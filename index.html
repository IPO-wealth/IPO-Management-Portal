<style>
:root{
  --navy:#0f1b2d;
  --navy-2:#16263f;
  --navy-3:#1e3252;
  --gold:#c8963e;
  --gold-light:#e0b46a;
  --teal:#2f8f7f;
  --bg:#f4f6f9;
  --card:#ffffff;
  --border:#e2e6ed;
  --text:#1c2733;
  --text-dim:#5c6b7a;
  --danger:#c0392b;
  --warn:#c8963e;
  --ok:#2f8f7f;
  --table-head-bg:#f8f9fb;
  --heading:#0f1b2d;
  --radius:8px;
  --shadow:0 1px 3px rgba(16,32,55,.08),0 1px 2px rgba(16,32,55,.06);
}
[data-theme="dark"]{
  --navy:#0b1420;
  --navy-2:#101d2e;
  --navy-3:#16263f;
  --gold:#d6a24e;
  --gold-light:#e8c07f;
  --teal:#3aa693;
  --bg:#0b1420;
  --card:#132238;
  --border:#28405c;
  --text:#e7edf5;
  --text-dim:#93a7bd;
  --danger:#e57468;
  --warn:#d6a24e;
  --ok:#3aa693;
  --table-head-bg:#0f2136;
  --heading:#eef3f9;
  --shadow:0 1px 3px rgba(0,0,0,.35),0 1px 2px rgba(0,0,0,.3);
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;height:100%;}
body{
  font-family:'Inter','Segoe UI',-apple-system,BlinkMacSystemFont,Roboto,Helvetica,Arial,sans-serif;
  background:var(--bg);
  color:var(--text);
  font-size:14px;
  display:flex;
  min-height:100vh;
  -webkit-font-smoothing:antialiased;
  text-rendering:optimizeLegibility;
  overscroll-behavior-y:contain;
}
/* Real financial dashboards align figures in a column — apply tabular (monospaced) digits
   to every number/currency value so amounts line up vertically instead of jittering with
   proportional-width digits. This is the one deliberate "signature" refinement for this pass. */
.kpi-card .val, table.dt td, .badge{ font-variant-numeric:tabular-nums; }
:focus-visible{ outline:2px solid var(--gold); outline-offset:1px; }
a{color:inherit;text-decoration:none;}
button{font-family:inherit;cursor:pointer;}
::-webkit-scrollbar{width:10px;height:10px;}
::-webkit-scrollbar-thumb{background:#c9d2dc;border-radius:6px;}

/* Sidebar */
#sidebar{
  width:238px;
  background:linear-gradient(180deg,var(--navy) 0%, var(--navy-2) 100%);
  color:#dbe4ef;
  flex-shrink:0;
  display:flex;
  flex-direction:column;
  position:fixed;
  top:0;left:0;bottom:0;
  z-index:200;
  transition:transform .25s ease;
}
#sidebar .brand{
  padding:20px 18px 14px;
  border-bottom:1px solid rgba(255,255,255,.08);
}
#sidebar .brand .title{font-size:15px;font-weight:700;letter-spacing:.4px;color:#fff;}
#sidebar .brand .sub{font-size:11px;color:var(--gold-light);margin-top:3px;letter-spacing:.5px;text-transform:uppercase;}
#sidebar nav{flex:1;overflow-y:auto;padding:10px 0;}
#sidebar .nav-item{
  display:flex;align-items:center;gap:10px;
  padding:10px 18px;
  font-size:13px;
  color:#b7c4d4;
  cursor:pointer;
  border-left:3px solid transparent;
  white-space:nowrap;
}
#sidebar .nav-item .ico{width:16px;text-align:center;font-size:13px;}
#sidebar .nav-item:hover{background:rgba(255,255,255,.05);color:#fff;}
#sidebar .nav-item.active{background:rgba(200,150,62,.14);color:#fff;border-left-color:var(--gold);font-weight:600;}
#sidebar .nav-badge{margin-left:auto;background:var(--danger);color:#fff;font-size:10px;padding:1px 6px;border-radius:10px;}
#sidebar .foot{padding:12px 18px;font-size:10.5px;color:#7688a0;border-top:1px solid rgba(255,255,255,.08);}

#sidebar-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:190;}

/* Main */
#main{margin-left:238px;flex:1;min-width:0;display:flex;flex-direction:column;}
#topbar{
  height:56px;background:var(--card);border-bottom:1px solid var(--border);
  display:flex;align-items:center;padding:0 20px;gap:14px;position:sticky;top:0;z-index:100;
}
#menuToggle{display:none;background:none;border:none;font-size:20px;color:var(--heading);padding:4px 8px;border-radius:6px;}
#topbar .pageTitle{font-size:16px;font-weight:700;color:var(--heading);}
#topbar .spacer{flex:1;}
#topbar .quickBtn{
  background:var(--navy);color:#fff;border:none;padding:8px 14px;border-radius:6px;font-size:12.5px;font-weight:600;
}
#topbar .quickBtn.secondary{background:var(--card);color:var(--heading);border:1px solid var(--border);}
#content{padding:20px 22px 60px;}

/* Cards / KPI */
.kpi-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(168px,1fr));gap:12px;margin-bottom:24px;}
.kpi-card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:16px;box-shadow:var(--shadow);}
.kpi-card .lbl{font-size:11px;color:var(--text-dim);text-transform:uppercase;letter-spacing:.4px;font-weight:600;}
.kpi-card .val{font-size:24px;font-weight:800;color:var(--heading);margin-top:8px;letter-spacing:-.2px;}
.kpi-card .val.gold{color:var(--gold);}
.kpi-card .val.danger{color:var(--danger);}
.kpi-card .val.ok{color:var(--ok);}
/* Standalone versions of the same utility classes, for use outside KPI cards
   (table cells, Reports rows) — these were previously only scoped to
   .kpi-card .val, so using them anywhere else silently had no effect at all. */
.danger{color:var(--danger);}
.ok{color:var(--ok);}
.gold{color:var(--gold);}

.section-card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow);margin-bottom:16px;}
.section-card .sc-head{padding:16px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:10px;}
.section-card .sc-head h3{margin:0;font-size:14px;color:var(--heading);font-weight:700;}
.section-card .sc-body{padding:16px;}
.section-card .sc-head .spacer{flex:1;}

/* Tables */
.table-wrap{overflow-x:auto;}
table.dt{width:100%;border-collapse:collapse;font-size:12.5px;}
table.dt th{
  text-align:left;padding:9px 10px;background:var(--table-head-bg);color:var(--text-dim);
  font-size:10.5px;text-transform:uppercase;letter-spacing:.3px;border-bottom:1px solid var(--border);
  white-space:nowrap;cursor:pointer;user-select:none;
}
table.dt th:hover{color:var(--heading);}
table.dt td{padding:9px 10px;border-bottom:1px solid var(--border);white-space:nowrap;}
table.dt tr:hover td{background:rgba(127,127,127,.08);}
table.dt tr.clickable{cursor:pointer;}
.clickable{cursor:pointer;}
.clickable:hover{text-decoration:underline;}
.empty-row td{text-align:center;color:var(--text-dim);padding:26px;font-style:italic;}

/* badges */
.badge{display:inline-block;padding:2px 9px;border-radius:20px;font-size:10.5px;font-weight:700;letter-spacing:.2px;}
.badge.gray{background:#eceff3;color:#5c6b7a;}
.badge.blue{background:#e5edfb;color:#2757a8;}
.badge.gold{background:#faf1de;color:#a2731c;}
.badge.green{background:#e2f5ef;color:#1f7a63;}
.badge.red{background:#fbe6e3;color:#a5301f;}
.badge.purple{background:#efe6fb;color:#6b2fa8;}
.badge.teal{background:#e0f3f0;color:#1c7f70;}

/* forms */
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px 14px;}
.form-grid.one{grid-template-columns:1fr;}
.f-group{display:flex;flex-direction:column;gap:5px;}
.f-group.span2{grid-column:1/-1;}
.f-group label{font-size:11.5px;color:var(--text-dim);font-weight:600;}
.f-group input,.f-group select,.f-group textarea{
  border:1px solid var(--border);border-radius:6px;padding:8px 10px;font-size:13px;font-family:inherit;background:var(--card);color:var(--text);
}
.f-group input:focus,.f-group select:focus,.f-group textarea:focus{outline:2px solid #2757a8;outline-offset:0;}
.f-group textarea{resize:vertical;min-height:60px;}
.checkbox-row{display:flex;align-items:center;gap:8px;}

.btn{border:none;border-radius:6px;padding:8px 14px;font-size:12.5px;font-weight:600;cursor:pointer;}
.btn-primary{background:var(--navy);color:#fff;}
.btn-gold{background:var(--gold);color:#fff;}
.btn-ghost{background:var(--card);border:1px solid var(--border);color:var(--text);}
.btn-danger{background:var(--danger);color:#fff;}
.btn-sm{padding:5px 10px;font-size:11.5px;}
.btn-row{display:flex;gap:8px;justify-content:flex-end;margin-top:16px;}
.link-btn{background:none;border:none;color:var(--gold);font-size:12px;font-weight:600;padding:2px 4px;}

/* toolbar for lists */
.list-toolbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:12px;}
.list-toolbar input[type=text],.list-toolbar select,.list-toolbar input[type=date]{
  border:1px solid var(--border);border-radius:6px;padding:7px 10px;font-size:12.5px;background:var(--card);
}
.list-toolbar .spacer{flex:1;}
.pagination{display:flex;gap:6px;justify-content:flex-end;align-items:center;margin-top:10px;font-size:12px;}
.pagination button{border:1px solid var(--border);background:var(--card);border-radius:5px;padding:4px 9px;}
.pagination button[disabled]{opacity:.4;cursor:not-allowed;}

/* modal */
#modalOverlay{position:fixed;inset:0;background:rgba(15,27,45,.5);display:none;align-items:flex-start;justify-content:center;z-index:500;overflow-y:auto;padding:40px 16px;}
#modalOverlay.open{display:flex;}
.modal-box{background:var(--card);border-radius:10px;max-width:640px;width:100%;box-shadow:0 20px 60px rgba(0,0,0,.3);}
.modal-box.wide{max-width:920px;}
.modal-head{padding:16px 20px;border-bottom:1px solid var(--border);display:flex;align-items:center;}
.modal-head h3{margin:0;font-size:15px;color:var(--heading);}
.modal-head .x{margin-left:auto;background:none;border:none;font-size:18px;color:var(--text-dim);cursor:pointer;}
.modal-body{padding:18px 20px;max-height:70vh;overflow-y:auto;}
.modal-foot{padding:14px 20px;border-top:1px solid var(--border);display:flex;justify-content:flex-end;gap:8px;}

/* toast */
#toastWrap{position:fixed;bottom:20px;right:20px;z-index:800;display:flex;flex-direction:column;gap:8px;}
.toast{background:var(--navy);color:#fff;padding:11px 16px;border-radius:7px;font-size:12.5px;box-shadow:var(--shadow);max-width:320px;}
.toast.warn{background:var(--warn);}
.toast .toast-act{margin-left:12px;background:rgba(255,255,255,.2);color:#fff;border:1px solid rgba(255,255,255,.5);border-radius:5px;padding:2px 10px;font-weight:700;font-size:12px;cursor:pointer;}
@media (max-width:640px){ #toastWrap{left:10px;right:10px;bottom:84px;} .toast{max-width:none;} }
.toast.danger{background:var(--danger);}
.toast.ok{background:var(--ok);}

/* capacity cell */
.cap-cell{display:inline-block;padding:3px 8px;border-radius:5px;font-weight:700;font-size:11.5px;}
.cap-avail{background:#e2f5ef;color:#1f7a63;}
.cap-near{background:#faf1de;color:#a2731c;}
.cap-full{background:#fbe0d3;color:#b1521a;}
.cap-over{background:#fbe6e3;color:#a5301f;}

.attn-list{display:flex;flex-direction:column;gap:8px;}
.attn-item{display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:6px;border-left:4px solid var(--border);background:#fafbfc;font-size:12.5px;}
.attn-item.high{border-left-color:var(--danger);}
.attn-item.med{border-left-color:var(--warn);}
.attn-item.low{border-left-color:#9fb2c2;}
.attn-item .tag{font-size:9.5px;text-transform:uppercase;font-weight:800;letter-spacing:.4px;color:var(--text-dim);}

.tabs{display:flex;gap:2px;border-bottom:1px solid var(--border);margin-bottom:14px;flex-wrap:wrap;}
.tabs button{background:none;border:none;padding:9px 14px;font-size:12.5px;font-weight:600;color:var(--text-dim);border-bottom:2px solid transparent;}
.tabs button.active{color:var(--heading);border-bottom-color:var(--gold);}

.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;}
.cal-cell{min-height:76px;border:1px solid var(--border);border-radius:6px;padding:6px;font-size:11px;background:var(--card);cursor:pointer;}
.cal-cell.empty{background:transparent;border:none;cursor:default;}
.cal-cell .dnum{font-weight:700;color:var(--heading);font-size:12px;}
.cal-cell .bankline{display:flex;justify-content:space-between;margin-top:3px;}

.small-muted{color:var(--text-dim);font-size:11.5px;}
.hint{font-size:11px;color:var(--text-dim);margin-top:4px;}

@media print{
  #sidebar, #topbar, #sidebar-overlay, .tabs, .no-print, #appLockOverlay, #modalOverlay, #toastWrap{ display:none !important; }
  #main{ margin-left:0 !important; }
  body{ background:#fff !important; }
  .printable-report{ box-shadow:none !important; border:none !important; }
  .kpi-card{ box-shadow:none !important; border:1px solid #ccc !important; }
  .print-only{ display:block !important; }
  .stmt-table tr{ break-inside:avoid; }
  .section-card{ break-inside:auto; }
}
@page{ margin:12mm; }
@media (min-width:901px){
  /* Desktop: navigation moves to a horizontal bar across the top instead of
     a vertical sidebar down the left. This only applies above the mobile
     breakpoint — the existing @media (max-width:900px) rules below are
     untouched, so the mobile experience (left sidebar via hamburger menu)
     stays exactly as it was. */
  body{ flex-direction:column; } /* was a row (sidebar beside content) — must be
     a column now so the horizontal nav sits ABOVE the content, not squeezed
     beside it fighting #main for the same horizontal space. */
  #sidebar{
    width:100%; height:60px; position:sticky; top:0; left:auto; right:auto; bottom:auto;
    flex-direction:row; align-items:center; flex-shrink:0; z-index:210;
    box-shadow:0 1px 3px rgba(16,32,55,.15);
  }
  #sidebar .brand{
    padding:12px 18px; border-bottom:none; border-right:1px solid rgba(255,255,255,.08);
    flex-shrink:0; white-space:nowrap;
  }
  #navList{ display:flex; flex-direction:row; align-items:stretch; overflow-x:auto; flex:1; height:100%; }
  #sidebar .nav-item{
    padding:0 16px; height:100%; border-left:none; border-bottom:3px solid transparent;
    flex-shrink:0;
  }
  #sidebar .nav-item.active{ border-left-color:transparent; border-bottom-color:var(--gold); }
  #main{ margin-left:0; width:100%; flex:1; }
  #topbar{ top:60px; }
  #menuToggle{ display:none !important; }
}
@media (max-width:900px){
  #sidebar{transform:translateX(-100%);}
  #sidebar.open{transform:translateX(0);}
  #sidebar-overlay.open{display:block;}
  #main{margin-left:0;}
  #menuToggle{display:block;}
  .form-grid{grid-template-columns:1fr;}
  .kpi-grid{grid-template-columns:repeat(2,1fr);}

  /* Standalone/installed-app mode: account for notches and the status bar
     area using safe-area insets. These resolve to 0 on any device without a
     notch (which is effectively all desktop browsers), so this has no visual
     effect there — it only matters when this app is actually installed and
     running full-screen on a phone. */
  #topbar{padding-top:calc(env(safe-area-inset-top, 0px));height:auto;min-height:calc(56px + env(safe-area-inset-top, 0px));}
  #sidebar{padding-top:env(safe-area-inset-top, 0px);padding-bottom:env(safe-area-inset-bottom, 0px);}
  body{padding-bottom:env(safe-area-inset-bottom, 0px);}

  /* Notification panel and search results: on desktop these are positioned
     relative to their trigger icon, which works fine since the topbar never
     wraps there. On mobile the topbar DOES wrap, so the trigger can end up
     anywhere in the row — anchoring the panel to it was pushing it partly
     off-screen. Anchor to the viewport instead. */
  #notifPanel{position:fixed !important;left:10px !important;right:10px !important;top:60px !important;width:auto !important;max-width:none !important;}
  #globalSearchResults{position:fixed !important;left:10px !important;right:10px !important;width:auto !important;}

  /* Topbar: search bar wraps to its own full-width row instead of squeezing
     against the title, bell, and export button on a narrow screen. */
  #topbar{flex-wrap:wrap;row-gap:8px;padding-left:12px;padding-right:12px;padding-bottom:10px;}
  #topbar .gsearch-wrap{order:3;flex-basis:100%;max-width:100%;margin:2px 0 0 0;}
  #topbar .pageTitle{font-size:14px;}
  #topbar .quickBtn{padding:7px 10px;font-size:12px;}

  /* Modals: less vertical padding so short phone screens don't push content
     off-screen, and content fits the viewport width properly. */
  #modalOverlay{padding:16px 10px;}
  .modal-box{max-width:100%;}

  /* Table toolbars and pagination: stack cleanly instead of overflowing. */
  .list-toolbar select, .list-toolbar input[type="text"]{flex:1 1 140px;min-width:0;}
  .pagination{flex-wrap:wrap;justify-content:center;}

  /* Section card padding tightened slightly for more usable width on small screens. */
  .section-card .sc-body{padding:12px;}
}

/* ===== Table platform (sticky header, totals, filters, density, cards) ===== */

.more-bar{background:var(--table-head-bg);padding:8px;border-radius:8px;border:1px dashed var(--border);}

@media (max-width:640px){
  .tabs{flex-wrap:nowrap;overflow-x:auto;-webkit-overflow-scrolling:touch;}

  table.dt.cards thead{display:none;}
  table.dt.cards tr{border:1px solid var(--border);border-radius:10px;margin:0 0 10px;background:var(--card);padding:6px 10px;box-shadow:0 1px 2px rgba(0,0,0,.04);}
  table.dt.cards td{display:flex;justify-content:space-between;gap:12px;align-items:center;border-bottom:1px dashed var(--border);padding:7px 0;white-space:normal;text-align:right;position:static !important;background:transparent !important;}

}

/* ===== Calm theme: fewer borders/shadows, quieter labels, one clear primary action ===== */
#content{width:100%;box-sizing:border-box;max-width:none;margin:0;}
.section-card{border-radius:12px;box-shadow:none;margin-bottom:16px;}
.section-card .sc-head{padding:14px 18px;border-bottom:1px solid var(--border);}
.section-card .sc-head h3{font-size:14px;font-weight:700;}
.kpi-grid{gap:12px;margin-bottom:16px;} .kpi-grid.money-grid{grid-template-columns:repeat(auto-fit,minmax(210px,1fr));}
.kpi-card{border-radius:12px;box-shadow:none;padding:14px 16px;}
.kpi-card[onclick],.kpi-card.clickable{cursor:pointer;} .kpi-card[onclick]:hover,.kpi-card.clickable:hover{border-color:var(--gold);}
.kpi-card .lbl{text-transform:none;letter-spacing:0;font-size:12px;font-weight:600;}
.kpi-card .val{font-size:22px;margin-top:6px;}
table.dt th{text-transform:none;letter-spacing:0;font-size:11.5px;font-weight:700;}
table.dt td{padding:10px 10px;}
.btn-gold{background:transparent;color:var(--gold);border:1px solid var(--gold);}
.btn-gold:hover{background:rgba(200,150,62,.1);}
.progress.mini{height:6px;margin:8px 0 4px;}
.tabs{margin-bottom:12px;} .tabs.ops-tabs{margin-bottom:16px;}
.pills{display:flex;gap:6px;flex-wrap:wrap;margin:0 0 14px;overflow-x:auto;}
.pill{border:1px solid var(--border);background:var(--card);color:var(--text-dim);border-radius:20px;padding:6px 14px;font-size:12.5px;font-weight:600;cursor:pointer;white-space:nowrap;}
.pill.on{background:var(--navy);color:#fff;border-color:var(--navy);} .pill:hover:not(.on){color:var(--heading);border-color:var(--gold);}
.today-panel .todo{padding:8px 12px;}
@media (max-width:640px){ .tabs.ops-tabs,.tabs{overflow-x:auto;flex-wrap:nowrap;} .tabs button{white-space:nowrap;} .kpi-grid.money-grid{grid-template-columns:1fr 1fr;} }
/* paginated tables scroll with the page, not inside a box */
.table-wrap{max-height:none !important;border:none !important;border-radius:0 !important;}
table.dt tfoot td{position:static !important;}
table.dt thead th{position:static;}
#topbar{flex-shrink:0;}
@media (max-width:900px){ #topbar{top:0 !important;height:auto !important;} }

/* ---- polish round: floating button, quiet delete, bulk bar, settings ---- */

@media (max-width:900px){ #content{padding-bottom:calc(110px + env(safe-area-inset-bottom,0px));} }
.dt td .btn-danger, .table-wrap td .btn-danger{ background:transparent; color:var(--danger); border:1px solid var(--border); }
.dt td .btn-danger:hover, .table-wrap td .btn-danger:hover{ background:var(--danger); color:#fff; border-color:var(--danger); }
#bulkBar{ display:none; align-items:center; gap:8px; flex-wrap:wrap; padding:6px 10px; border:1px dashed var(--border); border-radius:8px; background:var(--bg,#f4f6fa); }
#bulkBar.on{ display:inline-flex; }
.small-muted a{ color:var(--gold,#b8862f); font-weight:600; }

.selbar{ display:none; align-items:center; gap:8px; }
.selbar.on{ display:inline-flex; }
:where(select, input[type=date], input[type=number], input[type=text], input[type=search]){ font:inherit; font-size:13px; color:var(--text,inherit); background:var(--card,#fff); border:1px solid var(--border); border-radius:6px; padding:7px 10px; }

/* dark mode: primary buttons / active pills need a visible fill (navy equals the page background there) */
[data-theme="dark"] .btn-primary, [data-theme="dark"] .pill.on{ background:var(--gold); color:#0b1420; border-color:var(--gold); }
[data-theme="dark"] .btn-primary:hover{ background:var(--gold-light); }
[data-theme="dark"] #bulkBar{ background:var(--navy-2); }

.fp-off td{ background:rgba(120,130,150,.10); }

@media (max-width:640px){
  .fp-bank thead{display:none;} .fp-bank, .fp-bank tbody{display:block;}
  .fp-bank tr{display:block;border:1px solid var(--border);border-radius:8px;margin-bottom:10px;padding:8px 10px;}
  .fp-bank td{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:5px 0;border:0;}
  .fp-bank td::before{content:attr(data-l);color:var(--text-dim);font-size:12px;}
}

@media (max-width:640px){

@media (max-width:640px){

}

.stmt-prev td.num, .stmt-prev th.num{ text-align:right; }
.stmt-prev tr.stmt-ipo td{ background:var(--table-head-bg); }
.stmt-prev tr.stmt-sub td{ font-weight:700; border-top:1px solid var(--border); }
.stmt-prev tr.stmt-grand td{ font-weight:800; border-top:2px solid var(--text-dim); background:var(--table-head-bg); }

/* ---- batch 3: dashboard folding on phones ---- */
.mcol-body .sc-head h3{display:none;}
.mcol-body > .section-card{margin-top:8px;}

/* ---- batch 4: checklist on phones ---- */
.ckUpi.ck-noupi{border-color:var(--danger) !important;background:rgba(200,60,60,.10) !important;}
@media (max-width:900px){
  .ck-plan-head{position:sticky;top:var(--topbar-h,56px);z-index:20;background:var(--card);padding:8px 2px;border-bottom:1px solid var(--border);box-shadow:0 2px 4px rgba(0,0,0,.04);}
}

/* ---- batch 7: bottom navigation + quick add ---- */
#bottomNav{display:none;}
#quickAddBtn{position:fixed;bottom:24px;right:24px;width:52px;height:52px;border-radius:50%;background:var(--navy);color:#fff;border:none;font-size:28px;line-height:1;box-shadow:0 4px 12px rgba(0,0,0,.25);cursor:pointer;z-index:150;}
[data-theme="dark"] #quickAddBtn{background:var(--gold);color:#0b1420;}
#quickAddMenu{position:fixed;right:24px;bottom:86px;z-index:151;flex-direction:column;gap:2px;min-width:200px;background:var(--card);border:1px solid var(--border);border-radius:10px;box-shadow:0 8px 24px rgba(0,0,0,.22);padding:6px;}
#quickAddMenu button{background:transparent;border:0;color:var(--text);font:inherit;font-size:14px;text-align:left;padding:11px 12px;border-radius:7px;cursor:pointer;min-height:42px;}
#quickAddMenu button:hover{background:var(--table-head-bg);}
@media (max-width:900px){
  #bottomNav{display:flex;position:fixed;left:0;right:0;bottom:0;z-index:160;background:var(--card);border-top:1px solid var(--border);box-shadow:0 -2px 10px rgba(0,0,0,.08);padding:4px 4px calc(4px + env(safe-area-inset-bottom,0px));}
  #bottomNav .bn-item{flex:1;background:transparent;border:0;color:var(--text-dim);font:inherit;display:flex;flex-direction:column;align-items:center;gap:1px;padding:6px 2px;min-height:52px;cursor:pointer;border-radius:8px;}
  #bottomNav .bn-item.on{color:var(--gold);font-weight:700;}
  #bottomNav .bn-ico{font-size:20px;line-height:1.1;position:relative;}
  #bottomNav .bn-lbl{font-size:11px;}
  #bottomNav .bn-badge{position:absolute;top:-4px;right:-12px;background:var(--danger);color:#fff;font-size:10px;font-weight:700;border-radius:10px;padding:0 5px;line-height:1.4;}
  #quickAddBtn{display:none !important;}
  #quickAddMenu{left:50%;right:auto;transform:translateX(-50%);bottom:calc(72px + env(safe-area-inset-bottom,0px));width:min(280px,calc(100vw - 28px));}
  #bottomNav .bn-add .bn-plus{width:40px;height:40px;border-radius:50%;background:var(--navy);color:#fff;font-size:26px;line-height:38px;text-align:center;margin-top:-14px;box-shadow:0 3px 8px rgba(0,0,0,.25);}
  [data-theme="dark"] #bottomNav .bn-add .bn-plus{background:var(--gold);color:#0b1420;}
  #bottomNav .bn-add .bn-lbl{margin-top:1px;}
  #toastWrap{bottom:calc(130px + env(safe-area-inset-bottom,0px)) !important;}
}

@media (min-width:901px){
  #quickAddBtn{display:none !important;}
  #quickAddMenu{top:calc(60px + var(--topbar-h,56px) - 6px);bottom:auto;right:22px;}
}
@media (max-width:900px){ #topAddBtn{display:none !important;} }

/* =====================================================================
   PREMIUM THEME — "private ledger"
   Ink navy chrome · cool ledger-paper ground · brass accent · verdigris = money in, oxblood = money owed.
   Money figures are set in a serif with lining, tabular digits so columns of numbers read like a ledger.
   (Styling only — nothing here changes behaviour.)
   ===================================================================== */
:root{
  --serif:'Newsreader','Iowan Old Style','Palatino Linotype',Georgia,serif;
  --navy:#0b1324; --navy-2:#111c33; --navy-3:#1b2a47;
  --gold:#96681a; --gold-light:#d4a951; --brass:#b8863a;
  --teal:#1f6f5c; --ok:#1f6f5c; --danger:#9e2b25; --warn:#96681a;
  --bg:#edefea; --card:#fcfcfa; --border:#dcdfd6;
  --text:#19212d; --text-dim:#5a6573; --heading:#0b1324;
  --table-head-bg:#f3f4ef;
  --radius:14px;
  --shadow:0 1px 0 rgba(255,255,255,.8) inset,0 1px 2px rgba(11,19,36,.05),0 8px 20px -12px rgba(11,19,36,.14);
  --shadow-pop:0 22px 60px -14px rgba(11,19,36,.40);
  --focus-ring:0 0 0 3px rgba(150,104,26,.20);
}
[data-theme="dark"]{
  --navy:#070b15; --navy-2:#0c1426; --navy-3:#15213b;
  --gold:#d6a84f; --gold-light:#e8c57f; --brass:#d6a84f;
  --teal:#4db59c; --ok:#4db59c; --danger:#e8877e; --warn:#d6a84f;
  --bg:#080d18; --card:#0f1829; --border:#1f2d46;
  --text:#e4e8ef; --text-dim:#8e9bb0; --heading:#f1f4f9;
  --table-head-bg:#0b1322;
  --shadow:0 1px 0 rgba(255,255,255,.04) inset,0 1px 2px rgba(0,0,0,.4),0 10px 26px -14px rgba(0,0,0,.65);
  --shadow-pop:0 24px 64px -12px rgba(0,0,0,.75);
  --focus-ring:0 0 0 3px rgba(214,168,79,.25);
}
html{ -webkit-text-size-adjust:100%; }
body{ font-size:14px; line-height:1.45; font-feature-settings:'cv11','ss01'; }
::selection{ background:rgba(212,169,81,.35); }
::-webkit-scrollbar-thumb{ background:rgba(90,101,115,.35); border-radius:8px; border:2px solid transparent; background-clip:content-box; }
:focus-visible{ outline:2px solid var(--gold-light); outline-offset:2px; border-radius:6px; }

/* ---------- top navigation (ink) ---------- */
#sidebar{ background:linear-gradient(180deg,#0f1a30 0%,#0a1222 100%); color:#cdd7e6; }
#sidebar .brand .title{ font-family:var(--serif); font-size:18px; font-weight:600; letter-spacing:.005em; color:#fff; }
#sidebar .brand .sub{ text-transform:none; letter-spacing:.02em; font-size:11.5px; color:var(--gold-light); margin-top:1px; opacity:.9; }
#sidebar .nav-item{ font-size:13.5px; font-weight:500; color:#9fb0c8; gap:9px; transition:color .15s, background .15s; }
#sidebar .nav-item .ico{ width:18px; height:18px; display:inline-flex; align-items:center; justify-content:center; font-size:0; opacity:.85; }
#sidebar .nav-item .ico svg{ width:17px; height:17px; }
#sidebar .nav-item:hover{ color:#fff; background:rgba(255,255,255,.05); }
#sidebar .nav-item.active{ color:#fff; font-weight:600; background:linear-gradient(180deg,rgba(212,169,81,0) 0%,rgba(212,169,81,.12) 100%); }
#sidebar .nav-item.active .ico{ color:var(--gold-light); opacity:1; }
#sidebar .foot{ color:#6f819c; }
@media (min-width:901px){
  #sidebar{ box-shadow:0 1px 0 rgba(212,169,81,.28),0 6px 18px -10px rgba(5,10,20,.6); }
  #sidebar .nav-item{ border-bottom:2px solid transparent; }
  #sidebar .nav-item.active{ border-bottom-color:var(--gold-light); }
  #sidebar .brand{ border-right:1px solid rgba(255,255,255,.07); }
}
@media (max-width:900px){
  #sidebar .nav-item{ padding:13px 20px; font-size:14.5px; }
  #sidebar .nav-item.active{ border-left-color:var(--gold-light); background:rgba(212,169,81,.12); }
}

/* ---------- page header row ---------- */
#topbar{ background:var(--bg); background:color-mix(in srgb,var(--bg) 86%,transparent); -webkit-backdrop-filter:saturate(1.3) blur(12px); backdrop-filter:saturate(1.3) blur(12px); border-bottom:1px solid var(--border); height:62px; }
#topbar .pageTitle{ font-family:var(--serif); font-size:23px; font-weight:600; letter-spacing:-.005em; color:var(--heading); }
#topbar .quickBtn{ border-radius:9px; padding:9px 15px; font-size:13px; font-weight:600; background:linear-gradient(180deg,#17233f,#0b1324); color:#fff; box-shadow:0 1px 0 rgba(255,255,255,.1) inset,0 1px 2px rgba(11,19,36,.3); transition:filter .15s; }
#topbar .quickBtn:hover{ filter:brightness(1.15); }
#topbar .quickBtn.secondary{ background:var(--card); color:var(--heading); border:1px solid var(--border); box-shadow:none; }
#topAddBtn{ background:linear-gradient(180deg,#bf9141,#96681a) !important; color:#fff !important; }
[data-theme="dark"] #topbar .quickBtn{ background:var(--card); border:1px solid var(--border); }
[data-theme="dark"] #topAddBtn{ background:linear-gradient(180deg,#e0b866,#c0903a) !important; color:#0b1324 !important; }
#content{ padding:20px 16px 72px; max-width:none; margin:0; width:100%; }
@media (max-width:900px){ #topbar{ height:auto; } #topbar .pageTitle{ font-size:19px; } #content{ padding:16px 14px calc(110px + env(safe-area-inset-bottom,0px)); } }

/* ---------- cards ---------- */
.section-card, details.collapse, .kpi-card{ border-radius:var(--radius); border:1px solid var(--border); background:var(--card); box-shadow:var(--shadow); }
.section-card{ margin-bottom:18px; }
.section-card .sc-head{ padding:18px 22px 14px; border-bottom:1px solid var(--border); }
.section-card .sc-head h3{ font-family:var(--serif); font-size:19px; font-weight:600; letter-spacing:-.003em; }
.section-card .sc-body{ padding:16px 18px; }
details.collapse{ padding:0 20px; margin-bottom:16px; }
details.collapse>summary{ font-family:var(--serif); font-size:16.5px; font-weight:600; padding:15px 0; }
details.collapse>summary .small-muted{ font-family:'Inter',sans-serif; }
details.collapse>summary::before{ content:''; width:7px; height:7px; border-right:1.8px solid var(--text-dim); border-bottom:1.8px solid var(--text-dim); transform:rotate(-45deg); margin-right:12px; vertical-align:2px; transition:transform .18s; }
details.collapse[open]>summary::before{ transform:rotate(45deg); vertical-align:3px; }

/* ---------- key figures: the memorable part ---------- */
.kpi-grid{ gap:14px; margin-bottom:26px; }
.kpi-card{ padding:18px 20px 16px; position:relative; }
.kpi-card .lbl{ font-size:12.5px; text-transform:none; letter-spacing:0; font-weight:500; color:var(--text-dim); }
.kpi-card .val, .val{ font-family:var(--serif); font-size:34px; font-weight:500; line-height:1.08; letter-spacing:-.012em; margin-top:10px; font-variant-numeric:lining-nums tabular-nums; color:var(--heading); }
.kpi-card .val.gold{ color:var(--gold); } .kpi-card .val.danger{ color:var(--danger); } .kpi-card .val.ok{ color:var(--ok); }
.kpi-card .small-muted, .kpi-card .hint{ font-size:12px; line-height:1.5; margin-top:4px; }
.kpi-card[onclick], .kpi-card.clickable{ cursor:pointer; transition:border-color .15s, transform .15s, box-shadow .15s; }
.kpi-card[onclick]:hover, .kpi-card.clickable:hover{ border-color:rgba(150,104,26,.55); transform:translateY(-1px); text-decoration:none; }
.danger{ color:var(--danger); } .ok{ color:var(--ok); } .gold{ color:var(--gold); }
.link-btn, .small-muted a{ color:var(--gold); }

/* ---------- to-do rows (colour bar carries the urgency, so the emoji go) ---------- */
.todo-list{ gap:8px; }
.todo{ border-radius:10px; border:1px solid var(--border); border-left-width:3px; padding:11px 14px; background:var(--card); font-size:13.5px; transition:background .15s, border-color .15s; }
.todo:hover{ background:rgba(150,104,26,.06); }
.todo .ico{ display:none; }
.todo .go{ color:var(--text-dim); font-size:20px; line-height:1; }
.todo.high{ border-left-color:var(--danger); } .todo.med{ border-left-color:var(--brass); } .todo.low{ border-left-color:#8794a8; }
.today-panel .todo{ padding:10px 14px; }

/* ---------- tables ---------- */
table.dt{ font-size:13px; }
table.dt th{ background:transparent; color:var(--text-dim); font-size:12px; font-weight:600; text-transform:none; letter-spacing:0; padding:11px 10px; border-bottom:1.5px solid rgba(11,19,36,.16); }
[data-theme="dark"] table.dt th{ border-bottom-color:rgba(255,255,255,.14); }
table.dt td{ padding:11px 10px; border-bottom:1px solid var(--border); font-variant-numeric:lining-nums tabular-nums; }
table.dt tbody tr:hover td{ background:rgba(150,104,26,.055); }
table.dt tfoot td{ background:var(--table-head-bg); font-weight:700; border-top:1.5px solid rgba(11,19,36,.16); border-bottom:none; }
table.dt td.num, table.dt th.num{ text-align:right; }
.table-wrap{ border-radius:10px; }
.empty-row td{ font-style:normal; color:var(--text-dim); padding:34px; }
.empty-state{ border-radius:14px; background:transparent; }
.empty-state h3{ font-family:var(--serif); font-size:19px; font-weight:600; }

/* ---------- badges: soft tint with a status dot ---------- */
.badge{ display:inline-flex; align-items:center; gap:6px; padding:3px 10px 3px 8px; border-radius:999px; font-size:11.5px; font-weight:600; letter-spacing:.01em; }
.badge::before{ content:''; width:6px; height:6px; border-radius:50%; background:currentColor; opacity:.85; }
.badge.gray{ background:#e9ebe5; color:#586270; } .badge.blue{ background:#e3eaf7; color:#27508f; } .badge.gold{ background:#f5ead2; color:#84590f; }
.badge.green{ background:#dcefe8; color:#1a6753; } .badge.red{ background:#f6dedb; color:#97281f; } .badge.purple{ background:#ece4f6; color:#5f2c96; } .badge.teal{ background:#d9eeea; color:#17695c; }
[data-theme="dark"] .badge.gray{ background:rgba(142,155,176,.16); color:#b4bfd0; } [data-theme="dark"] .badge.blue{ background:rgba(110,150,230,.16); color:#9bb9f0; }
[data-theme="dark"] .badge.gold{ background:rgba(214,168,79,.16); color:#e8c57f; } [data-theme="dark"] .badge.green{ background:rgba(77,181,156,.16); color:#7fd6c0; }
[data-theme="dark"] .badge.red{ background:rgba(232,135,126,.16); color:#f0a39b; } [data-theme="dark"] .badge.purple{ background:rgba(170,130,230,.16); color:#c6a9ef; } [data-theme="dark"] .badge.teal{ background:rgba(77,181,156,.16); color:#7fd6c0; }
.cap-avail{ background:#dcefe8; color:#1a6753; } .cap-near{ background:#f5ead2; color:#84590f; } .cap-full{ background:#f6e0d0; color:#9a4a14; } .cap-over{ background:#f6dedb; color:#97281f; }

/* ---------- buttons ---------- */
.btn{ border-radius:10px; padding:9px 16px; font-size:13px; font-weight:600; letter-spacing:.005em; min-height:36px; transition:filter .15s, box-shadow .15s, border-color .15s, transform .06s; }
.btn:active{ transform:translateY(1px); }
.btn-primary{ background:linear-gradient(180deg,#18243f,#0b1324); color:#fff; box-shadow:0 1px 0 rgba(255,255,255,.12) inset,0 1px 2px rgba(11,19,36,.35); }
.btn-primary:hover{ filter:brightness(1.18); }
.btn-gold{ background:linear-gradient(180deg,#bf9141,#96681a); color:#fff; box-shadow:0 1px 0 rgba(255,255,255,.22) inset,0 1px 2px rgba(80,50,5,.35); }
.btn-gold:hover{ filter:brightness(1.08); }
.btn-ghost{ background:var(--card); border:1px solid var(--border); color:var(--text); }
.btn-ghost:hover{ border-color:var(--gold); color:var(--heading); }
.btn-danger{ background:linear-gradient(180deg,#b3382f,#8f2620); color:#fff; }
.btn-sm{ min-height:30px; padding:6px 12px; font-size:12px; border-radius:8px; }
.btn[disabled]{ opacity:.5; cursor:not-allowed; filter:none; }
[data-theme="dark"] .btn-primary, [data-theme="dark"] .pill.on{ background:linear-gradient(180deg,#e2ba6a,#c4953f); color:#0b1324; border-color:transparent; box-shadow:0 1px 0 rgba(255,255,255,.25) inset; }
[data-theme="dark"] .btn-primary:hover{ filter:brightness(1.08); background:linear-gradient(180deg,#e2ba6a,#c4953f); }
[data-theme="dark"] .btn-gold{ color:#0b1324; }
.dt td .btn-danger, .table-wrap td .btn-danger{ background:transparent; color:var(--danger); border:1px solid var(--border); box-shadow:none; }
.dt td .btn-danger:hover, .table-wrap td .btn-danger:hover{ background:var(--danger); color:#fff; border-color:var(--danger); filter:none; }

/* ---------- forms ---------- */
.f-group label{ font-size:12.5px; font-weight:600; color:var(--text-dim); }
.f-group input,.f-group select,.f-group textarea,
.list-toolbar input[type=text],.list-toolbar select,.list-toolbar input[type=date],
:where(select, input[type=date], input[type=number], input[type=text], input[type=search], input[type=password], input[type=email]){

<script>
/* =========================================================
   IPO MANAGEMENT PORTAL
   Single-file app. IndexedDB storage. No build step.
========================================================= */

const DB_NAME = 'ipoPortalDB';
const DB_VERSION = 4; // v2 added bankUpiIds and dropped the retired mandates store; v3 adds the payments (client ledger) store
const STORES = {
  clients: 'id', bankAccounts: 'id', ipos: 'id', ipoPlans: 'id',
  plannedClients: 'id', applications: 'id', bankUpiIds: 'id', payments: 'id',
  auditLogs: 'id', settings: 'key', trash: 'id'
};
let db;

function openDB(){
  return new Promise((resolve, reject) => {
    const req = indexedDB.open(DB_NAME, DB_VERSION);
    req.onupgradeneeded = (e) => {
      const d = e.target.result;
      Object.entries(STORES).forEach(([name, keyPath]) => {
        if (!d.objectStoreNames.contains(name)) {
          d.createObjectStore(name, { keyPath, autoIncrement: keyPath === 'id' });
        }
      });
      // retired store from an earlier version of this app — safe to drop if present
      if (d.objectStoreNames.contains('mandates')) {
        d.deleteObjectStore('mandates');
      }
    };
    req.onsuccess = (e) => { db = e.target.result; resolve(db); };
    req.onerror = (e) => reject(e.target.error || e);
    req.onblocked = () => reject(new Error('Database upgrade blocked — please close this app in any other open tabs and reload.'));
  });
}
function storeTx(name, mode='readonly'){ return db.transaction(name, mode).objectStore(name); }
function getAll(name){ return new Promise((res,rej)=>{ const r=storeTx(name).getAll(); r.onsuccess=()=>res(r.result); r.onerror=()=>rej(r.error); }); }
function getOne(name,id){ return new Promise((res,rej)=>{ const r=storeTx(name).get(id); r.onsuccess=()=>res(r.result); r.onerror=()=>rej(r.error); }); }
function assertNotReadOnly(){
  if (window.__suppressReadOnlyCheck) return; // system sync-write, not a user edit — never blocked
  if (window.__drive && window.__drive.role === 'viewer'){
    toast('You have view-only access to this portal — changes cannot be saved','danger');
    throw new Error('READ_ONLY_ACCESS');
  }
}
function __putRecRaw(name,obj){ return new Promise((res,rej)=>{ const r=storeTx(name,'readwrite').put(obj); r.onsuccess=()=>res(r.result); r.onerror=()=>rej(r.error); }); }
function __delRecRaw(name,id){ return new Promise((res,rej)=>{ const r=storeTx(name,'readwrite').delete(id); r.onsuccess=()=>res(); r.onerror=()=>rej(r.error); }); }
const RECYCLABLE = ['clients','bankAccounts','ipos','ipoPlans','plannedClients','applications','bankUpiIds','payments'];
const RECYCLE_LABEL = { clients:'Client', bankAccounts:'Bank account', ipos:'IPO', ipoPlans:'IPO plan', plannedClients:'Planned client', applications:'Application', bankUpiIds:'UPI ID', payments:'Payment' };
/* Undo capture: while active, remembers the "before" copy of every record that gets changed */
window.__undoCap = null;
function beginUndo(){ window.__undoCap = { items:new Map() }; }
async function endUndo(label){
  const cap = window.__undoCap; window.__undoCap = null;
  if (!cap || !cap.items.size) return;
  const items = Array.from(cap.items.values());
  toast(`${label||'Updated'} ${items.length} record(s)`, 'ok', { label:'Undo', ms:10000, fn: async ()=>{
    for (const it of items){ if (it.prev) await __putRecRaw(it.store, it.prev); else await __delRecRaw(it.store, it.id); }
    await loadAll(); navigate(S.view, S.params); toast('Undone','ok');
    if (typeof scheduleSync==='function') scheduleSync();
  }});
}
function putRec(name,obj){
  assertNotReadOnly(); assertMonthOpen(name,obj); idxReset();
  let __newItem = null;
  if (window.__undoCap && RECYCLABLE.includes(name)){
    if (obj.id==null){ // a brand-new record: remember it so Undo can remove it once its id is known
      __newItem = { store:name, id:null, prev:null }; window.__undoCap.n = (window.__undoCap.n||0)+1; window.__undoCap.items.set(name+':new:'+window.__undoCap.n, __newItem);
    } else {
      const key = name+':'+obj.id;
      if (!window.__undoCap.items.has(key)){ const old = (S[name]||[]).find(x=>x.id===obj.id); window.__undoCap.items.set(key,{ store:name, id:obj.id, prev: old?{...old}:null }); }
    }
  }
  const pr = __putRecRaw(name,obj);

}
/* Recycle bin: every delete keeps a copy for 30 days; deletes made together share a batch so they restore together */
let __trashBatch = null, __trashTimer = null;
async function delRec(name,id){
  assertNotReadOnly(); assertMonthOpenForDelete(name,id); idxReset();
  let __deleted = null;
  if (RECYCLABLE.includes(name) && !window.__suppressReadOnlyCheck){
    try {
      const rec = await getOne(name,id);
      if (rec){
        __deleted = rec;
        const now = Date.now();
        if (!__trashBatch || now - __trashBatch.t > 2500) __trashBatch = { id: 'b'+now.toString(36)+Math.random().toString(36).slice(2,5), t: now, n:0 };
        __trashBatch.t = now; __trashBatch.n++;
        const t = { batchId: __trashBatch.id, store:name, payload:rec, deletedAt: now, by:(window.__drive&&window.__drive.email)||'' };
        t.id = await __putRecRaw('trash', t); S.trash.push(t);
        clearTimeout(__trashTimer);
        const b = __trashBatch;
        __trashTimer = setTimeout(()=>{ toast(`Deleted ${b.n} record(s)`, 'warn', { label:'Undo', ms:10000, fn:()=>restoreTrashBatch(b.id) }); }, 700);
      }
    } catch(e){ console.warn('trash', e); }
  }
  await __delRecRaw(name,id);

}
async function restoreTrashBatch(batchId){
  const items = S.trash.filter(t=>t.batchId===batchId); if (!items.length) return;
  for (const t of items){ t.payload.updatedAt = new Date().toISOString(); await __putRecRaw(t.store, t.payload); await __delRecRaw('trash', t.id); }
  await clearTombstones(items.map(t=>[t.store, t.payload]));
  S.trash = S.trash.filter(t=>t.batchId!==batchId);
  await loadAll(); toast(`Restored ${items.length} record(s)`,'ok'); navigate(S.view, S.params);
  if (typeof scheduleSync==='function') scheduleSync();
}
async function purgeTrashBatch(batchId){
  for (const t of S.trash.filter(t=>t.batchId===batchId)) await __delRecRaw('trash', t.id);
  S.trash = S.trash.filter(t=>t.batchId!==batchId); navigate(S.view, S.params);
}
async function emptyTrash(){ for (const t of S.trash) await __delRecRaw('trash', t.id); S.trash=[]; navigate(S.view,S.params); toast('Recycle bin emptied','ok'); }
function trashLabel(t){ const p=t.payload; const nm = p.clientName||p.ipoName||p.bankName||p.upiId||(p.amountApplied!=null?('Application '+fmtMoney(p.amountApplied)):null)||(p.amount!=null?('Payment '+fmtMoney(p.amount)):null)||('#'+p.id); return `${RECYCLE_LABEL[t.store]||t.store}: ${nm}`; }
function recycleBinHtml(){

    const main = g.find(t=>['clients','ipos','bankAccounts','ipoPlans'].includes(t.store)) || g[0];

/* ---- per-render lookup indexes (speed) ---- */
let __idx = null;

function idx(){
  if (__idx && __idx.rA===S.applications && __idx.nA===S.applications.length && __idx.rC===S.clients && __idx.nC===S.clients.length && __idx.rI===S.ipos && __idx.nI===S.ipos.length && __idx.rB===S.bankAccounts && __idx.nB===S.bankAccounts.length && __idx.rP===S.ipoPlans && __idx.nP===S.ipoPlans.length) return __idx;
  const X = { rA:S.applications,nA:S.applications.length,rC:S.clients,nC:S.clients.length,rI:S.ipos,nI:S.ipos.length,rB:S.bankAccounts,nB:S.bankAccounts.length,rP:S.ipoPlans,nP:S.ipoPlans.length,
    aC:new Map(), aI:new Map(), aB:new Map(), pI:new Map(), pB:new Map(), c:new Map(), i:new Map(), b:new Map(), a:new Map(), plan:new Map(), cs:new Map(), is:new Map(), bs:new Map() };
  const push=(m,k,v)=>{ const l=m.get(k); if(l) l.push(v); else m.set(k,[v]); };
  for (const a of S.applications){ push(X.aC,a.clientId,a); push(X.aI,a.ipoId,a); push(X.aB,a.bankAccountId,a); X.a.set(a.id,a); }

  S.clients.forEach(c=>X.c.set(c.id,c)); S.ipos.forEach(i=>X.i.set(i.id,i)); S.bankAccounts.forEach(b=>X.b.set(b.id,b));

function clearStore(name){ return new Promise((res,rej)=>{ const r=storeTx(name,'readwrite').clear(); r.onsuccess=()=>res(); r.onerror=()=>rej(r.error); }); }

// ---- App state ----
const S = {
  clients: [], bankAccounts: [], ipos: [], ipoPlans: [], plannedClients: [],
  applications: [], bankUpiIds: [], payments: [], auditLogs: [], trash: [], settings: {},

async function loadAll(){
  const [clients, bankAccounts, ipos, ipoPlans, plannedClients, applications, bankUpiIds, auditLogs, settingsArr, payments] = await Promise.all([
    getAll('clients'), getAll('bankAccounts'), getAll('ipos'), getAll('ipoPlans'),
    getAll('plannedClients'), getAll('applications'), getAll('bankUpiIds'), getAll('auditLogs'), getAll('settings'), getAll('payments')
  ]);
  S.payments = payments; payIdxReset(); idxReset();
  try { S.trash = await getAll('trash'); const cut = Date.now()-30*86400000; for (const t of S.trash.filter(t=>t.deletedAt<cut)) { await __delRecRaw('trash', t.id); } S.trash = S.trash.filter(t=>t.deletedAt>=cut); } catch(e){ S.trash=[]; }
  S.clients = clients; S.bankAccounts = bankAccounts; S.ipos = ipos; S.ipoPlans = ipoPlans;
  S.plannedClients = plannedClients; S.applications = applications; S.bankUpiIds = bankUpiIds; S.auditLogs = auditLogs;

  // as "Pending Decision". Normalize any leftover records (including ones

  // silently stops matching filters, badges, or dashboard counts.
  let __migratedPendingStatus = false;

  // Sub Reference used to be free text — auto-collect any existing distinct values
  // so they remain selectable as a proper managed list instead of disappearing.
  let __subRefSeeded = false;
  S.clients.forEach(c => {
    const sr = (c.subReference||'').trim();
    if (sr && !S.settings.subReferences.includes(sr)){ S.settings.subReferences.push(sr); __subRefSeeded = true; }
  });
  if (__subRefSeeded) await saveSetting('subReferences', S.settings.subReferences);
  if (!S.settings.driveClientId) S.settings.driveClientId = '';
  if (!S.settings.authorizedEmail) S.settings.authorizedEmail = '';
  if (!S.settings.driveConnectedEmail) S.settings.driveConnectedEmail = '';
  if (!S.settings.driveFolderId) S.settings.driveFolderId = '';

/* Settings that belong to ONE device/person and must never travel through the shared Drive file

const LOCAL_ONLY_SETTINGS = new Set(['appLockEnabled','appLockPin','autoLockMinutes','browserNotifsEnabled','columnVisibility','driveClientId','driveConnectedEmail','driveFileId','driveFolderId','googlePickerApiKey','lastAutoBackupDate','lastManualBackup','lastRestore','lastSynced','theme','savedPresets']);
function isLocalOnlySetting(k){ return LOCAL_ONLY_SETTINGS.has(k) || k.startsWith('collabFileId_') || k.startsWith('collabFolderId_'); }
async function saveSetting(key, value){
  S.settings[key] = value; idxReset();

async function audit(action, entity, entityId, prevVal, newVal){
  const by = (window.__drive && window.__drive.email) || (S.settings && S.settings.driveConnectedEmail) || 'This device';
  const rec = { timestamp: new Date().toISOString(), by, action, entity, entityId: String(entityId), prev: prevVal ? JSON.stringify(prevVal) : '', next: newVal ? JSON.stringify(newVal) : '' };
  // keep the log small: for edits store only the fields that changed
  if (prevVal && newVal && typeof prevVal==='object' && typeof newVal==='object'){
    const chg = {}; const skip = new Set(['updatedAt','createdAt','id']);
    for (const k of new Set([...Object.keys(prevVal), ...Object.keys(newVal)])){ if (skip.has(k)) continue; if (JSON.stringify(prevVal[k]) !== JSON.stringify(newVal[k])) chg[k] = [prevVal[k]===undefined?null:prevVal[k], newVal[k]===undefined?null:newVal[k]]; }
    rec.chg = chg; rec.prev = ''; rec.next = '';
  }
  const id = await putRec('auditLogs', rec);
  rec.id = id;
  S.auditLogs.unshift(rec);
  if (typeof scheduleSync === 'function') scheduleSync();

// ---- utils ----
function uid(){ return Date.now().toString(36) + Math.random().toString(36).slice(2,7); }
function fmtDate(d){ if(!d) return '—'; const dt = new Date(d); if(isNaN(dt)) return d; return dt.toLocaleDateString('en-IN',{day:'2-digit',month:'short',year:'numeric'}); }
function fmtMoney(n){ n = Number(n)||0; return '₹' + n.toLocaleString('en-IN',{maximumFractionDigits:0}); }
// Local-date helpers: build YYYY-MM-DD from the device's own year/month/day.
// (toISOString converts to UTC first, which shifts dates back a day in India.)
function localDateStr(dt){ return dt.getFullYear() + '-' + String(dt.getMonth()+1).padStart(2,'0') + '-' + String(dt.getDate()).padStart(2,'0'); }
function todayStr(){ return localDateStr(new Date()); }

// ---- shared, safe date-sorting utilities (Point 54) ----
// Missing/invalid dates always sort to the end regardless of direction, so a
// record with no date never unpredictably jumps to the top of a "latest first" list.
function safeDateValue(d){
  if (!d) return null;
  const t = new Date(d).getTime();
  return isNaN(t) ? null : t;
}
function compareDatesDesc(a, b){ // latest first; missing/invalid always last
  const av = safeDateValue(a), bv = safeDateValue(b);
  if (av===null && bv===null) return 0;
  if (av===null) return 1;
  if (bv===null) return -1;
  return bv - av;
}
function sortedIpos(){
  // Default IPO ordering used everywhere in the app (Points 43-44): latest Opening
  // Date first. Ties broken by name so the order is deterministic, not insertion-based.
  return S.ipos.slice().sort((a,b) => compareDatesDesc(a.openDate, b.openDate) || (a.ipoName||'').localeCompare(b.ipoName||''));
}
function sortedActiveIpos(includeId){
  // For dropdowns where the user is creating something NEW (a plan, an application):
  // archived/Inactive IPOs shouldn't be selectable going forward. Filters and the main
  // IPOs list intentionally keep showing everything, including inactive IPOs, since
  // you still want to see/filter historical data for them.
  return sortedIpos().filter(i => (i.archiveStatus||'Active')==='Active' || i.id===includeId);
}
function sortedPlans(list){
  // Default Plan ordering used everywhere in the app (Points 45-47): newest created first.
  return (list || S.ipoPlans).slice().sort((a,b) => compareDatesDesc(a.createdAt, b.createdAt) || (b.id - a.id));
}
function isoDate(d){
  if(!d) return '';
  if (typeof d === 'string' && /^\d{4}-\d{2}-\d{2}$/.test(d)) return d; // already a plain date — keep as-is
  const dt = new Date(d); if(isNaN(dt)) return '';
  return localDateStr(dt);
}
function escapeHtml(s){ return (s==null?'':String(s)).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function toast(msg, kind='', action){
  const el = document.createElement('div');
  el.className = 'toast' + (kind ? ' '+kind : '');
  el.textContent = msg;
  if (action){ const b=document.createElement('button'); b.textContent=action.label||'Undo'; b.className='toast-act'; b.onclick=()=>{ el.remove(); action.fn(); }; el.appendChild(b); }
  document.getElementById('toastWrap').appendChild(el);
  setTimeout(()=>{ el.style.transition='opacity .4s'; el.style.opacity='0'; setTimeout(()=>el.remove(),400); }, action ? (action.ms||8000) : 3200);
}
function pad3(n){ return String(n).padStart(3,'0'); }

function nextCode(list, field, prefix){
  let max = 0;
  list.forEach(r => {
    const v = r[field];
    if (v && v.startsWith(prefix)) {
      const n = parseInt(v.slice(prefix.length), 10);
      if (!isNaN(n) && n > max) max = n;
    }
  });
  return prefix + pad3(max + 1);
}

function findClient(id){ return idx().c.get(id); }
function findBank(id){ return idx().b.get(id); }
function findIpo(id){ return idx().i.get(id); }
function findPlan(id){ return idx().plan.get(id); }

function ipoStatus(ipo){
  const today = todayStr();
  if (!ipo.openDate || !ipo.closeDate) return 'Upcoming';
  if (today < ipo.openDate) return 'Upcoming';
  if (today >= ipo.openDate && today <= ipo.closeDate) return 'Open';
  return 'Closed';
}
function statusBadgeClass(status){
  const map = {
    'Upcoming':'blue','Open':'green','Closed':'gray',
    'Not Applied':'gray','To Be Applied':'blue','Applied':'teal',
    'Allotted':'green','Not Allotted':'red','Pending':'gray',
    'Pending to Sell':'gold','Sold':'purple',
    'Received':'green','Receivable':'gold',
    'Planned':'blue','Partially Executed':'gold','Executed':'green','Awaiting Acceptance':'blue','Needs Reapply':'red','Sent':'blue','Accepted':'green','Failed':'red','To do':'gold','Cancelled':'red','Cancelled / Withdrawn':'red','Mandate Failed':'red',
    'Active':'green','Inactive':'gray',
    'Matched':'green','Bank Changed':'gold','Date Changed':'gold','Under Planned':'red','Over Planned':'blue',
    'Not Planned':'red','Partially Planned':'gold'
  };
  return map[status] || 'gray';
}
function badge(status){ return `<span class="badge ${statusBadgeClass(status)}">${escapeHtml(status||'—')}</span>`; }

// ---- planned client count ----
// The number of planned clients is DERIVED from the clients actually mapped to the plan (never typed by hand),
// so capacity, variance and reports can't drift. Old plans that were typed by hand and never had clients
// mapped keep their typed number until you map clients to them (after which the real mapping takes over).
function planClientCount(plan){
  if (!plan) return 0;
  const mapped = S.plannedClients.filter(pc => pc.planId === plan.id && S.clients.some(c => c.id === pc.clientId)).length;
  if (mapped === 0 && !plan.countSynced) return Number(plan.plannedClientCount) || 0; // legacy hand-typed plan
  return mapped;
}
async function syncPlanClientCount(plan){
  const n = S.plannedClients.filter(pc => pc.planId === plan.id && S.clients.some(c => c.id === pc.clientId)).length;
  if (plan.plannedClientCount === n && plan.countSynced) return;
  plan.plannedClientCount = n; plan.countSynced = true; plan.updatedAt = new Date().toISOString();
  await putRec('ipoPlans', plan);
}

// ---- bank capacity ----
// The per-bank-per-day mandate limit comes ONLY from Settings (any whole number >= 1). 6 is just the starting default.
function capacityLimit(){ const n = Math.floor(Number(S.settings.mandateCapacityPerBankPerDay)); return n >= 1 ? n : 6; }
function bankMandateCap(bankId){ const b = findBank(bankId); const n = b ? Math.floor(Number(b.mandateCap)) : NaN; return n >= 1 ? n : capacityLimit(); }
function bankCapacity(bankAccountId, dateStr){
  const plans = S.ipoPlans.filter(p => p.bankAccountId === bankAccountId && p.plannedDate === dateStr && p.planStatus !== 'Cancelled');
  // Mandates = total individual client applications planned through this bank on this
  // date, NOT the number of IPO-plan rows. One IPO planned for 6 different clients is
  // 6 mandates, not 1 — each client needs their own separate application/mandate
  // regardless of how many share the same IPO/bank/date.
  const planned = plans.reduce((s,p) => s + planClientCount(p), 0);
  const capacity = bankMandateCap(bankAccountId);
  const available = capacity - planned;
  const utilisation = capacity ? Math.round((planned / capacity) * 1000) / 10 : (planned ? 100 : 0);
  let status = 'Available';
  if (planned > capacity) status = 'Over Capacity';
  else if (planned === capacity) status = 'Full';
  else if (planned >= capacity - Math.max(1, Math.round(capacity/3))) status = 'Near Capacity'; // within ~a third of the limit
  return { planned, capacity, available, utilisation, status, plans };
}
function capClass(status){
  return { 'Available':'cap-avail','Near Capacity':'cap-near','Full':'cap-full','Over Capacity':'cap-over' }[status] || 'cap-avail';
}

// ---- planning vs actual ----
function planVariance(plan){
  const acts = S.applications.filter(a => a.planId === plan.id);
  const actualCount = acts.length;
  if (actualCount === 0) return 'Pending';
  const bankChanged = acts.some(a => a.bankAccountId !== plan.bankAccountId);
  const dateChanged = acts.some(a => a.applicationDate !== plan.plannedDate);
  if (bankChanged) return 'Bank Changed';
  if (dateChanged) return 'Date Changed';
  if (actualCount < planClientCount(plan)) return 'Under Planned';
  if (actualCount > planClientCount(plan)) return 'Over Planned';
  return 'Matched';
}

// ---- profit ----
// Allotment/Sale calculation. No partial sale: an allotted lot is either "Pending to Sell" or fully "Sold".
// Gross Received / Our Profit / Client Profit are only meaningful once Allotted + Sold, and each is independently overridable.
function isFilled(v){ return v !== null && v !== undefined && v !== ''; }
// Our share of the profit, in %. New applications are stamped with the current default (Settings → Profit Sharing,
// normally 50) when created, and each application can be changed individually. Older applications without a stamp
// were always 50/50, so they stay 50/50 — changing the default never rewrites history.
const LEGACY_PROFIT_SHARE = 50;
function defaultProfitShare(){ const n = Number(S.settings.profitSharePct); return (S.settings.profitSharePct !== undefined && S.settings.profitSharePct !== null && S.settings.profitSharePct !== '' && n >= 0 && n <= 100) ? n : 50; }
// A client can have their own share (Clients → Edit → "Our profit share %"); blank = use the default.
function clientOwnShare(c){ if (!c) return null; const v = c.profitSharePct; if (v === undefined || v === null || v === '') return null; const n = Number(v); return (n >= 0 && n <= 100) ? n : null; }
function shareForClient(clientId){ const own = clientOwnShare(findClient(clientId)); return own !== null ? own : defaultProfitShare(); }
function appProfitShare(app){ const n = Number(app.profitSharePct); return (app.profitSharePct !== undefined && app.profitSharePct !== null && app.profitSharePct !== '' && n >= 0 && n <= 100) ? n : LEGACY_PROFIT_SHARE; }
function calcAllotmentSale(app){
  const applicable = app.allotmentStatus === 'Allotted' && app.saleStatus === 'Sold' && isFilled(app.saleAmount);
  if (!applicable){
    return { applicable:false, calculatedGross:null, grossFinal:null, grossOverridden:false, calculatedOur:null, ourFinal:null, ourOverridden:false, calculatedClient:null, clientFinal:null, clientOverridden:false };
  }
  const applied = Number(app.amountApplied)||0;
  const sale = Number(app.saleAmount)||0;
  const calculatedGross = applied + (appProfitShare(app)/100)*(sale-applied);
  const grossOverridden = !!app.grossReceivedOverridden && isFilled(app.grossReceived);
  const grossFinal = grossOverridden ? Number(app.grossReceived) : calculatedGross;
  const calculatedOur = grossFinal - applied;
  const ourOverridden = !!app.ourProfitOverridden && isFilled(app.ourProfit);
  const ourFinal = ourOverridden ? Number(app.ourProfit) : calculatedOur;
  const calculatedClient = sale - grossFinal;
  const clientOverridden = !!app.clientProfitOverridden && isFilled(app.clientProfit);
  const clientFinal = clientOverridden ? Number(app.clientProfit) : calculatedClient;
  return { applicable:true, calculatedGross, grossFinal, grossOverridden, calculatedOur, ourFinal, ourOverridden, calculatedClient, clientFinal, clientOverridden };
}
// Back-compat alias used across stats/reports/excel for the business-side profit ("Our Profit")
function calcProfit(app){ const r = calcAllotmentSale(app); return { final: r.applicable ? r.ourFinal : 0, overridden: r.ourOverridden, calculated: r.applicable ? r.calculatedOur : 0 }; }

/* =================== NOTIFICATIONS =================== */
/* Honest scope: this is an in-app Notification Center — it computes urgent items
   fresh every time you open the portal or the panel, using the exact same rules
   as Dashboard > What Needs Attention. The optional "Browser Notifications" toggle
   in Settings uses the standard Notification API, which ONLY fires while this tab/app
   is actually open and running — there is no real background push here, since that
   would require a server to send notifications when your device isn't even looking
   at the app, which a static, serverless portal like this one cannot do. */
function computeNotifications(){
  const today = todayStr();
  const soon = isoDate(new Date(Date.now() + 2*86400000)); // 2 days from now
  const items = [];
  S.ipos.forEach(i=>{
    if ((i.archiveStatus||'Active')!=='Active') return;
    if (i.closeDate && i.closeDate>=today && i.closeDate<=soon) items.push({ text:`IPO closing soon: ${i.ipoName} (${fmtDate(i.closeDate)})`, go:()=>navigate('ipos',{id:i.id}) });
    if (i.allotmentDate===today) items.push({ text:`Allotment due today: ${i.ipoName}`, go:()=>navigate('ipos',{id:i.id}) });
  });
  const pendingAllotment = S.applications.filter(a=>a.applicationStatus==='Applied' && (!a.allotmentStatus || a.allotmentStatus==='Pending'));
  if (pendingAllotment.length) items.push({ text:`${pendingAllotment.length} application(s) awaiting allotment`, go:()=>navigate('allotments',{presetFilter:{tableId:'allotTbl',filterVals:{allotmentStatus:'Pending'}}}) });
  const awaitingSale = S.applications.filter(a=>a.allotmentStatus==='Allotted' && a.saleStatus!=='Sold');
  if (awaitingSale.length) items.push({ text:`${awaitingSale.length} allotted application(s) awaiting sale`, go:()=>navigate('allotments',{presetFilter:{tableId:'allotTbl',filterVals:{allotmentStatus:'Allotted', saleStatus:'Pending to Sell'}}}) });
  const awaitingReceipt = S.applications.filter(a=>a.saleStatus==='Sold' && a.amountReceiveStatus==='Receivable');
  if (awaitingReceipt.length) items.push({ text:`${awaitingReceipt.length} sold application(s) awaiting receipt`, go:()=>navigate('allotments',{presetFilter:{tableId:'allotTbl',filterVals:{amountReceiveStatus:'Receivable'}}}) });
  const hi = healthWeeklyIssues();
  if (hi) items.push({ text:`Data Health Check found ${hi} issue${hi===1?'':'s'} — tap to review`, go:()=>setSettingsTab('data') });
  const daysSinceBackup = daysSinceLastBackup();
  if (daysSinceBackup === null || daysSinceBackup > 7){
    items.push({ text: daysSinceBackup===null ? 'No backup taken yet — export one or connect Google Drive' : `Last backup was ${daysSinceBackup} days ago — consider backing up`, go:()=>navigate('settings') });
  }
  return items;
}
function renderNotifBadge(){
  const items = computeNotifications();
  const badge = document.getElementById('notifBadge');
  if (!badge) return;
  if (items.length){ badge.textContent = items.length; badge.style.display = 'inline-block'; }
  else badge.style.display = 'none';
}
function toggleNotifPanel(){
  const panel = document.getElementById('notifPanel');
  if (!panel) return;
  if (panel.style.display === 'block'){ panel.style.display = 'none'; return; }
  const items = computeNotifications();
  panel.innerHTML = items.length
    ? items.map((it,idx)=>`<div class="clickable" style="padding:10px 12px;border-bottom:1px solid var(--border);font-size:12.5px;" onclick="__notifGo(${idx})">${escapeHtml(it.text)}</div>`).join('')
    : `<div style="padding:14px;font-size:12.5px;color:var(--text-dim);">Nothing needs attention right now.</div>`;
  window.__notifItems = items;
  panel.style.display = 'block';
}
function __notifGo(idx){
  const it = window.__notifItems && window.__notifItems[idx];
  document.getElementById('notifPanel').style.display = 'none';
  if (it) it.go();
}

async function enableBrowserNotifications(){
  if (!('Notification' in window)){ toast('Browser notifications are not supported on this device/browser','danger'); return; }
  const perm = await Notification.requestPermission();
  await saveSetting('browserNotifsEnabled', perm === 'granted');
  if (perm === 'granted'){ toast('Browser notifications enabled — will show when you open the portal with urgent items pending','ok'); maybeFireBrowserNotifications(); }
  else toast('Permission denied — check your browser\'s site settings to enable notifications','warn');
  navigate('settings');
}

  if (!S.settings.browserNotifsEnabled || !('Notification' in window) || Notification.permission !== 'granted') return;
  const items = computeNotifications();
  if (items.length) new Notification('IPO Management Portal', { body: `${items.length} item(s) need attention — open the portal to review.` });
}

  S.view = view; S.params = params;

  // tab already filtered to the relevant records, instead of just the tab itself.
  if (params.presetFilter){

    if (!window.__tableState) window.__tableState = {};
    if (!window.__tableState[tableId]) window.__tableState[tableId] = { search:'', sortKey:null, sortDir:1, page:1, filterVals:{} };

    window.__tableState[tableId].page = 1;

  render();
  window.scrollTo(0,0);
}

// ---- generic field builder ----
function fieldHtml(f, val){
  val = (val===undefined||val===null) ? '' : val;
  const req = f.required ? 'required' : '';
  let inner = '';
  if (f.type === 'select'){
    inner = `<select id="fld_${f.key}" ${req} ${f.onchange?`onchange="${f.onchange}"`:''}>
      ${f.placeholder?`<option value="">${f.placeholder}</option>`:''}
      ${f.options.map(o=>{
        const ov = typeof o === 'object' ? o.value : o;
        const ol = typeof o === 'object' ? o.label : o;
        return `<option value="${escapeHtml(ov)}" ${String(val)===String(ov)?'selected':''}>${escapeHtml(ol)}</option>`;
      }).join('')}
    </select>`;
  } else if (f.type === 'textarea'){
    inner = `<textarea id="fld_${f.key}" ${req}>${escapeHtml(val)}</textarea>`;
  } else {
    inner = `<input type="${f.type||'text'}" id="fld_${f.key}" value="${escapeHtml(val)}" ${req} ${f.step?`step="${f.step}"`:''} ${f.min!==undefined?`min="${f.min}"`:''} placeholder="${escapeHtml(f.placeholder||'')}">`;
  }
  return `<div class="f-group ${f.span2?'span2':''}"><label>${f.label}${f.required?' *':''}</label>${inner}${f.hint?`<div class="hint">${f.hint}</div>`:''}</div>`;
}
function readFields(fields){
  const out = {};
  fields.forEach(f => {
    const el = document.getElementById('fld_'+f.key);
    if (!el) return;
    let v = el.value;
    if (f.type === 'number') v = v === '' ? null : Number(v);
    out[f.key] = v;
  });
  return out;
}

// ---- generic table with search/filter/sort/pagination ----
function makeTableController(id, opts){
  // opts: {data, columns, pageSize, rowClick, searchFields, filters:[{key,label,options}], extraToolbar}
  if (!window.__tableState) window.__tableState = {};
  if (!window.__tableState[id]) window.__tableState[id] = { search:'', sortKey:null, sortDir:1, page:1, filterVals:{}, pageSize: null };
  return window.__tableState[id];
}
function renderDataTable(id, opts){
  const st = makeTableController(id, opts);
  let rows = opts.data.slice();
  // #1: column customization — hide columns the user has chosen to hide for this table
  window.__tableColumnDefs = window.__tableColumnDefs || {};
  window.__tableColumnDefs[id] = opts.columns.filter(c=>c.key!=='sel').map(c=>({ key:c.key, hidden:!!c.hidden, label:(c.label||'').replace(/<[^>]+>/g,'') }));
  const colVisibility = (S.settings.columnVisibility && S.settings.columnVisibility[id]) || {};
  const columns = opts.columns.filter(c => c.key==='sel' || (colVisibility[c.key] === undefined ? !c.hidden : colVisibility[c.key] !== false));
  // filters
  (opts.filters||[]).forEach(f => {
    const v = st.filterVals[f.key];
    if (v) rows = rows.filter(r => f.match ? f.match(r, v) : String(r[f.key]) === String(v));
  });
  // search
  if (st.search && opts.searchFn) {
    rows = rows.filter(r => opts.searchFn(r, st.search.toLowerCase()));
  }
  // per-column filters (type text, or >100 / <=50 for numbers)
  const colDefs = {}; opts.columns.forEach(c=>{ colDefs[c.key]=c; });
  const activeCF = Object.entries(st.colFilters||{}).filter(([k,v])=>v && colDefs[k]);
  if (activeCF.length) rows = rows.filter(r => activeCF.every(([k,v]) => __colMatch(__cellText(colDefs[k], r), v)));
  // sort
  if (st.sortKey) {
    rows.sort((a,b) => {
      const sc = colDefs[st.sortKey];
      let av = opts.sortValue ? opts.sortValue(a, st.sortKey) : (sc && sc.val ? sc.val(a) : a[st.sortKey]);
      let bv = opts.sortValue ? opts.sortValue(b, st.sortKey) : (sc && sc.val ? sc.val(b) : b[st.sortKey]);
      if (av===undefined||av===null) av='';
      if (bv===undefined||bv===null) bv='';
      if (typeof av === 'number' && typeof bv === 'number') return (av-bv)*st.sortDir;
      return String(av).localeCompare(String(bv), undefined, {numeric:true}) * st.sortDir;
    });
  }
  const pageSize = st.pageSize || opts.pageSize || 12;
  const totalPages = Math.max(1, Math.ceil(rows.length / pageSize));
  if (st.page > totalPages) st.page = totalPages;
  const pageRows = rows.slice((st.page-1)*pageSize, st.page*pageSize);

  // expose the full filtered/searched (pre-pagination) id set so "select all" actions can select
  // everything matching the current filter/search, not just the current page or the whole dataset.
  window.__lastFilteredIds = window.__lastFilteredIds || {};
  window.__lastFilteredIds[id] = rows.map(r=>r.id);
  window.__tblLast = window.__tblLast || {};
  window.__tblLast[id] = { rows, columns: columns.filter(c=>c.key!=='sel') };
  const anyCF = activeCF.length>0, showCF = st.showColFilters || anyCF;

  const __fOpts = opts.filters||[];
  const __fHtml = f => `<select onchange="__tblFilter('${id}','${f.key}',this.value)" class="${st.filterVals[f.key]?'on':''}">
          <option value="">${f.label}: All</option>
          ${f.options.map(o=>`<option value="${escapeHtml(o)}" ${st.filterVals[f.key]===o?'selected':''}>${escapeHtml(o)}</option>`).join('')}
        </select>`;
  const __moreActive = __fOpts.slice(2).filter(f=>st.filterVals[f.key]).length;
  const __hasPresets = __fOpts.length>0;
  const toolbar = `
    <div class="list-toolbar">
      ${opts.searchFn ? `<input type="text" id="tblsearch-${id}" placeholder="${opts.searchPlaceholder||'Search...'}" value="${escapeHtml(st.search)}" oninput="__tblSearch('${id}',this.value)">` : ''}
      ${__fOpts.slice(0,2).map(__fHtml).join('')}
      <div class="spacer"></div>
      ${(st.search||anyCF||Object.values(st.filterVals||{}).some(Boolean)) ? `<button class="btn btn-ghost btn-sm" onclick="__tblClear('${id}')" title="Clear all filters">✕ Clear</button>`:''}
      <button class="btn btn-ghost btn-sm ${st.showMore||__moreActive?'on':''}" onclick="__tblToggleMore('${id}')" title="More filters, column filters, columns, presets">${st.showMore?'▾':'▸'} More${(__moreActive||activeCF.length)?' ('+(__moreActive+activeCF.length)+')':''}</button>
      <button class="btn btn-ghost btn-sm" onclick="__tblExport('${id}')" title="Download this table (with current filters) as CSV">⬇ CSV</button>
      ${opts.extraToolbar || ''}
    </div>
    ${(st.showMore||__moreActive) ? `<div class="list-toolbar more-bar">
      ${__fOpts.slice(2).map(__fHtml).join('')}
      <button class="btn btn-ghost btn-sm" onclick="__tblToggleCF('${id}')" title="Type under any column heading to filter it">🔎 Column filters ${showCF?'(on)':''}</button>
      <button class="btn btn-ghost btn-sm" onclick="openColumnPicker('${id}')" title="Show/hide columns">⚙ Columns</button>
      ${__hasPresets ? `<select onchange="if(this.value) applyTablePreset('${id}', this.value)" style="max-width:160px;">
          <option value="">Presets: Load...</option>
          ${((S.settings.savedPresets && S.settings.savedPresets[id]) || []).map((p,idx)=>`<option value="${idx}">${escapeHtml(p.name)}</option>`).join('')}
        </select>
        <button class="btn btn-ghost btn-sm" onclick="saveTablePreset('${id}')" title="Save current search/filters as a named preset">💾 Save Preset</button>` : ''}
    </div>` : ''}`;

  const hasSelCol = columns[0] && columns[0].key === 'sel';
  const stickyLeftPx = hasSelCol ? 40 : 0;
  const thead = `<tr>${columns.map((c,idx) => {
    const sticky = opts.stickyCol && c.key===opts.stickyCol;
    const stickyStyle = sticky ? `position:sticky;left:${stickyLeftPx}px;z-index:6;background:var(--table-head-bg);` : (c.key==='sel' ? `position:sticky;left:0;z-index:6;background:var(--table-head-bg);` : '');

      ? `<th style="${stickyStyle}">${c.label}</th>`
      : `<th onclick="__tblSort('${id}','${c.key}')" style="cursor:pointer;${stickyStyle}">${c.label}${st.sortKey===c.key?(st.sortDir===1?' ▲':' ▼'):''}</th>`;
  }).join('')}${opts.rowActions?'<th>Actions</th>':''}</tr>`

  // totals row (over ALL filtered rows, not just this page)

/* Root-cause fix for the "search loses focus" / "page jumps on selection" bugs:
   every table re-render used to blindly replace innerHTML, destroying and
   recreating the search input (and everything else) even when only a checkbox
   or one row changed. This helper preserves focus, cursor position, and the
   page's scroll position across that replace, and is used everywhere instead
   of a raw innerHTML assignment. */
function renderIntoWrap(wrapId, html){
  const wrap = document.getElementById(wrapId);
  if (!wrap) return;
  const active = document.activeElement;
  let focusInfo = null;
  if (active && wrap.contains(active) && (active.tagName==='INPUT' || active.tagName==='SELECT' || active.tagName==='TEXTAREA')){
    focusInfo = {
      id: active.id || null,
      selStart: (typeof active.selectionStart === 'number') ? active.selectionStart : null,
      selEnd: (typeof active.selectionEnd === 'number') ? active.selectionEnd : null
    };
  }
  const scrollY = window.scrollY;
  wrap.innerHTML = html;
  if (focusInfo && focusInfo.id){
    const el = document.getElementById(focusInfo.id);
    if (el){
      el.focus();
      if (focusInfo.selStart !== null && el.setSelectionRange){
        try { el.setSelectionRange(focusInfo.selStart, focusInfo.selEnd); } catch(e){ /* not a text-selectable input, ignore */ }
      }
    }
  }
  // Defensive: some browsers nudge scroll position when focus moves during
  // a DOM replace. Selecting/searching should never move the viewport.
  if (Math.abs(window.scrollY - scrollY) > 1) window.scrollTo(0, scrollY);
}
