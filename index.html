<script>
/* =================== GENERIC TABLE ENHANCER ===================
   Every hand-built report table (anything that isn't made by renderDataTable)
   gets: click-to-sort headers, a quick row filter, a Total row for the money /
   count columns, a CSV download, and labels so it turns into cards on a phone.   */
(function(){
  const NO_SUM = /(rate|%|avg|average|per\b|\/ ?(sale|app|alloc)|id\b|#|ratio|days?\b|trend|change|variance|gain|score|rank|year|date|price|gmp|limit|capacity|util|share)/i;
  const MONEYCELL = /^[-−+]?\s*₹?\s*-?[\d,]+(\.\d+)?$/;
  let busy = false;
  function num(t){ t = String(t).replace(/[₹,\s]/g,'').replace('−','-'); const n = parseFloat(t); return isNaN(n)?null:n; }
  function fmt(n, money){ n = Math.round(n*100)/100; return money ? '₹'+n.toLocaleString('en-IN',{maximumFractionDigits:0}) : n.toLocaleString('en-IN'); }
  function enhance(table){
    if (table.dataset.enh || table.dataset.dt) return;
    table.dataset.enh = '1';
    const thead = table.tHead; if (!thead || thead.rows.length !== 1) { table.classList.add('cards'); labelOnly(table); return; }
    const ths = Array.from(thead.rows[0].cells);
    const tb = table.tBodies[0]; if (!tb) return;
    let rows = Array.from(tb.rows);
    // an existing hand-made total row stays where it is, outside sort/filter/sum
    const footRows = []; while (rows.length && /^\s*(total|grand total)/i.test(rows[rows.length-1].cells[0] ? rows[rows.length-1].cells[0].textContent : '')) footRows.unshift(rows.pop());
    rows = rows.filter(r => !r.classList.contains('empty-row') && r.cells.length === ths.length);
    labelOnly(table);
    if (!rows.length) return;
    table.classList.add('cards');
    // numeric columns
    const info = ths.map((th,i)=>{
      const vals = rows.map(r=>r.cells[i].textContent.trim());
      const filled = vals.filter(v=>v && v!=='—' && v!=='-');
      const isNum = filled.length>0 && filled.every(v=>MONEYCELL.test(v));
      const isMoney = isNum && filled.some(v=>v.indexOf('₹')>=0);
      const label = th.textContent.trim();
      const sumOk = isNum && rows.length>1 && !footRows.length && label && !(NO_SUM.test(label) && !isMoney) && !/(rate|%|avg|average)/i.test(label);
      return { isNum, isMoney, sumOk, label };
    });
    ths.forEach((th,i)=>{
      if (info[i].isNum) { th.classList.add('num'); rows.forEach(r=>r.cells[i].classList.add('num')); }
      if (th.getAttribute('onclick') || !th.textContent.trim()) return;
      th.style.cursor='pointer'; th.title='Click to sort';
      th.addEventListener('click', ()=>{
        const dir = th.dataset.dir === 'asc' ? -1 : 1; th.dataset.dir = dir===1 ? 'asc':'desc';
        ths.forEach(x=>{ const m=x.querySelector('.sort-ind'); if(m) m.remove(); });
        const ind = document.createElement('span'); ind.className='sort-ind'; ind.textContent = dir===1?'▲':'▼'; th.appendChild(ind);
        const keyOf = r => { const t=r.cells[i].textContent.trim(); if (info[i].isNum){ const n=num(t); return n===null?-Infinity:n; } return t.toLowerCase(); };
        const sorted = rows.slice().sort((a,b)=>{ const x=keyOf(a), y=keyOf(b); return (typeof x==='number'&&typeof y==='number') ? (x-y)*dir : String(x).localeCompare(String(y),undefined,{numeric:true})*dir; });
        sorted.forEach(r=>tb.insertBefore(r, footRows[0] || null));
        rows = sorted;
      });
    });
    // totals
    let tf = null;
    if (info.some(x=>x.sumOk)) {
      tf = document.createElement('tfoot'); const tr = document.createElement('tr'); tr.className='total-row';
      ths.forEach((th,i)=>{ const td=document.createElement('td'); td.dataset.label=info[i].label; if(info[i].isNum) td.className='num'; tr.appendChild(td); });
      tf.appendChild(tr); table.appendChild(tf);
    }
    const recalc = ()=>{
      if (!tf) return; const vis = rows.filter(r=>r.style.display!=='none'); const tr = tf.rows[0];
      info.forEach((x,i)=>{ const td = tr.cells[i];
        if (x.sumOk){ let t=0; vis.forEach(r=>{ const n=num(r.cells[i].textContent); if(n!==null) t+=n; }); td.textContent = fmt(t,x.isMoney); }
        else td.textContent = '';
      });
      tr.cells[0].textContent = (info[0].sumOk ? tr.cells[0].textContent+' ' : '') + 'Total (' + vis.length + ')';
      if (info[0].sumOk) tr.cells[0].textContent = 'Total (' + vis.length + ') · ' + fmt(vis.reduce((t,r)=>t+(num(r.cells[0].textContent)||0),0), info[0].isMoney);
    };
    recalc();
    // toolbar
    const wrap = table.closest('.table-wrap') || table.parentElement;
    const tools = document.createElement('div'); tools.className='tbl-tools no-print';
    if (rows.length > 5) {
      const inp = document.createElement('input'); inp.type='text'; inp.placeholder='Filter rows…';
      inp.addEventListener('input', ()=>{ const q=inp.value.toLowerCase().trim(); rows.forEach(r=>{ r.style.display = !q || r.textContent.toLowerCase().includes(q) ? '' : 'none'; }); recalc(); });
      tools.appendChild(inp);
    }
    const b = document.createElement('button'); b.className='btn btn-ghost'; b.textContent='⬇ CSV';
    b.addEventListener('click', ()=>{
      const head = ths.map(t=>t.textContent.replace(/[▲▼]/g,'').trim());
      const body = rows.filter(r=>r.style.display!=='none').map(r=>Array.from(r.cells).map(c=>c.textContent.replace(/\s+/g,' ').trim()));
      const name = (table.closest('.section-card')?.querySelector('.sc-head h3')?.textContent || 'table').trim().replace(/[^\w]+/g,'_').slice(0,40);
      __downloadCsv(name, [head, ...body]); toast('Exported '+body.length+' row(s)','ok');
    });
    tools.appendChild(b);
    wrap.parentNode.insertBefore(tools, wrap);
    if (rows.length <= 12) wrap.classList.add('flat');
  }
  function labelOnly(table){
    const ths = table.tHead && table.tHead.rows[0] ? Array.from(table.tHead.rows[0].cells) : [];
    Array.from(table.tBodies).forEach(tb=>Array.from(tb.rows).forEach(r=>{ Array.from(r.cells).forEach((c,i)=>{ if(!c.dataset.label && ths[i] && c.colSpan===1) c.dataset.label = ths[i].textContent.trim(); }); }));
  }
  function run(){ if (busy) return; busy = true; try { document.querySelectorAll('table.dt').forEach(enhance); if (window.autoLinkNames) autoLinkNames(document); } catch(e){ console.warn('enhance', e); } busy = false; }
  let timer = null;
  new MutationObserver(()=>{ if (busy) return; clearTimeout(timer); timer = setTimeout(run, 30); }).observe(document.body,{childList:true,subtree:true});
  window.enhanceTables = run;
})();
</script>
<script>
/* =================== SUB-REFERENCE STATEMENT (PDF) ===================
   One PDF per group or per person: every person under it, sold applications only, by sale date,
   grouped IPO-wise with a sub total per IPO and a grand total at the end.
   Columns: Sale Date | Name | Sales | Cost | Profit  (Profit = that person's own share).
   The PDF is written directly (no library), so it works offline. */
let subStmtState = { mode:'group', sub:null, person:null, period:'thisMonth', from:'', to:'' };
function openStatementFor(id){ subStmtState.mode='person'; subStmtState.person=id; reportsTab='stmt'; navigate('reports'); }

const STMT_PERIODS = [
  ['thisMonth','This month'], ['lastMonth','Last month'], ['last2','Last 2 months'], ['last3','Last 3 months'],
  ['thisFY','This financial year'], ['lastFY','Last financial year'], ['thisYear','This year'], ['lastYear','Last year'], ['custom','Custom dates']
];
function stmtRange(){
  const now = new Date(), y = now.getFullYear(), m = now.getMonth(), iso = d => localDateStr(d), p = subStmtState.period;
  if (p==='thisMonth') return { from:iso(new Date(y,m,1)), to:iso(new Date(y,m+1,0)) };
  if (p==='lastMonth') return { from:iso(new Date(y,m-1,1)), to:iso(new Date(y,m,0)) };
  if (p==='last2') return { from:iso(new Date(y,m-2,1)), to:iso(new Date(y,m,0)) };
  if (p==='last3') return { from:iso(new Date(y,m-3,1)), to:iso(new Date(y,m,0)) };
  const fy = m>=3 ? y : y-1;
  if (p==='thisFY') return { from:iso(new Date(fy,3,1)), to:iso(new Date(fy+1,2,31)) };
  if (p==='lastFY') return { from:iso(new Date(fy-1,3,1)), to:iso(new Date(fy,2,31)) };
  if (p==='thisYear') return { from:y+'-01-01', to:y+'-12-31' };
  if (p==='lastYear') return { from:(y-1)+'-01-01', to:(y-1)+'-12-31' };
  return { from: subStmtState.from || '0001-01-01', to: subStmtState.to || '9999-12-31' };
}
function stmtSubs(){
  const set = new Set((S.settings.subReferences||[]).filter(Boolean));
  let blank = false;
  S.clients.forEach(c => { if (c.subReference) set.add(c.subReference); else blank = true; });
  const list = Array.from(set).sort((a,b)=>a.localeCompare(b));
  if (blank) list.push('');
  return list;
}
function stmtSubLabel(v){ return v ? v : '(No group)'; }
function stmtData(){
  const subs = stmtSubs();
  if (subStmtState.sub === null || !subs.includes(subStmtState.sub)) subStmtState.sub = subs.length ? subs[0] : '';
  const r = stmtRange(), sub = subStmtState.sub, person = subStmtState.mode==='person';
  if (person && (subStmtState.person===null || !findClient(subStmtState.person))) subStmtState.person = S.clients.length ? S.clients[0].id : null;
  const people = person ? S.clients.filter(c => c.id === subStmtState.person) : S.clients.filter(c => (c.subReference||'') === sub);
  const ids = new Set(people.map(c => c.id));
  const rows = [];
  S.applications.forEach(a => {
    if (!ids.has(a.clientId) || a.saleStatus !== 'Sold' || !a.saleDate) return;
    if (a.saleDate < r.from || a.saleDate > r.to) return;
    const c = calcAllotmentSale(a); if (!c.applicable) return;
    const cl = findClient(a.clientId), ipo = findIpo(a.ipoId);
    rows.push({ date:a.saleDate, name: cl?cl.clientName:'?', ipo: ipo?ipo.ipoName:'?', ipoId:a.ipoId, sales:Number(a.saleAmount)||0, cost:Number(a.amountApplied)||0, profit:c.clientFinal });
  });
  const groups = new Map();
  rows.forEach(x => { if (!groups.has(x.ipoId)) groups.set(x.ipoId, { ipo:x.ipo, rows:[], first:x.date }); const g = groups.get(x.ipoId); g.rows.push(x); if (x.date < g.first) g.first = x.date; });
  const list = Array.from(groups.values()).sort((a,b)=> a.first.localeCompare(b.first) || a.ipo.localeCompare(b.ipo));
  const sum = rs => rs.reduce((t,x)=>({ sales:t.sales+x.sales, cost:t.cost+x.cost, profit:t.profit+x.profit }), { sales:0, cost:0, profit:0 });
  list.forEach(g => { g.rows.sort((a,b)=> a.date.localeCompare(b.date) || a.name.localeCompare(b.name)); g.tot = sum(g.rows); });
  return { person, title: person ? (people[0] ? people[0].clientName : '') : stmtSubLabel(sub), sub, range:r, groups:list, total:sum(rows), count:rows.length, names:new Set(rows.map(x=>x.name)).size, people:people.length };
}
function stmtNum(n){ n = Math.round(Number(n)||0); return (n<0?'-':'') + Math.abs(n).toLocaleString('en-IN'); }
function stmtPeriodText(r){ return (r.from.startsWith('0001') ? 'Up to ' : fmtDate(r.from)+' to ') + (r.to.startsWith('9999') ? 'today' : fmtDate(r.to)); }

/* ---------- on-screen ---------- */
function setStmt(k, v){ subStmtState[k] = v; render(); }
function reportStatements(){
  const D = stmtData(), subs = stmtSubs();
  const subOpts = subs.map(s=>`<option value="${escapeHtml(s)}" ${s===D.sub?'selected':''}>${escapeHtml(stmtSubLabel(s))}</option>`).join('');
  const personOpts = S.clients.slice().sort((a,b)=>a.clientName.localeCompare(b.clientName)).map(c=>`<option value="${c.id}" ${c.id===subStmtState.person?'selected':''}>${escapeHtml(c.clientName)}</option>`).join('');
  const perOpts = STMT_PERIODS.map(p=>`<option value="${p[0]}" ${subStmtState.period===p[0]?'selected':''}>${p[1]}</option>`).join('');
  const body = D.groups.map(g => `
    <tr class="stmt-ipo"><td colspan="5"><b>${escapeHtml(g.ipo)}</b></td></tr>
    ${g.rows.map(x=>`<tr><td>${fmtDate(x.date)}</td><td>${escapeHtml(x.name)}</td><td class="num">${stmtNum(x.sales)}</td><td class="num">${stmtNum(x.cost)}</td><td class="num">${stmtNum(x.profit)}</td></tr>`).join('')}
    <tr class="stmt-sub"><td colspan="2">Sub Total — ${escapeHtml(g.ipo)}</td><td class="num">${stmtNum(g.tot.sales)}</td><td class="num">${stmtNum(g.tot.cost)}</td><td class="num">${stmtNum(g.tot.profit)}</td></tr>`).join('');
  return `
  <div class="section-card">
    <div class="sc-head" style="flex-wrap:wrap;gap:8px;"><h3>Statement (PDF)</h3><div class="spacer"></div>
      <button class="btn btn-ghost" ${D.count?'':'disabled'} onclick="stmtWhatsApp()">Share on WhatsApp</button>
      <button class="btn btn-primary" ${D.count?'':'disabled'} onclick="stmtDownload()">Download PDF</button></div>
    <div class="sc-body">
      <div style="display:flex;flex-wrap:wrap;gap:12px;align-items:flex-end;margin-bottom:14px;">
        <div class="f-group"><label>Statement for</label><select onchange="setStmt('mode', this.value)"><option value="group" ${!D.person?'selected':''}>A whole group</option><option value="person" ${D.person?'selected':''}>One person</option></select></div>
        ${D.person
          ? `<div class="f-group"><label>Name</label><select onchange="setStmt('person', Number(this.value))">${personOpts}</select></div>`
          : `<div class="f-group"><label>Group</label><select onchange="setStmt('sub', this.value)">${subOpts || '<option value="">(none)</option>'}</select></div>`}
        <div class="f-group"><label>Period</label><select onchange="setStmt('period', this.value)">${perOpts}</select></div>
        ${subStmtState.period==='custom' ? `<div class="f-group"><label>From</label><input type="date" value="${subStmtState.from}" onchange="setStmt('from', this.value)"></div><div class="f-group"><label>To</label><input type="date" value="${subStmtState.to}" onchange="setStmt('to', this.value)"></div>` : ''}
        <div class="small-muted" style="padding-bottom:8px;">${stmtPeriodText(D.range)} · by sale date</div>
      </div>
      <div class="kpi-grid" style="margin-bottom:14px;">
        ${D.person ? '' : `<div class="kpi-card"><div class="lbl">Names</div><div class="val">${D.names}</div><div class="small-muted">of ${D.people} in this group</div></div>`}
        <div class="kpi-card"><div class="lbl">Sales made</div><div class="val">${D.count}</div></div>
        <div class="kpi-card"><div class="lbl">Total sales</div><div class="val">${fmtMoney(D.total.sales)}</div></div>
        <div class="kpi-card"><div class="lbl">Total cost</div><div class="val">${fmtMoney(D.total.cost)}</div></div>
        <div class="kpi-card"><div class="lbl">Total profit</div><div class="val gold">${fmtMoney(D.total.profit)}</div></div>
      </div>
      ${D.count ? `<div class="table-wrap"><table class="dt stmt-prev" data-enh="1"><thead><tr><th>Sale Date</th><th>Name</th><th class="num">Sales</th><th class="num">Cost</th><th class="num">Profit</th></tr></thead><tbody>${body}
        <tr class="stmt-grand"><td colspan="2">Grand Total</td><td class="num">${stmtNum(D.total.sales)}</td><td class="num">${stmtNum(D.total.cost)}</td><td class="num">${stmtNum(D.total.profit)}</td></tr></tbody></table></div>`
        : `<p class="small-muted">No sales in this period for ${escapeHtml(D.title)}. Try another period.</p>`}
      <p class="hint">Only sold applications are included, by sale date, in rupees. The PDF has the same figures: a summary on top, each IPO with its sub total, and the grand total at the end.</p>
    </div>
  </div>`;
}

/* ---------- PDF writer (A4, Helvetica, no library) ---------- */
const STMT_W = [278,278,355,556,556,889,667,191,333,333,389,584,278,333,278,278,556,556,556,556,556,556,556,556,556,556,278,278,584,584,584,556,1015,667,667,722,722,667,611,778,722,278,500,667,556,833,722,778,667,778,722,667,611,722,667,944,667,667,611,278,278,278,469,556,333,556,556,500,556,556,278,556,556,222,222,500,222,833,556,556,556,556,333,500,278,556,500,722,500,500,500,334,260,334,584];
function stmtClean(t){ return String(t==null?'':t).replace(/[–—]/g,'-').replace(/[‘’]/g,"'").replace(/[“”]/g,'"').replace(/[^\x20-\x7E]/g,'?'); }
function stmtWidth(t, size, bold){ let w = 0; for (const ch of stmtClean(t)){ const c = ch.charCodeAt(0)-32; w += (STMT_W[c]||556) * ((bold && !/[0-9 ,.\-]/.test(ch)) ? 1.06 : 1); } return w*size/1000; }
function stmtFit(t, size, bold, maxW){ t = stmtClean(t); if (stmtWidth(t,size,bold) <= maxW) return t; while (t.length>1 && stmtWidth(t+'...',size,bold) > maxW) t = t.slice(0,-1); return t+'...'; }
function stmtEsc(t){ return stmtClean(t).replace(/\\/g,'\\\\').replace(/\(/g,'\\(').replace(/\)/g,'\\)'); }

function stmtBuildPdf(D){
  const PW = 595, PH = 842, M = 40, RIGHT = PW - M;
  const COL = { date:M, name:M+88, sales:M+330, cost:M+410, profit:RIGHT };
  const pages = []; let ops = null, y = 0;
  const newPage = () => { ops = []; pages.push(ops); y = PH - M; };
  const fillC = (g) => ops.push(`${g} ${g} ${g} rg`);
  const text = (t, x, yy, size, bold, align) => {
    t = stmtClean(t); const w = stmtWidth(t,size,bold); const px = align==='r' ? x - w : x;
    ops.push(`BT /${bold?'F2':'F1'} ${size} Tf ${px.toFixed(2)} ${yy.toFixed(2)} Td (${stmtEsc(t)}) Tj ET`);
  };
  const rect = (x, yy, w, h, g) => { fillC(g); ops.push(`${x.toFixed(2)} ${yy.toFixed(2)} ${w.toFixed(2)} ${h.toFixed(2)} re f`); fillC(0); };
  const line = (x1, yy, x2, wdt, g) => { ops.push(`${g} G ${wdt} w ${x1} ${yy.toFixed(2)} m ${x2} ${yy.toFixed(2)} l S`); };
  const colHead = () => {
    rect(M, y-16, RIGHT-M, 20, 0.90);
    text('Sale Date', COL.date+4, y-10, 9, true); text('Name', COL.name, y-10, 9, true);
    text('Sales (Rs.)', COL.sales, y-10, 9, true, 'r'); text('Cost (Rs.)', COL.cost, y-10, 9, true, 'r'); text('Profit (Rs.)', COL.profit-4, y-10, 9, true, 'r');
    y -= 24;
  };
  const need = (h) => { if (y - h < M + 28){ newPage(); colHead(); return true; } return false; };

  newPage();
  text('Statement', M, y-14, 20, true);
  text(D.title, M, y-36, 13, true);
  text('Period: ' + stmtPeriodText(D.range) + '  (by sale date)', M, y-54, 10, false);
  text('Prepared on ' + fmtDate(todayStr()), RIGHT, y-14, 9, false, 'r');
  y -= 72;
  // summary box
  const bh = 58; rect(M, y-bh, RIGHT-M, bh, 0.95);
  const cells = [...(D.person ? [] : [['Names', String(D.names)]]), ['Sales made', String(D.count)], ['Total sales (Rs.)', stmtNum(D.total.sales)], ['Total cost (Rs.)', stmtNum(D.total.cost)], ['Total profit (Rs.)', stmtNum(D.total.profit)]];
  const cw = (RIGHT-M)/cells.length;
  cells.forEach((c,i)=>{ text(c[0], M+i*cw+10, y-20, 8.5, false); text(c[1], M+i*cw+10, y-42, 13, true); });
  y -= bh + 18;
  colHead();

  D.groups.forEach(g => {
    need(18 + 17*2 + 20);
    rect(M, y-15, RIGHT-M, 19, 0.96);
    text(g.ipo, M+4, y-9, 10, true); y -= 21;
    g.rows.forEach(x => {
      if (need(17)) { rect(M, y-15, RIGHT-M, 19, 0.96); text(g.ipo + ' (continued)', M+4, y-9, 10, true); y -= 21; }
      text(fmtDate(x.date), COL.date+4, y-9, 9.5, false);
      text(stmtFit(x.name, 9.5, false, COL.sales-70-COL.name), COL.name, y-9, 9.5, false);
      text(stmtNum(x.sales), COL.sales, y-9, 9.5, false, 'r'); text(stmtNum(x.cost), COL.cost, y-9, 9.5, false, 'r'); text(stmtNum(x.profit), COL.profit-4, y-9, 9.5, false, 'r');
      line(M, y-14, RIGHT, 0.4, 0.85); y -= 17;
    });
    need(20);
    line(M, y+1, RIGHT, 0.8, 0.4);
    text('Sub Total - ' + g.ipo, M+4, y-12, 9.5, true);
    text(stmtNum(g.tot.sales), COL.sales, y-12, 9.5, true, 'r'); text(stmtNum(g.tot.cost), COL.cost, y-12, 9.5, true, 'r'); text(stmtNum(g.tot.profit), COL.profit-4, y-12, 9.5, true, 'r');
    y -= 28;
  });
  need(30);
  rect(M, y-20, RIGHT-M, 24, 0.86);
  text('Grand Total', M+4, y-12, 11, true);
  text(stmtNum(D.total.sales), COL.sales, y-12, 11, true, 'r'); text(stmtNum(D.total.cost), COL.cost, y-12, 11, true, 'r'); text(stmtNum(D.total.profit), COL.profit-4, y-12, 11, true, 'r');

  // page numbers
  pages.forEach((p, i) => { const t = 'Page ' + (i+1) + ' of ' + pages.length; const w = stmtWidth(t, 8, false); p.push(`BT /F1 8 Tf ${(PW/2 - w/2).toFixed(2)} 22 Td (${stmtEsc(t)}) Tj ET`); });

  // assemble objects
  const objs = []; const add = s => { objs.push(s); return objs.length; };
  const catalog = add(''), pagesObj = add(''), f1 = add('<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica /Encoding /WinAnsiEncoding >>'), f2 = add('<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica-Bold /Encoding /WinAnsiEncoding >>');
  const kids = [];
  pages.forEach(p => {
    const stream = p.join('\n');
    const c = add(`<< /Length ${stream.length} >>\nstream\n${stream}\nendstream`);
    kids.push(add(`<< /Type /Page /Parent ${pagesObj} 0 R /MediaBox [0 0 ${PW} ${PH}] /Resources << /Font << /F1 ${f1} 0 R /F2 ${f2} 0 R >> >> /Contents ${c} 0 R >>`));
  });
  objs[catalog-1] = `<< /Type /Catalog /Pages ${pagesObj} 0 R >>`;
  objs[pagesObj-1] = `<< /Type /Pages /Kids [${kids.map(k=>k+' 0 R').join(' ')}] /Count ${kids.length} >>`;
  let out = '%PDF-1.4\n'; const offs = [];
  objs.forEach((o,i) => { offs.push(out.length); out += `${i+1} 0 obj\n${o}\nendobj\n`; });
  const xref = out.length;
  out += `xref\n0 ${objs.length+1}\n0000000000 65535 f \n` + offs.map(o => String(o).padStart(10,'0') + ' 00000 n \n').join('');
  out += `trailer\n<< /Size ${objs.length+1} /Root ${catalog} 0 R >>\nstartxref\n${xref}\n%%EOF`;
  const bytes = new Uint8Array(out.length); for (let i=0;i<out.length;i++) bytes[i] = out.charCodeAt(i) & 255;
  return bytes;
}
function stmtDownload(){
  const D = stmtData(); if (!D.count){ toast('No sales in this period','warn'); return; }
  const bytes = stmtBuildPdf(D);
  const r = D.range, tag = (r.from.startsWith('0001') ? 'upto' : r.from) + '_to_' + (r.to.startsWith('9999') ? todayStr() : r.to);
  const name = 'Statement_' + stmtClean(D.title).replace(/[^A-Za-z0-9]+/g,'_').replace(/^_|_$/g,'') + '_' + tag + '.pdf';
  const blob = new Blob([bytes], { type:'application/pdf' }), url = URL.createObjectURL(blob);
  const a = document.createElement('a'); a.href = url; a.download = name; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(url), 4000);
  toast('Statement downloaded: ' + name, 'ok');
}

</script>
<script>
/* =================== DELETED-RECORD SYNC, MONTH CLOSE, CAPITAL VIEW, WEEKLY REVIEW, WHATSAPP =================== */

/* ---- Deleted-record list ("tombstones"): lets a delete on one device reach the others ---- */
function tombKey(store, r){ return store+':'+r.id+':'+(r.createdAt||''); }
function pruneTombstones(log){ const cut = Date.now()-120*86400000, o = {}; Object.entries(log||{}).forEach(([k,v])=>{ if (Date.parse(v) >= cut) o[k]=v; }); return o; }
async function logTombstone(store, rec){
  try { const log = { ...(S.settings.deletedLog||{}) }; log[tombKey(store,rec)] = new Date().toISOString(); await saveSetting('deletedLog', pruneTombstones(log)); }
  catch(e){ console.warn('tombstone', e); }
}
async function clearTombstones(pairs){
  try { const log = { ...(S.settings.deletedLog||{}) }; let ch = false;
    pairs.forEach(([st,r])=>{ const k = tombKey(st,r); if (log[k]){ delete log[k]; ch = true; } });
    if (ch) await saveSetting('deletedLog', log); } catch(e){}
}

/* ---- Month close: a closed month's sales can't be edited or deleted. Recording money received still works. ---- */
const LOCK_SAFE_FIELDS = new Set(['amountReceiveStatus','receivedDate','receivedViaLedger','updatedAt']);
function monthLocked(d){ const m = d ? String(d).slice(0,7) : ''; const L = (S.settings.monthLocks||{})[m]; return !!(L && L.closed); }
function appInClosedMonth(a){ return !!a && a.saleStatus==='Sold' && monthLocked(a.saleDate); }
function monthClosedBlock(a){
  toast(`Sales for ${monthLabel((a.saleDate||'').slice(0,7))} are closed. Reopen that month in Reports → Settlement to change them.`, 'danger');
  throw new Error('MONTH_CLOSED');
}
function assertMonthOpen(name, obj){
  if (name !== 'applications' || window.__suppressReadOnlyCheck) return;
  if (!Object.keys(S.settings.monthLocks||{}).length) return;
  const old = obj && obj.id!=null ? S.applications.find(x=>x.id===obj.id) : null;
  if (!appInClosedMonth(old) && !appInClosedMonth(obj)) return;
  if (old){
    const keys = new Set([...Object.keys(old), ...Object.keys(obj)]);
    const changed = [...keys].filter(k=>!LOCK_SAFE_FIELDS.has(k) && JSON.stringify(old[k])!==JSON.stringify(obj[k]));
    if (!changed.length) return;
    monthClosedBlock(appInClosedMonth(old) ? old : obj);
  }
  monthClosedBlock(obj);
}
function assertMonthOpenForDelete(name, id){
  if (name !== 'applications' || window.__suppressReadOnlyCheck) return;
  const a = S.applications.find(x=>x.id===id); if (appInClosedMonth(a)) monthClosedBlock(a);
}
async function setMonthClosed(month, closed){
  const L = { ...(S.settings.monthLocks||{}) }; L[month] = { closed, at:new Date().toISOString() };
  await saveSetting('monthLocks', L); await audit(closed?'Month Closed':'Month Reopened','Settings', 0, null, { month });
  toast(closed ? `${monthLabel(month)} closed — its sales are now locked` : `${monthLabel(month)} reopened`, 'ok'); render();
}
function toggleMonthClose(month){
  const closed = !!((S.settings.monthLocks||{})[month]||{}).closed;
  if (!closed){
    const pend = S.applications.filter(a=>a.saleStatus==='Sold' && (a.saleDate||'').slice(0,7)===month && recvDue(a)>0.5).length;
    confirmAction(`Close ${monthLabel(month)}? Its sales can no longer be edited or deleted.${pend?` ${pend} sale(s) are still waiting for money — you can still record the payments.`:''}`, ()=>setMonthClosed(month,true));
  } else confirmAction(`Reopen ${monthLabel(month)}? Its sales become editable again.`, ()=>setMonthClosed(month,false));
}
function monthClosePanelHtml(){
  const months = new Set(last12MonthKeys ? last12MonthKeys().slice(-6) : []);
  S.applications.forEach(a=>{ if (a.saleStatus==='Sold' && a.saleDate) months.add(a.saleDate.slice(0,7)); });
  Object.keys(S.settings.monthLocks||{}).forEach(m=>months.add(m));
  const list = Array.from(months).sort().reverse().slice(0,8);
  const rows = list.map(m=>{
    const closed = monthLocked(m+'-01'); const n = S.applications.filter(a=>a.saleStatus==='Sold' && (a.saleDate||'').slice(0,7)===m).length;
    return `<div style="display:flex;align-items:center;gap:10px;padding:6px 0;border-bottom:1px solid var(--border);"><b style="min-width:120px;">${monthLabel(m)}</b>
      <span class="small-muted" style="flex:1;">${n} sale${n===1?'':'s'}</span>
      ${closed?'<span class="badge green">🔒 Closed</span>':'<span class="badge gray">Open</span>'}
      <button class="btn btn-sm ${closed?'btn-ghost':'btn-primary'}" onclick="toggleMonthClose('${m}')">${closed?'Reopen':'Close month'}</button></div>`;
  }).join('');
  return `<details class="collapse no-print" style="margin-bottom:14px;"><summary>Month close <span class="small-muted" style="font-weight:500;">lock a month once it is settled</span></summary>
    <div style="margin-top:8px;">${rows||'<p class="small-muted">No sales yet.</p>'}<p class="hint">Closing a month stops edits and deletes to that month's sales (by sale date) so settled numbers can't change by accident. Payments received can still be recorded.</p></div></details>`;
}

/* ---- Dashboard: capital view ---- */
function capitalViewHtml(){
  const today = todayStr(), in7 = addDaysIso(today, 7);
  const pend = S.applications.filter(a=>isLiveApp(a) && (!a.allotmentStatus || a.allotmentStatus==='Pending'));
  const amt = a => Number(a.amountApplied)||0;
  const blocked = pend.reduce((s,a)=>s+amt(a),0);
  const ipoDate = a => { const i = findIpo(a.ipoId); return i && i.allotmentDate ? i.allotmentDate : ''; };
  const overdue = pend.filter(a=>ipoDate(a) && ipoDate(a) < today);
  const soon = pend.filter(a=>ipoDate(a) >= today && ipoDate(a) <= in7);
  const collect = S.applications.reduce((s,a)=>s+recvDue(a),0);
  const byIpo = new Map();
  soon.concat(overdue).forEach(a=>{ const k = a.ipoId; if (!byIpo.has(k)) byIpo.set(k,{ ipo:findIpo(k), amt:0, n:0 }); const g = byIpo.get(k); g.amt += amt(a); g.n++; });
  const rows = Array.from(byIpo.values()).sort((x,y)=>(x.ipo.allotmentDate||'').localeCompare(y.ipo.allotmentDate||'')).map(g=>`<tr class="clickable" onclick="openIpoDetail(${g.ipo.id})"><td><b>${escapeHtml(g.ipo.ipoName)}</b></td><td>${fmtDate(g.ipo.allotmentDate)}${g.ipo.allotmentDate<today?' <span class="badge red">result due</span>':''}</td><td>${g.n}</td><td style="text-align:right;">${fmtMoney(g.amt)}</td></tr>`).join('');
  const sum = l => l.reduce((s,a)=>s+amt(a),0);
  return mobileCollapse('capital','Capital view',fmtMoney(blocked)+' blocked',`<div class="section-card"><div class="sc-head"><h3>Capital view</h3></div><div class="sc-body">
    <div class="kpi-grid" style="margin-bottom:10px;">
      <div class="kpi-card" ${drillAttr('Money blocked in applications', pend)}><div class="lbl">Blocked today</div><div class="val">${fmtMoney(blocked)}</div><div class="small-muted">${pend.length} application${pend.length===1?'':'s'} awaiting result</div></div>
      <div class="kpi-card" ${drillAttr('Result due in the next 7 days', soon)}><div class="lbl">Result due in 7 days</div><div class="val">${fmtMoney(sum(soon))}</div><div class="small-muted">frees up if not allotted</div></div>
      <div class="kpi-card" ${drillAttr('Result date passed — enter result', overdue)}><div class="lbl">Result overdue</div><div class="val ${overdue.length?'danger':''}">${fmtMoney(sum(overdue))}</div><div class="small-muted">${overdue.length?'enter these results':'nothing overdue'}</div></div>
      <div class="kpi-card"><div class="lbl">Still to collect</div><div class="val ${collect>0.5?'danger':''}">${fmtMoney(collect)}</div><div class="small-muted">from clients</div></div>
    </div>
    ${rows?`<div class="table-wrap"><table class="dt" data-enh="1"><thead><tr><th>IPO</th><th>Result date</th><th>Apps</th><th style="text-align:right;">Money</th></tr></thead><tbody>${rows}</tbody></table></div>`:''}
  </div></div>`);
}

/* ---- Dashboard: weekly review ---- */
function weeklyReviewHtml(){
  const today = todayStr(), in7 = addDaysIso(today, 7), ago7 = addDaysIso(today, -7);
  const isPend = a => isLiveApp(a) && (!a.allotmentStatus || a.allotmentStatus==='Pending');
  const dueIpos = S.ipos.filter(i=>i.allotmentDate && i.allotmentDate<=today).map(i=>({ i, n:S.applications.filter(a=>a.ipoId===i.id && isPend(a)).length })).filter(x=>x.n);
  const upcomingRes = S.ipos.filter(i=>i.allotmentDate>today && i.allotmentDate<=in7).map(i=>({ i, n:S.applications.filter(a=>a.ipoId===i.id && isPend(a)).length })).filter(x=>x.n);
  const toSell = S.applications.filter(a=>a.allotmentStatus==='Allotted' && a.saleStatus!=='Sold').length;
  const byClient = new Map();
  S.applications.forEach(a=>{ const d = recvDue(a); if (d<=0.5 || !a.saleDate || a.saleDate>ago7) return; const g = byClient.get(a.clientId) || { id:a.clientId, amt:0, oldest:a.saleDate }; g.amt += d; if (a.saleDate<g.oldest) g.oldest=a.saleDate; byClient.set(a.clientId,g); });
  const overdue = Array.from(byClient.values()).sort((x,y)=>x.oldest.localeCompare(y.oldest)).slice(0,6);
  const overdueTotal = Array.from(byClient.values()).reduce((s,g)=>s+g.amt,0);
  const nextIpos = S.ipos.filter(i=>i.closeDate>=today && i.openDate<=in7 && (i.archiveStatus||'Active')!=='Inactive').map(i=>{
    const plans = S.ipoPlans.filter(p=>p.ipoId===i.id && p.planStatus!=='Cancelled');
    const left = plans.reduce((s,p)=>s+planPendingClients(p).filter(x=>!x.done).length,0);
    return { i, left, plans:plans.length };
  }).sort((a,b)=>a.i.openDate.localeCompare(b.i.openDate));
  const weekProfit = profitBetween(ago7, today);
  const li = (ico, text, go) => `<div class="todo med" ${go?`onclick="${go}"`:''}><span class="ico">${ico}</span><span class="tx">${text}</span>${go?'<span class="go">›</span>':''}</div>`;
  const pendHtml = [
    ...dueIpos.map(x=>li('🏆', `Enter result: <b>${escapeHtml(x.i.ipoName)}</b> (${x.n} pending)`, `resultsState={ipoId:${x.i.id},pending:{}};navigate('results')`)),
    ...upcomingRes.map(x=>li('🗓️', `Result on ${fmtDate(x.i.allotmentDate)}: ${escapeHtml(x.i.ipoName)} (${x.n} apps)`, `openIpoDetail(${x.i.id})`)),
    toSell ? li('💰', `${toSell} allotted share${toSell===1?'':'s'} waiting to be sold`, `navigate('allotments',{presetFilter:{tableId:'allotTbl',filterVals:{allotmentStatus:'Allotted',saleStatus:'Pending to Sell'}}})`) : ''
  ].join('') || '<p class="small-muted">Nothing pending.</p>';
  const overHtml = overdue.map(g=>{ const c = findClient(g.id); const days = dayDiff(g.oldest, today);
    return li('💵', `<b>${escapeHtml(c?c.clientName:'—')}</b> — ${fmtMoney(g.amt)} <span class="small-muted">(${days} days)</span>`, `navigate('clients',{id:${g.id}})`); }).join('') || '<p class="small-muted">No payment is more than 7 days late.</p>';
  const nextHtml = nextIpos.map(x=>li(x.i.openDate<=today?'🟢':'📋', `<b>${escapeHtml(x.i.ipoName)}</b> — ${x.i.openDate<=today?'open, closes '+fmtDate(x.i.closeDate):'opens '+fmtDate(x.i.openDate)}${x.plans?` · ${x.left} client${x.left===1?'':'s'} still to apply`:' · no plan yet'}`, `openIpoDetail(${x.i.id})`)).join('') || '<p class="small-muted">No IPO opening in the next 7 days.</p>';
  const h = t => `<h4 style="margin:12px 0 6px;font-size:13px;">${t}</h4>`;
  return `<details class="collapse" ${dashOpen('weekly',!isMobileView())} ontoggle="dashToggle('weekly',this.open)"><summary>Weekly review <span class="small-muted" style="font-weight:500;">last 7 days profit ${fmtMoney(weekProfit)}</span></summary>
    ${h('1. What is pending')}<div class="todo-list">${pendHtml}</div>
    ${h(`2. Overdue to collect${overdueTotal>0.5?' — '+fmtMoney(overdueTotal):''}`)}<div class="todo-list">${overHtml}</div>
    ${h('3. What to apply next')}<div class="todo-list">${nextHtml}</div></details>`;
}

/* ---- WhatsApp sharing ---- */
function shareWhatsApp(text){ window.open('https://wa.me/?text='+encodeURIComponent(text), '_blank', 'noopener'); }
function stmtWhatsApp(){
  const D = stmtData(); if (!D.count){ toast('No sales in this period','warn'); return; }
  const lines = [`*${bizName()} — Statement*`, `*${D.title}*`, stmtPeriodText(D.range), '',
    ...D.groups.map(g=>`• ${g.ipo}: ${g.rows.length} sale${g.rows.length===1?'':'s'}, profit ₹${stmtNum(g.tot.profit)}`), '',
    `Total sales: ₹${stmtNum(D.total.sales)}`, `Total cost: ₹${stmtNum(D.total.cost)}`, `*Total profit: ₹${stmtNum(D.total.profit)}*`];
  shareWhatsApp(lines.join('\n'));
}
function clientDueWhatsApp(clientId){
  const c = findClient(clientId); if (!c) return;
  const dues = clientDues(clientId,'in'), total = clientDueTotal(clientId,'in');
  if (!dues.length){ toast('Nothing is due from this client','ok'); return; }
  const lines = [`Hello ${c.clientName},`, `Payment pending from ${bizName()}:`, '',
    ...dues.slice(0,15).map(a=>{ const i = findIpo(a.ipoId); return `• ${i?i.ipoName:'IPO'} (sold ${fmtDate(a.saleDate)}): ₹${stmtNum(recvDue(a))}`; }),
    dues.length>15 ? `…and ${dues.length-15} more` : '', '', `*Total due: ₹${stmtNum(total)}*`, 'Please pay at the earliest. Thank you.'];
  shareWhatsApp(lines.filter((x,i,arr)=>!(x==='' && arr[i-1]==='')).join('\n'));
}

/* ---- Lock again on return if the app was hidden longer than the auto-lock time (important on mobile) ---- */
(function(){
  let hiddenAt = 0;
  document.addEventListener('visibilitychange', ()=>{
    if (document.hidden){ hiddenAt = Date.now(); return; }
    const mins = Number(S.settings.autoLockMinutes)||0;
    if (hiddenAt && mins && S.settings.appLockEnabled && S.settings.appLockPin && Date.now()-hiddenAt >= mins*60000 && typeof triggerAppLock==='function') triggerAppLock();
    hiddenAt = 0;
  });
})();
</script>

<script>
/* =================== OPERATIONS & PLANNING IMPROVEMENTS =================== */

/* ---- counts shown on the Operations tabs ---- */
function opsCounts(){
  const today = todayStr();
  const todo = S.ipoPlans.filter(p=>(p.plannedDate===today || mandateCounts(p).failed>0) && p.planStatus!=='Cancelled').reduce((s,p)=>{ const c=mandateCounts(p); return s+(p.plannedDate===today?c.todo:0)+c.failed; },0);
  const pendApps = S.applications.filter(a=>isLiveApp(a) && (!a.allotmentStatus || a.allotmentStatus==='Pending'));
  const dueResults = pendApps.filter(a=>{ const i=findIpo(a.ipoId); return i && i.allotmentDate && i.allotmentDate<=today; }).length;
  const toSell = S.applications.filter(a=>a.allotmentStatus==='Allotted' && a.saleStatus!=='Sold').length;
  return { checklist: todo, allotments: dueResults + toSell };
}
function opsBarHtml(){
  const cur = S.view==='results' ? 'allotments' : S.view, c = opsCounts();
  return `<div class="tabs ops-tabs no-print">${OPS_TABS.map(([v,l])=>{ const n = c[v]||0;
    return `<button class="${v===cur?'active':''}" onclick="navigate('${v}')">${l}${n?` <span class="badge ${v==='checklist'?'gold':'red'}" style="margin-left:4px;">${n}</span>`:''}</button>`; }).join('')}</div>`;
}

/* ---- Today: when nothing is planned, jump to the next day that has a plan ---- */
function nextPlanHintHtml(d){
  const upcoming = S.ipoPlans.filter(p=>p.plannedDate>d && p.planStatus!=='Cancelled').map(p=>p.plannedDate).sort();
  const prevPending = S.ipoPlans.filter(p=>p.plannedDate<d && p.planStatus!=='Cancelled' && planPendingClients(p).some(x=>!x.done)).map(p=>p.plannedDate).sort().reverse();
  let html = '';
  if (prevPending.length) html += `<div class="section-card"><div class="sc-body" style="display:flex;gap:10px;align-items:center;flex-wrap:wrap;"><span>⚠️ <b>${prevPending.length>1?'Earlier plans':'An earlier plan'}</b> still ha${prevPending.length>1?'ve':'s'} clients not marked as applied (latest: ${fmtDate(prevPending[0])}).</span><div class="spacer"></div><button class="btn btn-ghost btn-sm" onclick="checklistDate='${prevPending[0]}';navigate('checklist')">Open ${fmtDate(prevPending[0])}</button></div></div>`;
  if (upcoming.length){ const nd = upcoming[0]; const n = S.ipoPlans.filter(p=>p.plannedDate===nd && p.planStatus!=='Cancelled').reduce((s,p)=>s+planClientCount(p),0);
    html += `<div class="section-card"><div class="sc-body" style="display:flex;gap:10px;align-items:center;flex-wrap:wrap;"><span>📅 Next planned day: <b>${fmtDate(nd)}</b> (${n} client${n===1?'':'s'})</span><div class="spacer"></div><button class="btn btn-primary btn-sm" onclick="checklistDate='${nd}';navigate('checklist')">Open that day</button></div></div>`; }
  return html;
}

/* ---- Planning: "IPOs to plan" with coverage of your active clients ---- */
function ipoCoverage(ipo){
  const plans = S.ipoPlans.filter(p=>p.ipoId===ipo.id && p.planStatus!=='Cancelled');
  const planIds = new Set(plans.map(p=>p.id));
  const covered = new Set(S.plannedClients.filter(pc=>planIds.has(pc.planId)).map(pc=>pc.clientId));
  S.applications.forEach(a=>{ if (a.ipoId===ipo.id && isLiveApp(a)) covered.add(a.clientId); });
  const active = S.clients.filter(c=>c.status==='Active');
  const missing = active.filter(c=>!covered.has(c.id));
  return { plans, covered:active.length-missing.length, active:active.length, missing };
}
function planningUpcomingTab(){
  const list = S.ipos.filter(i=>ipoStatus(i)!=='Closed' && (i.archiveStatus||'Active')!=='Inactive').sort((a,b)=>(a.openDate||'').localeCompare(b.openDate||''));
  const cards = list.map(i=>{
    const cv = ipoCoverage(i), full = cv.plans.length && !cv.missing.length;
    const banks = [...new Set(cv.plans.map(p=>{ const b=findBank(p.bankAccountId); return b?b.bankName:''; }))].filter(Boolean).join(', ');
    const pct = cv.active ? Math.round(cv.covered/cv.active*100) : 0;
    return `<div class="ck-plan" style="margin-bottom:10px;"><div class="ck-plan-head" style="flex-wrap:wrap;gap:8px;">
      <b><a class="lnk" href="javascript:void(0)" onclick="openIpoDetail(${i.id})">${escapeHtml(i.ipoName)}</a></b> ${badge(ipoStatus(i))}
      <span class="small-muted">${fmtDate(i.openDate)} – ${fmtDate(i.closeDate)}${banks?' · '+escapeHtml(banks):''}</span><div class="spacer"></div>
      ${cv.plans.length?`<button class="btn btn-ghost btn-sm" onclick="planClients(${cv.plans[0].id})">Add clients</button>`:''}
      <button class="btn btn-primary btn-sm" onclick="quickPlan(${i.id})">${cv.plans.length?'+ Another plan':'Plan this IPO'}</button></div>
      <div style="padding:6px 12px 10px;"><div class="small-muted">${full?'✓ Every active client is covered':`<b>${cv.missing.length}</b> of ${cv.active} active client${cv.active===1?'':'s'} not planned or applied yet`} · ${cv.plans.length} plan${cv.plans.length===1?'':'s'}</div>
      <div class="progress"><div style="width:${pct}%"></div></div>
      ${cv.missing.length && cv.missing.length<=12 ? `<div class="small-muted" style="margin-top:4px;">Missing: ${cv.missing.map(c=>escapeHtml(c.clientName)).join(', ')}</div>`:''}</div></div>`;
  }).join('') || '<p class="small-muted">No upcoming or open IPOs. Add one under IPOs.</p>';
  return `<div class="section-card"><div class="sc-head"><h3>IPOs to plan</h3></div><div class="sc-body">${cards}</div></div>`;
}

/* ---- Allotments & Sale: quick sale entry (each client can have a different price) ---- */
function quickSalePanelHtml(){
  const list = S.applications.filter(a=>a.allotmentStatus==='Allotted' && a.saleStatus!=='Sold' && isLiveApp(a))
    .sort((a,b)=>(a.ipoId-b.ipoId) || ((findClient(a.clientId)||{}).clientName||'').localeCompare((findClient(b.clientId)||{}).clientName||''));
  if (!list.length) return '';
  const rows = list.slice(0,60).map(a=>{ const c=findClient(a.clientId), i=findIpo(a.ipoId);
    return `<tr><td data-label="Client"><b>${escapeHtml(c?c.clientName:'—')}</b></td><td data-label="IPO">${escapeHtml(i?i.ipoName:'—')}</td>
      <td data-label="Applied" class="num">${fmtMoney(a.amountApplied)}</td>
      <td data-label="Sale amount"><input type="number" class="qsAmt" data-id="${a.id}" placeholder="Sale amount" oninput="qsPreview(${a.id})" style="width:130px;"></td>
      <td data-label="Our profit" id="qsOur-${a.id}" class="small-muted">—</td></tr>`; }).join('');
  return `<details class="collapse no-print" style="margin-bottom:14px;" ${list.length<=15?'open':''}><summary>Quick sale entry <span class="small-muted" style="font-weight:500;">${list.length} allotted, not sold</span></summary>
    <div style="display:flex;flex-wrap:wrap;gap:10px;align-items:flex-end;margin:10px 0;">
      <div class="f-group"><label>Sale date</label><input type="date" id="qsDate" value="${todayStr()}"></div>
      <div class="f-group"><label>Money from client</label><select id="qsRecv"><option value="Receivable">Receivable (still to collect)</option><option value="Received">Received</option></select></div>
      <button class="btn btn-primary" onclick="qsSave()">Save sales with an amount</button></div>
    <div class="table-wrap flat"><table class="dt cards" data-enh="1"><thead><tr><th>Client</th><th>IPO</th><th>Applied</th><th>Sale amount (₹)</th><th>Our profit</th></tr></thead><tbody>${rows}</tbody></table></div>
    ${list.length>60?`<p class="hint">Showing the first 60 — save these, then the rest appear.</p>`:''}
    <p class="hint">Type each client's own sale amount for the full lot. Rows left empty are skipped. Profit uses each application's own share %.</p></details>`;
}
function qsPreview(id){
  const a = findApp(id), el = document.getElementById('qsAmt-'+id) || document.querySelector(`.qsAmt[data-id="${id}"]`), out = document.getElementById('qsOur-'+id); if (!a||!el||!out) return;
  const v = el.value; if (v==='' ){ out.textContent='—'; return; }
  const c = calcAllotmentSale({ ...a, saleStatus:'Sold', saleAmount:Number(v), grossReceivedOverridden:false, ourProfitOverridden:false, clientProfitOverridden:false });
  out.innerHTML = c.applicable ? `<b>${fmtMoney(c.ourFinal)}</b>` : '—';
}
async function qsSave(){
  const date = document.getElementById('qsDate').value, recv = document.getElementById('qsRecv').value;
  if (!date){ toast('Pick the sale date','warn'); return; }
  const rows = Array.from(document.querySelectorAll('.qsAmt')).filter(e=>e.value!=='').map(e=>({ id:Number(e.dataset.id), amt:Number(e.value) }));
  if (!rows.length){ toast('Type a sale amount for at least one row','warn'); return; }
  if (rows.some(r=>isNaN(r.amt))){ toast('One of the amounts is not a number','warn'); return; }
  beginUndo(); let n=0;
  try {
    for (const r of rows){
      const a = findApp(r.id); if (!a) continue;
      const probe = { ...a, saleStatus:'Sold', saleDate:date, saleAmount:r.amt, amountReceiveStatus:recv, grossReceivedOverridden:false, ourProfitOverridden:false, clientProfitOverridden:false };
      const calc = calcAllotmentSale(probe);
      const u = { ...a, saleStatus:'Sold', saleDate:date, saleAmount:r.amt, amountReceiveStatus:recv,
        receivedDate: recv==='Received' ? todayStr() : null, receivedViaLedger:false,
        calculatedGrossReceived: calc.calculatedGross, calculatedOurProfit: calc.calculatedOur, calculatedClientProfit: calc.calculatedClient,
        updatedAt:new Date().toISOString() };
      await putRec('applications', u); const prev = {...a}; Object.assign(a,u);
      await audit('Allotment Updates','Application', a.id, prev, u); n++;
    }
  } finally { await endUndo('Saved sale for'); }
  toast(`${n} sale${n===1?'':'s'} saved`,'ok'); navigate('allotments');
}
</script>

<script>
/* =================== BATCH 3: DASHBOARD HELPERS =================== */
function isMobileView(){ try { return window.matchMedia('(max-width:640px)').matches; } catch(e){ return false; } }
/* On phones a long dashboard section folds into a one-line summary; on larger screens it is shown open as before */
function mobileCollapse(key, title, summaryExtra, html){
  if (!isMobileView()) return html;
  return `<details class="collapse mcol" ${dashOpen(key,false)} ontoggle="dashToggle('${key}',this.open)"><summary>${title} <span class="small-muted" style="font-weight:500;">${summaryExtra||''}</span></summary><div class="mcol-body">${html}</div></details>`;
}
/* D1: of the profit from these sales, how much is already collected from clients and how much is still with them */
function ourCollectedSplit(apps){
  let collected = 0, pending = 0;
  apps.forEach(a=>{
    const c = calcAllotmentSale(a); if (!c.applicable) return;
    let frac = 1;
    if (a.amountReceiveStatus==='Receivable' && c.grossFinal>0) frac = Math.max(0, Math.min(1, 1 - recvDue(a)/c.grossFinal));
    collected += c.ourFinal*frac; pending += c.ourFinal*(1-frac);
  });
  return { collected, pending };
}
function collectLineHtml(apps){
  const r = ourCollectedSplit(apps); if (Math.abs(r.pending) < 0.5) return '';
  return `<div class="small-muted">Collected <b>${fmtMoney(r.collected)}</b> · <span class="danger">with clients ${fmtMoney(r.pending)}</span></div>`;
}
/* D2: where this month is heading if the pace so far continues */
function projectionHtml(profitSoFar){
  const now = new Date(), day = now.getDate(), days = new Date(now.getFullYear(), now.getMonth()+1, 0).getDate();
  if (day < 5 || day >= days || profitSoFar <= 0) return '';
  return `<div class="small-muted" title="Profit so far ÷ days passed × days in the month. Sales are lumpy, so treat it as a rough guide.">On pace for ≈ <b>${fmtMoney(Math.round(profitSoFar/day*days))}</b> by month end</div>`;
}
</script>

<script>
/* =================== BATCH 4: OPERATIONS & PLANNING =================== */

/* ---- T2: undo for "Mark ticked as Applied" ---- */
(function(){
  const f = window.ckSubmit; if (typeof f !== 'function') return;
  window.ckSubmit = async function(){ beginUndo(); try { return await f.apply(this, arguments); } finally { await endUndo('Created'); } };
})();

/* ---- P2: client picker with search, active-only, and "select all not yet covered" ---- */
function pcEligible(p, c){
  if (c.status!=='Active') return false;
  if (S.plannedClients.some(pc=>pc.planId===p.id && pc.clientId===c.id)) return false;
  if (clientAlreadyPlannedForIpo(c.id, p.ipoId, p.id)) return false;
  if (S.applications.some(a=>a.ipoId===p.ipoId && a.clientId===c.id && isLiveApp(a))) return false;
  return true;
}
function planClients(planId){
  const p = findPlan(planId); if (!p) return; const ipo = findIpo(p.ipoId), bank = findBank(p.bankAccountId);
  const mapped = new Set(S.plannedClients.filter(pc=>pc.planId===planId).map(pc=>pc.clientId));
  const list = S.clients.filter(c=>c.status==='Active' || mapped.has(c.id)).sort((a,b)=>a.clientName.localeCompare(b.clientName));
  const elig = list.filter(c=>pcEligible(p,c)).length;
  const rows = list.map(c=>{
    const inPlan = mapped.has(c.id), app = S.applications.find(a=>a.planId===planId && a.clientId===c.id);
    const other = !inPlan && clientAlreadyPlannedForIpo(c.id, p.ipoId, planId);
    const hasApp = !inPlan && !other && S.applications.some(a=>a.ipoId===p.ipoId && a.clientId===c.id && isLiveApp(a));
    const status = app ? badge(app.applicationStatus) : inPlan ? badge('To Be Applied') : other ? '<span class="badge gray">In another plan</span>' : hasApp ? '<span class="badge gray">Already applied</span>' : '<span class="small-muted">Not planned</span>';
    const ctl = other ? '<span class="small-muted">Blocked</span>' : `<label class="checkbox-row"><input type="checkbox" class="pcChk" data-cid="${c.id}" data-elig="${pcEligible(p,c)?1:0}" ${inPlan?'checked':''} onchange="togglePlanClient(${planId},${c.id},this.checked).then(pcCount)"> ${inPlan?'Planned':'Add'}</label>`;
    return `<tr data-n="${escapeHtml((c.clientName+' '+c.clientId).toLowerCase())}"><td data-label="Client"><b>${escapeHtml(c.clientName)}</b>${c.status!=='Active'?' <span class="badge gray">Inactive</span>':''}</td><td data-label="Status">${status}</td><td data-label="">${ctl}</td></tr>`;
  }).join('');
  openModal(`Plan Clients — ${escapeHtml(ipo?ipo.ipoName:'IPO')}`,
    `<p class="small-muted" style="margin-bottom:8px;">${fmtDate(p.plannedDate)} · ${escapeHtml(bank?bank.bankName:'')} · <b id="pcCount">${mapped.size}</b> planned. Only active clients are listed.</p>
     <div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px;">
       <input type="search" id="pcSearch" placeholder="Search client…" oninput="pcFilter(this.value)" style="flex:1;min-width:150px;">
       <button class="btn btn-gold btn-sm" ${elig?'':'disabled'} onclick="pcSelectAll(${planId})">Add all ${elig} not yet covered</button></div>
     <div class="table-wrap"><table class="dt cards" data-enh="1"><thead><tr><th>Client</th><th>Status</th><th></th></tr></thead><tbody id="pcRows">${rows||'<tr class="empty-row"><td colspan="3">No active clients.</td></tr>'}</tbody></table></div>`,
    `<button class="btn btn-primary" onclick="closeModal();navigate('planning')">Done</button>`, true);
}
function pcFilter(q){ q=(q||'').trim().toLowerCase(); document.querySelectorAll('#pcRows tr[data-n]').forEach(tr=>{ tr.style.display = !q || tr.dataset.n.includes(q) ? '' : 'none'; }); }
function pcCount(){ const el=document.getElementById('pcCount'); if (el) el.textContent = document.querySelectorAll('#pcRows .pcChk:checked').length; }
async function pcSelectAll(planId){
  const boxes = Array.from(document.querySelectorAll('#pcRows .pcChk')).filter(b=>!b.checked && b.dataset.elig==='1' && b.closest('tr').style.display!=='none');
  if (!boxes.length) return; let n = 0;
  for (const b of boxes){ b.checked = true; await togglePlanClient(planId, Number(b.dataset.cid), true); n++; }
  pcCount(); toast(`${n} client${n===1?'':'s'} added to the plan`,'ok');
}

/* ---- P3: plans — nearest first, with quick filters ---- */
let planChip = 'all';
const PLAN_CHIPS = [['today','Today'],['week','Next 7 days'],['upcoming','Upcoming'],['past','Past'],['all','All']];
function plansForChip(){
  const t = todayStr(), w = addDaysIso(t,7);
  let l = S.ipoPlans.slice();
  if (planChip==='today') l = l.filter(p=>p.plannedDate===t);
  else if (planChip==='week') l = l.filter(p=>p.plannedDate>=t && p.plannedDate<=w);
  else if (planChip==='upcoming') l = l.filter(p=>p.plannedDate>=t);
  else if (planChip==='past') l = l.filter(p=>p.plannedDate<t);
  const up = l.filter(p=>p.plannedDate>=t).sort((a,b)=>a.plannedDate.localeCompare(b.plannedDate)), past = l.filter(p=>p.plannedDate<t).sort((a,b)=>b.plannedDate.localeCompare(a.plannedDate));
  return up.concat(past);
}
function planChipsHtml(){ return PLAN_CHIPS.map(([k,l])=>`<button class="pill ${planChip===k?'on':''}" onclick="setPlanChip('${k}')">${l}</button>`).join(''); }
function setPlanChip(k){ planChip = k; const el = document.getElementById('planChips'); if (el) el.innerHTML = planChipsHtml(); if (window.__tableState && window.__tableState.plansTbl) window.__tableState.plansTbl.page = 1; if (window.__tableRerender.plansTbl) window.__tableRerender.plansTbl(); }

/* ---- A2: applications — date chips ---- */
let appChip = 'all', appFrom = '', appTo = '';
function appsForChip(){
  const t = todayStr(); let from = '', to = '';
  if (appChip==='today') from = to = t;
  else if (appChip==='week') { from = addDaysIso(t,-6); to = t; }
  else if (appChip==='month') { from = t.slice(0,8)+'01'; to = t; }
  else if (appChip==='custom') { from = appFrom; to = appTo; }
  return S.applications.filter(a=>(!from || (a.applicationDate||'')>=from) && (!to || (a.applicationDate||'')<=to));
}
function appChipsHtml(){
  const chips = [['today','Applied today'],['week','Last 7 days'],['month','This month'],['all','All dates'],['custom','Custom']].map(([k,l])=>`<button class="pill ${appChip===k?'on':''}" onclick="setAppChip('${k}')">${l}</button>`).join('');
  const cust = appChip==='custom' ? `<input type="date" value="${appFrom}" onchange="appFrom=this.value;setAppChip('custom')"><span class="small-muted">to</span><input type="date" value="${appTo}" onchange="appTo=this.value;setAppChip('custom')">` : '';
  return `<div class="pills no-print" id="appChips" style="padding:8px 14px 0;margin:0;align-items:center;">${chips}${cust}</div>`;
}
function setAppChip(k){ appChip = k; const el = document.getElementById('appChips'); if (el) el.outerHTML = appChipsHtml(); if (window.__tableState && window.__tableState.appsTbl) window.__tableState.appsTbl.page = 1; if (window.__tableRerender.appsTbl) window.__tableRerender.appsTbl(); }

/* ---- L1: money to collect, with Record Payment right on the Allotments screen ---- */
function collectPanelHtml(){
  const g = new Map();
  S.applications.forEach(a=>{ const d = recvDue(a); if (d<=0.5) return; const x = g.get(a.clientId) || { id:a.clientId, amt:0, n:0, oldest:a.saleDate||'' }; x.amt += d; x.n++; if (a.saleDate && (!x.oldest || a.saleDate<x.oldest)) x.oldest = a.saleDate; g.set(a.clientId,x); });
  const list = Array.from(g.values()).sort((a,b)=>(a.oldest||'9').localeCompare(b.oldest||'9'));
  if (!list.length) return '';
  const total = list.reduce((s,x)=>s+x.amt,0), today = todayStr();
  const rows = list.map(x=>{ const c = findClient(x.id); const days = x.oldest ? dayDiff(x.oldest, today) : null;
    return `<tr><td data-label="Client"><a class="lnk" href="javascript:void(0)" onclick="openClientDetail(${x.id})"><b>${escapeHtml(c?c.clientName:'—')}</b></a></td>
      <td data-label="Sales">${x.n}</td><td data-label="Oldest sale">${x.oldest?fmtDate(x.oldest):'—'}${days!=null?` <span class="small-muted">(${days}d)</span>`:''}</td>
      <td data-label="Due" class="num"><b>${fmtMoney(x.amt)}</b></td>
      <td data-label=""><button class="btn btn-primary btn-sm" onclick="collectPay(${x.id})">Record payment</button> <button class="btn btn-ghost btn-sm" onclick="clientDueWhatsApp(${x.id})">WhatsApp</button></td></tr>`; }).join('');
  return `<details class="collapse no-print" style="margin-bottom:14px;" ${dashOpen('collect',false)} ontoggle="dashToggle('collect',this.open)"><summary>Money to collect <span class="small-muted" style="font-weight:500;">${fmtMoney(total)} from ${list.length} client${list.length===1?'':'s'}</span></summary>
    <div class="table-wrap flat" style="margin-top:8px;"><table class="dt cards" data-enh="1"><thead><tr><th>Client</th><th>Sales</th><th>Oldest sale</th><th class="num">Due</th><th></th></tr></thead><tbody>${rows}</tbody></table></div></details>`;
}
function collectPay(clientId){ window.__payReturn = 'allotments'; recordPayment(clientId,'in'); }

/* ---- L2: quick filter chips on Allotments & Sale ---- */
function allotChipState(){
  const fv = (window.__tableState && window.__tableState.allotTbl && window.__tableState.allotTbl.filterVals) || {};
  if (fv.allotmentStatus==='Pending' && !fv.saleStatus && !fv.amountReceiveStatus) return 'result';
  if (fv.allotmentStatus==='Allotted' && fv.saleStatus==='Pending to Sell') return 'sell';
  if (fv.amountReceiveStatus==='Receivable' && !fv.allotmentStatus) return 'collect';
  if (!fv.allotmentStatus && !fv.saleStatus && !fv.amountReceiveStatus) return 'all';
  return '';
}
function allotChip(k){
  if (!window.__tableState) window.__tableState = {};
  const st = window.__tableState.allotTbl || (window.__tableState.allotTbl = { search:'', sortKey:null, sortDir:1, page:1, filterVals:{} });
  const clear = { allotmentStatus:'', saleStatus:'', amountReceiveStatus:'' };
  st.filterVals = { ...st.filterVals, ...clear, ...(k==='result'?{allotmentStatus:'Pending'}:k==='sell'?{allotmentStatus:'Allotted',saleStatus:'Pending to Sell'}:k==='collect'?{amountReceiveStatus:'Receivable'}:{}) };
  st.page = 1; navigate('allotments');
}
function allotChipsHtml(){
  const cur = allotChipState();
  return `<div class="pills no-print" style="margin-bottom:10px;">${[['all','All'],['result','Needs result'],['sell','To sell'],['collect','To collect']].map(([k,l])=>`<button class="pill ${cur===k?'on':''}" onclick="allotChip('${k}')">${l}</button>`).join('')}</div>`;
}

/* ---- R1: open Results on the IPO that most needs it; warn before the allotment date ---- */
function resultsIpoChoices(){
  const t = todayStr();
  const withLive = S.ipos.filter(i=>S.applications.some(a=>a.ipoId===i.id && isLiveApp(a)));
  const pend = i => S.applications.filter(x=>x.ipoId===i.id && isLiveApp(x) && (!x.allotmentStatus || x.allotmentStatus==='Pending')).length;
  const rank = i => { const n = pend(i); if (!n) return 3; return (i.allotmentDate && i.allotmentDate<=t) ? 0 : 1; };
  return withLive.sort((a,b)=> rank(a)-rank(b) || (rank(a)<=1 ? (a.allotmentDate||'9').localeCompare(b.allotmentDate||'9') : compareDatesDesc(a.allotmentDate,b.allotmentDate)));
}
(function(){
  const rs = window.resSave; if (typeof rs !== 'function') return;
  window.resSave = async function(){
    const ipo = findIpo(resultsState.ipoId);
    if (ipo && ipo.allotmentDate && ipo.allotmentDate > todayStr() && !window.__resForce){
      confirmAction(`The allotment date for ${ipo.ipoName} is ${fmtDate(ipo.allotmentDate)}, which has not arrived yet. Save these results anyway?`, ()=>{ window.__resForce = true; Promise.resolve(rs()).finally(()=>{ window.__resForce = false; }); });
      return;
    }
    return rs();
  };
})();
</script>

<script>

/* ---- C3: bulk actions on clients ---- */
let __selectedClientIds = new Set();
function toggleClientSelection(id, checked){ if (checked) __selectedClientIds.add(id); else __selectedClientIds.delete(id); __refreshClientSelectionUI(); }

function ipoAllotRate(i){ const st = ipoStats(i.id); const n = st.allotted.length, no = st.apps.filter(a=>a.allotmentStatus==='Not Allotted').length; return (n+no) ? Math.round(n/(n+no)*1000)/10 : null; }
