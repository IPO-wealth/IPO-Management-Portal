<script>
/* =================== CLIENT LEDGER: payments, statements =================== */
/* One money flow per client, tracked in the "payments" store:
     'in'  = money received FROM the client (against the gross amount due on their sales).
   There is no payout ledger: the client's share is already settled inside the gross amount they pay.
   Every payment is applied to the client's oldest unpaid sales first and remembers which sales it covered
   ("allocations"), so partial payments, ageing and real days-to-pay all work. A sale flips to "Received"
   automatically once fully covered. */
const PAY_MODES = ['UPI','Bank Transfer','Cash','Cheque','Other'];
const r2 = n => Math.round((Number(n)||0)*100)/100;
var __payIdx = null;
function payIdx(){
  if (__payIdx) return __payIdx;
  const idx = { in:new Map() };
  S.payments.forEach(p=>{
    const m = idx[p.type]; if (!m) return;
    (p.allocations||[]).forEach(x=> m.set(x.appId, (m.get(x.appId)||0) + (Number(x.amount)||0)));
  });
  return (__payIdx = idx);
}
function payIdxReset(){ __payIdx = null; }
function allocatedTo(appId, type){ return payIdx()[type].get(appId) || 0; }

// money still to come from the client for one sale (0 unless it is a completed sale marked Receivable)
function recvDue(a){
  if (a.amountReceiveStatus !== 'Receivable') return 0;
  const c = calcAllotmentSale(a); if (!c.applicable) return 0;
  return Math.max(0, r2(c.grossFinal - allocatedTo(a.id,'in')));
}
function clientDues(clientId, type){
  return S.applications.filter(a=>a.clientId===clientId && recvDue(a) > 0.5)
    .sort((x,y)=>(x.saleDate||'').localeCompare(y.saleDate||'') || x.id - y.id);
}
function clientDueTotal(clientId, type){ return r2(clientDues(clientId,type).reduce((s,a)=>s+recvDue(a),0)); }

// split an amount over the client's oldest unpaid sales first
function allocateAmount(clientId, type, amount){
  let rem = r2(amount); const allocs = [];
  for (const a of clientDues(clientId, type)){
    if (rem <= 0.005) break;
    const due = recvDue(a);
    const take = Math.min(rem, due);
    if (take > 0.005){ allocs.push({ appId:a.id, amount:r2(take) }); rem = r2(rem - take); }
  }
  return { allocs, rem };
}
// after money has been applied, mark fully-covered sales as Received (and remember the date)
async function syncReceivedFlags(appIds, dateStr){
  for (const id of appIds){
    const a = findApp(id); if (!a || a.amountReceiveStatus !== 'Receivable') continue;
    const c = calcAllotmentSale(a); if (!c.applicable) continue;
    if (c.grossFinal - allocatedTo(a.id,'in') <= 0.5){
      const updated = { ...a, amountReceiveStatus:'Received', receivedDate:dateStr, receivedViaLedger:true, updatedAt:new Date().toISOString() };
      const prev = {...a}; await putRec('applications', updated); Object.assign(a, updated);
      await audit('Payment Applied','Application', id, prev, updated);
    }
  }
}

function recordPayment(clientId, type){
  const cl = findClient(clientId); if (!cl) return;
  const due = clientDueTotal(clientId, type), n = clientDues(clientId, type).length;
  openModal(`Payment Received — ${escapeHtml(cl.clientName)}`,
    `<p class="small-muted" style="margin-bottom:10px;">Outstanding from this client: <b>${fmtMoney(due)}</b> across ${n} sale(s).
       The amount is applied to the oldest unpaid sales first.</p>
     <div class="form-grid">
       ${fieldHtml({key:'payDate',label:'Date',type:'date',required:true}, todayStr())}
       ${fieldHtml({key:'payAmount',label:'Amount (₹)',type:'number',required:true}, due>0?due:'')}
       ${fieldHtml({key:'payMode',label:'Mode',type:'select',options:PAY_MODES}, 'UPI')}
       ${fieldHtml({key:'payNote',label:'Reference / note (optional)',span2:true,placeholder:'e.g. UPI ref no., "part payment"'}, '')}
     </div>`,
    `<button class="btn btn-ghost" onclick="closeModal()">Cancel</button><button class="btn btn-primary" onclick="savePayment(${clientId},'${type}')">Save</button>`);
}
async function savePayment(clientId, type){
  const f = readFields([{key:'payDate'},{key:'payAmount',type:'number'},{key:'payMode'},{key:'payNote'}]);
  if (!f.payDate){ toast('Date is required','warn'); return; }
  if (!f.payAmount || f.payAmount <= 0){ toast('Enter an amount greater than zero','warn'); return; }
  const { allocs, rem } = allocateAmount(clientId, type, f.payAmount);
  const rec = { clientId, type, date:f.payDate, amount:r2(f.payAmount), mode:f.payMode||'Other', note:(f.payNote||'').trim(), allocations:allocs, unallocated:rem,
                createdAt:new Date().toISOString(), updatedAt:new Date().toISOString() };
  const id = await putRec('payments', rec); rec.id = id; S.payments.push(rec); payIdxReset();
  await audit('Payment Received','Payment', id, null, rec);
  if (type === 'in') await syncReceivedFlags(allocs.map(x=>x.appId), f.payDate);
  closeModal();
  toast(rem > 0.5 ? `Saved — ${fmtMoney(rem)} is not matched to any sale yet (kept as credit)` : 'Payment saved', rem>0.5?'warn':'ok');
  if (window.__payReturn){ const v = window.__payReturn; window.__payReturn = null; navigate(v); } else navigate('clients', { id: clientId });
}
// use up leftover credit on sales that have become due since the payment was made
async function applyCredits(clientId){
  let applied = 0;
  for (const type of ['in']){
    const pays = S.payments.filter(p=>p.clientId===clientId && p.type===type && (p.unallocated||0) > 0.5).sort((a,b)=>a.date.localeCompare(b.date));
    for (const p of pays){
      const { allocs, rem } = allocateAmount(clientId, type, p.unallocated);
      if (!allocs.length) continue;
      const updated = { ...p, allocations:[...(p.allocations||[]), ...allocs], unallocated:rem, updatedAt:new Date().toISOString() };
      await putRec('payments', updated); Object.assign(p, updated); payIdxReset();
      applied += allocs.reduce((s,x)=>s+x.amount,0);
      if (type==='in') await syncReceivedFlags(allocs.map(x=>x.appId), p.date);
    }
  }
  toast(applied ? `Applied ${fmtMoney(applied)} of credit to unpaid sales` : 'No unpaid sales for the leftover credit to cover','ok');
  navigate('clients', { id: clientId });
}
function deletePayment(id){
  const p = S.payments.find(x=>x.id===id); if (!p) return;
  confirmAction(`Delete this payment received of ${fmtMoney(p.amount)} on ${fmtDate(p.date)}? The sales it covered become unpaid again.`, async () => {
    await delRec('payments', id);
    S.payments = S.payments.filter(x=>x.id!==id); payIdxReset();
    if (p.type === 'in'){
      for (const x of (p.allocations||[])){
        const a = findApp(x.appId); if (!a || !a.receivedViaLedger) continue;
        const c = calcAllotmentSale(a);
        if (c.applicable && c.grossFinal - allocatedTo(a.id,'in') > 0.5){
          const updated = { ...a, amountReceiveStatus:'Receivable', receivedDate:null, receivedViaLedger:false, updatedAt:new Date().toISOString() };
          await putRec('applications', updated); Object.assign(a, updated);
        }
      }
    }
    await audit('Payment Deleted','Payment', id, p, null);
    toast('Payment deleted','ok'); navigate('clients', { id: p.clientId });
  });
}
/* ---- account card on the client page ---- */
function clientAccountCardHtml(c){
  const receivable = clientDueTotal(c.id,'in');
  const pays = S.payments.filter(p=>p.clientId===c.id && p.type==='in').sort((a,b)=>b.date.localeCompare(a.date) || b.id-a.id);
  const received = pays.filter(p=>p.type==='in').reduce((s,p)=>s+p.amount,0);
  const credit = pays.reduce((s,p)=>s+(p.unallocated||0),0);
  const rows = pays.map(p=>`<tr><td>${fmtDate(p.date)}</td>
      <td><span class="badge green">Received</span></td>
      <td><b>${fmtMoney(p.amount)}</b></td><td>${escapeHtml(p.mode||'')}</td><td>${escapeHtml(p.note||'')}</td>
      <td class="small-muted">${(p.allocations||[]).length} sale(s)${p.unallocated>0.5?` · <span class="danger">${fmtMoney(p.unallocated)} unapplied</span>`:''}</td>
      <td class="no-print"><button class="btn btn-sm btn-danger" onclick="deletePayment(${p.id})">Delete</button></td></tr>`).join('') || `<tr class="empty-row"><td colspan="7">No payments recorded yet.</td></tr>`;
  return `
  <div class="section-card no-print">
    <div class="sc-head"><h3>Account &amp; Payments</h3><div class="spacer"></div>
      <button class="btn btn-primary btn-sm" onclick="window.__payReturn=null;recordPayment(${c.id},'in')">+ Payment Received</button>
      ${credit>0.5?`<button class="btn btn-ghost btn-sm" onclick="applyCredits(${c.id})">Apply ${fmtMoney(credit)} unapplied credit</button>`:''}
      ${receivable>0.5?`<button class="btn btn-ghost btn-sm" onclick="clientDueWhatsApp(${c.id})">WhatsApp reminder</button>`:''}
      <button class="btn btn-ghost btn-sm" onclick="openStatementFor(${c.id})">Statement PDF</button></div>
    <div class="sc-body">
      <div class="kpi-grid" style="margin-bottom:12px;">
        <div class="kpi-card"><div class="lbl">Still to Receive From Client</div><div class="val ${receivable>0?'danger':''}">${fmtMoney(receivable)}</div></div>
        <div class="kpi-card"><div class="lbl">Received (recorded payments)</div><div class="val ok">${fmtMoney(received)}</div></div>
      </div>
      <div class="table-wrap"><table class="dt"><thead><tr><th>Date</th><th>Type</th><th>Amount</th><th>Mode</th><th>Note</th><th>Applied to</th><th class="no-print"></th></tr></thead><tbody>${rows}</tbody></table></div>
    </div>
  </div>`;
}

function bizName(){ return (S.settings.businessName || '').trim() || 'IPO Management Portal'; }

/* ---- branding (settings) ---- */
function brandingCardHtml(){
  return `
  <div class="section-card">
    <div class="sc-head"><h3>Business Details (for statements)</h3></div>
    <div class="sc-body">
      <p class="small-muted">Shown as the portal name and on printouts.</p>
      <div class="form-grid">
        <div class="f-group"><label>Business name</label><input type="text" id="bizNameInput" value="${escapeHtml(S.settings.businessName||'')}" placeholder="IPO Management Portal"></div>
        <div class="f-group"><label>Tagline / contact line</label><input type="text" id="bizTaglineInput" value="${escapeHtml(S.settings.businessTagline||'')}" placeholder="e.g. +91 98xxxxxx · you@email.com"></div>
        <div class="f-group span2"><label>Statement footer note</label><input type="text" id="bizFooterInput" value="${escapeHtml(S.settings.statementFooter||'')}" placeholder="This is a computer-generated statement."></div>
        <div class="f-group"><label>Logo</label>
          ${S.settings.businessLogo?`<img src="${S.settings.businessLogo}" alt="" style="max-height:48px;display:block;margin-bottom:6px;"><button class="btn btn-ghost btn-sm" onclick="removeBusinessLogo()">Remove logo</button>`:''}
          <input type="file" accept="image/*" onchange="handleLogoUpload(this)"></div>
      </div>
      <button class="btn btn-primary btn-sm" style="margin-top:10px;" onclick="saveBranding()">Save</button>
    </div>
  </div>`;
}
async function saveBranding(){
  await saveSetting('businessName', document.getElementById('bizNameInput').value.trim());
  await saveSetting('businessTagline', document.getElementById('bizTaglineInput').value.trim());
  await saveSetting('statementFooter', document.getElementById('bizFooterInput').value.trim());
  payIdxReset(); toast('Business details saved','ok'); navigate('settings');
}
function handleLogoUpload(input){
  const file = input.files && input.files[0]; if (!file) return;
  const reader = new FileReader();
  reader.onload = e => {
    const img = new Image();
    img.onload = async () => {
      const scale = Math.min(1, 320/img.width, 160/img.height);
      const cv = document.createElement('canvas'); cv.width = Math.max(1, Math.round(img.width*scale)); cv.height = Math.max(1, Math.round(img.height*scale));
      cv.getContext('2d').drawImage(img, 0, 0, cv.width, cv.height);
      await saveSetting('businessLogo', cv.toDataURL('image/png'));
      toast('Logo saved','ok'); navigate('settings');
    };
    img.onerror = () => toast('Could not read that image','warn');
    img.src = e.target.result;
  };
  reader.readAsDataURL(file);
}
async function removeBusinessLogo(){ await saveSetting('businessLogo', ''); navigate('settings'); }

<script>
/* =================== BANK ACCOUNTS =================== */
function bankStats(bankId){
  const X = idx(); const hit = X.bs.get(bankId); if (hit) return hit;
  const plans = (X.pB.get(bankId)||[]).slice();
  const apps = (X.aB.get(bankId)||[]).slice();
  const profit = apps.reduce((s,a)=>s+calcProfit(a).final,0);
  const clientProfit = apps.reduce((s,a)=>{ const c=calcAllotmentSale(a); return s+(c.applicable?c.clientFinal:0); },0);
  const res = { plans, apps, profit, clientProfit }; X.bs.set(bankId,res); return res;
}
function viewBanks(){

}
function bankFields(b){
  return [
    { key:'bankName', label:'Bank Name', required:true, placeholder:'e.g. HDFC Bank' },
    { key:'accountHolderName', label:'Account Holder Name', required:true },
    { key:'status', label:'Status', type:'select', options:['Active','Inactive'] }
  ].map(f => fieldHtml(f, b ? b[f.key] : (f.key==='status'?'Active':''))).join('');
}
/* ---- UPI IDs per bank account (bankUpiIds store) ---- */
function bankUpis(bankAccountId){ return S.bankUpiIds.filter(u=>u.bankAccountId===bankAccountId); }
let __editingBankUpiDraft = []; // {id|null, upiId, _tempKey}
function editBank(id){
  const b = id ? findBank(id) : null;
  __editingBankUpiDraft = id ? bankUpis(id).map(u=>({ id:u.id, upiId:u.upiId, _tempKey: 'u'+u.id })) : [];
  openModal(b ? 'Edit Bank Account' : 'Add Bank Account',
    `<div class="form-grid">${bankFields(b)}</div>
     <div class="f-group span2" style="margin-top:14px;">
       <label>UPI IDs (optional — a bank account may have zero, one, or several)</label>
       <div id="bankUpiRows"></div>
       <button type="button" class="btn btn-ghost btn-sm" style="margin-top:6px;width:fit-content;" onclick="addBankUpiRow()">+ Add UPI ID</button>
     </div>`,
    `<button class="btn btn-ghost" onclick="closeModal()">Cancel</button><button class="btn btn-primary" onclick="saveBank(${id||'null'})">Save</button>`);
  renderBankUpiRows();
}
function renderBankUpiRows(){
  const wrap = document.getElementById('bankUpiRows');
  if (!wrap) return;
  wrap.innerHTML = __editingBankUpiDraft.length ? __editingBankUpiDraft.map((u,idx)=>`
    <div style="display:flex;gap:8px;margin-bottom:6px;">
      <input type="text" value="${escapeHtml(u.upiId)}" placeholder="e.g. paras@hdfc" oninput="__editingBankUpiDraft[${idx}].upiId=this.value" style="flex:1;border:1px solid var(--border);border-radius:6px;padding:8px 10px;">
      <button type="button" class="btn btn-sm btn-danger" onclick="removeBankUpiRow(${idx})">Delete</button>
    </div>`).join('') : `<div class="small-muted">No UPI IDs added.</div>`;
}
function addBankUpiRow(){ __editingBankUpiDraft.push({ id:null, upiId:'', _tempKey:'new'+Date.now() }); renderBankUpiRows(); }
function removeBankUpiRow(idx){ __editingBankUpiDraft.splice(idx,1); renderBankUpiRows(); }
async function saveBank(id){
  const data = readFields([{key:'bankName'},{key:'accountHolderName'},{key:'status'}]);
  if (!data.bankName || !data.accountHolderName){ toast('Bank name and account holder are required','warn'); return; }

  const cleanedUpis = __editingBankUpiDraft.map(u=>({ ...u, upiId: (u.upiId||'').trim() })).filter(u=>u.upiId);
  const seen = new Set();
  for (const u of cleanedUpis){
    const key = u.upiId.toLowerCase();
    if (seen.has(key)){ toast('Duplicate UPI ID entered — each UPI ID must be unique for this bank account','warn'); return; }
    seen.add(key);
  }

  let bankAccountId = id;
  if (id){
    const existing = findBank(id);
    const updated = { ...existing, ...data, updatedAt: new Date().toISOString() };
    await putRec('bankAccounts', updated); const __prev4 = {...existing}; Object.assign(existing, updated);
    await audit('Bank Account Edit','BankAccount', existing.bankId, __prev4, updated);
    toast('Bank account updated','ok');
  } else {
    const bankId = nextCode(S.bankAccounts, 'bankId', 'BANK');
    const rec = { bankId, ...data, status: data.status||'Active', createdAt: new Date().toISOString(), updatedAt: new Date().toISOString() };
    const newId = await putRec('bankAccounts', rec); rec.id = newId; S.bankAccounts.push(rec);
    bankAccountId = newId;
    await audit('Bank Account Creation','BankAccount', bankId, null, rec);
    toast('Bank account added','ok');
  }

  // sync UPI rows: delete removed, update existing, create new
  const existingUpis = bankUpis(bankAccountId);
  const keptIds = new Set(cleanedUpis.filter(u=>u.id).map(u=>u.id));
  for (const old of existingUpis){
    if (!keptIds.has(old.id)){
      await delRec('bankUpiIds', old.id);
      S.bankUpiIds = S.bankUpiIds.filter(x=>x.id!==old.id);
      await audit('UPI Deleted','BankUpiId', old.id, old, null);
    }
  }
  for (const u of cleanedUpis){
    if (u.id){
      const existingRec = S.bankUpiIds.find(x=>x.id===u.id);
      if (existingRec && existingRec.upiId !== u.upiId){
        const updated = { ...existingRec, upiId: u.upiId, updatedAt: new Date().toISOString() };
        await putRec('bankUpiIds', updated); const __prev5 = {...existingRec}; Object.assign(existingRec, updated);
        await audit('UPI Edited','BankUpiId', u.id, __prev5, updated);
      }
    } else {
      const rec = { bankAccountId, upiId: u.upiId, createdAt: new Date().toISOString(), updatedAt: new Date().toISOString() };
      const newId = await putRec('bankUpiIds', rec); rec.id = newId; S.bankUpiIds.push(rec);
      await audit('UPI Added','BankUpiId', newId, null, rec);
    }
  }
  closeModal(); navigate('banks');
}
function deleteBank(id){
  const b = findBank(id);
  const stats = bankStats(id);
  if (stats.plans.length || stats.apps.length){
    confirmDangerousDelete({
      warningHtml: `This bank account (${escapeHtml(b.bankId)} — ${escapeHtml(b.bankName)}) has ${stats.plans.length} planned entr(y/ies) and ${stats.apps.length} application(s) on record. Deleting it permanently removes all of this. This cannot be undone.`,
      onDelete: async () => {
        for (const a of stats.apps){ await delRec('applications', a.id); }
        S.applications = S.applications.filter(a=>a.bankAccountId!==id);
        const planIds = stats.plans.map(p=>p.id);
        for (const p of stats.plans){ await delRec('ipoPlans', p.id); }
        S.ipoPlans = S.ipoPlans.filter(p=>p.bankAccountId!==id);
        const orphanedPlannedClients = S.plannedClients.filter(pc=>planIds.includes(pc.planId));
        for (const pc of orphanedPlannedClients){ await delRec('plannedClients', pc.id); }
        S.plannedClients = S.plannedClients.filter(pc=>!planIds.includes(pc.planId));
        await delRec('bankAccounts', id);
        S.bankAccounts = S.bankAccounts.filter(x=>x.id!==id);
        for (const u of bankUpis(id)){ await delRec('bankUpiIds', u.id); }
        S.bankUpiIds = S.bankUpiIds.filter(x=>x.bankAccountId!==id);
        await audit('Bank Account Deletion','BankAccount', b.bankId, b, null);
        toast('Bank account and its records deleted','ok'); navigate('banks');
      }
    });
    return;
  }
  confirmAction(`Delete bank account ${escapeHtml(b.bankId)} - ${escapeHtml(b.bankName)}? This bank account has no history, so this is safe to remove permanently.`, async () => {
    await delRec('bankAccounts', id);
    S.bankAccounts = S.bankAccounts.filter(x=>x.id!==id);
    for (const u of bankUpis(id)){ await delRec('bankUpiIds', u.id); }
    S.bankUpiIds = S.bankUpiIds.filter(x=>x.bankAccountId!==id);
    await audit('Bank Account Deletion','BankAccount', b.bankId, b, null);
    toast('Bank account deleted','ok'); navigate('banks');
  });
}

/* =================== IPOs =================== */
function ipoStats(ipoId){
  const X = idx(); const hit = X.is.get(ipoId); if (hit) return hit;
  const apps = (X.aI.get(ipoId)||[]).slice();
  const plans = (X.pI.get(ipoId)||[]).slice();
  const allotted = apps.filter(a=>a.allotmentStatus==='Allotted');
  const profit = apps.reduce((s,a)=>s+calcProfit(a).final,0);
  const clientProfit = apps.reduce((s,a)=>{ const c=calcAllotmentSale(a); return s+(c.applicable?c.clientFinal:0); },0);
  const res = { apps, plans, allotted, profit, clientProfit }; X.is.set(ipoId,res); return res;
}

/* =================== DATA HEALTH CHECK =================== */
/* Scans every relationship in the data model for dangling references — e.g. an
   application pointing at a client, bank, or IPO that no longer exists. This is
   diagnostic-only: it reports issues so you can decide what to do, it never
   silently deletes or repairs anything on its own. */
function runDataHealthCheck(){
  const issues = [];
  const clientIds = new Set(S.clients.map(c=>c.id));
  const ipoIds = new Set(S.ipos.map(i=>i.id));
  const bankIds = new Set(S.bankAccounts.map(b=>b.id));
  const planIds = new Set(S.ipoPlans.map(p=>p.id));
  const upiIds = new Set(S.bankUpiIds.map(u=>u.id));

  S.applications.forEach(a=>{
    if (!clientIds.has(a.clientId)) issues.push({ entity:'Application', id:a.id, message:`References a Client that no longer exists (clientId: ${a.clientId})` });
    if (!ipoIds.has(a.ipoId)) issues.push({ entity:'Application', id:a.id, message:`References an IPO that no longer exists (ipoId: ${a.ipoId})` });
    if (!bankIds.has(a.bankAccountId)) issues.push({ entity:'Application', id:a.id, message:`References a Bank Account that no longer exists (bankAccountId: ${a.bankAccountId})` });
    if (a.upiId!=null && !upiIds.has(a.upiId)) issues.push({ entity:'Application', id:a.id, message:`References a UPI ID that no longer exists (upiId: ${a.upiId})` });
    if (a.planId!=null && !planIds.has(a.planId)) issues.push({ entity:'Application', id:a.id, message:`References a Plan that no longer exists (planId: ${a.planId})` });
  });
  S.ipoPlans.forEach(p=>{
    if (!ipoIds.has(p.ipoId)) issues.push({ entity:'IPO Plan', id:p.id, message:`References an IPO that no longer exists (ipoId: ${p.ipoId})` });
    if (!bankIds.has(p.bankAccountId)) issues.push({ entity:'IPO Plan', id:p.id, message:`References a Bank Account that no longer exists (bankAccountId: ${p.bankAccountId})` });
  });
  S.plannedClients.forEach(pc=>{
    if (!clientIds.has(pc.clientId)) issues.push({ entity:'Planned Client', id:pc.id, message:`References a Client that no longer exists (clientId: ${pc.clientId})` });
    if (!planIds.has(pc.planId)) issues.push({ entity:'Planned Client', id:pc.id, message:`References a Plan that no longer exists (planId: ${pc.planId})` });
  });
  S.bankUpiIds.forEach(u=>{
    if (!bankIds.has(u.bankAccountId)) issues.push({ entity:'Bank UPI ID', id:u.id, message:`References a Bank Account that no longer exists (bankAccountId: ${u.bankAccountId})` });
  });
  return issues;
}

/* Keeps every application's stored allotment date in step with its IPO's allotment date.
   The IPO is the single source of truth for this date, so whenever the IPO changes,
   all of its existing applications are brought up to date. Returns how many changed. */
async function syncIpoAllotmentDate(ipo){
  const newDate = ipo.allotmentDate || null;
  let count = 0;
  for (const a of S.applications){
    if (a.ipoId !== ipo.id) continue;
    if ((a.allotmentDate || null) === newDate) continue;
    const updated = { ...a, allotmentDate: newDate, updatedAt: new Date().toISOString() };
    await putRec('applications', updated); Object.assign(a, updated);
    count++;
  }
  if (count) await audit('Allotment Date Synced','IPO', ipo.ipoId, null, { applicationsUpdated: count, allotmentDate: newDate });
  return count;
}
async function saveIpo(id, force){
  const data = readFields([{key:'ipoName'},{key:'minimumApplicationAmount',type:'number'},{key:'openDate'},{key:'closeDate'},{key:'allotmentDate'},{key:'category'},{key:'issuePrice',type:'number'},{key:'lotSize',type:'number'},{key:'listingDate'},{key:'archiveStatus'}]);
  if (!data.ipoName || !data.openDate || !data.closeDate){ toast('IPO name and dates are required','warn'); return; }
  if (data.closeDate < data.openDate){ toast('Close date cannot be before open date','warn'); return; }
  if (!data.allotmentDate) data.allotmentDate = null;
  if (!data.category) data.category = null;
  if (!data.listingDate) data.listingDate = null;
  const dupe = S.ipos.find(i => i.id!==id && i.ipoName.trim().toLowerCase() === data.ipoName.trim().toLowerCase());
  if (dupe && !force){
    openModal('Possible Duplicate IPO',
      `<p style="font-size:13px;">An IPO named "${escapeHtml(dupe.ipoName)}" (${escapeHtml(dupe.ipoId)}, opened ${fmtDate(dupe.openDate)}) already exists.</p><p class="small-muted">If this is genuinely a different IPO (e.g. a re-listing), you can save it anyway.</p>`,
      `<button class="btn btn-ghost" onclick="closeModal()">Cancel</button><button class="btn btn-danger" onclick="saveIpo(${id||'null'}, true)">Save Anyway</button>`);
    return;
  }
  if (id){
    const existing = findIpo(id);
    const updated = { ...existing, ...data, updatedAt: new Date().toISOString() };
    await putRec('ipos', updated); const __prev7 = {...existing}; Object.assign(existing, updated);
    await audit('IPO Edit','IPO', existing.ipoId, __prev7, updated);
    const syncedCount = await syncIpoAllotmentDate(existing);
    toast(syncedCount ? `IPO updated — allotment date refreshed on ${syncedCount} application(s)` : 'IPO updated','ok');
  } else {
    const ipoId = nextCode(S.ipos, 'ipoId', 'IPO');
    const rec = { ipoId, ...data, createdAt: new Date().toISOString(), updatedAt: new Date().toISOString() };
    const newId = await putRec('ipos', rec); rec.id = newId; S.ipos.push(rec);
    await audit('IPO Creation','IPO', ipoId, null, rec);
    toast('IPO added','ok');
  }
  closeModal(); navigate('ipos');
}
function deleteIpo(id){
  const i = findIpo(id);
  const stats = ipoStats(id);
  if (stats.plans.length || stats.apps.length){
    confirmDangerousDelete({
      warningHtml: `This IPO (${escapeHtml(i.ipoId)} — ${escapeHtml(i.ipoName)}) has ${stats.plans.length} planning record(s), ${stats.apps.length} application(s), and ${fmtMoney(stats.profit)} in recorded profit. Deleting it permanently removes all of this, including those planning records and applications. This cannot be undone.`,
      onDelete: async () => {
        const planIds = stats.plans.map(p=>p.id);
        for (const p of stats.plans){ await delRec('ipoPlans', p.id); }
        S.ipoPlans = S.ipoPlans.filter(p=>p.ipoId!==id);
        const orphanedPlannedClients = S.plannedClients.filter(pc=>planIds.includes(pc.planId));
        for (const pc of orphanedPlannedClients){ await delRec('plannedClients', pc.id); }
        S.plannedClients = S.plannedClients.filter(pc=>!planIds.includes(pc.planId));
        for (const a of stats.apps){ await delRec('applications', a.id); }
        S.applications = S.applications.filter(a=>a.ipoId!==id);
        await delRec('ipos', id);
        S.ipos = S.ipos.filter(x=>x.id!==id);
        await audit('IPO Deletion','IPO', i.ipoId, i, null);
        toast('IPO and its records deleted','ok');
        navigate('ipos');
      }
    });
    return;
  }
  confirmAction(`Delete IPO ${escapeHtml(i.ipoId)} - ${escapeHtml(i.ipoName)}? This IPO has no records, so this is safe to remove permanently.`, async () => {
    await delRec('ipos', id);
    S.ipos = S.ipos.filter(x=>x.id!==id);
    await audit('IPO Deletion','IPO', i.ipoId, i, null);
    toast('IPO deleted','ok'); navigate('ipos');
  });
}

<script>
/* =================== IPO PLANNING =================== */
let planningTab = 'plans'; // plans | calendar | variance | capacity

function viewPlanning(){
  if (planningTab==='variance'||planningTab==='upcoming') planningTab='capacity';
  if (planningTab==='funds') planningTab='plans';
  return `
  <div class="pills no-print">
    <button class="pill ${planningTab==='plans'?'on':''}" onclick="setPlanningTab('plans')">Plans</button>
    <button class="pill ${planningTab==='calendar'?'on':''}" onclick="setPlanningTab('calendar')">Calendar</button>
    <button class="pill ${planningTab==='capacity'?'on':''}" onclick="setPlanningTab('capacity')">Capacity &amp; progress</button>
  </div>
  <div id="planningTabBody"></div>`;
}
function setPlanningTab(t){ planningTab = t; render(); }
function afterPlanning(){
  const el = document.getElementById('planningTabBody');
  if (planningTab==='plans') el.innerHTML = planningUpcomingTab() + planningPlansTab();
  else if (planningTab==='calendar') el.innerHTML = planningCalendarTab();
  else if (planningTab==='capacity') el.innerHTML = planningCapacityTab();
  if (planningTab==='plans') { setTimeout(()=>window.__tableRerender['plansTbl'] && window.__tableRerender['plansTbl'](), 0); }
}

function planStatusComputed(plan){
  if (plan.planStatus === 'Cancelled') return 'Cancelled';
  const v = planVariance(plan);
  const c = (typeof mandateCounts === 'function') ? mandateCounts(plan) : null;
  if (c && c.total > 0){
    if (c.failed > 0) return 'Needs Reapply';           // at least one mandate failed and is not re-sent yet
    if (c.accepted >= c.total) return 'Executed';       // every client's mandate accepted
    if (c.sent > 0) return 'Awaiting Acceptance';       // mandates sent, waiting for the bank/client
    if (c.accepted > 0) return 'Partially Executed';
    return 'Planned';
  }
  if (v === 'Pending') return 'Planned';
  if (v === 'Matched' || v === 'Bank Changed' || v === 'Date Changed') return 'Executed';
  return 'Partially Executed';
}

function planningPlansTab(){
  window.__tableRerender['plansTbl'] = () => {
    renderIntoWrap('plansTblWrap', renderDataTable('plansTbl', {
      data: plansForChip(),
      searchFn: (r,q) => { const ipo=findIpo(r.ipoId); return ((ipo?ipo.ipoName:'')+' '+r.plannedDate).toLowerCase().includes(q); },
      searchPlaceholder: 'Search by IPO...',
      filters: [
        { key:'bankAccountId', label:'Bank', options: S.bankAccounts.map(b=>b.bankName), match:(r,v)=>{ const b=findBank(r.bankAccountId); return b && b.bankName===v; } },
        { key:'ipoId', label:'IPO', options: sortedIpos().map(i=>i.ipoName), match:(r,v)=>{ const i=findIpo(r.ipoId); return i && i.ipoName===v; } },
        { key:'status', label:'Status', options:Array.from(new Set(S.ipoPlans.map(planStatusComputed))).sort(), match:(r,v)=>planStatusComputed(r)===v }
      ],
      pageSize: 10,
      columns: [
        { key:'ipoId', label:'IPO', val:r=>{ const i=findIpo(r.ipoId); return i?i.ipoName:''; }, render:r=>{ const i=findIpo(r.ipoId); return i?`<a class="lnk" href="javascript:void(0)" onclick="event.stopPropagation();openIpoDetail(${i.id})">${escapeHtml(i.ipoName)}</a>`:'—'; } },
        { key:'plannedDate', label:'Planned Date', render:r=>fmtDate(r.plannedDate) },
        { key:'bankAccountId', label:'Bank', val:r=>{ const b=findBank(r.bankAccountId); return b?b.bankName:''; }, render:r=>{ const b=findBank(r.bankAccountId); return escapeHtml(b?b.bankName:'—'); } },
        { key:'plannedClientCount', label:'Planned Clients', num:true, sum:true, val:r=>planClientCount(r), render:r=>`<a class="lnk" href="javascript:void(0)" onclick="event.stopPropagation();planClients(${r.id})">${planClientCount(r)}</a>` },
        { key:'status', label:'Status', val:r=>planStatusComputed(r), render:r=>badge(planStatusComputed(r)) },
        { key:'mandates', label:'Mandates', sortable:false, val:r=>mandateSummaryText(r), render:r=>mandateSummaryHtml(r) },
        { key:'variance', label:'Vs Actual', val:r=>planVariance(r), render:r=>badge(planVariance(r)) },
        { hidden:true, key:'notes', label:'Notes', render:r=>escapeHtml(r.notes||'—') }
      ],
      rowActions: r => `<button class="btn btn-sm btn-ghost" onclick="planClients(${r.id})">Clients</button>
                         <button class="btn btn-sm btn-ghost" onclick="editPlan(${r.id})">Edit</button>
                         <button class="btn btn-sm btn-danger" onclick="deletePlan(${r.id})">Delete</button>`
    }));
  };
  setTimeout(()=>window.__tableRerender['plansTbl'](), 0);
  return `
  <div class="section-card">
    <div class="sc-head"><h3>IPO Plans</h3><div class="spacer"></div>
      <button class="btn btn-gold" onclick="bulkPlanClients()">Bulk Plan Clients</button>
      <button class="btn btn-primary" onclick="editPlan()">+ New Plan</button>
    </div>
    <div class="pills no-print" id="planChips" style="padding:8px 14px 0;margin:0;">${planChipsHtml()}</div>
    <div class="sc-body" id="plansTblWrap"></div>
  </div>`;
}

function planFields(p){
  return [
    { key:'ipoId', label:'IPO', type:'select', required:true, placeholder:'Select IPO', options: sortedActiveIpos(p?p.ipoId:null).map(i=>({value:i.id,label:i.ipoName})) },
    { key:'plannedDate', label:'Planned Application Date', type:'date', required:true },
    { key:'bankAccountId', label:'Bank Account', type:'select', required:true, placeholder:'Select Bank', options: S.bankAccounts.filter(b=>b.status==='Active').map(b=>({value:b.id,label:b.bankName})) },
    { key:'planStatus', label:'Planned Status', type:'select', options:['Planned','Partially Executed','Executed','Cancelled'] },
    { key:'notes', label:'Notes', type:'textarea', span2:true }
  ].map(f => fieldHtml(f, p ? p[f.key] : (f.key==='planStatus'?'Planned':''))).join('');
}
function editPlan(id){
  const p = id ? findPlan(id) : null;
  openModal(p ? 'Edit IPO Plan' : 'New IPO Plan',
    `<div class="form-grid">${planFields(p)}</div><p class="hint">Planned client count is worked out automatically from the clients you add with the <b>Clients</b> button${p ? ` (currently <b>${planClientCount(p)}</b>)` : ''} — there is nothing to type.</p>`,
    `<button class="btn btn-ghost" onclick="closeModal()">Cancel</button><button class="btn btn-primary" onclick="savePlan(${id||'null'})">Save</button>`, true);
}
async function savePlan(id, forceOverride){
  const data = readFields([{key:'ipoId',type:'number'},{key:'plannedDate'},{key:'bankAccountId',type:'number'},{key:'planStatus'},{key:'notes'}]);
  if (!data.ipoId || !data.plannedDate || !data.bankAccountId){ toast('IPO, date and bank are required','warn'); return; }

  // duplicate check
  const dup = S.ipoPlans.find(x => x.ipoId===data.ipoId && x.bankAccountId===data.bankAccountId && x.plannedDate===data.plannedDate && x.id !== id);
  if (dup && !forceOverride){
    openModal('Duplicate Plan',
      `<p style="font-size:13px;">This IPO is already planned through this bank account on this date. You can edit the existing plan instead, or continue to create another record.</p>`,
      `<button class="btn btn-ghost" onclick="closeModal()">Cancel</button>
       <button class="btn btn-gold" onclick="closeModal(); editPlan(${dup.id})">Edit Existing Plan</button>
       <button class="btn btn-danger" onclick="savePlan(${id||'null'}, true)">Continue Anyway</button>`);
    return;
  }

  // capacity check — count actual mandates (plannedClientCount), not a flat +1 per plan
  const cap = bankCapacity(data.bankAccountId, data.plannedDate);
  const existingPlanSameSlot = id ? S.ipoPlans.find(x=>x.id===id && x.bankAccountId===data.bankAccountId && x.plannedDate===data.plannedDate) : null;
  const thisPlanMandates = id ? planClientCount(findPlan(id)) : 0;       // clients already mapped to this plan
  const previousMandatesForThisPlan = existingPlanSameSlot ? thisPlanMandates : 0; // already counted in cap.planned if slot unchanged
  const projected = cap.planned - previousMandatesForThisPlan + thisPlanMandates;
  if (thisPlanMandates > 0 && projected > cap.capacity && !forceOverride){
    const bank = findBank(data.bankAccountId);
    openModal('⚠️ Capacity Warning',
      `<p style="font-size:13px;line-height:1.6;">${escapeHtml(bank.bankName)} already has <b>${cap.planned}</b> mandate(s) planned for ${fmtDate(data.plannedDate)}.<br>
       Maximum recommended capacity: <b>${cap.capacity}</b><br>This plan would bring it to: <b>${projected}</b><br>Available: <b>${cap.available}</b><br><br>Do you want to continue anyway?</p>`,
      `<button class="btn btn-ghost" onclick="closeModal()">Cancel</button>
       <button class="btn btn-danger" onclick="savePlan(${id||'null'}, true)">Continue Anyway</button>`);
    return;
  }

  if (id){
    const existing = findPlan(id);
    const updated = { ...existing, ...data, updatedAt: new Date().toISOString() };
    await putRec('ipoPlans', updated); const __prev8 = {...existing}; Object.assign(existing, updated);
    await audit('Plan Modification','IPOPlan', id, __prev8, updated);
    toast('Plan updated','ok');
  } else {
    const rec = { ...data, plannedClientCount: 0, countSynced: true, planStatus: data.planStatus||'Planned', createdAt: new Date().toISOString(), updatedAt: new Date().toISOString() };
    const newId = await putRec('ipoPlans', rec); rec.id = newId; S.ipoPlans.push(rec);
    await audit('Plan Creation','IPOPlan', newId, null, rec);
    toast('Plan created','ok'); window.__openClientsFor = newId;
  }
  closeModal(); navigate('planning');
  if (window.__openClientsFor){ const pid = window.__openClientsFor; window.__openClientsFor = null; setTimeout(()=>planClients(pid), 60); }
}
function deletePlan(id){
  const p = findPlan(id);
  const dependentClients = S.plannedClients.filter(pc=>pc.planId===id);
  const linkedApps = S.applications.filter(a=>a.planId===id);
  const parts = [];
  if (dependentClients.length) parts.push(`${dependentClients.length} client(s) mapped to it, who will be released for re-planning against this IPO`);
  if (linkedApps.length) parts.push(`${linkedApps.length} application(s) created from it, which will be kept but will no longer be linked to any plan`);
  const msg = parts.length ? `This plan has ${parts.join(' and ')}. Continue?` : `Delete this plan?`;
  confirmAction(msg, async () => {
    for (const a of linkedApps){
      const updated = { ...a, planId: null, updatedAt: new Date().toISOString() };
      await putRec('applications', updated); Object.assign(a, updated);
    }
    await delRec('ipoPlans', id);
    S.ipoPlans = S.ipoPlans.filter(x=>x.id!==id);
    for (const pc of dependentClients){ await delRec('plannedClients', pc.id); }
    S.plannedClients = S.plannedClients.filter(x=>x.planId!==id);
    await audit('Plan Modification','IPOPlan', id, p, null);
    toast('Plan deleted','ok'); navigate('planning');
  });
}

/* ---- duplicate-client-per-IPO eligibility rule ----
   A client already mapped to an ACTIVE (non-cancelled) plan for a given IPO cannot be
   mapped to another plan of the SAME IPO, regardless of bank/date/plan. Deleting or
   cancelling the plan releases the client for that IPO again. Deleting an application
   does NOT release the client — only the plan controls eligibility. */
function clientAlreadyPlannedForIpo(clientId, ipoId, excludePlanId){
  return S.plannedClients.some(pc => {
    if (pc.clientId !== clientId) return false;
    if (excludePlanId && pc.planId === excludePlanId) return false;
    const plan = findPlan(pc.planId);
    return plan && plan.ipoId === ipoId && plan.planStatus !== 'Cancelled';
  });
}

/* ---- client mapping for a plan ---- */
async function togglePlanClient(planId, clientId, checked){
  const plan = findPlan(planId);
  if (checked && clientAlreadyPlannedForIpo(clientId, plan.ipoId, planId)){
    toast('This client is already planned for this IPO under another active plan','warn');
    planClients(planId);
    return;
  }
  const existing = S.plannedClients.find(pc=>pc.planId===planId && pc.clientId===clientId);
  if (checked && !existing){
    const rec = { planId, clientId, createdAt: new Date().toISOString() };
    const id = await putRec('plannedClients', rec); rec.id = id; S.plannedClients.push(rec);
    await audit('Plan Modification','PlannedClient', id, null, rec);
    const cap = bankCapacity(plan.bankAccountId, plan.plannedDate);
    if (cap.planned > cap.capacity) toast(`Heads up: ${findBank(plan.bankAccountId).bankName} now has ${cap.planned} mandates on ${fmtDate(plan.plannedDate)} (limit ${cap.capacity})`,'warn');
  } else if (!checked && existing){
    await delRec('plannedClients', existing.id);
    S.plannedClients = S.plannedClients.filter(x=>x.id!==existing.id);
    await audit('Plan Modification','PlannedClient', existing.id, existing, null);
  }
  await syncPlanClientCount(plan);
}

/* ---- bulk client planning (all banks in one go) ----
   Pick an IPO + date, click a bank chip (the "brush"), then tick clients to put them on that bank.
   Each client goes to exactly one bank; a bank never takes more than its daily mandate limit. */
let __bulkPlanSearch = '';
let __bulkPlanSelected = new Map();   // clientId -> bankAccountId
let __bpBrush = null;
let __bpGroups = [];
const BP_COLORS = ['#1f6f5c','#27508f','#96681a','#8a3f9e','#b3382f','#2a8aa0','#6b7a1f','#c0527a'];
function bpBanks(){ return S.bankAccounts.filter(b=>b.status==='Active'); }
function bpColor(bankId){ const i = bpBanks().findIndex(b=>b.id===bankId); return BP_COLORS[(i<0?0:i)%BP_COLORS.length]; }
function bpAssignedTo(bankId){ let n=0; __bulkPlanSelected.forEach(b=>{ if (b===bankId) n++; }); return n; }
function bpRoom(bankId){   // free mandate slots on this bank for the chosen date, after what's already assigned here
  const date = (document.getElementById('bpDate')||{}).value;
  if (!date) return Infinity;
  return bankCapacity(bankId, date).available - bpAssignedTo(bankId);
}
function bulkPlanClients(){
  __bulkPlanSearch = ''; __bulkPlanSelected = new Map(); __bpBrush = null;
  const ipoOpts = sortedActiveIpos().map(i=>`<option value="${i.id}">${escapeHtml(i.ipoName)}</option>`).join('');
  openModal('Bulk Plan Clients',
    `<div class="form-grid">
      <div class="f-group"><label>IPO *</label><select id="bpIpo" onchange="renderBulkPlanClientList()"><option value="">Select IPO</option>${ipoOpts}</select></div>
      <div class="f-group"><label>Planned Date *</label><input type="date" id="bpDate" onchange="bpRefresh()"></div>
      <div class="f-group"><label>&nbsp;</label><div class="small-muted">Up to ${capacityLimit()} mandates per bank per day. Each client goes to one bank.</div></div>
    </div>
    <div class="f-group span2" style="margin-top:10px;">
      <div class="bp-banks" id="bpBanks"></div>
      <div style="display:flex;gap:8px;align-items:center;margin-bottom:6px;flex-wrap:wrap;">
        <input type="text" id="bpSearch" placeholder="Search by client name or ID..." oninput="__bulkPlanSearch=this.value; renderBulkPlanClientList()" style="flex:1;min-width:180px;">
        <button type="button" class="btn btn-ghost btn-sm" onclick="bulkPlanSelectAll()">Put all shown on selected bank</button>
        <button type="button" class="btn btn-ghost btn-sm" onclick="bulkPlanClearAll()">Clear All</button>
        <span class="small-muted" id="bpSelectedCount">Selected: 0 clients</span>
      </div>
      <div id="bpClientListWrap" class="bp-wrap"></div>
    </div>`,
    `<button class="btn btn-ghost" onclick="closeModal()">Cancel</button><button class="btn btn-primary" onclick="submitBulkPlan()">Create Plans &amp; Map Clients</button>`, true);
  document.getElementById('modalBox').classList.add('xwide'); document.getElementById('modalOverlay').classList.add('xw');
  if (!window.__bpResize){ window.__bpResize = true; window.addEventListener('resize', ()=>{ if (document.getElementById('bpClientListWrap')) bpFit(); }); }
  const bs = bpBanks(); if (bs.length) __bpBrush = bs[0].id;
  renderBulkPlanClientList();
}
function bpRefresh(){ renderBulkPlanClientList(); }
function bpSetBrush(id){ __bpBrush = id; renderBulkPlanBanks(); }
function renderBulkPlanBanks(){
  const el = document.getElementById('bpBanks'); if (!el) return;
  const date = (document.getElementById('bpDate')||{}).value;
  const banks = bpBanks();
  el.innerHTML = banks.length ? `<span class="small-muted">Selected bank — tick clients to put them on it:</span>` + banks.map(b=>{
    const n = bpAssignedTo(b.id);
    const cap = date ? bankCapacity(b.id, date) : null;
    const lim = cap ? cap.available : capacityLimit();
    return `<button type="button" class="bp-bank${__bpBrush===b.id?' on':''}" style="--bk:${bpColor(b.id)}" onclick="bpSetBrush(${b.id})" title="${cap?`${cap.planned} already planned on this date`:'Pick a date to include existing plans'}">${escapeHtml(b.bankName)} <b>${n}/${Math.max(lim,0)}</b></button>`;
  }).join('') : `<span class="small-muted">No active bank accounts.</span>`;
}
function renderBulkPlanClientList(){
  const wrap = document.getElementById('bpClientListWrap');
  if (!wrap) return;
  const ipoId = Number(document.getElementById('bpIpo').value) || null;
  const q = (__bulkPlanSearch||'').toLowerCase();
  const keepScroll = wrap.scrollTop;
  // drop assignments for clients now blocked for the chosen IPO
  if (ipoId) [...__bulkPlanSelected.keys()].forEach(id => { if (clientAlreadyPlannedForIpo(id, ipoId, null)) __bulkPlanSelected.delete(id); });
  const visible = S.clients.filter(c => !q || (c.clientId+' '+c.clientName).toLowerCase().includes(q));
  // Order: reference (blank last) -> sub-reference (blank last) -> name, so each sub-reference sits together.
  const refKey = c => (c.referenceName||'').trim(), subKey = c => (c.subReference||'').trim();
  const cmp = (a,b) => (!a&&b) ? 1 : (a&&!b) ? -1 : a.localeCompare(b,undefined,{sensitivity:'base'});
  const sorted = visible.slice().sort((a,b)=> cmp(refKey(a),refKey(b)) || cmp(subKey(a),subKey(b)) || (a.clientName||'').localeCompare(b.clientName||'',undefined,{sensitivity:'base'}));
  __bpGroups = [];
  sorted.forEach(c=>{
    const r = refKey(c), sb = subKey(c), last = __bpGroups[__bpGroups.length-1];
    if (last && last.r===r && last.sb===sb) last.list.push(c); else __bpGroups.push({ r, sb, list:[c] });
  });
  const isBlocked = c => ipoId && clientAlreadyPlannedForIpo(c.id, ipoId, null);
  let lastRef = null;
  wrap.innerHTML = '<div class="bp-cols">' + (__bpGroups.map((g,gi)=>{
    let head = '';
    if (g.r !== lastRef || gi===0){
      lastRef = g.r;
      const n = __bpGroups.filter(x=>x.r===g.r).reduce((t,x)=>t+x.list.length,0);
      head = `<div class="bp-ref"><span>${escapeHtml(g.r||'No reference')} <small class="small-muted">${n}</small></span><a href="javascript:void(0)" onclick="bulkPlanToggleRef(${gi})">all</a></div>`;
    }
    const multi = g.list.length > 1 && g.sb;
    const sub = multi ? `<div class="bp-ghead"><b>${escapeHtml(g.sb)}</b><span class="small-muted">${g.list.length}</span><a href="javascript:void(0)" onclick="bulkPlanToggleGroup(${gi})">all</a></div>` : '';
    const tiles = g.list.map(c=>{
      const blocked = isBlocked(c), inactive = c.status === 'Inactive', bank = __bulkPlanSelected.get(c.id), checked = bank!=null && !blocked;
      const bk = checked ? findBank(bank) : null;
      const tip = c.clientId + ' \u2014 ' + c.clientName + (g.sb?' ('+g.sb+')':'') + (inactive?' (Inactive)':'') + (blocked?' (already planned for this IPO)':'') + (bk?' \u2192 '+bk.bankName:'');
      return `<label class="bp-tile${checked?' on':''}${blocked?' blk':''}${inactive?' inact':''}" ${checked?`style="--bk:${bpColor(bank)}"`:''} title="${escapeHtml(tip)}">
        <input type="checkbox" class="bulkPlanClient" value="${c.id}" ${blocked?'disabled':''} ${checked?'checked':''} onchange="bpToggleClient(${c.id}, this.checked)">
        <span>${escapeHtml(c.clientName)}</span>${inactive?'<i class="bp-inact">Inactive</i>':''}${bk?`<i class="bp-bk">${escapeHtml((bk.bankName||'').slice(0,4))}</i>`:''}</label>`;
    }).join('');
    return head + `<div class="bp-group${multi?' multi':''} ${gi%2?'alt':''}">${sub}${tiles}</div>`;
  }).join('') || `<div class="small-muted">No clients match.</div>`) + '</div>';
  wrap.scrollTop = keepScroll;
  renderBulkPlanBanks();
  bpFit();
  updateBulkPlanSelectedCount();
}
function bpFit(){
  const wrap = document.getElementById('bpClientListWrap'); if (!wrap) return;
  const cols = wrap.querySelector('.bp-cols'); if (!cols) return;
  if (window.matchMedia('(max-width:900px)').matches){ cols.style.height=''; cols.style.columnCount='2'; cols.style.fontSize=''; return; }
  const cs = getComputedStyle(wrap), availH = wrap.clientHeight - parseFloat(cs.paddingTop) - parseFloat(cs.paddingBottom), availW = wrap.clientWidth - parseFloat(cs.paddingLeft) - parseFloat(cs.paddingRight);
  cols.style.height = availH + 'px';
  const sizes = [14,13.5,13,12.5,12,11.5,11,10.5,10];
  for (const fs of sizes){
    cols.style.fontSize = fs + 'px';
    for (let n = 3; n <= 12; n++){
      if (availW / n < 130) break;
      cols.style.columnCount = String(n);
      if (cols.scrollWidth <= cols.clientWidth + 2) return;
    }
  }
}
function bulkPlanToggleRef(gi){
  const g = __bpGroups[gi]; if (!g) return;
  const list = __bpGroups.filter(x=>x.r===g.r).flatMap(x=>x.list);
  const all = list.every(c => __bulkPlanSelected.get(c.id) === __bpBrush);
  if (all){ list.forEach(c => __bulkPlanSelected.delete(c.id)); renderBulkPlanClientList(); } else bpPut(list);
}
function bpNeedBank(){
  if (!__bpBrush){ toast('Select a bank first','warn'); return false; }
  if (!document.getElementById('bpDate').value){ toast('Pick the planned date first','warn'); return false; }
  return true;
}
function bpToggleClient(id, checked){
  if (!checked){ __bulkPlanSelected.delete(id); renderBulkPlanClientList(); return; }
  if (!bpNeedBank()){ renderBulkPlanClientList(); return; }
  if (bpRoom(__bpBrush) < 1){ toast(`${(findBank(__bpBrush)||{}).bankName||'This bank'} is full for this date (${capacityLimit()} mandates). Pick another bank.`,'warn'); renderBulkPlanClientList(); return; }
  __bulkPlanSelected.set(id, __bpBrush); renderBulkPlanClientList();
}
function bpPut(list){
  if (!bpNeedBank()) return;
  const ipoId = Number(document.getElementById('bpIpo').value) || null;
  let added = 0, skippedFull = 0;
  list.forEach(c=>{
    if (ipoId && clientAlreadyPlannedForIpo(c.id, ipoId, null)) return;
    if (__bulkPlanSelected.has(c.id)) return;   // only unassigned clients; never steal from another bank
    if (bpRoom(__bpBrush) < 1){ skippedFull++; return; }
    __bulkPlanSelected.set(c.id, __bpBrush); added++;
  });
  if (skippedFull) toast(`${added} added; ${skippedFull} left out because ${(findBank(__bpBrush)||{}).bankName||'the bank'} is full`,'warn');
  renderBulkPlanClientList();
}
function bulkPlanToggleGroup(gi){
  const g = __bpGroups[gi]; if (!g) return;
  const allOnBrush = g.list.every(c => __bulkPlanSelected.get(c.id) === __bpBrush);
  if (allOnBrush){ g.list.forEach(c => __bulkPlanSelected.delete(c.id)); renderBulkPlanClientList(); }
  else bpPut(g.list);
}
function bulkPlanSelectAll(){
  // Puts everyone matching the CURRENT search on the selected bank (until it is full).
  const q = (__bulkPlanSearch||'').toLowerCase();
  bpPut(S.clients.filter(c => !q || (c.clientId+' '+c.clientName).toLowerCase().includes(q)));
}
function bulkPlanClearAll(){ __bulkPlanSelected = new Map(); renderBulkPlanClientList(); }
function updateBulkPlanSelectedCount(){
  const n = __bulkPlanSelected.size;
  const el = document.getElementById('bpSelectedCount');
  if (el) el.textContent = `Selected: ${n} client${n===1?'':'s'}`;
}
async function submitBulkPlan(){
  const ipoId = Number(document.getElementById('bpIpo').value);
  const plannedDate = document.getElementById('bpDate').value;
  if (!ipoId || !plannedDate){ toast('IPO and date are required','warn'); return; }
  const assign = [...__bulkPlanSelected.entries()].filter(([cid]) => !clientAlreadyPlannedForIpo(cid, ipoId, null));
  if (!assign.length){ toast('Tick at least one client','warn'); return; }
  // group clients by bank and re-check each bank's daily limit
  const byBank = new Map();
  assign.forEach(([cid,bid])=>{ if(!byBank.has(bid)) byBank.set(bid,[]); byBank.get(bid).push(cid); });
  for (const [bid, ids] of byBank){
    const cap = bankCapacity(bid, plannedDate);
    if (ids.length > cap.available){ toast(`${(findBank(bid)||{}).bankName||'A bank'} can take ${Math.max(cap.available,0)} more on this date, but ${ids.length} are assigned`,'warn'); return; }
  }
  let total = 0; const parts = [];
  for (const [bid, ids] of byBank){
    let plan = S.ipoPlans.find(x=>x.ipoId===ipoId && x.bankAccountId===bid && x.plannedDate===plannedDate);
    if (!plan){
      const rec = { ipoId, plannedDate, bankAccountId:bid, countSynced:true, plannedClientCount: 0, planStatus:'Planned', notes:'', createdAt:new Date().toISOString(), updatedAt:new Date().toISOString() };
      const id = await putRec('ipoPlans', rec); rec.id = id; S.ipoPlans.push(rec); plan = rec;
      await audit('Plan Creation','IPOPlan', id, null, rec);
    }
    for (const cid of ids){
      if (!S.plannedClients.some(pc=>pc.planId===plan.id && pc.clientId===cid)){
        const rec = { planId: plan.id, clientId: cid, createdAt: new Date().toISOString() };
        const id = await putRec('plannedClients', rec); rec.id = id; S.plannedClients.push(rec); total++;
      }
    }
    await syncPlanClientCount(plan);
    parts.push(`${(findBank(bid)||{}).bankName||'Bank'} ${ids.length}`);
  }
  toast(`${total} client(s) planned for ${findIpo(ipoId).ipoName} — ${parts.join(', ')}`, 'ok');
  closeModal(); navigate('planning');
}
</script>

<script>
/* ---- planning calendar ---- */

    const bankLines = activeBanks.slice(0,4).map(b=>{

function calShift(n){ calMonth += n; if (calMonth<0){calMonth=11;calYear--;} if(calMonth>11){calMonth=0;calYear++;} render(); }
function openCalendarDate(dateStr){
  const activeBanks = S.bankAccounts.filter(b=>b.status==='Active');
  const blocks = activeBanks.map(b=>{
    const cap = bankCapacity(b.id, dateStr);
    const list = cap.plans.map(p=>{ const ipo = findIpo(p.ipoId); return `<li>${escapeHtml(ipo?ipo.ipoName:'—')} <span class="small-muted">(${planClientCount(p)} clients planned)</span></li>`; }).join('') || '<li class="small-muted">No IPOs planned</li>';
    return `<div style="margin-bottom:12px;">
      <div style="display:flex;align-items:center;gap:8px;"><b>${escapeHtml(b.bankName)}</b><span class="cap-cell ${capClass(cap.status)}">${cap.planned}/${cap.capacity} used</span><span class="small-muted">${cap.available} slot(s) remaining</span></div>
      <ul style="margin:6px 0 0 18px;font-size:12.5px;">${list}</ul>

  }).join('');

    `<button class="btn btn-primary" onclick="closeModal()">Close</button>`, true);

/* ---- capacity dashboard ---- */
function planningCapacityTab(){
  const activeBanks = S.bankAccounts.filter(b=>b.status==='Active');
  const dateSet = new Set(S.ipoPlans.map(p=>p.plannedDate));
  if (!dateSet.size) dateSet.add(todayStr());
  const rows = [];
  activeBanks.forEach(b => {
    dateSet.forEach(d => {
      const cap = bankCapacity(b.id, d);
      if (cap.planned > 0) rows.push({ bank:b.bankName, date:d, ...cap });
    });
  });
  rows.sort((a,b)=> a.date.localeCompare(b.date) || a.bank.localeCompare(b.bank));
  const trs = rows.map(r=>`<tr>
    <td>${escapeHtml(r.bank)}</td><td>${fmtDate(r.date)}</td><td>${r.planned}</td><td>${r.capacity}</td>
    <td>${r.available}</td><td>${r.utilisation}%</td><td><span class="cap-cell ${capClass(r.status)}">${r.status}</span></td>
  </tr>`).join('') || `<tr class="empty-row"><td colspan="7">No planning activity yet.</td></tr>`;
  return `
  <div class="section-card">
    <div class="sc-head"><h3>Bank Capacity Dashboard</h3></div>
    <div class="sc-body table-wrap">
      <table class="dt"><thead><tr><th>Bank</th><th>Date</th><th>Planned Mandates</th><th>Capacity</th><th>Available</th><th>Utilisation</th><th>Status</th></tr></thead>
      <tbody>${trs}</tbody></table>
    </div>
  </div>`;
}

/* ---- planned vs actual variance ---- */
function upcomingPlanningStatus(ipo){
  const plans = S.ipoPlans.filter(p=>p.ipoId===ipo.id);
  if (!plans.length) return 'Not Planned';
  const totalPlannedClients = plans.reduce((s,p)=>s+planClientCount(p),0);
  const mappedClients = S.plannedClients.filter(pc => plans.some(p=>p.id===pc.planId)).length;
  if (mappedClients >= totalPlannedClients && totalPlannedClients > 0) return 'Planned';
  return 'Partially Planned';
}
function quickPlan(ipoId){
  editPlan();
  setTimeout(()=>{ const sel = document.getElementById('fld_ipoId'); if (sel) sel.value = ipoId; }, 30);
}

<script>

function appFields(a){

function editApplication(id){

    `<button class="btn btn-ghost" onclick="closeModal()">Cancel</button><button class="btn btn-primary" onclick="saveApplication(${id||'null'})">Save</button>`, true);
