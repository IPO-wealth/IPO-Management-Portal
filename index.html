<script>
/* ===== Mandate tracking: Sent -> Accepted / Failed, per planned client ===== */
function nowLocalDT(){ const d=new Date(), p=n=>String(n).padStart(2,'0'); return `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())}T${p(d.getHours())}:${p(d.getMinutes())}`; }
function fmtDT(s){ if(!s) return ''; const [d,t]=String(s).split('T'); return fmtDate(d)+(t?', '+t:''); }
function pcRec(planId,cid){ return S.plannedClients.find(pc=>pc.planId===planId && pc.clientId===cid); }
function lastAttempt(pc){ const a = pc && pc.attempts; return a && a.length ? a[a.length-1] : null; }
// Accepted = an application exists for this plan+client (that is what "executed" means). Otherwise the latest attempt decides.
function mandateState(plan, cid){
  if (S.applications.some(a=>a.planId===plan.id && a.clientId===cid)) return 'Accepted';
  const at = lastAttempt(pcRec(plan.id,cid));
  if (at && at.status==='Sent') return 'Sent';
  if (at && at.status==='Failed') return 'Failed';
  return 'To do';
}
function mandateCounts(plan){
  const ids = planPendingClients(plan).map(x=>x.cid), c = { total:ids.length, todo:0, sent:0, accepted:0, failed:0 };
  ids.forEach(cid=>{ const s=mandateState(plan,cid); if(s==='Accepted') c.accepted++; else if(s==='Sent') c.sent++; else if(s==='Failed') c.failed++; else c.todo++; });
  return c;
}
function mandateSummaryText(plan){ const c=mandateCounts(plan); if(!c.total) return ''; return `${c.accepted} accepted, ${c.sent} sent, ${c.failed} failed, ${c.todo} to do`; }
function mandateSummaryHtml(plan){
  const c=mandateCounts(plan); if(!c.total) return '<span class="small-muted">—</span>';
  const bits=[`<span class="ok">${c.accepted} ✓</span>`]; if(c.sent) bits.push(`<span>${c.sent} sent</span>`); if(c.failed) bits.push(`<b class="danger">${c.failed} failed</b>`); if(c.todo) bits.push(`<span class="small-muted">${c.todo} to do</span>`);
  return `<span style="white-space:nowrap">${bits.join(' · ')}</span>`;
}
function mandateCellHtml(plan, cid, st, at, app){
  const n = (pcRec(plan.id,cid)||{}).attempts; const att = n && n.length>1 ? ` <span class="small-muted">attempt ${n.length}</span>` : '';
  if (st==='Accepted'){ const t = (app && app.mandateAcceptedAt) || (at && at.status==='Accepted' && at.resolvedAt) || ''; return `<span class="badge green">Accepted</span>${att}${t?`<div class="small-muted">${escapeHtml(fmtDT(t))}</div>`:''}`; }
  if (st==='Sent') return `<span class="badge blue">Sent</span>${att}<div class="small-muted">${escapeHtml(fmtDT(at.sentAt))}</div>
    <div class="mand-btns"><button class="btn btn-sm btn-ghost" onclick="ckOpenResolve(${plan.id},'Accepted',[${cid}])">Accepted</button><button class="btn btn-sm btn-ghost" onclick="ckOpenResolve(${plan.id},'Failed',[${cid}])">Failed</button><a href="javascript:void(0)" onclick="ckUndoAttempt(${plan.id},${cid})">undo</a></div>`;
  if (st==='Failed') return `<span class="badge red">Failed</span>${att}<div class="small-muted">${escapeHtml(fmtDT(at.resolvedAt))}</div>
    <div class="mand-btns"><button class="btn btn-sm btn-gold" onclick="ckOpenReapply(${plan.id},[${cid}])">Reapply</button><a href="javascript:void(0)" onclick="ckUndoAttempt(${plan.id},${cid})">undo</a></div>`;
  return `<span class="badge gold">To do</span>${att}`;
}
function ckUsedUpis(ipoId, exceptCid){
  const used = new Set(S.applications.filter(a=>a.ipoId===ipoId && a.upiId!=null && isLiveApp(a)).map(a=>a.upiId));
  S.plannedClients.forEach(pc=>{ const pl=findPlan(pc.planId); if(!pl||pl.ipoId!==ipoId||pc.clientId===exceptCid) return; const at=lastAttempt(pc); if(at && at.status==='Sent' && at.upiId!=null) used.add(at.upiId); });
  return used;
}
async function ckSaveAttempt(plan, cid, attempt){
  const pc = pcRec(plan.id, cid); if(!pc) return;
  pc.attempts = [...(pc.attempts||[]), attempt]; pc.updatedAt = new Date().toISOString();
  await putRec('plannedClients', pc);
}
/* --- To do -> Sent --- */
async function ckSend(planId, force){
  const plan = findPlan(planId); if(!plan) return;
  const ticks = ckTicked(planId,'To do');
  if (!ticks.length){ toast('Tick at least one client that is still "To do"','warn'); return; }
  const rows = ticks.map(t=>{ const cid=Number(t.dataset.cid); const amt=Number(document.getElementById(`ckAmt-${planId}-${cid}`).value)||0; const u=document.getElementById(`ckUpi-${planId}-${cid}`).value; return { cid, amt, upiId:u?Number(u):null }; });
  const bad = rows.filter(r=>!r.amt); if (bad.length){ toast('Enter an amount for every ticked client','warn'); bad.forEach(r=>document.getElementById(`ckAmt-${planId}-${r.cid}`).classList.add('invalid')); return; }
  const used = ckUsedUpis(plan.ipoId), seen = new Set(), dups = [];
  rows.forEach(r=>{ if (r.upiId!=null){ if (used.has(r.upiId) || seen.has(r.upiId)) dups.push(r); seen.add(r.upiId); } });
  if (dups.length && !force){
    openModal('Same UPI used twice', `<p style="font-size:13px;line-height:1.5;">${dups.length} mandate(s) use a UPI ID that is already used for <b>${escapeHtml(findIpo(plan.ipoId)?.ipoName||'this IPO')}</b> (applied, sent, or twice in this batch). A UPI ID can normally apply only once per IPO.</p>`,
      `<button class="btn btn-ghost" onclick="closeModal()">Go back</button><button class="btn btn-danger" onclick="closeModal();ckSend(${planId},true)">Save anyway</button>`); return;
  }
  const t = nowLocalDT();
  try { for (const r of rows) await ckSaveAttempt(plan, r.cid, { bankId:plan.bankAccountId, upiId:r.upiId, amount:r.amt, status:'Sent', sentAt:t, resolvedAt:null }); }
  catch(e){ toast(e.message||'Could not save','danger'); return; }
  toast(`${rows.length} mandate(s) marked as Sent`,'ok'); navigate('checklist');
}
/* --- Sent -> Accepted / Failed (with the time) --- */
function ckOpenResolve(planId, kind, cids){
  const plan = findPlan(planId); if(!plan) return;
  if (!cids) cids = ckTicked(planId,'Sent').map(t=>Number(t.dataset.cid));
  cids = cids.filter(cid=>mandateState(plan,cid)==='Sent');
  if (!cids.length){ toast('Tick at least one client whose mandate is Sent','warn'); return; }
  const t = nowLocalDT(), ok = kind==='Accepted';
  const rows = cids.map(cid=>{ const c=findClient(cid), at=lastAttempt(pcRec(planId,cid)); return `<tr><td>${escapeHtml(c?c.clientName:'')}</td><td class="small-muted">sent ${escapeHtml(fmtDT(at.sentAt))}</td><td><input type="datetime-local" class="mdT" data-cid="${cid}" value="${t}"></td></tr>`; }).join('');
  openModal(ok?'Mandates accepted':'Mandates failed',
    `<p class="small-muted" style="margin-bottom:8px;">${ok?'Enter when each mandate was accepted.':'Enter when each mandate failed.'} ${ok?'The application is created for each accepted client.':'Failed clients stay in the plan so you can reapply.'}</p>
     <div class="f-group" style="max-width:260px;margin-bottom:10px;"><label>Same time for all</label><input type="datetime-local" value="${t}" oninput="document.querySelectorAll('.mdT').forEach(i=>i.value=this.value)"></div>
     <div class="table-wrap flat"><table class="dt" data-enh="1"><thead><tr><th>Client</th><th>Sent</th><th>${ok?'Accepted at':'Failed at'}</th></tr></thead><tbody>${rows}</tbody></table></div>`,
    `<button class="btn btn-ghost" onclick="closeModal()">Cancel</button><button class="btn ${ok?'btn-primary':'btn-danger'}" onclick="ckResolveSave(${planId},'${kind}',[${cids.join(',')}])">Save ${cids.length} as ${kind}</button>`);
}
async function ckResolveSave(planId, kind, cids){
  const plan = findPlan(planId); if(!plan) return;
  const times = {}; let miss = false;
  document.querySelectorAll('.mdT').forEach(i=>{ if(!i.value) miss = true; times[Number(i.dataset.cid)] = i.value; });
  if (miss){ toast('Enter the time for every client','warn'); return; }
  const ok = kind==='Accepted'; let n = 0;
  beginUndo();
  try {
    for (const cid of cids){
      const pc = pcRec(planId,cid), at = lastAttempt(pc); if(!at || at.status!=='Sent') continue;
      at.status = kind; at.resolvedAt = times[cid]; pc.updatedAt = new Date().toISOString();
      if (ok && !S.applications.some(a=>a.planId===planId && a.clientId===cid)){
        const now = new Date().toISOString();
        const rec = { clientId:cid, ipoId:plan.ipoId, bankAccountId:at.bankId||plan.bankAccountId, applicationDate:plan.plannedDate, upiId:at.upiId, amountApplied:at.amount,
          applicationStatus:'Applied', planId, mandateSentAt:at.sentAt, mandateAcceptedAt:at.resolvedAt, mandateAttempts:(pc.attempts||[]).length, profitSharePct: shareForClient(cid), allotmentStatus:'Pending', allotmentDate:null, saleStatus:null, saleDate:null, saleAmount:null,
          calculatedGrossReceived:null, grossReceived:null, grossReceivedOverridden:false, calculatedOurProfit:null, ourProfit:null, ourProfitOverridden:false,
          calculatedClientProfit:null, clientProfit:null, clientProfitOverridden:false, createdAt:now, updatedAt:now };
        const id = await putRec('applications', rec); rec.id = id; S.applications.push(rec);
        await audit('Application Creation','Application', id, null, rec);
      }
      await putRec('plannedClients', pc); n++;
    }
  } catch(e){ toast(e.message||'Could not save','danger'); }
  finally { await endUndo(ok?'Created':'Updated'); }
  closeModal(); toast(`${n} mandate(s) marked ${kind}${ok?' — application(s) created':''}`,'ok'); navigate('checklist');
}
/* --- Failed -> reapply (same bank/UPI prefilled, both changeable) --- */
function ckOpenReapply(planId, cids){
  const plan = findPlan(planId); if(!plan) return;
  if (!cids) cids = ckTicked(planId,'Failed').map(t=>Number(t.dataset.cid));
  cids = cids.filter(cid=>mandateState(plan,cid)==='Failed');
  if (!cids.length){ toast('Tick at least one Failed client','warn'); return; }
  window.__reapply = { planId, cids };
  const firstAt = lastAttempt(pcRec(planId,cids[0]));
  const banks = S.bankAccounts.filter(b=>b.status==='Active'), cur = (firstAt&&firstAt.bankId)||plan.bankAccountId;
  openModal('Reapply failed mandates',
    `<div class="f-group" style="max-width:320px;margin-bottom:10px;"><label>Bank for the new attempt</label><select id="raBank" onchange="ckReapplyRows()">${banks.map(b=>`<option value="${b.id}" ${b.id===cur?'selected':''}>${escapeHtml(b.bankName)}</option>`).join('')}</select></div>
     <div class="table-wrap flat"><table class="dt" data-enh="1"><thead><tr><th>Client</th><th>Amount (₹)</th><th>UPI ID</th></tr></thead><tbody id="raRows"></tbody></table></div>
     <p class="small-muted" style="margin-top:8px;">The failed attempt stays in the history. The new attempt starts as Sent.</p>`,
    `<button class="btn btn-ghost" onclick="closeModal()">Cancel</button><button class="btn btn-gold" onclick="ckReapplySave()">Reapply ${cids.length} &amp; mark Sent</button>`);
  ckReapplyRows(true);
}
function ckReapplyRows(first){
  const { planId, cids } = window.__reapply; const plan = findPlan(planId); const bankId = Number(document.getElementById('raBank').value);
  const upis = S.bankUpiIds.filter(u=>u.bankAccountId===bankId), taken = new Set();
  const prev = {}; if(!first) cids.forEach(cid=>{ const a=document.getElementById('raAmt-'+cid), u=document.getElementById('raUpi-'+cid); if(a) prev[cid]={amt:a.value}; });
  document.getElementById('raRows').innerHTML = cids.map(cid=>{
    const c = findClient(cid), at = lastAttempt(pcRec(planId,cid)), used = ckUsedUpis(plan.ipoId, cid);
    let pick = null;
    if (at && at.bankId===bankId && at.upiId!=null && !used.has(at.upiId) && !taken.has(at.upiId)) pick = at.upiId;
    else { const f = upis.find(u=>!used.has(u.id) && !taken.has(u.id)); pick = f?f.id:null; }
    if (pick!=null) taken.add(pick);
    const amt = (prev[cid]&&prev[cid].amt) || (at&&at.amount) || '';
    return `<tr><td>${escapeHtml(c?c.clientName:'')}</td><td><input type="number" id="raAmt-${cid}" value="${amt}" style="width:100px"></td>
      <td><select id="raUpi-${cid}"><option value="">— no UPI —</option>${upis.map(u=>`<option value="${u.id}" ${u.id===pick?'selected':''}>${escapeHtml(u.upiId)}${used.has(u.id)?' (used)':''}</option>`).join('')}</select></td></tr>`;
  }).join('');
}
async function ckReapplySave(){
  const { planId, cids } = window.__reapply; const plan = findPlan(planId); if(!plan) return;
  const bankId = Number(document.getElementById('raBank').value), t = nowLocalDT();
  const rows = cids.map(cid=>({ cid, amt:Number(document.getElementById('raAmt-'+cid).value)||0, upiId:(document.getElementById('raUpi-'+cid).value||null) && Number(document.getElementById('raUpi-'+cid).value) }));
  if (rows.some(r=>!r.amt)){ toast('Enter an amount for every client','warn'); return; }
  const seen = new Set(); let dup = false; rows.forEach(r=>{ if(r.upiId!=null && r.upiId!==0){ if(seen.has(r.upiId)) dup=true; seen.add(r.upiId); } });
  if (dup){ toast('Two clients use the same UPI ID','warn'); return; }
  try { for (const r of rows) await ckSaveAttempt(plan, r.cid, { bankId, upiId:r.upiId||null, amount:r.amt, status:'Sent', sentAt:t, resolvedAt:null }); }
  catch(e){ toast(e.message||'Could not save','danger'); return; }
  closeModal(); toast(`${rows.length} mandate(s) re-sent`,'ok'); navigate('checklist');
}
/* --- undo a wrong click --- */
async function ckUndoAttempt(planId, cid){
  const pc = pcRec(planId,cid), at = lastAttempt(pc); if(!at) return;
  if (at.status==='Sent') pc.attempts = pc.attempts.slice(0,-1);
  else if (at.status==='Failed'){ at.status='Sent'; at.resolvedAt=null; }
  else return;
  pc.updatedAt = new Date().toISOString();
  try { await putRec('plannedClients', pc); } catch(e){ toast(e.message||'Could not save','danger'); return; }
  navigate('checklist');
}
</script>
<script>
(function(){const _r=render;render=function(){const r=_r.apply(this,arguments);try{requestAnimationFrame(()=>{const b=document.querySelector('.tabs button.active');if(b&&b.scrollIntoView)b.scrollIntoView({block:'nearest',inline:'center'});});}catch(e){}return r;};})();
</script>
<script>
/* ===== Mandate reminders, client mandate/profit history, month-close checklist ===== */
function staleHours(){ return Number(S.settings.mandateStaleHours)||3; }
function sentAgeH(at){ if(!at||!at.sentAt) return 0; const t=new Date(at.sentAt).getTime(); return isNaN(t)?0:(Date.now()-t)/3600000; }
function staleSentList(){
  const out=[];
  S.ipoPlans.filter(p=>p.planStatus!=='Cancelled').forEach(p=>planPendingClients(p).forEach(x=>{
    if (mandateState(p,x.cid)!=='Sent') return;
    const at=lastAttempt(pcRec(p.id,x.cid)), h=sentAgeH(at);
    if (h>=staleHours()) out.push({plan:p,cid:x.cid,h});
  }));
  return out;
}
function ageText(h){ return h>=24 ? Math.floor(h/24)+'d' : Math.floor(h)+'h'; }
(function(){
  const _td=todoDigest;
  todoDigest=function(){
    const items=_td.apply(this,arguments); const st=staleSentList();
    if (st.length){
      const oldest=st.reduce((a,b)=>b.h>a.h?b:a);
      const it={ cls:'high', ico:'⏰', text:`${st.length} mandate${st.length===1?'':'s'} sent ${staleHours()}+ hours ago, not accepted yet (oldest ${ageText(oldest.h)}) — check or mark failed`, go:`checklistDate='${oldest.plan.plannedDate}';navigate('checklist')` };
      const i=items.findIndex(x=>x.ico==='⏳'); if(i>=0) items.splice(i,0,it); else items.unshift(it);
    }
    return items;
  };
  const _mc=mandateCellHtml;
  mandateCellHtml=function(plan,cid,st,at,app){
    let h=_mc.apply(this,arguments);
    if (st==='Sent'){ const a=sentAgeH(at); if (a>=staleHours()) h+=`<div class="danger small-muted" style="font-weight:600">⏰ waiting ${ageText(a)}</div>`; }
    return h;
  };
  const _vc=viewClientDetail;
  viewClientDetail=function(id){
    const base=_vc.apply(this,arguments); const c=findClient(id); if(!c) return base;
    return base + clientHistoryExtraHtml(c);
  };
})();
function clientHistoryExtraHtml(c){
  const pcs=S.plannedClients.filter(pc=>pc.clientId===c.id);
  let att=0, fail=0, firstTry=0, acc=0;
  const byBank={};
  pcs.forEach(pc=>{ const a=pc.attempts||[]; if(!a.length) return;
    att+=a.length; const f=a.filter(x=>x.status==='Failed').length; fail+=f;
    const plan=findPlan(pc.planId); const ok=plan?S.applications.some(x=>x.planId===pc.planId&&x.clientId===c.id):false;
    if(ok){ acc++; if(a.length===1) firstTry++; }
    a.forEach(x=>{ const b=findBank(x.bankId); const n=b?b.bankName:'—'; byBank[n]=byBank[n]||{t:0,f:0}; byBank[n].t++; if(x.status==='Failed') byBank[n].f++; });
  });
  const apps=S.applications.filter(a=>a.clientId===c.id);
  const byYear={};
  apps.forEach(a=>{ if(a.saleStatus!=='Sold'||!a.saleDate) return; const y=a.saleDate.slice(0,4); const k=calcAllotmentSale(a); if(!k.applicable) return;
    byYear[y]=byYear[y]||{n:0,our:0,cl:0}; byYear[y].n++; byYear[y].our+=k.ourFinal||0; byYear[y].cl+=(k.grossFinal||0)-(k.ourFinal||0); });
  const yrs=Object.keys(byYear).sort().reverse();
  const yearRows=yrs.map(y=>`<tr><td>${y}</td><td>${byYear[y].n}</td><td>${fmtMoney(byYear[y].our)}</td></tr>`).join('');
  const bankRows=Object.entries(byBank).map(([n,v])=>`<tr><td>${escapeHtml(n)}</td><td>${v.t}</td><td>${v.f?`<b class="danger">${v.f}</b>`:'0'}</td></tr>`).join('');
  if(!att && !yrs.length) return '';
  return `<div class="section-card"><div class="sc-head"><h3>Mandate record &amp; yearly profit</h3></div><div class="sc-body">
    <div class="kpi-grid" style="margin-bottom:12px;">
      <div class="kpi-card"><div class="lbl">Mandate attempts</div><div class="val">${att}</div></div>
      <div class="kpi-card"><div class="lbl">Failed attempts</div><div class="val ${fail?'danger':''}">${fail}</div></div>
      <div class="kpi-card"><div class="lbl">Accepted first try</div><div class="val">${acc?Math.round(firstTry/acc*100)+'%':'—'}</div><div class="small-muted">${firstTry} of ${acc} tracked</div></div>
    </div>
    <div class="settings-grid" style="display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:16px;">
      ${bankRows?`<div class="table-wrap"><table class="dt" data-enh="1"><thead><tr><th>Bank</th><th>Attempts</th><th>Failed</th></tr></thead><tbody>${bankRows}</tbody></table></div>`:''}
      ${yearRows?`<div class="table-wrap"><table class="dt" data-enh="1"><thead><tr><th>Year</th><th>Sales</th><th>Our profit</th></tr></thead><tbody>${yearRows}</tbody></table></div>`:''}
    </div></div></div>`;
}
function monthCloseChecks(m){
  const inM=d=>d&&String(d).slice(0,7)===m, end=m+'-31', apps=S.applications;
  const sold=apps.filter(a=>a.saleStatus==='Sold'&&inM(a.saleDate));
  const checks=[];
  const add=(label,n,detail,block)=>checks.push({label,n,detail,block});
  add('Sales still waiting for money', sold.filter(a=>recvDue(a)>0.5).length, 'You can still record payments after closing.', false);
  add('Sales with no sale amount', sold.filter(a=>!Number(a.saleAmount)).length, 'Profit will show as zero for these.', true);
  add('Allotted shares not yet sold (IPO listed by this month)', apps.filter(a=>a.allotmentStatus==='Allotted'&&a.saleStatus!=='Sold'&&(()=>{ const i=findIpo(a.ipoId); const d=i&&(i.listingDate||i.allotmentDate); return d&&String(d)<=end; })()).length, 'Sell or confirm these before locking the month.', true);
  add('Allotment results not entered (result date passed)', apps.filter(a=>isLiveApp(a)&&(!a.allotmentStatus||a.allotmentStatus==='Pending')&&(()=>{ const i=findIpo(a.ipoId); return i&&i.allotmentDate&&i.allotmentDate<=end; })()).length, 'Enter results in Operations → Results.', true);
  add('Profit overrides with no reason', sold.filter(a=>{ const k=calcAllotmentSale(a); return (k.grossOverridden||k.ourOverridden)&&!(a.overrideReason||'').trim(); }).length, 'Add a reason so you can explain it later.', false);
  add('Mandates failed or unconfirmed in this month\'s plans', S.ipoPlans.filter(p=>p.planStatus!=='Cancelled'&&inM(p.plannedDate)).reduce((n,p)=>{ const c=mandateCounts(p); return n+c.failed+c.sent; },0), 'Reapply or resolve them in the checklist.', false);
  return checks;
}
function toggleMonthClose(month){
  const closed=!!((S.settings.monthLocks||{})[month]||{}).closed;
  if (closed){ confirmAction(`Reopen ${monthLabel(month)}? Its sales become editable again.`, ()=>setMonthClosed(month,false)); return; }
  const ch=monthCloseChecks(month), bad=ch.filter(x=>x.n&&x.block).length;
  const rows=ch.map(x=>`<div style="display:flex;gap:10px;align-items:flex-start;padding:8px 0;border-bottom:1px solid var(--border);">
    <span style="font-size:16px;line-height:1.3">${!x.n?'✅':(x.block?'⚠️':'ℹ️')}</span>
    <div style="flex:1"><b>${x.label}</b>${x.n?` — <b class="${x.block?'danger':''}">${x.n}</b><div class="small-muted">${x.detail}</div>`:''}</div></div>`).join('');
  openModal(`Close ${monthLabel(month)}?`, `<p class="small-muted" style="margin-top:0">Closing locks this month's sales (by sale date) against edits and deletes.</p>${rows}${bad?`<p class="danger" style="font-weight:600;margin-bottom:0">${bad} item${bad===1?'':'s'} need attention first — you can still close anyway.</p>`:'<p class="ok" style="font-weight:600;margin-bottom:0">All clear.</p>'}`,
    `<button class="btn btn-ghost" onclick="closeModal()">Cancel</button><button class="btn btn-primary" onclick="closeModal();setMonthClosed('${month}',true)">${bad?'Close anyway':'Close month'}</button>`);
}
</script>
