    <div class="sc-body"><p class="small-muted">Sold applications still awaiting recovery, sorted by longest outstanding first. Anything over 15 days is flagged.</p><div id="agingReportWrap"></div></div>
  </div>`;
}

function monthKey(dateStr){ if(!dateStr) return null; return dateStr.slice(0,7); } // 'YYYY-MM'
function monthLabel(key){ const [y,m] = key.split('-'); return new Date(Number(y), Number(m)-1, 1).toLocaleDateString('en-IN',{month:'short', year:'2-digit'}); }

function last12MonthKeys(){
  const keys = [];
  const now = new Date();
  for (let i=11; i>=0; i--){
    const d = new Date(now.getFullYear(), now.getMonth()-i, 1);
    keys.push(`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`);
  }
  return keys;
}

window.__trendCharts = {};
function destroyChart(id){ if (window.__trendCharts[id]){ window.__trendCharts[id].destroy(); delete window.__trendCharts[id]; } }

function renderTrendsCharts(){
  if (typeof Chart === 'undefined'){
    ['monthlyTrendTableWrap'].forEach(id=>{ const el=document.getElementById(id); if(el) el.innerHTML = '<p class="small-muted">Charts library failed to load (check your internet connection) — the tables below still work.</p>'; });
  }
  const months = last12MonthKeys();

  // ---- Monthly Profit Trend table + line chart ----
  const monthly = months.map(mk => {
    const soldThisMonth = S.applications.filter(a => a.saleStatus==='Sold' && monthKey(a.saleDate)===mk);
    const appsThisMonth = S.applications.filter(a => monthKey(a.applicationDate)===mk).length;
    const allottedThisMonth = S.applications.filter(a => { const i=findIpo(a.ipoId); return a.allotmentStatus==='Allotted' && i && monthKey(i.allotmentDate)===mk; }).length;
    let gross=0, our=0, client=0;
    soldThisMonth.forEach(a=>{ const c=calcAllotmentSale(a); if(c.applicable){ gross+=c.grossFinal; our+=c.ourFinal; client+=c.clientFinal; } });
    return { mk, applications:appsThisMonth, allotments:allottedThisMonth, sold:soldThisMonth.length, gross, our, client };
  });
  const tblRows = monthly.map(m=>`<tr><td>${monthLabel(m.mk)}</td><td>${m.applications}</td><td>${m.allotments}</td><td>${m.sold}</td><td>${fmtMoney(m.gross)}</td><td>${fmtMoney(m.our)}</td><td>${fmtMoney(m.client)}</td></tr>`).join('');
  const tblWrap = document.getElementById('monthlyTrendTableWrap');
  if (tblWrap) tblWrap.innerHTML = `<div class="table-wrap"><table class="dt"><thead><tr><th>Month</th><th>Applications</th><th>Allotments</th><th>Sold</th><th>Gross Received</th><th>Our Profit</th><th>Client Profit</th></tr></thead><tbody>${tblRows}</tbody></table></div>`;

  const chartsAvailable = (typeof Chart !== 'undefined');
  if (!chartsAvailable){
    const el = document.getElementById('monthlyTrendTableWrap');
    if (el) el.insertAdjacentHTML('beforeend', '<p class="small-muted">Charts library failed to load (check your internet connection) — the tables below still work.</p>');
  }

  if (chartsAvailable) { destroyChart('profitTrend');
  const ctxTrend = document.getElementById('chartProfitTrend');
  if (ctxTrend) window.__trendCharts['profitTrend'] = new Chart(ctxTrend, {
    type:'line',
    data:{ labels: monthly.map(m=>monthLabel(m.mk)), datasets:[{ label:'Our Profit', data: monthly.map(m=>m.our), borderColor:'#c8963e', backgroundColor:'rgba(200,150,62,.15)', fill:true, tension:.25 }] },
    options:{ responsive:true, plugins:{legend:{display:false}}, scales:{ y:{ ticks:{ callback:v=>fmtMoney(v) } } } }
  }); }

  // ---- Profit by IPO (top 10) ----
  const ipoProfits = S.ipos.map(i=>{
    const apps = S.applications.filter(a=>a.ipoId===i.id);
    let our=0; apps.forEach(a=>{ const c=calcAllotmentSale(a); if(c.applicable) our+=c.ourFinal; });
    return { name:i.ipoName, our };
  }).filter(x=>x.our!==0).sort((a,b)=>b.our-a.our).slice(0,10);
  if (chartsAvailable) { destroyChart('profitByIpo');
  const ctxIpo = document.getElementById('chartProfitByIpo');
  if (ctxIpo) window.__trendCharts['profitByIpo'] = new Chart(ctxIpo, {
    type:'bar',
    data:{ labels: ipoProfits.map(x=>x.name), datasets:[{ label:'Our Profit', data: ipoProfits.map(x=>x.our), backgroundColor:'#2f8f7f' }] },
    options:{ responsive:true, plugins:{legend:{display:false}}, scales:{ y:{ ticks:{ callback:v=>fmtMoney(v) } } } }
  }); }

  // ---- Applications by Bank ----
  const bankCounts = S.bankAccounts.map(b=>({ name:b.bankName, count: S.applications.filter(a=>a.bankAccountId===b.id).length })).filter(x=>x.count>0).sort((a,b)=>b.count-a.count);
  if (chartsAvailable) { destroyChart('appsByBank');
  const ctxBank = document.getElementById('chartAppsByBank');
  if (ctxBank) window.__trendCharts['appsByBank'] = new Chart(ctxBank, {
    type:'bar',
    data:{ labels: bankCounts.map(x=>x.name), datasets:[{ label:'Applications', data: bankCounts.map(x=>x.count), backgroundColor:'#16263f' }] },
    options:{ responsive:true, plugins:{legend:{display:false}} }
  }); }

  // ---- Lifecycle funnel ----
  const totalApps = S.applications.length;
  const allottedCount = S.applications.filter(a=>a.allotmentStatus==='Allotted').length;
  const soldCount = S.applications.filter(a=>a.saleStatus==='Sold').length;
  const receivedCount = S.applications.filter(a=>a.amountReceiveStatus==='Received').length;
  if (chartsAvailable) { destroyChart('funnel');
  const ctxFunnel = document.getElementById('chartFunnel');
  if (ctxFunnel) window.__trendCharts['funnel'] = new Chart(ctxFunnel, {
    type:'bar',
    data:{ labels:['Applied','Allotted','Sold','Received'], datasets:[{ data:[totalApps, allottedCount, soldCount, receivedCount], backgroundColor:['#16263f','#2f8f7f','#c8963e','#1f7a63'] }] },
    options:{ indexAxis:'y', responsive:true, plugins:{legend:{display:false}} }
  }); }

  // ---- Year-over-Year comparison ----
  const thisYear = new Date().getFullYear();
  const lastYear = thisYear - 1;
  function yearTotals(year){
    const sold = S.applications.filter(a=>a.saleStatus==='Sold' && a.saleDate && new Date(a.saleDate).getFullYear()===year);
    const apps = S.applications.filter(a=>a.applicationDate && new Date(a.applicationDate).getFullYear()===year);
    let gross=0, our=0, client=0;
    sold.forEach(a=>{ const c=calcAllotmentSale(a); if(c.applicable){ gross+=c.grossFinal; our+=c.ourFinal; client+=c.clientFinal; } });
    return { applications:apps.length, sold:sold.length, gross, our, client };
  }
  const yThis = yearTotals(thisYear), yLast = yearTotals(lastYear);
  const pctChange = (a,b) => b===0 ? (a===0?'—':'New') : `${a>=b?'+':''}${Math.round(((a-b)/Math.abs(b))*100)}%`;
  const yoyRows = [
    ['Applications', yLast.applications, yThis.applications, pctChange(yThis.applications, yLast.applications)],
    ['Sold', yLast.sold, yThis.sold, pctChange(yThis.sold, yLast.sold)],
    ['Gross Received', fmtMoney(yLast.gross), fmtMoney(yThis.gross), pctChange(yThis.gross, yLast.gross)],
    ['Our Profit', fmtMoney(yLast.our), fmtMoney(yThis.our), pctChange(yThis.our, yLast.our)],
    ['Client Profit', fmtMoney(yLast.client), fmtMoney(yThis.client), pctChange(yThis.client, yLast.client)],
  ];
  const yoyWrap = document.getElementById('yoySummaryWrap');
  if (yoyWrap) yoyWrap.innerHTML = `<div class="table-wrap"><table class="dt"><thead><tr><th></th><th>${lastYear}</th><th>${thisYear}</th><th>Change</th></tr></thead><tbody>${yoyRows.map(r=>`<tr><td>${r[0]}</td><td>${r[1]}</td><td>${r[2]}</td><td>${r[3]}</td></tr>`).join('')}</tbody></table></div>`;

  // Monthly Our Profit, this year vs last year, month-by-month (Jan-Dec)
  const monthNames = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  function monthlyProfitForYear(year){
    return monthNames.map((_,idx)=>{
      const sold = S.applications.filter(a=>{ if(a.saleStatus!=='Sold'||!a.saleDate) return false; const d=new Date(a.saleDate); return d.getFullYear()===year && d.getMonth()===idx; });
      let our=0; sold.forEach(a=>{ const c=calcAllotmentSale(a); if(c.applicable) our+=c.ourFinal; });
      return our;
    });
  }
  if (chartsAvailable) { destroyChart('yoy');
  const ctxYoy = document.getElementById('chartYoY');
  if (ctxYoy) window.__trendCharts['yoy'] = new Chart(ctxYoy, {
    type:'bar',
    data:{ labels: monthNames, datasets:[
      { label:String(lastYear), data: monthlyProfitForYear(lastYear), backgroundColor:'#93a7bd' },
      { label:String(thisYear), data: monthlyProfitForYear(thisYear), backgroundColor:'#c8963e' }
    ]},
    options:{ responsive:true, plugins:{legend:{display:true}}, scales:{ y:{ ticks:{ callback:v=>fmtMoney(v) } } } }
  }); }

  // ---- Top 10 Clients by Profit ----
  const clientProfits = S.clients.map(c=>{
    const apps = S.applications.filter(a=>a.clientId===c.id);
    let our=0; apps.forEach(a=>{ const cal=calcAllotmentSale(a); if(cal.applicable) our+=cal.ourFinal; });
    return { name:c.clientName, id:c.clientId, our };
  }).filter(x=>x.our!==0).sort((a,b)=>b.our-a.our).slice(0,10);
  const topClientsWrap = document.getElementById('topClientsWrap');
  if (topClientsWrap) topClientsWrap.innerHTML = clientProfits.length
    ? `<div class="table-wrap"><table class="dt"><thead><tr><th>Client</th><th>Our Profit</th></tr></thead><tbody>${clientProfits.map(x=>`<tr><td>${escapeHtml(x.id)} — ${escapeHtml(x.name)}</td><td>${fmtMoney(x.our)}</td></tr>`).join('')}</tbody></table></div>`
    : '<p class="small-muted">No profit recorded yet.</p>';

  // ---- Top 10 IPOs by Profit (table alongside the chart) ----
  const topIposWrap = document.getElementById('topIposWrap');
  if (topIposWrap) topIposWrap.innerHTML = ipoProfits.length
    ? `<div class="table-wrap"><table class="dt"><thead><tr><th>IPO</th><th>Our Profit</th></tr></thead><tbody>${ipoProfits.map(x=>`<tr><td>${escapeHtml(x.name)}</td><td>${fmtMoney(x.our)}</td></tr>`).join('')}</tbody></table></div>`
    : '<p class="small-muted">No profit recorded yet.</p>';

  // ---- Aging report: sold + receivable, sorted by longest outstanding ----
  const today = new Date(todayStr());
  const aging = S.applications.filter(a=>a.saleStatus==='Sold' && a.amountReceiveStatus==='Receivable' && a.saleDate).map(a=>{
    const c = findClient(a.clientId), b = findBank(a.bankAccountId), i = findIpo(a.ipoId);
    const days = Math.round((today - new Date(a.saleDate)) / 86400000);
    const calc = calcAllotmentSale(a);
    return { client:c?c.clientName:'—', ipo:i?i.ipoName:'—', bank:b?b.bankName:'—', saleDate:a.saleDate, days, amount: calc.applicable?calc.grossFinal:0 };
  }).sort((a,b)=>b.days-a.days);
  const agingWrap = document.getElementById('agingReportWrap');
  if (agingWrap) agingWrap.innerHTML = aging.length
    ? `<div class="table-wrap"><table class="dt"><thead><tr><th>Client</th><th>IPO</th><th>Bank</th><th>Sale Date</th><th>Days Outstanding</th><th>Amount</th></tr></thead><tbody>${aging.map(a=>`<tr><td>${escapeHtml(a.client)}</td><td>${escapeHtml(a.ipo)}</td><td>${escapeHtml(a.bank)}</td><td>${fmtDate(a.saleDate)}</td><td class="${a.days>15?'danger':''}">${a.days} day${a.days===1?'':'s'}${a.days>15?' ⚠️':''}</td><td>${fmtMoney(a.amount)}</td></tr>`).join('')}</tbody></table></div>`
    : '<p class="small-muted">Nothing pending — everything sold has been recovered.</p>';
}

let yearlySummaryYear = new Date().getFullYear();
function setYearlySummaryYear(y){ yearlySummaryYear = Number(y); render(); }
function reportYearlySummary(){
  const year = yearlySummaryYear;
  const yearsWithData = Array.from(new Set(
    S.applications.map(a=>a.applicationDate).filter(Boolean).map(d=>new Date(d).getFullYear())
  )).sort((a,b)=>b-a);
  if (!yearsWithData.includes(year)) yearsWithData.unshift(year);

  const appsThisYear = S.applications.filter(a=>a.applicationDate && new Date(a.applicationDate).getFullYear()===year);
  const allotted = appsThisYear.filter(a=>a.allotmentStatus==='Allotted');
  const notAllotted = appsThisYear.filter(a=>a.allotmentStatus==='Not Allotted');
  const sold = appsThisYear.filter(a=>a.saleStatus==='Sold');
  const ipoIdsThisYear = new Set(appsThisYear.map(a=>a.ipoId));
  const amountApplied = appsThisYear.reduce((s,a)=>s+(Number(a.amountApplied)||0),0);
  let gross=0, our=0, client=0;
  appsThisYear.forEach(a=>{ const c=calcAllotmentSale(a); if(c.applicable){ gross+=c.grossFinal; our+=c.ourFinal; client+=c.clientFinal; } });

  const bankRows = S.bankAccounts.map(b=>{
    const bApps = appsThisYear.filter(a=>a.bankAccountId===b.id);
    if (!bApps.length) return null;
    let bOur=0; bApps.forEach(a=>{ const c=calcAllotmentSale(a); if(c.applicable) bOur+=c.ourFinal; });
    return `<tr><td>${escapeHtml(b.bankName)}</td><td>${bApps.length}</td><td>${fmtMoney(bApps.reduce((s,a)=>s+(Number(a.amountApplied)||0),0))}</td><td>${fmtMoney(bOur)}</td></tr>`;
  }).filter(Boolean).join('') || `<tr class="empty-row"><td colspan="4">No data for ${year}.</td></tr>`;

  return `
  <div class="section-card no-print">
    <div class="sc-body" style="display:flex;gap:8px;align-items:center;">
      <select onchange="setYearlySummaryYear(this.value)">
        ${yearsWithData.map(y=>`<option value="${y}" ${y===year?'selected':''}>${y}</option>`).join('')}
      </select>
      <button class="btn btn-primary" onclick="window.print()">Print / Save as PDF</button>
    </div>
  </div>

  <div class="section-card printable-report">
    <div class="sc-body">
      <div style="text-align:center;margin-bottom:20px;">
        <h2 style="margin:0;">IPO Management Portal</h2>
        <p class="small-muted" style="margin:4px 0;">Yearly Summary — ${year}</p>
      </div>

      <div class="kpi-grid">
        <div class="kpi-card"><div class="lbl">Applications</div><div class="val">${appsThisYear.length}</div></div>
        <div class="kpi-card"><div class="lbl">IPOs Participated</div><div class="val">${ipoIdsThisYear.size}</div></div>
        <div class="kpi-card"><div class="lbl">Allotted</div><div class="val ok">${allotted.length}</div></div>
        <div class="kpi-card"><div class="lbl">Not Allotted</div><div class="val danger">${notAllotted.length}</div></div>
        <div class="kpi-card"><div class="lbl">Sold</div><div class="val">${sold.length}</div></div>
        <div class="kpi-card"><div class="lbl">Amount Applied</div><div class="val">${fmtMoney(amountApplied)}</div></div>
        <div class="kpi-card"><div class="lbl">Gross Received</div><div class="val">${fmtMoney(gross)}</div></div>
        <div class="kpi-card"><div class="lbl">Our Profit</div><div class="val gold">${fmtMoney(our)}</div></div>
        <div class="kpi-card"><div class="lbl">Client Profit</div><div class="val">${fmtMoney(client)}</div></div>
      </div>

      <h3 style="margin-top:24px;">Bank-wise Breakdown</h3>
      <div class="table-wrap"><table class="dt"><thead><tr><th>Bank</th><th>Applications</th><th>Amount Applied</th><th>Our Profit</th></tr></thead><tbody>${bankRows}</tbody></table></div>

      <p class="small-muted" style="margin-top:20px;text-align:center;">Generated ${fmtDate(todayStr())} from IPO Management Portal.</p>
    </div>
  </div>`;
}
let caFilters = { reference:'', subReference:'' };
function setCaFilter(key, val){ caFilters[key] = val; render(); }
function reportClientAnalysis(){
  const filtered = S.clients.filter(c =>
    (!caFilters.reference || c.referenceName===caFilters.reference) &&
    (!caFilters.subReference || c.subReference===caFilters.subReference)
  );
  const rows = filtered.map(c=>{
    const st = clientStats(c.id);
    return `<tr><td>${escapeHtml(c.clientName)}</td><td>${escapeHtml(c.subReference||'—')}</td><td>${st.apps.length}</td><td>${st.allotted.length}</td><td>${st.notAllotted.length}</td><td>${st.sold.length}</td><td>${fmtMoney(st.amountApplied)}</td><td>${fmtMoney(st.grossReceived)}</td><td>${fmtMoney(st.profit)}</td><td>${fmtMoney(st.clientProfit)}</td></tr>`;
  }).join('') || `<tr class="empty-row"><td colspan="10">No clients match.</td></tr>`;
  return `<div class="section-card">
    <div class="sc-body" style="display:flex;flex-wrap:wrap;gap:8px;">
      <select onchange="setCaFilter('reference', this.value)">
        <option value="">Reference: All</option>
        ${(S.settings.references||[]).map(r=>`<option value="${escapeHtml(r)}" ${caFilters.reference===r?'selected':''}>${escapeHtml(r)}</option>`).join('')}
      </select>
      <select onchange="setCaFilter('subReference', this.value)">
        <option value="">Sub Reference: All</option>
        ${(S.settings.subReferences||[]).map(r=>`<option value="${escapeHtml(r)}" ${caFilters.subReference===r?'selected':''}>${escapeHtml(r)}</option>`).join('')}
      </select>
    </div>
  </div>
  <div class="section-card"><div class="sc-body table-wrap"><table class="dt"><thead><tr><th>Client</th><th>Sub Reference</th><th>Applications</th><th>Allotments</th><th>Not Allotted</th><th>Sold</th><th>Amount Applied</th><th>Gross Received</th><th>Our Profit</th><th>Client Profit</th></tr></thead><tbody>${rows}</tbody></table></div></div>`;
}
function reportIpoAnalysis(){
  const rows = S.ipos.map(i=>{
    const st = ipoStats(i.id);
    const notAllotted = st.apps.filter(a=>a.allotmentStatus==='Not Allotted').length;
    const sold = st.apps.filter(a=>a.saleStatus==='Sold').length;
    const amountApplied = st.apps.reduce((s,a)=>s+(Number(a.amountApplied)||0),0);
    const gross = st.apps.reduce((s,a)=>{ const c=calcAllotmentSale(a); return s+(c.applicable?c.grossFinal:0); },0);
    return `<tr><td>${escapeHtml(i.ipoName)}</td><td>${st.apps.length}</td><td>${st.allotted.length}</td><td>${notAllotted}</td><td>${sold}</td><td>${fmtMoney(amountApplied)}</td><td>${fmtMoney(gross)}</td><td>${fmtMoney(st.profit)}</td></tr>`;
  }).join('') || `<tr class="empty-row"><td colspan="8">No IPOs yet.</td></tr>`;
  return `<div class="section-card"><div class="sc-body table-wrap"><table class="dt"><thead><tr><th>IPO</th><th>Applications</th><th>Allotments</th><th>Not Allotted</th><th>Sold</th><th>Amount Applied</th><th>Gross Received</th><th>Our Profit</th></tr></thead><tbody>${rows}</tbody></table></div></div>`;
}
function reportBankAnalysis(){
  const rows = S.bankAccounts.map(b=>{
    const st = bankStats(b.id);
    const actualIpoIds = new Set(st.apps.map(a=>a.ipoId));
    const amountApplied = st.apps.reduce((s,a)=>s+(Number(a.amountApplied)||0),0);
    const gross = st.apps.reduce((s,a)=>{ const c=calcAllotmentSale(a); return s+(c.applicable?c.grossFinal:0); },0);
    // Amount Blocked: only applications still awaiting an allotment decision for this bank —
    // matches the same definition used on the Dashboard and IPO Command Center.
    const amountBlocked = st.apps.filter(a=>!a.allotmentStatus || a.allotmentStatus==='Pending').reduce((s,a)=>s+(Number(a.amountApplied)||0),0);
    const pendingReceivablesCount = st.apps.filter(a=>a.amountReceiveStatus==='Receivable').length;
    return `<tr><td>${escapeHtml(b.bankName)}</td><td>${st.plans.length}</td><td>${actualIpoIds.size}</td>
      <td class="clickable" ${navAttr('applications', {bankAccountId:b.bankName}, 'appsTbl')}>${st.apps.length}</td>
      <td class="clickable" ${navAttr('allotments', {bankAccountId:b.bankName, allotmentStatus:'Allotted'})}>${st.apps.filter(a=>a.allotmentStatus==='Allotted').length}</td>
      <td>${fmtMoney(amountApplied)}</td><td>${fmtMoney(amountBlocked)}</td>
      <td class="clickable ${pendingReceivablesCount>0?'danger':''}" ${navAttr('allotments', {bankAccountId:b.bankName, amountReceiveStatus:'Receivable'})}>${pendingReceivablesCount}</td>
      <td>${fmtMoney(gross)}</td><td>${fmtMoney(st.profit)}</td></tr>`;
  }).join('') || `<tr class="empty-row"><td colspan="10">No bank accounts yet.</td></tr>`;
  return `<div class="section-card"><div class="sc-body table-wrap"><table class="dt"><thead><tr><th>Bank</th><th>Planned IPOs</th><th>Actual IPOs</th><th>Applications</th><th>Allotments</th><th>Amount Applied</th><th>Amount Blocked</th><th>Pending Receivables</th><th>Gross Received</th><th>Our Profit</th></tr></thead><tbody>${rows}</tbody></table></div>
  <div class="sc-body"><p class="small-muted">Amount Blocked = amount currently tied up in applications still awaiting an allotment decision (excludes Not Allotted and already-resolved applications). Pending Receivables = count of sold applications whose recovery is still outstanding.</p></div></div>`;
}
let praRange = { preset:'thisMonth', from:null, to:null };
let praFilters = { ipoId:'', clientId:'', bankId:'', reference:'', subReference:'' };
function resolvePraRange(){
  const now = new Date();
  const y = now.getFullYear(), m = now.getMonth();
  const p = praRange.preset;
  if (p === 'thisMonth') return { from: isoDate(new Date(y,m,1)), to: isoDate(new Date(y,m+1,0)) };
  if (p === 'thisYear') return { from: isoDate(new Date(y,0,1)), to: isoDate(new Date(y,11,31)) };
  if (p === 'custom') return { from: praRange.from || '0001-01-01', to: praRange.to || '9999-12-31' };
  return { from:'0001-01-01', to:'9999-12-31' }; // 'all'
}
function setPraPreset(p){ praRange.preset = p; render(); }
function setPraCustom(){
  praRange.preset = 'custom';
  praRange.from = document.getElementById('praFrom').value;
  praRange.to = document.getElementById('praTo').value;
  render();
}
function setPraFilter(key, val){ praFilters[key] = val; render(); }
function reportProfitAnalysis(){
  const r = resolvePraRange();
  // Filters (IPO/Client/Bank/Reference) apply to every figure below; the date
  // range applies only to the profit figures, which are dated by Sale Date —
  // Capital Blocked / Receivables are current outstanding balances, not
  // historical, so they intentionally ignore the date range.
  const matchesFilters = a => {
    if (praFilters.ipoId && String(a.ipoId)!==praFilters.ipoId) return false;
    if (praFilters.bankId && String(a.bankAccountId)!==praFilters.bankId) return false;
    if (praFilters.clientId && String(a.clientId)!==praFilters.clientId) return false;
    if (praFilters.reference || praFilters.subReference){
      const c = findClient(a.clientId);
      if (praFilters.reference && (!c || c.referenceName !== praFilters.reference)) return false;
      if (praFilters.subReference && (!c || c.subReference !== praFilters.subReference)) return false;
    }
    return true;
  };
  const allFiltered = S.applications.filter(matchesFilters);
  const soldInRange = allFiltered.filter(a => a.saleStatus==='Sold' && inRange(a.saleDate, r));

  let grossProfit=0, ourProfit=0, clientProfit=0;
  soldInRange.forEach(a=>{ const c=calcAllotmentSale(a); if (c.applicable){ grossProfit+=c.grossFinal; ourProfit+=c.ourFinal; clientProfit+=c.clientFinal; } });
  const monthNow = new Date();
  const soldThisMonth = allFiltered.filter(a=>a.saleStatus==='Sold' && a.saleDate>=isoDate(new Date(monthNow.getFullYear(),monthNow.getMonth(),1)) && a.saleDate<=todayStr());
  const soldThisYear = allFiltered.filter(a=>a.saleStatus==='Sold' && a.saleDate>=isoDate(new Date(monthNow.getFullYear(),0,1)) && a.saleDate<=todayStr());
  const monthlyProfit = soldThisMonth.reduce((s,a)=>{ const c=calcAllotmentSale(a); return s+(c.applicable?c.ourFinal:0); },0);
  const yearlyProfit = soldThisYear.reduce((s,a)=>{ const c=calcAllotmentSale(a); return s+(c.applicable?c.ourFinal:0); },0);
  const avgProfitPerMonth = Math.round(yearlyProfit / (monthNow.getMonth()+1));
  let totalReceived=0, totalReceivable=0;
  allFiltered.forEach(a=>{ const c=calcAllotmentSale(a); if (c.applicable){ if (a.amountReceiveStatus==='Received') totalReceived+=c.grossFinal; if (a.amountReceiveStatus==='Receivable') totalReceivable+=c.grossFinal; } });
  const totalCapitalBlocked = allFiltered.filter(a=>!a.allotmentStatus || a.allotmentStatus==='Pending').reduce((s,a)=>s+(Number(a.amountApplied)||0),0);

  const presetBtns = [['thisMonth','This Month'],['thisYear','This Year'],['all','All Time'],['custom','Custom']]
    .map(([k,l]) => `<button class="btn btn-sm ${praRange.preset===k?'btn-primary':'btn-ghost'}" onclick="setPraPreset('${k}')">${l}</button>`).join('');

  return `
  <div class="section-card">
    <div class="sc-body" style="display:flex;flex-wrap:wrap;gap:8px;align-items:center;">
      ${presetBtns}
      ${praRange.preset==='custom' ? `<input type="date" id="praFrom" value="${praRange.from||''}" onchange="setPraCustom()"><span>to</span><input type="date" id="praTo" value="${praRange.to||''}" onchange="setPraCustom()">` : ''}
      <span class="small-muted" style="margin-left:auto;">Profit figures: ${fmtDate(r.from)} – ${fmtDate(r.to)} (by Sale Date)</span>
    </div>
    <div class="sc-body" style="display:flex;flex-wrap:wrap;gap:8px;border-top:1px solid var(--border);">
      <select onchange="setPraFilter('ipoId', this.value)">
        <option value="">IPO: All</option>
        ${sortedIpos().map(i=>`<option value="${i.id}" ${praFilters.ipoId===String(i.id)?'selected':''}>${escapeHtml(i.ipoName)}</option>`).join('')}
      </select>
      <select onchange="setPraFilter('clientId', this.value)">
        <option value="">Client: All</option>
        ${S.clients.map(c=>`<option value="${c.id}" ${praFilters.clientId===String(c.id)?'selected':''}>${escapeHtml(c.clientName)}</option>`).join('')}
      </select>
      <select onchange="setPraFilter('bankId', this.value)">
        <option value="">Bank: All</option>
        ${S.bankAccounts.map(b=>`<option value="${b.id}" ${praFilters.bankId===String(b.id)?'selected':''}>${escapeHtml(b.bankName)}</option>`).join('')}
      </select>
      <select onchange="setPraFilter('reference', this.value)">
        <option value="">Reference: All</option>
        ${(S.settings.references||[]).map(rf=>`<option value="${escapeHtml(rf)}" ${praFilters.reference===rf?'selected':''}>${escapeHtml(rf)}</option>`).join('')}
      </select>
      <select onchange="setPraFilter('subReference', this.value)">
        <option value="">Sub Reference: All</option>
        ${(S.settings.subReferences||[]).map(rf=>`<option value="${escapeHtml(rf)}" ${praFilters.subReference===rf?'selected':''}>${escapeHtml(rf)}</option>`).join('')}
      </select>
    </div>
  </div>

  <div class="kpi-grid">
    <div class="kpi-card"><div class="lbl">Monthly Profit</div><div class="val gold">${fmtMoney(monthlyProfit)}</div></div>
    <div class="kpi-card"><div class="lbl">Yearly Profit</div><div class="val gold">${fmtMoney(yearlyProfit)}</div></div>
    <div class="kpi-card"><div class="lbl">Avg Profit / Month</div><div class="val">${fmtMoney(avgProfitPerMonth)}</div></div>
    <div class="kpi-card"><div class="lbl">Gross Profit (range)</div><div class="val">${fmtMoney(grossProfit)}</div></div>
    <div class="kpi-card"><div class="lbl">Our Profit (range)</div><div class="val gold">${fmtMoney(ourProfit)}</div></div>
    <div class="kpi-card"><div class="lbl">Client Profit (range)</div><div class="val">${fmtMoney(clientProfit)}</div></div>
    <div class="kpi-card"><div class="lbl">Total Received</div><div class="val ok">${fmtMoney(totalReceived)}</div></div>
    <div class="kpi-card"><div class="lbl">Total Receivables</div><div class="val ${totalReceivable>0?'danger':''}">${fmtMoney(totalReceivable)}</div></div>
    <div class="kpi-card"><div class="lbl">Total Capital Blocked</div><div class="val">${fmtMoney(totalCapitalBlocked)}</div></div>
  </div>
  <p class="small-muted">Uses the same profit calculation logic as the Dashboard and Allotment &amp; Sale tab — figures will always match. Monthly/Yearly/Avg figures reflect the real calendar month/year (independent of the range buttons above), matching the Dashboard's Overview cards; the other figures respect the selected range and filters.</p>`;
}

function reportPlanningPerformance(){
  const totalPlanned = S.ipoPlans.length;
  const totalActual = new Set(S.applications.filter(a=>a.planId).map(a=>a.planId)).size;
  const executed = S.ipoPlans.filter(p=>planVariance(p)==='Matched').length;
  const notExecuted = S.ipoPlans.filter(p=>planVariance(p)==='Pending').length;
  const bankChanged = S.ipoPlans.filter(p=>planVariance(p)==='Bank Changed').length;
  const dateChanged = S.ipoPlans.filter(p=>planVariance(p)==='Date Changed').length;
  const dateSet = new Set(S.ipoPlans.map(p=>p.plannedDate));
  let overCapacityDays = 0, utilSum = 0, utilCount = 0;
  S.bankAccounts.forEach(b=>{ dateSet.forEach(d=>{ const cap = bankCapacity(b.id,d); if (cap.planned>0){ utilSum += cap.utilisation; utilCount++; if (cap.status==='Over Capacity') overCapacityDays++; } }); });
  const avgUtil = utilCount ? Math.round((utilSum/utilCount)*10)/10 : 0;
  return `<div class="kpi-grid">
    <div class="kpi-card"><div class="lbl">Total Planned IPO Slots</div><div class="val">${totalPlanned}</div></div>
    <div class="kpi-card"><div class="lbl">Total Actual IPO Slots</div><div class="val">${totalActual}</div></div>
    <div class="kpi-card"><div class="lbl">Plans Executed</div><div class="val ok">${executed}</div></div>
    <div class="kpi-card"><div class="lbl">Plans Not Executed</div><div class="val danger">${notExecuted}</div></div>
    <div class="kpi-card"><div class="lbl">Plans With Bank Change</div><div class="val">${bankChanged}</div></div>
    <div class="kpi-card"><div class="lbl">Plans With Date Change</div><div class="val">${dateChanged}</div></div>
    <div class="kpi-card"><div class="lbl">Over-Capacity Days</div><div class="val danger">${overCapacityDays}</div></div>
    <div class="kpi-card"><div class="lbl">Average Bank Utilisation</div><div class="val">${avgUtil}%</div></div>
  </div>`;
}

        { key:'timestamp', label:'Timestamp', render:r=>new Date(r.timestamp).toLocaleString('en-IN') },

async function addReference(){
  const input = document.getElementById('newRefInput');
  const val = input.value.trim();
  if (!val) return;
  if (!S.settings.references.includes(val)) S.settings.references.push(val);
  await saveSetting('references', S.settings.references);
  navigate('settings');
}
async function addSubReference(){
  const input = document.getElementById('newSubRefInput');

  navigate('settings');
}

  S.settings.subReferences = S.settings.subReferences.filter(r=>r!==val);

}
async function removeReference(val){

  navigate('settings');
}

function toExcelDate(str){ if(!str) return null; const d = new Date(str); if (isNaN(d)) return null; return d; }
function exportAllToExcel(){
  const wb = XLSX.utils.book_new();

  const clientsSheet = S.clients.map(c=>({ 'Client ID':c.clientId, 'Client Name':c.clientName, 'Reference':c.referenceName, 'Sub Reference':c.subReference, 'Status':c.status, 'Date Added': toExcelDate(c.createdAt) }));

  XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(plannedClientsSheet), 'Planned Clients');

  const appsSheet = S.applications.map(a=>{ const c=findClient(a.clientId), i=findIpo(a.ipoId), b=findBank(a.bankAccountId); const u=S.bankUpiIds.find(x=>x.id===a.upiId); const calc=calcAllotmentSale(a); return {

    'UPI ID':u?u.upiId:'','Amount Applied':Number(a.amountApplied)||0,'Status':a.applicationStatus,'Plan ID':a.planId||'','Allotment Status':a.allotmentStatus||'',
    'Allotment Date':toExcelDate(a.allotmentDate),'Sale Status':a.saleStatus||'','Sale Date':toExcelDate(a.saleDate),'Sale Amount':Number(a.saleAmount)||0,

function excelSerialToIso(serial){
  // Standard Excel-serial-to-calendar-date conversion, done entirely in UTC
  // math. This deliberately avoids depending on how any library constructs
  // JS Date objects internally (that ambiguity is what caused the date to
  // shift by a day) — a serial number is just a number, so there's nothing
  // to get wrong about timezone or local-vs-UTC here.
  const utcDays = Math.floor(serial - 25569); // 25569 = days between 1899-12-30 and 1970-01-01
  const d = new Date(utcDays * 86400 * 1000);
  const y = d.getUTCFullYear(), m = String(d.getUTCMonth()+1).padStart(2,'0'), day = String(d.getUTCDate()).padStart(2,'0');
  return `${y}-${m}-${day}`;
}
function parseExcelDate(val){
  if (val===null || val===undefined || val==='') return null;
  if (typeof val === 'number') return excelSerialToIso(val);
  if (val instanceof Date){
    // Fallback only — shouldn't normally be hit now that we read raw values,
    // but handled defensively in case a cell already comes through as a Date.
    if (val.getUTCHours()===0 && val.getUTCMinutes()===0 && val.getUTCSeconds()===0){
      return `${val.getUTCFullYear()}-${String(val.getUTCMonth()+1).padStart(2,'0')}-${String(val.getUTCDate()).padStart(2,'0')}`;
    }
    return `${val.getFullYear()}-${String(val.getMonth()+1).padStart(2,'0')}-${String(val.getDate()).padStart(2,'0')}`;
  }
  const s = String(val).trim();
  // dd/mm/yyyy or dd-mm-yyyy (common in India) — construct in UTC, not local time
  const dmy = s.match(/^(\d{1,2})[\/\-](\d{1,2})[\/\-](\d{4})$/);
  if (dmy) return excelSerialToIso(Math.floor((Date.UTC(Number(dmy[3]), Number(dmy[2])-1, Number(dmy[1])) - Date.UTC(1899,11,30)) / 86400000));
  // yyyy-mm-dd — extract directly rather than round-tripping through Date parsing
  const iso = s.match(/^(\d{4})-(\d{1,2})-(\d{1,2})/);
  if (iso) return `${iso[1]}-${String(iso[2]).padStart(2,'0')}-${String(iso[3]).padStart(2,'0')}`;
  return null;
}
function normalizeStatus(val, allowed){
  const s = (val||'').toString().trim();
  const hit = allowed.find(a => a.toLowerCase() === s.toLowerCase());
  return hit || null;
}

let __pendingImport = null;
function importFromExcel(file){
  if (!file) return;
  const reader = new FileReader();
  reader.onload = (e) => {
    let wb;
    try { wb = XLSX.read(e.target.result, { type:'array', cellDates:false }); }
    catch(err){ toast('Could not read this file — make sure it\'s a valid .xlsx file','danger'); return; }

    const ipoRows = wb.Sheets['IPOs'] ? XLSX.utils.sheet_to_json(wb.Sheets['IPOs'], { defval:'' }) : [];
    const appRows = wb.Sheets['Applications'] ? XLSX.utils.sheet_to_json(wb.Sheets['Applications'], { defval:'' }) : [];

    const plan = { newIpos:[], updatedIpos:[], newClients:new Set(), newBanks:new Set(), newUpis:[], newApps:[], errors:[], skippedDupes:0 };

    // ---- IPOs sheet: create new, or update dates/amount on existing (matched by name) ----
    ipoRows.forEach((row, idx) => {
      const name = (row['IPO Name']||'').toString().trim();
      if (!name || /example — delete/i.test(name)) return;
      const openDate = parseExcelDate(row['Open Date']);
      const closeDate = parseExcelDate(row['Close Date']);
      const allotmentDate = parseExcelDate(row['Allotment Date']);
      const minAmount = Number(row['Min Amount']) || 0;
      const existing = S.ipos.find(i => i.ipoName.toLowerCase() === name.toLowerCase());
      if (existing) plan.updatedIpos.push({ existing, name, minAmount, openDate, closeDate, allotmentDate });
      else plan.newIpos.push({ name, minAmount, openDate, closeDate, allotmentDate });
    });

    // ---- Applications sheet: auto-create Client/Bank/UPI by name, match IPO by name ----
    appRows.forEach((row, idx) => {
      const rowNum = idx + 2; // +2: header row + 1-indexing, matches what the user sees in Excel
      const clientName = (row['Client Name']||'').toString().trim();
      const ipoName = (row['IPO']||'').toString().trim();
      const bankName = (row['Bank']||'').toString().trim();
      if (!clientName || /example — delete/i.test(clientName)) return;
      if (!ipoName || !bankName){ plan.errors.push(`Row ${rowNum}: missing IPO or Bank name — skipped.`); return; }

      const amountApplied = Number(row['Amount Applied']) || 0;
      if (amountApplied <= 0){ plan.errors.push(`Row ${rowNum} (${clientName}): Amount Applied must be a positive number — skipped.`); return; }

      const applicationDate = parseExcelDate(row['Application Date']);
      if (!applicationDate){ plan.errors.push(`Row ${rowNum} (${clientName}): missing or invalid Application Date — skipped.`); return; }

      const allotmentStatus = normalizeStatus(row['Allotment Status'], ALLOTMENT_STATUSES) || 'Pending';
      const saleStatus = row['Sale Status'] ? normalizeStatus(row['Sale Status'], SALE_STATUSES) : null;
      if (row['Sale Status'] && !saleStatus){ plan.errors.push(`Row ${rowNum} (${clientName}): Sale Status "${row['Sale Status']}" not recognized — must be exactly "Pending to Sell" or "Sold". Left blank.`); }
      const recoveryStatus = row['Recovery Status'] ? normalizeStatus(row['Recovery Status'], RECEIVE_STATUSES) : null;
      if (row['Recovery Status'] && !recoveryStatus){ plan.errors.push(`Row ${rowNum} (${clientName}): Recovery Status "${row['Recovery Status']}" not recognized — must be exactly "Receivable" or "Received". Left blank.`); }
      const saleDate = parseExcelDate(row['Sale Date']);
      const saleAmount = row['Sale Amount']!=='' ? Number(row['Sale Amount'])||0 : null;
      const grossReceived = row['Gross Received']!=='' && row['Gross Received']!=null ? Number(row['Gross Received'])||0 : null;

      // duplicate check against records already in the portal (same rule the manual form uses)
      const existingClient = S.clients.find(c=>c.clientName.toLowerCase()===clientName.toLowerCase());
      const existingBank = S.bankAccounts.find(b=>b.bankName.toLowerCase()===bankName.toLowerCase());
      const matchedNewIpo = plan.newIpos.find(i=>i.name.toLowerCase()===ipoName.toLowerCase());
      const existingIpo = S.ipos.find(i=>i.ipoName.toLowerCase()===ipoName.toLowerCase());
      if (existingClient && existingBank && (existingIpo||matchedNewIpo)){
        const ipoRef = existingIpo ? existingIpo.id : ('NEW:'+ipoName.toLowerCase());
        const dupe = S.applications.find(a => a.clientId===existingClient.id && String(a.ipoId)===String(ipoRef) && a.bankAccountId===existingBank.id) ||
                     plan.newApps.find(a => a._clientKey===clientName.toLowerCase() && a._ipoKey===ipoName.toLowerCase() && a._bankKey===bankName.toLowerCase());
        if (dupe){ plan.skippedDupes++; return; }
      }
      if (!existingClient) plan.newClients.add(clientName);
      if (!existingBank) plan.newBanks.add(bankName);
      const upiId = (row['UPI ID']||'').toString().trim();
      if (upiId && existingBank && !bankUpis(existingBank.id).some(u=>u.upiId.toLowerCase()===upiId.toLowerCase())){
        plan.newUpis.push({ bankName, upiId });
      }

      plan.newApps.push({
        _clientKey:clientName.toLowerCase(), _ipoKey:ipoName.toLowerCase(), _bankKey:bankName.toLowerCase(),
        clientName, ipoName, bankName, upiId, applicationDate, amountApplied,
        allotmentStatus, saleStatus, saleDate, saleAmount, recoveryStatus, grossReceived, rowNum
      });
    });

    __pendingImport = plan;
    showImportPreview(plan);
  };
  reader.readAsArrayBuffer(file);
}

function showImportPreview(plan){
  const summary = `
    <div class="kpi-grid" style="margin-bottom:14px;">
      <div class="kpi-card"><div class="lbl">New IPOs</div><div class="val">${plan.newIpos.length}</div></div>
      <div class="kpi-card"><div class="lbl">IPOs to Update</div><div class="val">${plan.updatedIpos.length}</div></div>
      <div class="kpi-card"><div class="lbl">New Clients</div><div class="val">${plan.newClients.size}</div></div>

      <div class="kpi-card"><div class="lbl">Applications to Import</div><div class="val ok">${plan.newApps.length}</div></div>
      <div class="kpi-card"><div class="lbl">Duplicates Skipped</div><div class="val">${plan.skippedDupes}</div></div>

    </div>`;

  openModal('Review Import Before Committing',

}

async function commitImport(){
  const plan = __pendingImport;
  if (!plan) return;
  closeModal();

  // 1) IPOs — create new, update existing
  for (const ni of plan.newIpos){
    const ipoId = nextCode(S.ipos, 'ipoId', 'IPO');
    const rec = { ipoId, ipoName:ni.name, minimumApplicationAmount:ni.minAmount, openDate:ni.openDate, closeDate:ni.closeDate, allotmentDate:ni.allotmentDate, archiveStatus:'Active', createdAt:new Date().toISOString(), updatedAt:new Date().toISOString() };
    const newId = await putRec('ipos', rec); rec.id = newId; S.ipos.push(rec);
    await audit('IPO Imported','IPO', ipoId, null, rec);
  }
  for (const ui of plan.updatedIpos){
    const updated = { ...ui.existing, minimumApplicationAmount:ui.minAmount||ui.existing.minimumApplicationAmount, openDate:ui.openDate||ui.existing.openDate, closeDate:ui.closeDate||ui.existing.closeDate, allotmentDate:ui.allotmentDate||ui.existing.allotmentDate, updatedAt:new Date().toISOString() };
    await putRec('ipos', updated); Object.assign(ui.existing, updated);
    await audit('IPO Updated via Import','IPO', ui.existing.ipoId, ui.existing, updated);
  }

  // 2) Clients — auto-create by name
  const clientByName = {};
  S.clients.forEach(c => clientByName[c.clientName.toLowerCase()] = c);
  for (const name of plan.newClients){
    const clientId = nextCode(S.clients, 'clientId', 'CL');
    const rec = { clientId, clientName:name, referenceName:'', subReference:'', status:'Active', createdAt:new Date().toISOString(), updatedAt:new Date().toISOString() };
    const newId = await putRec('clients', rec); rec.id = newId; S.clients.push(rec);
    clientByName[name.toLowerCase()] = rec;
    await audit('Client Imported','Client', clientId, null, rec);
  }

  // 3) Banks — auto-create by name
  const bankByName = {};
  S.bankAccounts.forEach(b => bankByName[b.bankName.toLowerCase()] = b);
  for (const name of plan.newBanks){
    const bankId = nextCode(S.bankAccounts, 'bankId', 'BANK');
    const rec = { bankId, bankName:name, accountHolderName:'', status:'Active', createdAt:new Date().toISOString(), updatedAt:new Date().toISOString() };
    const newId = await putRec('bankAccounts', rec); rec.id = newId; S.bankAccounts.push(rec);
    bankByName[name.toLowerCase()] = rec;
    await audit('Bank Account Imported','BankAccount', bankId, null, rec);
  }

  // 4) UPI IDs — auto-create under the matched bank
  for (const nu of plan.newUpis){
    const bank = bankByName[nu.bankName.toLowerCase()];
    if (!bank) continue;
    const rec = { bankAccountId:bank.id, upiId:nu.upiId, createdAt:new Date().toISOString(), updatedAt:new Date().toISOString() };
    const newId = await putRec('bankUpiIds', rec); rec.id = newId; S.bankUpiIds.push(rec);
  }

  // 5) Applications — build final records, resolving IPO/Client/Bank/UPI by name
  const ipoByName = {}; S.ipos.forEach(i => ipoByName[i.ipoName.toLowerCase()] = i);
  for (const na of plan.newApps){
    const client = clientByName[na._clientKey];
    const bank = bankByName[na._bankKey];
    const ipo = ipoByName[na._ipoKey];
    if (!client || !bank || !ipo) continue; // shouldn't happen — already validated in the preview step
    const upi = na.upiId ? bankUpis(bank.id).find(u=>u.upiId.toLowerCase()===na.upiId.toLowerCase()) : null;
    const rec = {
      clientId:client.id, ipoId:ipo.id, bankAccountId:bank.id, upiId: upi?upi.id:null,
      applicationDate:na.applicationDate, amountApplied:na.amountApplied, applicationStatus:'Applied', planId:null,
      allotmentStatus:na.allotmentStatus, allotmentDate: ipo.allotmentDate || null,
      saleStatus:na.saleStatus, saleDate:na.saleDate, saleAmount:na.saleAmount,
      calculatedGrossReceived:null, grossReceived:na.grossReceived, grossReceivedOverridden: na.grossReceived!=null,
      calculatedOurProfit:null, ourProfit:null, ourProfitOverridden:false,
      calculatedClientProfit:null, clientProfit:null, clientProfitOverridden:false,
      amountReceiveStatus:na.recoveryStatus,
      overrideReason: na.grossReceived!=null ? 'Set via Excel import' : null,
      overrideChangedAt: na.grossReceived!=null ? new Date().toISOString() : null,
      createdAt:new Date().toISOString(), updatedAt:new Date().toISOString()
    };
    const newId = await putRec('applications', rec); rec.id = newId; S.applications.push(rec);
  }
  await audit('Bulk Import','Applications', null, null, { count: plan.newApps.length });

  __pendingImport = null;
  toast(`Imported ${plan.newApps.length} application(s)`,'ok');
  if (typeof scheduleSync === 'function') scheduleSync();
  navigate('dashboard');
}

function localBackupDownload(){

  const url = URL.createObjectURL(blob);
  const a = document.createElement('a'); a.href = url; a.download = `ipo_portal_backup_${todayStr()}.json`; a.click();
  URL.revokeObjectURL(url);

async function restoreSnapshot(data){
  for (const [store, keyPath] of Object.entries(STORES)){
    if (store === 'settings') continue;
    await clearStore(store);
    const arr = data[store] || [];
    for (const rec of arr) await putRec(store, rec);
  }
  if (data.settings){
    for (const [k,v] of Object.entries(data.settings)) await saveSetting(k, v);
  }
  await loadAll();
}
function localBackupRestore(file){
  if (!file) return;
  const reader = new FileReader();
  reader.onload = (e) => {
    let data;
    try { data = JSON.parse(e.target.result); }
    catch(err){ toast('Invalid backup file — not valid JSON','danger'); return; }
    const counts = ['clients','bankAccounts','ipos','ipoPlans','applications'].map(k =>
      `${(data[k]||[]).length} ${k}`).join(', ');
    openModal('Restore Backup?',
      `<p style="font-size:13px;line-height:1.6;">
         <b>&#9888; Restoring this backup may replace current portal data.</b><br><br>
         <b>Backup date:</b> ${data.exportedAt ? fmtDate(data.exportedAt) : 'Unknown'}<br>
         <b>Data version:</b> ${data.version ?? 'Unknown'}<br>
         <b>Contains:</b> ${counts || 'No records found'}
       </p>`,
      `<button class="btn btn-ghost" onclick="closeModal()">Cancel</button>
       <button class="btn btn-danger" id="confirmRestoreBtn">Restore This Backup</button>`);
    document.getElementById('confirmRestoreBtn').onclick = async () => {
      closeModal();
      try {
        await restoreSnapshot(data);
        await saveSetting('lastRestore', new Date().toISOString());
        toast('Backup restored','ok');
        navigate('dashboard');
      } catch(err){ toast('Restore failed: ' + (err.message||err),'danger'); }
    };
  };
  reader.readAsText(file);
}

const DRIVE_FOLDER_NAME = 'IPO Management Portal';
const DRIVE_FILE_NAME = 'ipo_management_portal_data.json';
const DRIVE_SCOPE = 'https://www.googleapis.com/auth/drive.file';

window.__drive = {
  signedIn: false, email: null, accessToken: null,
  folderId: null, fileId: null, remoteModifiedTime: null,
  status: 'idle', // idle | saving | syncing | offline | conflict | error | denied
  pendingChanges: false, syncTimer: null, pollTimer: null
};

function loadGis(){
  return new Promise((resolve) => {
    if (window.google && window.google.accounts) return resolve();
    const s = document.createElement('script');
    s.src = 'https://accounts.google.com/gsi/client';
    s.onload = resolve;
    s.onerror = resolve;
    document.head.appendChild(s);
  });
}
function setDriveStatus(status){
  window.__drive.status = status;
  renderSyncIndicator();
  if (S.view === 'settings') { const b = document.getElementById('contentSettingsRerenderHook'); if (b) navigate('settings'); }
}
function renderSyncIndicator(){
  const el = document.getElementById('syncIndicator');
  if (!el) return;
  const labels = {
    idle: window.__drive.signedIn ? 'Saved to Google Drive' : '',
    saving: 'Saving...', syncing: 'Syncing...', offline: 'Offline — changes will sync when connection is restored',
    conflict: 'Data updated elsewhere — refresh to continue', error: 'Sync failed — Retry', denied: 'Access Denied'
  };
  const text = labels[window.__drive.status] || '';
  el.textContent = text;
  el.style.display = text ? 'inline-block' : 'none';
  el.className = 'badge ' + ({idle:'green',saving:'gold',syncing:'gold',offline:'gray',conflict:'red',error:'red',denied:'red'}[window.__drive.status] || 'gray');
  el.onclick = (window.__drive.status==='error') ? syncToDrive : (window.__drive.status==='conflict' ? refreshFromDrive : null);
  el.style.cursor = el.onclick ? 'pointer' : 'default';
}

/* ---- centralized sync trigger: called after every real data mutation via audit() ---- */
function scheduleSync(){
  if (!window.__drive.signedIn) return;
  window.__drive.pendingChanges = true;
  if (!navigator.onLine){ setDriveStatus('offline'); return; }
  setDriveStatus('saving');
  if (window.__drive.syncTimer) clearTimeout(window.__drive.syncTimer);
  window.__drive.syncTimer = setTimeout(() => { syncToDrive(); }, 1200);
}
window.addEventListener('online', () => { if (window.__drive.signedIn && window.__drive.pendingChanges) syncToDrive(); });
window.addEventListener('offline', () => { if (window.__drive.signedIn) setDriveStatus('offline'); });

async function driveConnect(){
  await loadGis();
  if (!window.google || !window.google.accounts){ toast('Could not load Google Identity Services (check network/connectivity)','danger'); return; }
  await loadGoogleClientId();
  const clientId = S.settings.driveClientId;
  if (!clientId){ toast('Enter a Google OAuth Client ID in Settings first','warn'); return; }
  requestDriveToken(clientId, false);
}
async function loadGoogleClientId(){ /* placeholder for symmetry — client id comes from Settings input */ }

/* silent=true is used for auto-reconnect on page load / device switch: no popups, fails quietly */
function requestDriveToken(clientId, silent){
  const tokenClient = google.accounts.oauth2.initTokenClient({
    client_id: clientId,
    scope: DRIVE_SCOPE + ' https://www.googleapis.com/auth/userinfo.email',
    callback: async (resp) => {
      if (!resp || !resp.access_token){
        if (!silent) toast('Google Drive connection failed','danger');
        return;
      }
      window.__drive.accessToken = resp.access_token;
      await driveVerifyAndBootstrap(silent);
    },
    error_callback: () => { /* silent auto-reconnect failed (e.g. needs interaction) — user can click Connect manually */ }
  });
  tokenClient.requestAccessToken(silent ? { prompt: 'none' } : {});
}

/* Called once on every page load. If this device previously connected to Drive,
   try to silently re-establish the session so the user doesn't have to click
   "Connect Google Drive" every single time they open the app on a device. */
async function driveAutoReconnect(){
  try {
    const clientId = S.settings.driveClientId;
    const knownEmail = S.settings.driveConnectedEmail;
    if (!clientId || !knownEmail) return;
    await loadGis();
    if (!window.google || !window.google.accounts) return;
    requestDriveToken(clientId, true);
  } catch(err){ /* silent — user can always connect manually from Settings */ }
}

async function driveVerifyAndBootstrap(silent){
  try {
    const res = await fetch('https://www.googleapis.com/oauth2/v3/userinfo', { headers: { Authorization: `Bearer ${window.__drive.accessToken}` } });
    const info = await res.json();
    const email = (info.email || '').toLowerCase();
    const authorized = (S.settings.authorizedEmail || '').toLowerCase();
    if (authorized && email !== authorized){
      setDriveStatus('denied');
      if (!silent){
        openModal('Access Denied',
          `<p style="font-size:13px;">Access Denied — This Google account is not authorized to use the IPO Management Portal.</p>
           <p class="small-muted">Signed in as ${escapeHtml(info.email||'')}. Authorized account: ${escapeHtml(S.settings.authorizedEmail)}.</p>`,
          `<button class="btn btn-primary" onclick="closeModal()">OK</button>`);
      }
      window.__drive.accessToken = null;
      window.__drive.signedIn = false;
      return;
    }
    if (!authorized){ await saveSetting('authorizedEmail', email); }
    window.__drive.email = info.email;
    window.__drive.signedIn = true;
    await saveSetting('driveConnectedEmail', info.email);
    if (!silent){ toast('Google Drive connected — this account is now the authorized account for this portal','ok'); }
    await driveBootstrapFolderAndFile();
    startDrivePolling();
    if (!silent) navigate('settings');
  } catch(err){ if (!silent) toast('Google Drive sign-in failed','danger'); }
}

/* ---- cross-device auto-pull: periodically check if the Drive file changed
   elsewhere (e.g. edited on another device) and pull it in automatically ---- */
function startDrivePolling(){
  stopDrivePolling();
  window.__drive.pollTimer = setInterval(checkRemoteChanges, 20000);
  document.addEventListener('visibilitychange', onVisibilityCheckRemote);
}
function stopDrivePolling(){
  if (window.__drive.pollTimer){ clearInterval(window.__drive.pollTimer); window.__drive.pollTimer = null; }
  document.removeEventListener('visibilitychange', onVisibilityCheckRemote);
}
function onVisibilityCheckRemote(){
  if (document.visibilityState === 'visible') checkRemoteChanges();
}
async function checkRemoteChanges(){
  if (!window.__drive.signedIn || !window.__drive.fileId) return;
  if (window.__drive.pendingChanges) return; // don't pull over unsaved local edits — let the push finish first
  if (!navigator.onLine) return;
  try {
    const meta = await driveGetFileMeta(window.__drive.fileId);
    if (window.__drive.remoteModifiedTime && meta.modifiedTime !== window.__drive.remoteModifiedTime){
      await refreshFromDrive(true);
    }
  } catch(err){ /* transient network/API hiccup during background polling — ignore, next poll retries */ }
}

async function driveApi(url, opts={}){
  const res = await fetch(url, { ...opts, headers: { ...(opts.headers||{}), Authorization: `Bearer ${window.__drive.accessToken}` } });
  if (!res.ok) throw new Error('Drive API error ' + res.status);
  return res;
}
async function driveFindFolder(){
  const q = encodeURIComponent(`name='${DRIVE_FOLDER_NAME}' and mimeType='application/vnd.google-apps.folder' and trashed=false`);
  const res = await driveApi(`https://www.googleapis.com/drive/v3/files?q=${q}&fields=files(id,name)`);
  const json = await res.json();
  return (json.files && json.files[0]) || null;
}
async function driveCreateFolder(){
  const res = await driveApi('https://www.googleapis.com/drive/v3/files', {
    method: 'POST', headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ name: DRIVE_FOLDER_NAME, mimeType: 'application/vnd.google-apps.folder' })
  });
  return await res.json();
}
async function driveFindFile(folderId){
  const q = encodeURIComponent(`name='${DRIVE_FILE_NAME}' and '${folderId}' in parents and trashed=false`);
  const res = await driveApi(`https://www.googleapis.com/drive/v3/files?q=${q}&fields=files(id,name,modifiedTime)`);
  const json = await res.json();
  return (json.files && json.files[0]) || null;
}
async function driveCreateFile(folderId){
  const metadata = { name: DRIVE_FILE_NAME, parents: [folderId], mimeType: 'application/json' };
  const boundary = '-------ipoportal' + Date.now();
  const body =
    `--${boundary}\r\nContent-Type: application/json; charset=UTF-8\r\n\r\n${JSON.stringify(metadata)}\r\n` +
    `--${boundary}\r\nContent-Type: application/json\r\n\r\n${JSON.stringify(snapshotData())}\r\n--${boundary}--`;
  const res = await driveApi('https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart&fields=id,modifiedTime', {
    method: 'POST', headers: { 'Content-Type': `multipart/related; boundary=${boundary}` }, body
  });
  return await res.json();
}
async function driveBootstrapFolderAndFile(){
  setDriveStatus('syncing');
  let folder = S.settings.driveFolderId ? { id: S.settings.driveFolderId } : await driveFindFolder();
  if (!folder){ folder = await driveCreateFolder(); }
  window.__drive.folderId = folder.id;
  await saveSetting('driveFolderId', folder.id);

  let file = S.settings.driveFileId ? await driveGetFileMeta(S.settings.driveFileId).catch(()=>null) : null;
  if (!file) file = await driveFindFile(folder.id);
  if (!file){ file = await driveCreateFile(folder.id); }
  window.__drive.fileId = file.id;
  window.__drive.remoteModifiedTime = file.modifiedTime || null;
  await saveSetting('driveFileId', file.id);

  await refreshFromDrive(true);
  setDriveStatus('idle');
}
async function driveGetFileMeta(fileId){
  const res = await driveApi(`https://www.googleapis.com/drive/v3/files/${fileId}?fields=id,name,modifiedTime,trashed`);
  const json = await res.json();
  if (json.trashed) throw new Error('trashed');
  return json;
}

async function syncToDrive(){
  if (!window.__drive.signedIn || !window.__drive.fileId) return;
  if (!navigator.onLine){ setDriveStatus('offline'); return; }
  setDriveStatus('syncing');
  try {
    // conflict check: has the remote file changed since we last knew about it?
    const meta = await driveGetFileMeta(window.__drive.fileId);
    if (window.__drive.remoteModifiedTime && meta.modifiedTime !== window.__drive.remoteModifiedTime){
      setDriveStatus('conflict');
      toast('Data was updated from another device. Please refresh the latest data before continuing.','warn');
      return;
    }
    const res = await driveApi(`https://www.googleapis.com/upload/drive/v3/files/${window.__drive.fileId}?uploadType=media&fields=id,modifiedTime`, {
      method: 'PATCH', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(snapshotData())
    });
    const json = await res.json();
    window.__drive.remoteModifiedTime = json.modifiedTime || meta.modifiedTime;
    window.__drive.pendingChanges = false;
    await saveSetting('lastSynced', new Date().toISOString());
    setDriveStatus('idle');
  } catch(err){
    setDriveStatus('error');
  }
}
async function refreshFromDrive(silent){
  if (!window.__drive.signedIn || !window.__drive.fileId){ toast('Connect Google Drive first','warn'); return; }
  const doRefresh = async () => {
    setDriveStatus('syncing');
    try {
      const meta = await driveGetFileMeta(window.__drive.fileId);
      const res = await driveApi(`https://www.googleapis.com/drive/v3/files/${window.__drive.fileId}?alt=media`);
      const data = await res.json();
      await restoreSnapshot(data);
      window.__drive.remoteModifiedTime = meta.modifiedTime;
      window.__drive.pendingChanges = false;
      await saveSetting('lastSynced', new Date().toISOString());
      setDriveStatus('idle');
      if (!silent){ toast('Refreshed from Google Drive','ok'); navigate('dashboard'); }
    } catch(err){ setDriveStatus('error'); if (!silent) toast('Could not refresh from Google Drive','danger'); }
  };
  if (silent) { await doRefresh(); return; }
  confirmAction('This will replace your local working copy with the latest data from Google Drive. Continue?', doRefresh);
}
function driveSignOut(){
  stopDrivePolling();
  window.__drive.signedIn = false;
  window.__drive.accessToken = null;
  window.__drive.email = null;
  setDriveStatus('idle');
  const el = document.getElementById('syncIndicator'); if (el) el.style.display = 'none';
  toast('Signed out of Google Drive. Your data on Drive has not been changed.','ok');
  navigate('settings');
}
async function saveDriveConfig(){
  await saveSetting('driveClientId', document.getElementById('driveClientId').value.trim());
  toast('Google Drive configuration saved','ok');
}
</script>
<script>
/* =================== APPEARANCE / THEME =================== */
function resolveTheme(pref){
  if (pref === 'dark') return 'dark';
  if (pref === 'light') return 'light';
  // 'system' (or unset): follow the OS/browser preference
  return (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) ? 'dark' : 'light';
}
function applyTheme(){
  const pref = (S.settings && S.settings.theme) || 'light';
  document.documentElement.setAttribute('data-theme', resolveTheme(pref));
}
async function setTheme(pref){
  await saveSetting('theme', pref);
  applyTheme();
  navigate('settings');
}
if (window.matchMedia){
  window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', () => {
    if (S.settings && S.settings.theme === 'system') applyTheme();
  });
}
</script>
<script>
/* =================== APP LOCK =================== */
/* Honest limitation: this is a UI-level lock only. All portal data still lives
   unencrypted in this browser's IndexedDB — a technically savvy person with
   access to this device and its browser storage could still read it directly.
   This lock deters casual access (someone picking up an unlocked phone), it is
   not encryption-at-rest and cannot be, in a purely static, serverless app. */
window.__appLock = { locked:false, timer:null };

async function sha256Hex(str){
  const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(str));
  return Array.from(new Uint8Array(buf)).map(b=>b.toString(16).padStart(2,'0')).join('');
}

function armAutoLock(){
  if (window.__appLock.timer) clearTimeout(window.__appLock.timer);
  const mins = Number(S.settings.autoLockMinutes) || 0;
  if (!S.settings.appLockEnabled || !S.settings.appLockPin || !mins) return;
  window.__appLock.timer = setTimeout(triggerAppLock, mins * 60000);
}
function triggerAppLock(){
  if (!S.settings.appLockEnabled || !S.settings.appLockPin) return;
  window.__appLock.locked = true;
  document.getElementById('appLockOverlay').style.display = 'block';
  document.getElementById('lockPinInput').value = '';
  document.getElementById('lockError').textContent = '';
  setTimeout(()=>document.getElementById('lockPinInput').focus(), 50);
}
async function tryUnlockApp(){
  const val = document.getElementById('lockPinInput').value;
  const hash = await sha256Hex(val);
  if (hash === S.settings.appLockPin){
    window.__appLock.locked = false;
    document.getElementById('appLockOverlay').style.display = 'none';
    armAutoLock();
  } else {
    document.getElementById('lockError').textContent = 'Incorrect PIN. Try again.';
    document.getElementById('lockPinInput').value = '';
  }
}
['click','keydown','touchstart'].forEach(ev => document.addEventListener(ev, () => { if (!window.__appLock.locked) armAutoLock(); }));

async function setupAppLock(){
  const pin = document.getElementById('newLockPin').value;
  const confirm = document.getElementById('newLockPinConfirm').value;
  if (!/^\d{4,8}$/.test(pin)){ toast('PIN must be 4-8 digits','warn'); return; }
  if (pin !== confirm){ toast('PINs do not match','warn'); return; }
  const hash = await sha256Hex(pin);
  await saveSetting('appLockPin', hash);
  await saveSetting('appLockEnabled', true);
  if (!S.settings.autoLockMinutes) await saveSetting('autoLockMinutes', 5);
  toast('App Lock enabled','ok');
  armAutoLock();
  navigate('settings');
}
async function disableAppLock(){
  confirmAction('Turn off App Lock? This portal contains client and financial data — anyone with access to this device would be able to open it without a PIN.', async () => {
    await saveSetting('appLockEnabled', false);
    await saveSetting('appLockPin', null);
    if (window.__appLock.timer) clearTimeout(window.__appLock.timer);
    toast('App Lock disabled','ok');
    navigate('settings');
  });
}
async function setAutoLockMinutes(mins){
  await saveSetting('autoLockMinutes', Number(mins));
  armAutoLock();
}
</script>
<script>
/* =================== INIT =================== */
async function init(){
  // Register the service worker so Chrome recognizes this as a real installable
  // app. Registration failing (e.g. sw.js missing from the deployment) isn't
  // fatal to the app itself — it just means "Install" won't appear and you'll
  // still see "Create shortcut" instead, so this is wrapped defensively.
  if ('serviceWorker' in navigator){
    navigator.serviceWorker.register('./sw.js').catch(err => console.warn('Service worker registration failed — Install option may not appear:', err));
  }
  try {
    await openDB();
    await loadAll();
    applyTheme();
    renderNav();
    navigate('dashboard');
    renderSyncIndicator();
    if (!navigator.onLine) setDriveStatus('offline');
    driveAutoReconnect(); // silent — reconnects this device to Drive and starts cross-device auto-sync if previously connected
    if (S.settings.appLockEnabled && S.settings.appLockPin){ triggerAppLock(); } else { armAutoLock(); }
    renderNotifBadge();
    maybeFireBrowserNotifications();
  } catch(err){
    console.error('Portal failed to initialize:', err);
    document.getElementById('content').innerHTML =
      `<div class="section-card"><div class="sc-body">
         <h3 style="color:var(--danger);margin-top:0;">The portal failed to load</h3>
         <p style="font-size:13px;">${escapeHtml(err && err.message ? err.message : String(err))}</p>
         <p class="small-muted">Try reloading the page. If this keeps happening, your browser may have an older cached copy of the local database — clearing this site's storage (Application → IndexedDB → ipoPortalDB → Delete, in browser dev tools) and reloading will rebuild it from scratch.</p>
       </div></div>`;
  }
}
window.addEventListener('error', (e) => {
  const c = document.getElementById('content');
  if (c && !c.innerHTML.trim()) {
    c.innerHTML = `<div class="section-card"><div class="sc-body"><h3 style="color:var(--danger);margin-top:0;">Something went wrong</h3><p style="font-size:13px;">${escapeHtml(e.message||'Unknown error')}</p></div></div>`;
  }
});
init();
</script>
