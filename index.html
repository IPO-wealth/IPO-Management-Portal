/* ---------- 14. Listing & GMP analysis ---------- */
let listingState = { cat:'' };
function setListing(k, v){ listingState[k] = v; render(); }
function ipoGmpPct(i){ return (Number(i.issuePrice)>0 && i.gmp!=null && i.gmp!=='') ? Number(i.gmp)/Number(i.issuePrice)*100 : null; }
function ipoListingGainPct(i){ return (Number(i.issuePrice)>0 && i.listingPrice!=null && i.listingPrice!=='') ? (Number(i.listingPrice)-Number(i.issuePrice))/Number(i.issuePrice)*100 : null; }
function ipoGainPerLot(i){ return (Number(i.lotSize)>0 && ipoListingGainPct(i)!=null) ? (Number(i.listingPrice)-Number(i.issuePrice))*Number(i.lotSize) : null; }
function pearson(xs, ys){
  const n = xs.length; if (n < 3) return null;
  const mx = xs.reduce((a,b)=>a+b,0)/n, my = ys.reduce((a,b)=>a+b,0)/n;
  let sxy=0, sxx=0, syy=0; for (let k=0;k<n;k++){ sxy+=(xs[k]-mx)*(ys[k]-my); sxx+=(xs[k]-mx)**2; syy+=(ys[k]-my)**2; }
  return (sxx && syy) ? sxy/Math.sqrt(sxx*syy) : null;
}
function reportListing(){
  const list = S.ipos.filter(i => (!listingState.cat || i.category===listingState.cat) && (i.issuePrice || i.gmp!=null || i.listingPrice!=null));
  const f1 = v => v==null ? '—' : v.toFixed(1);
  const rows = list.slice().sort((a,b)=>(b.openDate||'').localeCompare(a.openDate||'')).map(i=>{
    const st = ipoStats(i.id), gp = ipoGmpPct(i), lg = ipoListingGainPct(i), lot = ipoGainPerLot(i);
    const gmpErr = (lg!=null && gp!=null) ? lg - gp : null;
    return { i, gp, lg, lot, gmpErr, allotted: st.allotted.length, profit: st.profit, perAllot: st.allotted.length ? st.profit/st.allotted.length : null };
  });
  const withBoth = rows.filter(r=>r.gp!=null && r.lg!=null);
  const withListing = rows.filter(r=>r.lg!=null);
  const avg = arr => arr.length ? arr.reduce((a,b)=>a+b,0)/arr.length : null;
  const corr = pearson(withBoth.map(r=>r.gp), withBoth.map(r=>r.lg));
  const corrText = corr==null ? 'Needs GMP and listing price on at least 3 IPOs' : (Math.abs(corr)>=0.7 ? 'Strong' : Math.abs(corr)>=0.4 ? 'Moderate' : 'Weak') + (corr>=0?' — higher GMP usually meant a higher listing gain':' — GMP pointed the wrong way');
  // does GMP predict YOUR profit? bucket IPOs by GMP %
  const buckets = [['Below 0%',-1e9,0],['0% – 10%',0,10],['10% – 25%',10,25],['25% and above',25,1e9]].map(([label,lo,hi])=>{
    const rs = rows.filter(r=>r.gp!=null && r.gp>=lo && r.gp<hi);
    const al = rs.reduce((s,r)=>s+r.allotted,0), pr = rs.reduce((s,r)=>s+r.profit,0);
    return `<tr><td>${label}</td><td>${rs.length}</td><td>${f1(avg(rs.filter(r=>r.lg!=null).map(r=>r.lg)))}${rs.some(r=>r.lg!=null)?'%':''}</td><td>${al}</td><td>${fmtMoney(pr)}</td><td>${al?fmtMoney(pr/al):'—'}</td></tr>`;
  }).join('');
  const body = rows.map(r=>`<tr>
    ${dcell(r.i.ipoName+' — all applications', S.applications.filter(a=>a.ipoId===r.i.id), escapeHtml(r.i.ipoName))}<td>${escapeHtml(r.i.category||'—')}</td>
    <td>${r.i.issuePrice?fmtMoney(r.i.issuePrice):'—'}</td><td>${r.i.lotSize||'—'}</td>
    <td>${r.i.gmp!=null?fmtMoney(r.i.gmp):'—'}</td><td>${f1(r.gp)}${r.gp!=null?'%':''}</td>
    <td>${r.i.listingDate?fmtDate(r.i.listingDate):'—'}</td><td>${r.i.listingPrice!=null?fmtMoney(r.i.listingPrice):'—'}</td>
    <td>${r.lg==null?'—':`<b class="${r.lg>=0?'ok':'danger'}">${r.lg.toFixed(1)}%</b>`}</td>
    <td>${r.lot==null?'—':`<span class="${r.lot>=0?'ok':'danger'}">${fmtMoney(r.lot)}</span>`}</td>
    <td>${r.gmpErr==null?'—':(r.gmpErr>=0?'+':'')+r.gmpErr.toFixed(1)+' pts'}</td>
    <td>${r.allotted}</td><td><span class="${r.profit<0?'danger':''}">${fmtMoney(r.profit)}</span>${r.profit<0?' <span class="badge red">Loss</span>':''}</td></tr>`).join('') || `<tr><td colspan="13" class="small-muted">No IPOs have price details yet. Open an IPO → Edit and fill in Issue Price, GMP, Listing Price etc.</td></tr>`;
  return `
  <div class="section-card">
    <div class="sc-head"><h3>Listing &amp; GMP Analysis</h3></div>
    <div class="sc-body">
      <div style="display:flex;flex-wrap:wrap;gap:12px;align-items:flex-end;margin-bottom:14px;">
        <div class="f-group"><label>Category</label><select onchange="setListing('cat', this.value)">
          ${['','Mainboard','SME'].map(c=>`<option value="${c}" ${listingState.cat===c?'selected':''}>${c||'All'}</option>`).join('')}</select></div>
      </div>
      <div class="kpi-grid" style="margin-bottom:14px;">
        <div class="kpi-card"><div class="lbl">IPOs With Listing Data</div><div class="val">${withListing.length}</div></div>
        <div class="kpi-card"><div class="lbl">Avg Listing Gain</div><div class="val gold">${withListing.length?f1(avg(withListing.map(r=>r.lg)))+'%':'—'}</div></div>
        <div class="kpi-card"><div class="lbl">Listed Above Issue Price</div><div class="val ok">${withListing.length?Math.round(withListing.filter(r=>r.lg>0).length/withListing.length*100)+'%':'—'}</div></div>
        <div class="kpi-card"><div class="lbl">Avg GMP Miss</div><div class="val">${withBoth.length?f1(avg(withBoth.map(r=>Math.abs(r.gmpErr))))+' pts':'—'}</div></div>
        <div class="kpi-card"><div class="lbl">Loss-Making IPOs (yours)</div><div class="val danger">${rows.filter(r=>r.profit<0).length}</div></div>
      </div>
      <p style="font-size:13px;margin:0 0 14px;"><b>Does GMP predict listing gain?</b> ${corrText}.</p>
      <div class="table-wrap"><table class="dt"><thead><tr>
        <th>IPO</th><th>Category</th><th>Issue Price</th><th>Lot Size</th><th>GMP</th><th>GMP %</th><th>Listing Date</th><th>Listing Price</th><th>Listing Gain %</th><th>Gain / Lot</th><th>Actual − GMP</th><th>Your Allotments</th><th>Your Profit</th>
      </tr></thead><tbody>${body}</tbody></table></div>
      <h4 style="margin:18px 0 8px;">Your results by GMP level</h4>
      <div class="table-wrap"><table class="dt"><thead><tr><th>GMP was…</th><th>IPOs</th><th>Avg Listing Gain</th><th>Your Allotments</th><th>Your Profit</th><th>Profit / Allotment</th></tr></thead><tbody>${buckets}</tbody></table></div>
      <p class="hint">GMP % = GMP ÷ issue price. Listing Gain % = (listing price − issue price) ÷ issue price. "Actual − GMP" shows how far the real listing gain was above (+) or below (−) what the GMP suggested. With only a few IPOs the patterns can be luck — they get more useful as you fill in more.</p>
    </div>
  </div>`;
}

/* ---- Settlement by Reference ----
   For a chosen period (by SALE date): each Reference → Sub-Reference (→ client) with how much was sold, the total profit,
   our share vs the clients' share, and how much of the money owed to you has been collected vs is still receivable.
   Uses each application's own profit share % (so a changed split is respected) and any manual overrides. */
let settleState = { preset:'thisMonth', from:'', to:'', ref:'', showClients:false };
function setSettle(k, v){ settleState[k] = v; render(); }
function settlementData(){
  const r = presetRange(settleState.preset === 'all' ? 'all' : settleState.preset, settleState.from, settleState.to);
  const refs = new Map(); // ref -> { subs: Map(sub -> { clients: Map(clientId -> row) }) }
  const blank = () => ({ sales:0, applied:0, saleAmt:0, our:0, client:0, collected:0, pending:0, apps:[], pApps:[] });
  const add = (row, a, c) => {
    row.apps.push(a); row.sales++; row.applied += Number(a.amountApplied)||0; row.saleAmt += Number(a.saleAmount)||0;
    row.our += c.ourFinal; row.client += c.clientFinal;
    if (a.amountReceiveStatus === 'Received') row.collected += c.grossFinal;
    else if (a.amountReceiveStatus === 'Receivable'){ row.pending += c.grossFinal; row.pApps.push(a); }
  };
  S.applications.forEach(a=>{
    if (a.saleStatus !== 'Sold' || !a.saleDate || !inRange(a.saleDate, r)) return;
    const c = calcAllotmentSale(a); if (!c.applicable) return;
    const cl = findClient(a.clientId); if (!cl) return;
    const ref = cl.referenceName || '(No Reference)', sub = cl.subReference || '(No Sub-Reference)';
    if (settleState.ref && ref !== settleState.ref) return;
    if (!refs.has(ref)) refs.set(ref, { total: blank(), subs: new Map() });
    const R = refs.get(ref);
    if (!R.subs.has(sub)) R.subs.set(sub, { total: blank(), clients: new Map() });
    const SB = R.subs.get(sub);
    if (!SB.clients.has(cl.id)) SB.clients.set(cl.id, { name: cl.clientName, ...blank() });
    add(R.total, a, c); add(SB.total, a, c); add(SB.clients.get(cl.id), a, c);
  });
  return { r, refs };
}
function reportSettlement(){
  const { r, refs } = settlementData();
  const presets = [['thisMonth','This Month'],['prevMonth','Last Month'],['thisFY','Current FY'],['prevFY','Previous FY'],['all','All Time'],['custom','Custom']];
  const presetBtns = presets.map(([k,l])=>`<button class="btn btn-sm ${settleState.preset===k?'btn-primary':'btn-ghost'}" onclick="setSettle('preset','${k}')">${l}</button>`).join('');
  const allRefs = Array.from(new Set(S.clients.map(c=>c.referenceName||'(No Reference)'))).sort();
  const grand = { sales:0, applied:0, saleAmt:0, our:0, client:0, collected:0, pending:0, apps:[], pApps:[] };
  refs.forEach(R=>{ ['sales','applied','saleAmt','our','client','collected','pending'].forEach(k=>grand[k]+=R.total[k]); grand.apps.push(...R.total.apps); grand.pApps.push(...R.total.pApps); });
  const effPct = t => { const tot = t.our + t.client; return tot ? (t.our/tot*100).toFixed(1)+'%' : '—'; };
  const cells = (t, bold, label) => `${dcell((label||'All')+' — sales', t.apps, t.sales)}<td>${fmtMoney(t.applied)}</td><td>${fmtMoney(t.saleAmt)}</td><td>${fmtMoney(t.our+t.client)}</td>
      <td>${bold?'<b>':''}${fmtMoney(t.our)}${bold?'</b>':''}</td><td>${fmtMoney(t.client)}</td><td>${effPct(t)}</td><td>${fmtMoney(t.collected)}</td>${dcell((label||'All')+' — still to collect', t.pApps, `<span class="${t.pending>0?'danger':''}">${fmtMoney(t.pending)}</span>`)}`;
  let body = '';
  Array.from(refs.entries()).sort((a,b)=>b[1].total.our - a[1].total.our).forEach(([ref, R])=>{
    body += `<tr style="background:var(--table-head-bg);font-weight:700;"><td>${escapeHtml(ref)}</td>${cells(R.total, true, ref)}</tr>`;
    Array.from(R.subs.entries()).sort((a,b)=>b[1].total.our - a[1].total.our).forEach(([sub, SB])=>{
      body += `<tr><td style="padding-left:22px;">${escapeHtml(sub)}</td>${cells(SB.total, false, ref+' › '+sub)}</tr>`;
      if (settleState.showClients){
        Array.from(SB.clients.values()).sort((a,b)=>b.our-a.our).forEach(cl=>{
          body += `<tr class="small-muted"><td style="padding-left:44px;">${escapeHtml(cl.name)}</td>${cells(cl, false, cl.name)}</tr>`;
        });
      }
    });
  });
  body = body || `<tr><td colspan="10" class="small-muted">No completed sales in this period${settleState.ref?' for this reference':''}.</td></tr>`;
  const foot = refs.size ? `<tr style="font-weight:700;border-top:2px solid var(--border);"><td>TOTAL</td>${cells(grand, true, 'All references')}</tr>` : '';
  return `
  <div class="section-card printable-report">
    <div class="sc-head"><h3>Settlement by Reference</h3><div class="spacer"></div>
      <button class="btn btn-ghost btn-sm no-print" onclick="exportSettlement()">Download Excel</button>
      <button class="btn btn-primary btn-sm no-print" onclick="window.print()">Print / Save as PDF</button></div>
    <div class="sc-body">
      <div class="no-print" style="display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:12px;">
        ${presetBtns}
        ${settleState.preset==='custom' ? `<input type="date" value="${settleState.from}" onchange="setSettle('from', this.value)"><span>to</span><input type="date" value="${settleState.to}" onchange="setSettle('to', this.value)">` : ''}
        <select onchange="setSettle('ref', this.value)"><option value="">All references</option>${allRefs.map(x=>`<option value="${escapeHtml(x)}" ${settleState.ref===x?'selected':''}>${escapeHtml(x)}</option>`).join('')}</select>
        <label class="checkbox-row"><input type="checkbox" ${settleState.showClients?'checked':''} onchange="setSettle('showClients', this.checked)"> Show clients</label>
      </div>
      <p style="margin:0 0 12px;font-size:13px;"><b>Period:</b> ${settleState.preset==='all'?'All time':`${fmtDate(r.from)} – ${fmtDate(r.to)}`} (sales made in this period)${settleState.ref?` · <b>Reference:</b> ${escapeHtml(settleState.ref)}`:''} · <span class="small-muted">Generated ${fmtDate(todayStr())}</span></p>
      <div class="kpi-grid" style="margin-bottom:14px;">
        <div class="kpi-card"><div class="lbl">Total Profit</div><div class="val">${fmtMoney(grand.our+grand.client)}</div></div>
        <div class="kpi-card"><div class="lbl">Our Share</div><div class="val gold">${fmtMoney(grand.our)}</div></div>
        <div class="kpi-card"><div class="lbl">Clients' Share</div><div class="val">${fmtMoney(grand.client)}</div></div>
        <div class="kpi-card"><div class="lbl">Still to Collect</div><div class="val ${grand.pending>0?'danger':''}">${fmtMoney(grand.pending)}</div></div>
      </div>
      <div class="table-wrap"><table class="dt"><thead><tr>
        <th>Reference / Sub-Reference</th><th>Sales</th><th>Applied</th><th>Sale Amount</th><th>Total Profit</th><th>Our Share</th><th>Clients' Share</th><th>Our %</th><th>Collected</th><th>Still to Collect</th>
      </tr></thead><tbody>${body}${foot}</tbody></table></div>
      <p class="hint">Total Profit = Sale Amount − Applied. It is split using each application's own profit share % (normally 50%, adjustable in Settings and per application), including any manual overrides — "Our %" shows the actual blended split. <b>Collected</b> / <b>Still to Collect</b> = the gross amount from clients marked Received / Receivable. Only completed sales (Allotted + Sold) are counted, by sale date.</p>
    </div>
  </div>`;
}
function exportSettlement(){
  const { refs } = settlementData();
  const rows = [];
  refs.forEach((R, ref)=>{
    R.subs.forEach((SB, sub)=>{
      SB.clients.forEach(cl=>rows.push({ 'Reference':ref, 'Sub Reference':sub, 'Client':cl.name, 'Sales':cl.sales, 'Applied':cl.applied, 'Sale Amount':cl.saleAmt, 'Total Profit':cl.our+cl.client, 'Our Share':cl.our, 'Clients Share':cl.client, 'Collected':cl.collected, 'Still to Collect':cl.pending }));
    });
  });
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(rows), 'Settlement');
  XLSX.writeFile(wb, `Settlement_${settleState.preset}_${todayStr()}.xlsx`);
}

/* ---- Allotment-rate analysis ----
   Answers "where do my allotments actually come from?" by grouping applications on any one dimension
   (bank, UPI, reference, sub-reference, client, IPO, amount, month) and showing the allotment rate.
   Rate = Allotted ÷ (Allotted + Not Allotted), i.e. only applications whose result is already out —
   Pending ones are shown separately so they never drag the rate down. Cancelled / failed applications are ignored. */
let allotRate = { dim:'bank', from:'', to:'', minDecided:1 };
const ALLOT_DIMS = {
  bank:   { label:'Bank',            key:a=>{ const b=findBank(a.bankAccountId); return b?b.bankName:'(unknown bank)'; } },
  upi:    { label:'UPI ID',          key:a=>{ const u=S.bankUpiIds.find(x=>x.id===a.upiId); const b=findBank(a.bankAccountId); return u ? `${u.upiId}${b?' ('+b.bankName+')':''}` : '(no UPI recorded)'; } },
  ref:    { label:'Reference',       key:a=>{ const c=findClient(a.clientId); return (c&&c.referenceName)||'(no reference)'; } },
  subref: { label:'Sub-Reference',   key:a=>{ const c=findClient(a.clientId); return (c&&c.subReference)||'(no sub-reference)'; } },
  client: { label:'Client',          key:a=>{ const c=findClient(a.clientId); return c?c.clientName:'(unknown client)'; } },
  ipo:    { label:'IPO',             key:a=>{ const i=findIpo(a.ipoId); return i?i.ipoName:'(unknown IPO)'; } },
  amount: { label:'Application Amount', key:a=>{ const n=Number(a.amountApplied)||0; return n<=15000?'Up to ₹15,000':n<=50000?'₹15,001 – ₹50,000':n<=100000?'₹50,001 – ₹1,00,000':'Above ₹1,00,000'; } },
  month:  { label:'Application Month', key:a=>(a.applicationDate||'').slice(0,7)||'(no date)' }
};
function setAllotRate(k, v){ allotRate[k] = (k==='minDecided') ? Math.max(1, Math.floor(Number(v))||1) : v; render(); }
function allotRateRows(){
  const dim = ALLOT_DIMS[allotRate.dim] || ALLOT_DIMS.bank;
  const groups = new Map();
  S.applications.forEach(a=>{
    if (!isLiveApp(a)) return;
    if (allotRate.from && (!a.applicationDate || a.applicationDate < allotRate.from)) return;
    if (allotRate.to && (!a.applicationDate || a.applicationDate > allotRate.to)) return;
    const k = dim.key(a);
    if (!groups.has(k)) groups.set(k, { name:k, total:0, allotted:0, notAllotted:0, pending:0, amount:0, profit:0, apps:[] });
    const g = groups.get(k);
    g.apps.push(a);
    g.total++; g.amount += Number(a.amountApplied)||0;
    if (a.allotmentStatus==='Allotted') g.allotted++;
    else if (a.allotmentStatus==='Not Allotted') g.notAllotted++;
    else g.pending++;
    const c = calcAllotmentSale(a); if (c.applicable) g.profit += c.ourFinal;
  });
  const rows = Array.from(groups.values()).map(g=>({ ...g, decided: g.allotted+g.notAllotted, rate: (g.allotted+g.notAllotted) ? g.allotted/(g.allotted+g.notAllotted)*100 : null }));
  return rows;
}
function reportAllotmentRate(){
  const all = allotRateRows();
  const totAllotted = all.reduce((s,r)=>s+r.allotted,0), totDecided = all.reduce((s,r)=>s+r.decided,0), totPending = all.reduce((s,r)=>s+r.pending,0);
  const overall = totDecided ? totAllotted/totDecided*100 : 0;
  const rows = all.filter(r=>r.decided >= allotRate.minDecided)
    .sort((a,b)=> (b.rate ?? -1) - (a.rate ?? -1) || b.decided - a.decided);
  window.__allotRateExport = rows;
  const dimOpts = Object.entries(ALLOT_DIMS).map(([k,d])=>`<option value="${k}" ${allotRate.dim===k?'selected':''}>${d.label}</option>`).join('');
  const body = rows.map(r=>{
    const cls = r.rate==null ? '' : (r.rate >= overall ? 'ok' : 'danger');
    const bar = r.rate==null ? '' : `<div style="height:6px;border-radius:3px;background:var(--border);margin-top:4px;min-width:90px;"><div style="height:6px;border-radius:3px;width:${Math.min(100,r.rate).toFixed(0)}%;background:var(--${r.rate>=overall?'ok':'danger'}, #888);"></div></div>`;
    const ppa = r.decided ? fmtMoney(r.profit / r.decided) : '—';
    return `<tr>
      <td>${escapeHtml(allotRate.dim==='month' && r.name.length===7 ? new Date(r.name+'-01').toLocaleDateString('en-IN',{month:'short',year:'numeric'}) : r.name)}</td>
      ${dcell(r.name+' — applications', r.apps, r.total)}${dcell(r.name+' — allotted', r.apps.filter(a=>a.allotmentStatus==='Allotted'), r.allotted)}${dcell(r.name+' — not allotted', r.apps.filter(a=>a.allotmentStatus==='Not Allotted'), r.notAllotted)}${dcell(r.name+' — awaiting result', r.apps.filter(a=>!a.allotmentStatus||a.allotmentStatus==='Pending'), r.pending)}
      <td><b class="${cls}">${r.rate==null?'—':r.rate.toFixed(1)+'%'}</b>${bar}</td>
      <td>${fmtMoney(r.amount)}</td><td>${fmtMoney(r.profit)}</td><td>${ppa}</td></tr>`;
  }).join('') || `<tr><td colspan="9" class="small-muted">No applications with a declared result match these filters yet.</td></tr>`;
  return `
  <div class="section-card">
    <div class="sc-head"><h3>Allotment Rate Analysis</h3><div class="spacer"></div>

/* ---------- 18. Client scorecards ---------- */
let scoreState = { sort:'profit', slowDays:15, ipoId:'' };
function setScore(k, v){ scoreState[k] = (k==='slowDays') ? (Math.max(1, Math.floor(Number(v))||15)) : v; render(); }
function clientScoreData(){
  const today = todayStr();
  const base = S.applications.filter(a => isLiveApp(a) && a.applicationStatus === 'Applied');
  let allotted = 0, decided = 0, profitTot = 0, soldTot = 0;
  base.forEach(a=>{
    if (a.allotmentStatus==='Allotted'){ allotted++; decided++; } else if (a.allotmentStatus==='Not Allotted') decided++;
    const c = calcAllotmentSale(a); if (c.applicable){ profitTot += c.ourFinal; soldTot++; }
  });
  const overallRate = decided ? allotted/decided : 0, overallAvgSale = soldTot ? profitTot/soldTot : 0;
  const rows = S.clients.map(cl=>{
    const apps = base.filter(a=>a.clientId===cl.id);
    const al = apps.filter(a=>a.allotmentStatus==='Allotted'), na = apps.filter(a=>a.allotmentStatus==='Not Allotted');
    const decidedN = al.length + na.length;
    let profit = 0, soldN = 0, outAmt = 0, oldest = 0;
    const outApps = [];
    apps.forEach(a=>{
      const c = calcAllotmentSale(a); if (!c.applicable) return;
      profit += c.ourFinal; soldN++;
      if (a.amountReceiveStatus === 'Receivable'){ outAmt += c.grossFinal; outApps.push(a); if (a.saleDate) oldest = Math.max(oldest, dayDiff(a.saleDate, today)); }
    });
    const flag = !outApps.length ? 'Clear' : (oldest > scoreState.slowDays ? 'Slow payer' : 'Pending');
    // Expected profit per application: allotment rate (pulled toward the overall rate while there are few results) × typical profit per sale
    const smoothRate = (al.length + overallRate*3) / (decidedN + 3);
    const avgSale = soldN ? profit/soldN : overallAvgSale;
    const expected = smoothRate * avgSale * (flag==='Slow payer' ? 0.5 : 1);
    return { cl, apps, al, na, decidedN, rate: decidedN ? al.length/decidedN*100 : null, profit, soldN, avgPerApp: apps.length ? profit/apps.length : 0, outAmt, outApps, oldest, flag, expected, avgSale };
  });
  return { rows, overallRate, overallAvgSale, today };
}
function reportClientScorecards(){

  const sorters = { profit:(a,b)=>b.profit-a.profit, rate:(a,b)=>(b.rate??-1)-(a.rate??-1), avg:(a,b)=>b.avgPerApp-a.avgPerApp, outstanding:(a,b)=>b.outAmt-a.outAmt, apps:(a,b)=>b.apps.length-a.apps.length };

  const flagBadge = f => `<span class="badge ${f==='Clear'?'green':f==='Pending'?'gold':'red'}">${f}</span>`;
  const sortOpts = [['profit','Our profit'],['rate','Allotment rate'],['avg','Avg profit / application'],['outstanding','Outstanding amount'],['apps','Applications']].map(([k,l])=>`<option value="${k}" ${scoreState.sort===k?'selected':''}>${l}</option>`).join('');
  const body = rows.map(r=>`<tr>
    <td><a href="javascript:void(0)" onclick="openClientDetail(${r.cl.id})" style="color:var(--heading);font-weight:600;">${escapeHtml(r.cl.clientName)}</a>${r.cl.status==='Inactive'?' <span class="badge gray">Inactive</span>':''}<div class="small-muted">${escapeHtml(r.cl.referenceName||'—')}</div></td>
    ${dcell(`${r.cl.clientName} — applications`, r.apps, r.apps.length)}

    ${dcell(`${r.cl.clientName} — allotted`, r.al, r.al.length)}
    <td>${r.rate==null?'—':`<b class="${r.rate/100>=D.overallRate?'ok':'danger'}">${r.rate.toFixed(0)}%</b>`}${r.decidedN<3?' <span class="small-muted" title="Fewer than 3 results — too early to judge">·</span>':''}</td>
    <td>${fmtMoney(r.profit)}</td><td>${fmtMoney(r.avgPerApp)}</td>
    ${dcell(`${r.cl.clientName} — amount still to receive`, r.outApps, r.outAmt?fmtMoney(r.outAmt):'—')}
    <td>${r.outApps.length?`${r.oldest} days`:'—'}</td><td>${flagBadge(r.flag)}</td></tr>`).join('') || `<tr><td colspan="10" class="small-muted">No client applications yet.</td></tr>`;

  // ---- who to prioritise for the next IPO ----
  const upcoming = S.ipos.filter(i=>ipoStatus(i)!=='Closed' && (i.archiveStatus||'Active')==='Active').sort((a,b)=>(a.openDate||'').localeCompare(b.openDate||''));
  const ipoId = Number(scoreState.ipoId) || (upcoming[0] ? upcoming[0].id : null);
  let prioHtml = '<p class="small-muted">No upcoming or open IPO to plan for yet.</p>';
  if (ipoId){

      .sort((a,b)=>b.expected-a.expected).slice(0, 15);
    prioHtml = `<div style="display:flex;gap:8px;align-items:center;margin-bottom:10px;flex-wrap:wrap;"><label class="small-muted">For IPO</label>
      <select onchange="setScore('ipoId', this.value)">${upcoming.map(i=>`<option value="${i.id}" ${i.id===ipoId?'selected':''}>${escapeHtml(i.ipoName)} (${ipoStatus(i)})</option>`).join('')}</select>
      <span class="small-muted">Top ${cand.length} active clients not yet planned or applied for ${escapeHtml(ipo.ipoName)}</span></div>
      <div class="table-wrap"><table class="dt"><thead><tr><th>#</th><th>Client</th><th>Reference</th><th>Allotment Rate</th><th>Avg Profit / Sale</th><th>Expected Profit / Application</th><th>Payment</th><th>Note</th></tr></thead><tbody>
      ${cand.map((r,k)=>`<tr><td>${k+1}</td><td><a href="javascript:void(0)" onclick="openClientDetail(${r.cl.id})" style="color:var(--heading);font-weight:600;">${escapeHtml(r.cl.clientName)}</a></td><td>${escapeHtml(r.cl.referenceName||'—')}</td>
        <td>${r.rate==null?'—':r.rate.toFixed(0)+'%'} <span class="small-muted">(${r.decidedN} results)</span></td><td>${r.soldN?fmtMoney(r.avgSale):'<span class="small-muted">'+fmtMoney(r.avgSale)+' (avg)</span>'}</td>
        <td><b>${fmtMoney(r.expected)}</b></td><td>${flagBadge(r.flag)}</td><td class="small-muted">${r.decidedN<3?'Few results yet — based mostly on the overall average':(r.flag==='Slow payer'?'Ranked lower — has overdue money':'')}</td></tr>`).join('') || '<tr><td colspan="8" class="small-muted">Every active client is already planned or applied for this IPO.</td></tr>'}

  }
  return `

  </div>
  <div class="section-card">
    <div class="sc-head"><h3>Client Scorecards</h3></div>
    <div class="sc-body">
      <div style="display:flex;gap:12px;flex-wrap:wrap;align-items:flex-end;margin-bottom:12px;">
        <div class="f-group"><label>Sort by</label><select onchange="setScore('sort', this.value)">${sortOpts}</select></div>
        <div class="f-group"><label>Mark "Slow payer" after (days)</label><input type="number" min="1" step="1" value="${scoreState.slowDays}" style="width:90px;" onchange="setScore('slowDays', this.value)"></div>
      </div>
      <div class="table-wrap"><table class="dt"><thead><tr>
        <th>Client</th><th>Applications</th><th>Results</th><th>Allotted</th><th>Allotment Rate</th><th>Our Profit</th><th>Avg Profit / Application</th><th>Still to Receive</th><th>Oldest Unpaid</th><th>Payment</th>
      </tr></thead><tbody>${body}</tbody></table></div>
      <p class="hint"><b>Allotment rate</b> = allotted ÷ results declared (a dot means fewer than 3 results). Green = above your overall ${(D.overallRate*100).toFixed(0)}%. <b>Payment:</b> Clear = nothing owed; Pending = money receivable but not yet older than ${scoreState.slowDays} days; Slow payer = oldest unpaid sale is older than that. The portal records <i>whether</i> a payment was received but not <i>when</i>, so "days to pay" is measured as how long unpaid sales have been waiting. Click any count to see the records.</p>
    </div>
  </div>`;
}

/* ---------- 20. Report builder (pivot) ---------- */
let pivot = { rows:'bank', cols:'', metric:'our', basis:'applicationDate', from:'', to:'', sort:'value' };
function setPivot(k, v){ pivot[k] = v; render(); }
const PIVOT_METRICS = {
  apps:        { label:'Applications (count)',        fmt:'n', fn:L=>L.length },
  allotted:    { label:'Allotted (count)',            fmt:'n', fn:L=>L.filter(a=>a.allotmentStatus==='Allotted').length },
  notAllotted: { label:'Not Allotted (count)',        fmt:'n', fn:L=>L.filter(a=>a.allotmentStatus==='Not Allotted').length },
  pending:     { label:'Awaiting result (count)',     fmt:'n', fn:L=>L.filter(a=>!a.allotmentStatus||a.allotmentStatus==='Pending').length },
  rate:        { label:'Allotment rate (%)',          fmt:'p', fn:L=>{ const al=L.filter(a=>a.allotmentStatus==='Allotted').length, d=al+L.filter(a=>a.allotmentStatus==='Not Allotted').length; return d ? al/d*100 : null; } },
  sold:        { label:'Sold (count)',                fmt:'n', fn:L=>L.filter(a=>calcAllotmentSale(a).applicable).length },
  amount:      { label:'Amount applied (₹)',          fmt:'m', fn:L=>L.reduce((s,a)=>s+(Number(a.amountApplied)||0),0) },
  saleAmt:     { label:'Sale amount (₹)',             fmt:'m', fn:L=>L.reduce((s,a)=>s+(calcAllotmentSale(a).applicable?Number(a.saleAmount)||0:0),0) },
  gross:       { label:'Gross received (₹)',          fmt:'m', fn:L=>L.reduce((s,a)=>{ const c=calcAllotmentSale(a); return s+(c.applicable?c.grossFinal:0); },0) },
  our:         { label:'Our profit (₹)',              fmt:'m', fn:L=>L.reduce((s,a)=>{ const c=calcAllotmentSale(a); return s+(c.applicable?c.ourFinal:0); },0) },
  client:      { label:'Client profit (₹)',           fmt:'m', fn:L=>L.reduce((s,a)=>{ const c=calcAllotmentSale(a); return s+(c.applicable?c.clientFinal:0); },0) },
  avgOur:      { label:'Avg profit per sale (₹)',     fmt:'m', fn:L=>{ let t=0,n=0; L.forEach(a=>{ const c=calcAllotmentSale(a); if(c.applicable){ t+=c.ourFinal; n++; } }); return n ? t/n : null; } },
  receivable:  { label:'Still to receive (₹)',        fmt:'m', fn:L=>L.reduce((s,a)=>{ const c=calcAllotmentSale(a); return s+(c.applicable && a.amountReceiveStatus==='Receivable' ? c.grossFinal : 0); },0) }
};
function pivotDims(){
  const fyOf = d => { if (!d) return '(no date)'; const y = Number(d.slice(0,4)), m = Number(d.slice(5,7)); const s = m>=4 ? y : y-1; return `FY ${s}-${String(s+1).slice(2)}`; };
  return { ...ALLOT_DIMS,
    salemonth: { label:'Sale Month', key:a=>(a.saleStatus==='Sold' && a.saleDate) ? a.saleDate.slice(0,7) : '(not sold)', time:true },
    fy:        { label:'Financial Year (applied)', key:a=>fyOf(a.applicationDate) },
    category:  { label:'IPO Category', key:a=>{ const i=findIpo(a.ipoId); return (i&&i.category)||'(not set)'; } },
    allotstatus:{ label:'Allotment Result', key:a=>a.allotmentStatus||'Pending' },
    recovery:  { label:'Recovery Status', key:a=>a.saleStatus==='Sold' ? (a.amountReceiveStatus||'(not set)') : '(not sold)' },
    share:     { label:'Our Profit Share %', key:a=>appProfitShare(a)+'%' }
  };
}
function pivotLabel(dimKey, v){
  if ((dimKey==='month' || dimKey==='salemonth') && /^\d{4}-\d{2}$/.test(v)) return new Date(v+'-01').toLocaleDateString('en-IN',{month:'short',year:'numeric'});
  return v;
}
function pivotFormat(metric, v){
  if (v===null || v===undefined) return '—';
  const f = PIVOT_METRICS[metric].fmt;
  return f==='m' ? fmtMoney(v) : f==='p' ? v.toFixed(1)+'%' : String(Math.round(v));
}
function pivotCompute(){
  const dims = pivotDims();
  const rd = dims[pivot.rows] || dims.bank, cd = pivot.cols ? (dims[pivot.cols] || null) : null;
  const M = PIVOT_METRICS[pivot.metric] || PIVOT_METRICS.our;
  const base = S.applications.filter(a=>{
    if (!isLiveApp(a) || a.applicationStatus !== 'Applied') return false;
    const d = a[pivot.basis]; 
    if (pivot.from && (!d || d < pivot.from)) return false;
    if (pivot.to && (!d || d > pivot.to)) return false;
    return true;
  });
  const rowMap = new Map(), colTotals = new Map();
  base.forEach(a=>{
    const rk = rd.key(a), ck = cd ? cd.key(a) : '__all';
    if (!rowMap.has(rk)) rowMap.set(rk, { all:[], cells:new Map() });
    const R = rowMap.get(rk); R.all.push(a);
    if (!R.cells.has(ck)) R.cells.set(ck, []);
    R.cells.get(ck).push(a);
    if (!colTotals.has(ck)) colTotals.set(ck, []);
    colTotals.get(ck).push(a);
  });
  const isTime = (pivot.rows==='month' || pivot.rows==='salemonth' || pivot.rows==='fy');
  let rowKeys = Array.from(rowMap.keys());
  const val = L => M.fn(L);
  rowKeys.sort((a,b)=> (pivot.sort==='name' || isTime) ? String(a).localeCompare(String(b)) : ((val(rowMap.get(b).all) ?? -1e15) - (val(rowMap.get(a).all) ?? -1e15)));
  let colKeys = cd ? Array.from(colTotals.keys()) : ['__all'];
  const colTime = (pivot.cols==='month' || pivot.cols==='salemonth' || pivot.cols==='fy');
  colKeys.sort((a,b)=> colTime ? String(a).localeCompare(String(b)) : ((val(colTotals.get(b)) ?? -1e15) - (val(colTotals.get(a)) ?? -1e15)));
  const COLCAP = 14, extraCols = Math.max(0, colKeys.length - COLCAP);
  colKeys = colKeys.slice(0, COLCAP);
  return { rd, cd, M, base, rowMap, colTotals, rowKeys, colKeys, extraCols, val };
}
function reportBuilder(){
  const dims = pivotDims();
  const P = pivotCompute();
  const dimOpts = (sel, withNone) => (withNone?`<option value="" ${sel===''?'selected':''}>— none (single column) —</option>`:'') + Object.entries(dims).map(([k,d])=>`<option value="${k}" ${sel===k?'selected':''}>${d.label}</option>`).join('');
  const metricOpts = Object.entries(PIVOT_METRICS).map(([k,m])=>`<option value="${k}" ${pivot.metric===k?'selected':''}>${m.label}</option>`).join('');
  const basisOpts = [['applicationDate','Application date'],['allotmentDate','Allotment date'],['saleDate','Sale date']].map(([k,l])=>`<option value="${k}" ${pivot.basis===k?'selected':''}>${l}</option>`).join('');
  // heat shading relative to the largest cell
  let maxAbs = 0;
  P.rowKeys.forEach(rk => P.colKeys.forEach(ck => { const v = P.val(P.rowMap.get(rk).cells.get(ck) || []); if (v!=null && Math.abs(v) > maxAbs) maxAbs = Math.abs(v); }));
  const shade = v => (v==null || !maxAbs || P.M.fmt==='p') ? '' : `background:rgba(200,150,62,${(Math.min(1,Math.abs(v)/maxAbs)*0.35).toFixed(2)});`;

    const R = P.rowMap.get(rk);

    const tv = P.val(R.all);
    const ta = drillAttr(`${pivotLabel(pivot.rows, rk)}`, R.all);
    return `<tr><td>${escapeHtml(pivotLabel(pivot.rows, rk))}</td>${cells}<td ${ta?'class="clickable" '+ta:''}><b>${pivotFormat(pivot.metric, tv)}</b></td></tr>`;
  }).join('') || `<tr><td colspan="${(P.cd?P.colKeys.length:0)+2}" class="small-muted">No applications match these filters.</td></tr>`;
  const totalRow = P.rowKeys.length ? `<tr style="font-weight:700;border-top:2px solid var(--border);"><td>TOTAL</td>${P.cd ? P.colKeys.map(ck=>`<td>${pivotFormat(pivot.metric, P.val(P.colTotals.get(ck)||[]))}</td>`).join('') : ''}<td>${pivotFormat(pivot.metric, P.val(P.base))}</td></tr>` : '';
  return `

    <div class="sc-head"><h3>Report Builder</h3><div class="spacer"></div>

        <div class="f-group"><label>Columns</label><select onchange="setPivot('cols', this.value)">${dimOpts(pivot.cols,true)}</select></div>
        <div class="f-group"><label>Show</label><select onchange="setPivot('metric', this.value)">${metricOpts}</select></div>
        <div class="f-group"><label>Filter dates by</label><select onchange="setPivot('basis', this.value)">${basisOpts}</select></div>

      </div>

      <p class="hint">Pick what goes down the side (Rows), optionally across the top (Columns), and the number to show. Money and profit figures only count completed sales (Allotted + Sold). Cancelled / Mandate Failed applications are ignored. Click any number to see the records behind it${P.extraCols?` · Showing the ${P.colKeys.length} biggest columns (${P.extraCols} more hidden — narrow the dates or pick a different column)`:''}${P.rowKeys.length>300?' · Showing the first 300 rows':''}.</p>
    </div>

}
function exportPivot(kind){
  const P = pivotCompute();
  const aoa = [[P.rd.label + (P.cd ? ' / ' + P.cd.label : ''), ...(P.cd ? P.colKeys.map(ck=>pivotLabel(pivot.cols, ck)) : []), P.cd ? 'Total' : P.M.label]];
  const num = v => (v===null||v===undefined) ? '' : Number((Math.round(v*100)/100).toFixed(2));
  P.rowKeys.forEach(rk=>{ const R = P.rowMap.get(rk); aoa.push([pivotLabel(pivot.rows, rk), ...(P.cd ? P.colKeys.map(ck=>{ const L = R.cells.get(ck)||[]; return L.length ? num(P.val(L)) : ''; }) : []), num(P.val(R.all))]); });
  aoa.push(['TOTAL', ...(P.cd ? P.colKeys.map(ck=>num(P.val(P.colTotals.get(ck)||[]))) : []), num(P.val(P.base))]);
  const ws = XLSX.utils.aoa_to_sheet(aoa);
  const name = `Report_${pivot.rows}${pivot.cols?'_by_'+pivot.cols:''}_${pivot.metric}_${todayStr()}`;
  if (kind === 'csv'){
    const blob = new Blob([XLSX.utils.sheet_to_csv(ws)], { type:'text/csv' });
    const url = URL.createObjectURL(blob); const a = document.createElement('a'); a.href = url; a.download = name + '.csv'; a.click(); URL.revokeObjectURL(url);
  } else {
    const wb = XLSX.utils.book_new(); XLSX.utils.book_append_sheet(wb, ws, 'Report'); XLSX.writeFile(wb, name + '.xlsx');
  }
}


function reportSubReferenceProfit(){
  // Group: Reference -> Sub-Reference -> clients -> profit, so you can see each
  // individual sub-reference's contribution plus the combined total for the
  // reference it rolls up under.
  function clientProfitTotal(clientId){
    let our=0, gross=0, clientShare=0;
    S.applications.filter(a=>a.clientId===clientId).forEach(a=>{
      const c = calcAllotmentSale(a);
      if (c.applicable){ our+=c.ourFinal; gross+=c.grossFinal; clientShare+=c.clientFinal; }
    });
    return { our, gross, clientShare };
  }
  // #10: month-over-month trend, by Sale Date, for the headline "Our Profit" figure
  const now = new Date();
  const thisMonthStart = isoDate(new Date(now.getFullYear(), now.getMonth(), 1));
  const lastMonthStart = isoDate(new Date(now.getFullYear(), now.getMonth()-1, 1));
  const lastMonthEnd = isoDate(new Date(now.getFullYear(), now.getMonth(), 0));
  function clientProfitInMonth(clientId, from, to){
    let our=0;
    S.applications.filter(a=>a.clientId===clientId && a.saleStatus==='Sold' && a.saleDate>=from && a.saleDate<=to).forEach(a=>{
      const c = calcAllotmentSale(a);
      if (c.applicable) our+=c.ourFinal;
    });
    return our;
  }
  function trendArrow(thisM, lastM){
    if (lastM===0) return thisM>0 ? '<span class="ok">▲ New</span>' : '';
    const pct = Math.round(((thisM-lastM)/Math.abs(lastM))*100);
    if (pct>0) return `<span class="ok">▲ ${pct}%</span>`;
    if (pct<0) return `<span class="danger">▼ ${Math.abs(pct)}%</span>`;
    return '<span class="small-muted">— 0%</span>';
  }

  const references = ['(No Reference)', ...(S.settings.references||[])];
  let anyData = false;
  const sections = references.map(refName=>{
    const isNone = refName === '(No Reference)';
    const clientsInRef = S.clients.filter(c => isNone ? !c.referenceName : c.referenceName===refName);
    if (!clientsInRef.length) return '';

    const subRefNames = ['(No Sub-Reference)', ...(S.settings.subReferences||[])];
    const subRows = subRefNames.map(subName=>{
      const isNoneSub = subName === '(No Sub-Reference)';
      const clientsInSub = clientsInRef.filter(c => isNoneSub ? !c.subReference : c.subReference===subName);
      if (!clientsInSub.length) return null;
      let our=0, gross=0, clientShare=0, thisMonth=0, lastMonth=0;
      clientsInSub.forEach(c=>{
        const t=clientProfitTotal(c.id); our+=t.our; gross+=t.gross; clientShare+=t.clientShare;
        thisMonth += clientProfitInMonth(c.id, thisMonthStart, todayStr());
        lastMonth += clientProfitInMonth(c.id, lastMonthStart, lastMonthEnd);
      });
      if (our===0 && gross===0 && clientShare===0) return null;
      anyData = true;
      return { subName, clientCount:clientsInSub.length, our, gross, clientShare, thisMonth, lastMonth };
    }).filter(Boolean);

    if (!subRows.length) return '';
    const refTotalOur = subRows.reduce((s,r)=>s+r.our,0);
    const refTotalGross = subRows.reduce((s,r)=>s+r.gross,0);
    const refTotalClient = subRows.reduce((s,r)=>s+r.clientShare,0);

    return `
    <div class="section-card">
      <div class="sc-head"><h3>${escapeHtml(refName)}</h3><div class="spacer"></div><span class="small-muted">Total Our Profit: <b class="gold">${fmtMoney(refTotalOur)}</b></span></div>
      <div class="sc-body table-wrap">
        <table class="dt"><thead><tr><th>Sub-Reference</th><th>Clients</th><th>Gross Received</th><th>Our Profit</th><th>Client Profit</th><th>Trend (vs last month)</th></tr></thead>
        <tbody>
          ${subRows.map(r=>`<tr><td>${escapeHtml(r.subName)}</td><td>${r.clientCount}</td><td>${fmtMoney(r.gross)}</td><td>${fmtMoney(r.our)}</td><td>${fmtMoney(r.clientShare)}</td><td>${trendArrow(r.thisMonth, r.lastMonth)}</td></tr>`).join('')}
          <tr style="font-weight:700;border-top:2px solid var(--border);"><td>Total</td><td>${clientsInRef.length}</td><td>${fmtMoney(refTotalGross)}</td><td>${fmtMoney(refTotalOur)}</td><td>${fmtMoney(refTotalClient)}</td><td></td></tr>
        </tbody></table>
      </div>
    </div>`;
  }).join('');

  return anyData ? sections : `<div class="section-card"><div class="sc-body"><p class="small-muted">No profit recorded against any Reference/Sub-Reference yet.</p></div></div>`;
}

function reportIpoAnalysis(){
  const rows = S.ipos.map(i=>{

    const sold = st.apps.filter(a=>a.saleStatus==='Sold').length;

    const gross = st.apps.reduce((s,a)=>{ const c=calcAllotmentSale(a); return s+(c.applicable?c.grossFinal:0); },0);
    const resolvedCount = st.allotted.length + notAllotted;
    const winRate = resolvedCount ? Math.round((st.allotted.length/resolvedCount)*1000)/10 : null;
    return { ipoName:i.ipoName, apps:st.apps.length, allotted:st.allotted.length, notAllotted, sold, amountApplied, gross, profit:st.profit, winRate, resolvedCount };

  const buckets = [

let praRange = { preset:'thisMonth', from:null, to:null };
let praFilters = { ipoId:'', clientId:'', bankId:'', reference:'', subReference:'' };
function resolvePraRange(){
  const now = new Date();
  const y = now.getFullYear(), m = now.getMonth();
  const p = praRange.preset;
  if (p === 'thisMonth') return { from: isoDate(new Date(y,m,1)), to: isoDate(new Date(y,m+1,0)) };
  if (p === 'thisYear') return { from: isoDate(new Date(y,0,1)), to: isoDate(new Date(y,11,31)) };
  if (p === 'custom') return { from: praRange.from || '0001-01-01', to: praRange.to || '9999-12-31' };
  return { from:'0001-01-01', to:'9999-12-31' }; // 'all'
}
function setPraPreset(p){ praRange.preset = p; render(); }
function setPraCustom(){
  praRange.preset = 'custom';
  praRange.from = document.getElementById('praFrom').value;
  praRange.to = document.getElementById('praTo').value;
  render();
}
function setPraFilter(key, val){ praFilters[key] = val; render(); }
function reportProfitAnalysis(){
  const r = resolvePraRange();
  // Filters (IPO/Client/Bank/Reference) apply to every figure below; the date
  // range applies only to the profit figures, which are dated by Sale Date —
  // Capital Blocked / Receivables are current outstanding balances, not
  // historical, so they intentionally ignore the date range.
  const matchesFilters = a => {
    if (praFilters.ipoId && String(a.ipoId)!==praFilters.ipoId) return false;
    if (praFilters.bankId && String(a.bankAccountId)!==praFilters.bankId) return false;
    if (praFilters.clientId && String(a.clientId)!==praFilters.clientId) return false;
    if (praFilters.reference || praFilters.subReference){
      const c = findClient(a.clientId);
      if (praFilters.reference && (!c || c.referenceName !== praFilters.reference)) return false;
      if (praFilters.subReference && (!c || c.subReference !== praFilters.subReference)) return false;
    }
    return true;
  };
  const allFiltered = S.applications.filter(matchesFilters);
  const soldInRange = allFiltered.filter(a => a.saleStatus==='Sold' && inRange(a.saleDate, r));

  let grossProfit=0, ourProfit=0, clientProfit=0;
  soldInRange.forEach(a=>{ const c=calcAllotmentSale(a); if (c.applicable){ grossProfit+=c.grossFinal; ourProfit+=c.ourFinal; clientProfit+=c.clientFinal; } });
  const monthNow = new Date();
  const soldThisMonth = allFiltered.filter(a=>a.saleStatus==='Sold' && a.saleDate>=isoDate(new Date(monthNow.getFullYear(),monthNow.getMonth(),1)) && a.saleDate<=todayStr());
  const soldThisYear = allFiltered.filter(a=>a.saleStatus==='Sold' && a.saleDate>=isoDate(new Date(monthNow.getFullYear(),0,1)) && a.saleDate<=todayStr());
  const monthlyProfit = soldThisMonth.reduce((s,a)=>{ const c=calcAllotmentSale(a); return s+(c.applicable?c.ourFinal:0); },0);
  const yearlyProfit = soldThisYear.reduce((s,a)=>{ const c=calcAllotmentSale(a); return s+(c.applicable?c.ourFinal:0); },0);
  const avgProfitPerMonth = Math.round(yearlyProfit / (monthNow.getMonth()+1));
  let totalReceived=0, totalReceivable=0;
  allFiltered.forEach(a=>{ const c=calcAllotmentSale(a); if (c.applicable){ if (a.amountReceiveStatus==='Received') totalReceived+=c.grossFinal; if (a.amountReceiveStatus==='Receivable') totalReceivable+=c.grossFinal; } });
  const totalCapitalBlocked = allFiltered.filter(a=>isLiveApp(a) && (!a.allotmentStatus || a.allotmentStatus==='Pending')).reduce((s,a)=>s+(Number(a.amountApplied)||0),0);

  const presetBtns = [['thisMonth','This Month'],['thisYear','This Year'],['all','All Time'],['custom','Custom']]
    .map(([k,l]) => `<button class="btn btn-sm ${praRange.preset===k?'btn-primary':'btn-ghost'}" onclick="setPraPreset('${k}')">${l}</button>`).join('');

function reportPlanningPerformance(){
  const totalPlanned = S.ipoPlans.length;
  const totalActual = new Set(S.applications.filter(a=>a.planId).map(a=>a.planId)).size;
  const executed = S.ipoPlans.filter(p=>planVariance(p)==='Matched').length;
  const notExecuted = S.ipoPlans.filter(p=>planVariance(p)==='Pending').length;
  const bankChanged = S.ipoPlans.filter(p=>planVariance(p)==='Bank Changed').length;
  const dateChanged = S.ipoPlans.filter(p=>planVariance(p)==='Date Changed').length;
  const dateSet = new Set(S.ipoPlans.map(p=>p.plannedDate));
  let overCapacityDays = 0, utilSum = 0, utilCount = 0;
  S.bankAccounts.forEach(b=>{ dateSet.forEach(d=>{ const cap = bankCapacity(b.id,d); if (cap.planned>0){ utilSum += cap.utilisation; utilCount++; if (cap.status==='Over Capacity') overCapacityDays++; } }); });
  const avgUtil = utilCount ? Math.round((utilSum/utilCount)*10)/10 : 0;
  return `<div class="kpi-grid">
    <div class="kpi-card"><div class="lbl">Total Planned IPO Slots</div><div class="val">${totalPlanned}</div></div>
    <div class="kpi-card"><div class="lbl">Total Actual IPO Slots</div><div class="val">${totalActual}</div></div>
    <div class="kpi-card"><div class="lbl">Plans Executed</div><div class="val ok">${executed}</div></div>
    <div class="kpi-card"><div class="lbl">Plans Not Executed</div><div class="val danger">${notExecuted}</div></div>
    <div class="kpi-card"><div class="lbl">Plans With Bank Change</div><div class="val">${bankChanged}</div></div>
    <div class="kpi-card"><div class="lbl">Plans With Date Change</div><div class="val">${dateChanged}</div></div>
    <div class="kpi-card"><div class="lbl">Over-Capacity Days</div><div class="val danger">${overCapacityDays}</div></div>
    <div class="kpi-card"><div class="lbl">Average Bank Utilisation</div><div class="val">${avgUtil}%</div></div>
  </div>`;
}

/* Plain-language summary of an audit entry: "field: old → new" for each changed field. */
function auditChangeSummary(r){
  try {
    const prev = r.prev ? JSON.parse(r.prev) : null, next = r.next ? JSON.parse(r.next) : null;
    if (!prev && next) return '<span class="small-muted">New record created</span>';
    if (prev && !next) return '<span class="small-muted">Record deleted</span>';
    if (!prev || !next) return '—';
    const skip = new Set(['updatedAt','createdAt','id']);
    const parts = [];
    for (const k of Object.keys(next)){
      if (skip.has(k)) continue;
      if (JSON.stringify(prev[k]) !== JSON.stringify(next[k])){
        const f = v => (v===null||v===undefined||v==='') ? '(blank)' : String(v);
        parts.push(`<b>${escapeHtml(k)}</b>: ${escapeHtml(f(prev[k]))} → ${escapeHtml(f(next[k]))}`);
      }
    }

function excelSerialToIso(serial){
  // Standard Excel-serial-to-calendar-date conversion, done entirely in UTC
  // math. This deliberately avoids depending on how any library constructs
  // JS Date objects internally (that ambiguity is what caused the date to
  // shift by a day) — a serial number is just a number, so there's nothing
  // to get wrong about timezone or local-vs-UTC here.
  const utcDays = Math.floor(serial - 25569); // 25569 = days between 1899-12-30 and 1970-01-01
  const d = new Date(utcDays * 86400 * 1000);
  const y = d.getUTCFullYear(), m = String(d.getUTCMonth()+1).padStart(2,'0'), day = String(d.getUTCDate()).padStart(2,'0');
  return `${y}-${m}-${day}`;
}
function parseExcelDate(val){
  if (val===null || val===undefined || val==='') return null;
  if (typeof val === 'number') return excelSerialToIso(val);
  if (val instanceof Date){
    // Fallback only — shouldn't normally be hit now that we read raw values,
    // but handled defensively in case a cell already comes through as a Date.
    if (val.getUTCHours()===0 && val.getUTCMinutes()===0 && val.getUTCSeconds()===0){
      return `${val.getUTCFullYear()}-${String(val.getUTCMonth()+1).padStart(2,'0')}-${String(val.getUTCDate()).padStart(2,'0')}`;
    }
    return `${val.getFullYear()}-${String(val.getMonth()+1).padStart(2,'0')}-${String(val.getDate()).padStart(2,'0')}`;
  }
  const s = String(val).trim();
  // dd/mm/yyyy or dd-mm-yyyy (common in India) — construct in UTC, not local time
  const dmy = s.match(/^(\d{1,2})[\/\-](\d{1,2})[\/\-](\d{4})$/);
  if (dmy) return excelSerialToIso(Math.floor((Date.UTC(Number(dmy[3]), Number(dmy[2])-1, Number(dmy[1])) - Date.UTC(1899,11,30)) / 86400000));
  // yyyy-mm-dd — extract directly rather than round-tripping through Date parsing
  const iso = s.match(/^(\d{4})-(\d{1,2})-(\d{1,2})/);
  if (iso) return `${iso[1]}-${String(iso[2]).padStart(2,'0')}-${String(iso[3]).padStart(2,'0')}`;
  return null;
}
function normalizeStatus(val, allowed){
  const s = (val||'').toString().trim();
  const hit = allowed.find(a => a.toLowerCase() === s.toLowerCase());
  return hit || null;
}

let __pendingImport = null;
function importFromExcel(file){
  if (!file) return;
  const reader = new FileReader();
  reader.onload = (e) => {
    let wb;
    try { wb = XLSX.read(e.target.result, { type:'array', cellDates:false }); }
    catch(err){ toast('Could not read this file — make sure it\'s a valid .xlsx file','danger'); return; }

    const ipoRows = wb.Sheets['IPOs'] ? XLSX.utils.sheet_to_json(wb.Sheets['IPOs'], { defval:'' }) : [];
    const appRows = wb.Sheets['Applications'] ? XLSX.utils.sheet_to_json(wb.Sheets['Applications'], { defval:'' }) : [];

    const plan = { newIpos:[], updatedIpos:[], newClients:new Set(), newClientMeta:{}, clientFills:{}, newBanks:new Set(), newUpis:[], newApps:[], errors:[], skippedDupes:0 };

    // ---- IPOs sheet: create new, or update dates/amount on existing (matched by name) ----
    ipoRows.forEach((row, idx) => {
      const name = (row['IPO Name']||'').toString().trim();
      if (!name || /example — delete/i.test(name)) return;
      const openDate = parseExcelDate(row['Open Date']);
      const closeDate = parseExcelDate(row['Close Date']);
      const allotmentDate = parseExcelDate(row['Allotment Date']);
      const minAmount = Number(row['Min Amount']) || 0;
      const existing = S.ipos.find(i => i.ipoName.toLowerCase() === name.toLowerCase());
      if (existing) plan.updatedIpos.push({ existing, name, minAmount, openDate, closeDate, allotmentDate });
      else plan.newIpos.push({ name, minAmount, openDate, closeDate, allotmentDate });
    });

    // ---- Applications sheet: auto-create Client/Bank/UPI by name, match IPO by name ----
    appRows.forEach((row, idx) => {
      const rowNum = idx + 2; // +2: header row + 1-indexing, matches what the user sees in Excel
      const clientName = (row['Client Name']||'').toString().trim();
      const ipoName = (row['IPO']||'').toString().trim();
      const bankName = (row['Bank']||'').toString().trim();
      if (!clientName || /example — delete/i.test(clientName)) return;
      if (!ipoName || !bankName){ plan.errors.push(`Row ${rowNum}: missing IPO or Bank name — skipped.`); return; }

      const amountApplied = Number(row['Amount Applied']) || 0;

      const applicationDate = parseExcelDate(row['Application Date']);
      if (!applicationDate){ plan.errors.push(`Row ${rowNum} (${clientName}): missing or invalid Application Date — skipped.`); return; }

      const allotmentStatus = normalizeStatus(row['Allotment Status'], ALLOTMENT_STATUSES) || 'Pending';
      const saleStatus = row['Sale Status'] ? normalizeStatus(row['Sale Status'], SALE_STATUSES) : null;
      if (row['Sale Status'] && !saleStatus){ plan.errors.push(`Row ${rowNum} (${clientName}): Sale Status "${row['Sale Status']}" not recognized — must be exactly "Pending to Sell" or "Sold". Left blank.`); }
      const recoveryStatus = row['Recovery Status'] ? normalizeStatus(row['Recovery Status'], RECEIVE_STATUSES) : null;
      if (row['Recovery Status'] && !recoveryStatus){ plan.errors.push(`Row ${rowNum} (${clientName}): Recovery Status "${row['Recovery Status']}" not recognized — must be exactly "Receivable" or "Received". Left blank.`); }
      const saleDate = parseExcelDate(row['Sale Date']);
      const saleAmount = row['Sale Amount']!=='' ? Number(row['Sale Amount'])||0 : null;
      const grossReceived = row['Gross Received']!=='' && row['Gross Received']!=null ? Number(row['Gross Received'])||0 : null;
      const refName = (row['Reference']||'').toString().trim().replace(/\s+/g,' ');
      const subRef = (row['Sub Reference']||'').toString().trim().replace(/\s+/g,' ');
      // optional link to an existing plan — must be a plan for the same IPO
      let planId = null;
      if (row['Plan ID']!=='' && row['Plan ID']!=null){
        const pl = S.ipoPlans.find(x => String(x.id) === String(row['Plan ID']).trim());
        const ipoForPlan = S.ipos.find(i=>i.ipoName.toLowerCase()===ipoName.toLowerCase());
        if (!pl) plan.errors.push(`Row ${rowNum} (${clientName}): Plan ID "${row['Plan ID']}" does not exist — plan link left blank.`);
        else if (!ipoForPlan || pl.ipoId !== ipoForPlan.id) plan.errors.push(`Row ${rowNum} (${clientName}): Plan ID ${row['Plan ID']} belongs to a different IPO — plan link left blank.`);
        else planId = pl.id;
      }

      // duplicate check against records already in the portal (same rule the manual form uses)
      const existingClient = S.clients.find(c=>c.clientName.toLowerCase()===clientName.toLowerCase());
      const existingBank = S.bankAccounts.find(b=>b.bankName.toLowerCase()===bankName.toLowerCase());
      const matchedNewIpo = plan.newIpos.find(i=>i.name.toLowerCase()===ipoName.toLowerCase());
      const existingIpo = S.ipos.find(i=>i.ipoName.toLowerCase()===ipoName.toLowerCase());
      if (existingClient && existingBank && (existingIpo||matchedNewIpo)){
        const ipoRef = existingIpo ? existingIpo.id : ('NEW:'+ipoName.toLowerCase());
        const dupe = S.applications.find(a => a.clientId===existingClient.id && String(a.ipoId)===String(ipoRef) && a.bankAccountId===existingBank.id) ||
                     plan.newApps.find(a => a._clientKey===clientName.toLowerCase() && a._ipoKey===ipoName.toLowerCase() && a._bankKey===bankName.toLowerCase());
        if (dupe){ plan.skippedDupes++; return; }
      }
      if (!existingClient){
        plan.newClients.add(clientName);
        const k = clientName.toLowerCase();
        if (!plan.newClientMeta[k]) plan.newClientMeta[k] = { ref:refName, sub:subRef };
        else { if (!plan.newClientMeta[k].ref && refName) plan.newClientMeta[k].ref = refName; if (!plan.newClientMeta[k].sub && subRef) plan.newClientMeta[k].sub = subRef; }
      } else if ((!existingClient.referenceName && refName) || (!existingClient.subReference && subRef)){
        plan.clientFills[existingClient.id] = { ref: refName, sub: subRef };
      }
      if (!existingBank) plan.newBanks.add(bankName);
      const upiId = (row['UPI ID']||'').toString().trim();
      if (upiId && existingBank && !bankUpis(existingBank.id).some(u=>u.upiId.toLowerCase()===upiId.toLowerCase())){
        plan.newUpis.push({ bankName, upiId });
      }

      plan.newApps.push({
        _clientKey:clientName.toLowerCase(), _ipoKey:ipoName.toLowerCase(), _bankKey:bankName.toLowerCase(),

}

async function commitImport(){
  const plan = __pendingImport;
  if (!plan) return;
  closeModal();

  // 1) IPOs — create new, update existing
  for (const ni of plan.newIpos){
    const ipoId = nextCode(S.ipos, 'ipoId', 'IPO');
    const rec = { ipoId, ipoName:ni.name, minimumApplicationAmount:ni.minAmount, openDate:ni.openDate, closeDate:ni.closeDate, allotmentDate:ni.allotmentDate, archiveStatus:'Active', createdAt:new Date().toISOString(), updatedAt:new Date().toISOString() };
    const newId = await putRec('ipos', rec); rec.id = newId; S.ipos.push(rec);
    await audit('IPO Imported','IPO', ipoId, null, rec);
  }
  for (const ui of plan.updatedIpos){
    const updated = { ...ui.existing, minimumApplicationAmount:ui.minAmount||ui.existing.minimumApplicationAmount, openDate:ui.openDate||ui.existing.openDate, closeDate:ui.closeDate||ui.existing.closeDate, allotmentDate:ui.allotmentDate||ui.existing.allotmentDate, updatedAt:new Date().toISOString() };
    await putRec('ipos', updated); const __prev15 = {...ui.existing}; Object.assign(ui.existing, updated);
    await audit('IPO Updated via Import','IPO', ui.existing.ipoId, __prev15, updated);
    await syncIpoAllotmentDate(ui.existing);
  }

  // 2) Clients — auto-create by name
  const clientByName = {};
  S.clients.forEach(c => clientByName[c.clientName.toLowerCase()] = c);
  for (const name of plan.newClients){
    const clientId = nextCode(S.clients, 'clientId', 'CL');
    const meta = (plan.newClientMeta||{})[name.toLowerCase()] || { ref:'', sub:'' };
    const rec = { clientId, clientName:name, referenceName:meta.ref||'', subReference:meta.sub||'', status:'Active', createdAt:new Date().toISOString(), updatedAt:new Date().toISOString() };
    const newId = await putRec('clients', rec); rec.id = newId; S.clients.push(rec);
    clientByName[name.toLowerCase()] = rec;
    await audit('Client Imported','Client', clientId, null, rec);
  }

  // 2b) Fill blank Reference / Sub Reference on existing clients (never overwrite a value already there)
  for (const [cid, f] of Object.entries(plan.clientFills||{})){
    const c = S.clients.find(x => String(x.id) === String(cid));
    if (!c) continue;
    const updated = { ...c, referenceName: c.referenceName || f.ref || '', subReference: c.subReference || f.sub || '', updatedAt:new Date().toISOString() };
    const prev = {...c}; await putRec('clients', updated); Object.assign(c, updated);
    await audit('Client Updated via Import','Client', c.clientId, prev, updated);
  }
  // keep the Sub-Reference dropdown list in Settings in step with any new names
  const knownSubs = S.settings.subReferences || [];
  const newSubs = S.clients.map(c=>(c.subReference||'').trim()).filter(x => x && !knownSubs.includes(x));
  if (newSubs.length) await saveSetting('subReferences', [...knownSubs, ...Array.from(new Set(newSubs))]);

  // 3) Banks — auto-create by name
  const bankByName = {};
  S.bankAccounts.forEach(b => bankByName[b.bankName.toLowerCase()] = b);
  for (const name of plan.newBanks){
    const bankId = nextCode(S.bankAccounts, 'bankId', 'BANK');
    const rec = { bankId, bankName:name, accountHolderName:'', status:'Active', createdAt:new Date().toISOString(), updatedAt:new Date().toISOString() };
    const newId = await putRec('bankAccounts', rec); rec.id = newId; S.bankAccounts.push(rec);
    bankByName[name.toLowerCase()] = rec;
    await audit('Bank Account Imported','BankAccount', bankId, null, rec);
  }

  // 4) UPI IDs — auto-create under the matched bank
  for (const nu of plan.newUpis){
    const bank = bankByName[nu.bankName.toLowerCase()];
    if (!bank) continue;
    const rec = { bankAccountId:bank.id, upiId:nu.upiId, createdAt:new Date().toISOString(), updatedAt:new Date().toISOString() };
    const newId = await putRec('bankUpiIds', rec); rec.id = newId; S.bankUpiIds.push(rec);
  }

  // 5) Applications — build final records, resolving IPO/Client/Bank/UPI by name
  const ipoByName = {}; S.ipos.forEach(i => ipoByName[i.ipoName.toLowerCase()] = i);
  for (const na of plan.newApps){
    const client = clientByName[na._clientKey];
    const bank = bankByName[na._bankKey];
    const ipo = ipoByName[na._ipoKey];
    if (!client || !bank || !ipo) continue; // shouldn't happen — already validated in the preview step
    const upi = na.upiId ? bankUpis(bank.id).find(u=>u.upiId.toLowerCase()===na.upiId.toLowerCase()) : null;
    const rec = {
      clientId:client.id, ipoId:ipo.id, bankAccountId:bank.id, upiId: upi?upi.id:null,
      applicationDate:na.applicationDate, amountApplied:na.amountApplied, applicationStatus:'Applied', planId: na.planId || null, profitSharePct: shareForClient(client.id),
      allotmentStatus:na.allotmentStatus, allotmentDate: ipo.allotmentDate || null,
      saleStatus:na.saleStatus, saleDate:na.saleDate, saleAmount:na.saleAmount,
      calculatedGrossReceived:null, grossReceived:na.grossReceived, grossReceivedOverridden: na.grossReceived!=null,
      calculatedOurProfit:null, ourProfit:null, ourProfitOverridden:false,
      calculatedClientProfit:null, clientProfit:null, clientProfitOverridden:false,
      amountReceiveStatus:na.recoveryStatus,
      overrideReason: na.grossReceived!=null ? 'Set via Excel import' : null,
      overrideChangedAt: na.grossReceived!=null ? new Date().toISOString() : null,
      createdAt:new Date().toISOString(), updatedAt:new Date().toISOString()
    };
    const newId = await putRec('applications', rec); rec.id = newId; S.applications.push(rec);
  }
  await audit('Bulk Import','Applications', null, null, { count: plan.newApps.length });

  __pendingImport = null;
  toast(`Imported ${plan.newApps.length} application(s)`,'ok');
  if (typeof scheduleSync === 'function') scheduleSync();
  navigate('dashboard');
}

function localBackupDownload(){

  const a = document.createElement('a'); a.href = url; a.download = `ipo_portal_backup_${todayStr()}.json`; a.click();
  URL.revokeObjectURL(url);

function daysSinceLastBackup(){
  const dates = [S.settings.lastManualBackup, S.settings.lastSynced].filter(Boolean).map(d=>new Date(d).getTime());
  if (!dates.length) return null;
  const mostRecent = Math.max(...dates);
  return Math.floor((Date.now() - mostRecent) / 86400000);
}
async function restoreSnapshot(data){
  window.__suppressReadOnlyCheck = true; // this is the system syncing real data in, not a user edit — must never be blocked by viewer read-only mode
  try {
    for (const [store, keyPath] of Object.entries(STORES)){
      if (store === 'settings') continue;
      await clearStore(store);
      const arr = data[store] || [];
      for (const rec of arr) await putRec(store, rec);
    }
    if (data.settings){
      const isOwner = window.__drive && window.__drive.role === 'owner';
      for (const [k,v] of Object.entries(data.settings)){
        if (isLocalOnlySetting(k)) continue;
        if (isOwner && k==='authorizedEmail' && S.settings[k]) continue;
        if (isOwner && k==='collaborators' && (S.settings[k]||[]).length) continue; // owner's list is the master copy
        await saveSetting(k, v);
      }
    }
    await loadAll();
  } finally {
    window.__suppressReadOnlyCheck = false;
  }
}
function localBackupRestore(file){
  if (!file) return;
  const reader = new FileReader();
  reader.onload = (e) => {
    let data;
    try { data = JSON.parse(e.target.result); }
    catch(err){ toast('Invalid backup file — not valid JSON','danger'); return; }
    const counts = ['clients','bankAccounts','ipos','ipoPlans','applications'].map(k =>
      `${(data[k]||[]).length} ${k}`).join(', ');
    openModal('Restore Backup?',
      `<p style="font-size:13px;line-height:1.6;">
         <b>&#9888; Restoring this backup may replace current portal data.</b><br><br>
         <b>Backup date:</b> ${data.exportedAt ? fmtDate(data.exportedAt) : 'Unknown'}<br>
         <b>Data version:</b> ${data.version ?? 'Unknown'}<br>
         <b>Contains:</b> ${counts || 'No records found'}
       </p>`,
      `<button class="btn btn-ghost" onclick="closeModal()">Cancel</button>
       <button class="btn btn-danger" id="confirmRestoreBtn">Restore This Backup</button>`);
    document.getElementById('confirmRestoreBtn').onclick = async () => {
      closeModal();
      try {
        await restoreSnapshot(data);
        await saveSetting('lastRestore', new Date().toISOString());
        toast('Backup restored','ok');
        navigate('dashboard');
      } catch(err){ toast('Restore failed: ' + (err.message||err),'danger'); }
    };
  };
  reader.readAsText(file);
}

async function openCollaboratorFilePicker(){
  const apiKey = S.settings.googlePickerApiKey;
  if (!apiKey){
    openModal('One More Setup Step',
      `<p style="font-size:13px;line-height:1.6;">To access a portal shared with you, the owner needs to add a Google Picker API key in Settings → Share Portal Access first (a one-time setup, separate from the OAuth Client ID). Ask them to complete that, then reconnect here.</p>`,

  }

    .setMimeTypes('application/json')
    .setIncludeFolders(true);
  const picker = new google.picker.PickerBuilder()
    .addView(view)
    .setOAuthToken(window.__drive.accessToken)
    .setDeveloperKey(apiKey)
    .setAppId(String(S.settings.driveClientId||'').split('-')[0]) // Cloud project number: required so Google grants this app access to the picked file under drive.file scope
    .setCallback(async (data) => {
      if (data.action === google.picker.Action.PICKED){
        const file = data.docs[0];
        const email = (window.__drive.email||'').toLowerCase();
        await saveSetting('collabFileId_'+email, file.id);
        if (file.parentId) await saveSetting('collabFolderId_'+email, file.parentId);
        window.__drive.fileId = file.id;
        const ok = await refreshFromDrive(true);
        if (!ok){
          window.__drive.role = 'pending';
          openModal('Could not open the shared file',
            `<p style="font-size:13px;line-height:1.6;">Google refused to let this portal read the file you picked.</p>
             <p style="font-size:13px;line-height:1.6;"><b>Error:</b> ${escapeHtml(window.__drive.lastError||'unknown')}</p>
             <p class="small-muted">Send this message to the portal owner.</p>`,
            `<button class="btn btn-primary" onclick="closeModal()">Close</button>`);
          return;
        }
        // Only now, after pulling the REAL shared settings, do we actually know
        // whether this person is an Editor or Viewer — trusting anything set
        // before this point would be a guess, which is exactly what caused the
        // original bug.
        const realCollaborators = S.settings.collaborators || [];
        const realCollab = realCollaborators.find(c => c.email.toLowerCase() === email);
        const realOwner = (S.settings.authorizedEmail||'').toLowerCase();
        if (email === realOwner){ window.__drive.role = 'owner'; }
        else if (realCollab){ window.__drive.role = realCollab.role; }
        else {
          window.__drive.role = 'viewer'; // safest possible fallback if something's inconsistent
          toast('Connected, but you\'re not on this portal\'s access list — showing view-only until the owner adds you','warn');
        }
        toast(`Portal data connected as ${window.__drive.role}`,'ok');
        startDrivePolling();
        navigate('dashboard');
      }
    })
    .build();

}
/* ---- Owner-side: grant/revoke access for a collaborator ---- */
async function grantCollaboratorAccess(){
  const email = document.getElementById('collabEmailInput').value.trim().toLowerCase();
  const role = document.getElementById('collabRoleSelect').value;
  if (!email || !email.includes('@')){ toast('Enter a valid email address','warn'); return; }
  if (!window.__drive.fileId){ toast('Connect Google Drive yourself first, before sharing access','warn'); return; }
  try {
    const driveRole = role === 'editor' ? 'writer' : 'reader';
    // Only share the file itself, not the folder — Google's Drive API rejects
    // folder-permission changes under this app's narrow file-scoped access
    // when it doesn't already have explicit permission on every child file
    // inside that folder. The collaborator only ever needs the data file.
    if (!window.__drive.fileId) throw new Error('No connected data file to share yet — try reconnecting Google Drive first.');
    await driveApi(`https://www.googleapis.com/drive/v3/files/${window.__drive.fileId}/permissions`, {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({ role: driveRole, type:'user', emailAddress: email })
    });
    const collaborators = (S.settings.collaborators || []).filter(c=>c.email!==email);
    collaborators.push({ email, role });
    await saveSetting('collaborators', collaborators);
    const pushed = await pushSharedSettingsNow();
    toast(pushed ? `Access granted to ${email} (${role}) and saved to Google Drive` : `Access granted to ${email}, but saving the list to Drive failed — check connection and try again`, pushed ? 'ok' : 'warn');
    navigate('settings');
  } catch(err){
    console.error('grantCollaboratorAccess failed:', err);
    openModal('Could Not Grant Access',
      `<p style="font-size:13px;line-height:1.6;">${escapeHtml(err.message||'Unknown error')}</p>
       <p class="small-muted">This is the exact error from Google's API — if you're not sure what it means, copy this message and send it over.</p>`,
      `<button class="btn btn-primary" onclick="closeModal()">Close</button>`);
  }
}
/* Push the owner's access list to the Drive file right now, before any background pull can overwrite it. */
async function pushSharedSettingsNow(){
  try {
    if (window.__drive.syncTimer) clearTimeout(window.__drive.syncTimer);
    window.__drive.pendingChanges = true;
    const meta = await driveGetFileMeta(window.__drive.fileId);
    if (window.__drive.remoteModifiedTime && meta.modifiedTime !== window.__drive.remoteModifiedTime){
      const res = await driveApi(`https://www.googleapis.com/drive/v3/files/${window.__drive.fileId}?alt=media`);
      await restoreSnapshot(await res.json()); // owner's access list is preserved by restoreSnapshot
      window.__drive.remoteModifiedTime = meta.modifiedTime;
    }
    await syncToDrive();
    return window.__drive.status === 'idle';
  } catch(e){ return false; }
}
async function revokeCollaboratorAccess(email){
  confirmAction(`Remove ${escapeHtml(email)}'s access to this portal? They will need to be re-invited to get access again.`, async () => {
    const collaborators = (S.settings.collaborators || []).filter(c=>c.email!==email);
    await saveSetting('collaborators', collaborators);
    await pushSharedSettingsNow();
    toast('Access removed — note: this stops future syncing for them, but does not retroactively revoke the Google Drive file permission. Remove that separately in Drive if needed.','ok');
    navigate('settings');
  });
}

function renderSyncIndicator(){

async function driveConnect(){

  await loadGoogleClientId();
