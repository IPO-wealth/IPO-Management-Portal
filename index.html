    openModal('⚠️ Capacity Warning',
      `<p style="font-size:13px;line-height:1.6;">${escapeHtml(bank.bankName)} already has <b>${cap.planned}</b> mandate(s) planned for ${fmtDate(plannedDate)}.<br>Adding these ${clientIds.length} client(s) would bring it to <b>${projected}</b>.<br>Maximum recommended capacity: <b>6</b><br>Available: <b>${cap.available}</b><br><br>Continue anyway?</p>`,
      `<button class="btn btn-ghost" onclick="closeModal()">Cancel</button><button class="btn btn-danger" onclick="submitBulkPlan(true)">Continue Anyway</button>`);
    return;
  }
  if (!plan){
    const rec = { ipoId, plannedDate, bankAccountId, plannedClientCount: clientIds.length, planStatus:'Planned', notes:'', createdAt:new Date().toISOString(), updatedAt:new Date().toISOString() };
    const id = await putRec('ipoPlans', rec); rec.id = id; S.ipoPlans.push(rec); plan = rec;
    await audit('Plan Creation','IPOPlan', id, null, rec);
  } else {
    plan.plannedClientCount = (plan.plannedClientCount||0) + clientIds.length;
    await putRec('ipoPlans', plan);
  }
  for (const cid of clientIds){
    if (!S.plannedClients.some(pc=>pc.planId===plan.id && pc.clientId===cid)){
      const rec = { planId: plan.id, clientId: cid, createdAt: new Date().toISOString() };
      const id = await putRec('plannedClients', rec); rec.id = id; S.plannedClients.push(rec);
    }
  }
  toast(`${clientIds.length} client(s) planned for ${findIpo(ipoId).ipoName}${blocked.length?` (${blocked.length} skipped — already planned for this IPO)`:''}`, 'ok');
  closeModal(); navigate('planning');
}
</script>

<script>
/* ---- planning calendar ---- */
let calMonth = new Date().getMonth();
let calYear = new Date().getFullYear();
function planningCalendarTab(){
  const activeBanks = S.bankAccounts.filter(b=>b.status==='Active');
  const first = new Date(calYear, calMonth, 1);
  const startDow = first.getDay();
  const daysInMonth = new Date(calYear, calMonth+1, 0).getDate();
  const monthName = first.toLocaleDateString('en-IN',{month:'long',year:'numeric'});

  let cells = '';
  for (let i=0;i<startDow;i++) cells += `<div class="cal-cell empty"></div>`;
  for (let d=1; d<=daysInMonth; d++){
    const dateStr = `${calYear}-${String(calMonth+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
    const bankLines = activeBanks.slice(0,4).map(b=>{
      const cap = bankCapacity(b.id, dateStr);
      return `<div class="bankline"><span>${escapeHtml(b.bankName.slice(0,10))}</span><span class="cap-cell ${capClass(cap.status)}" style="padding:0 5px;">${cap.planned}/6</span></div>`;
    }).join('');
    cells += `<div class="cal-cell" onclick="openCalendarDate('${dateStr}')"><div class="dnum">${d}</div>${bankLines}${activeBanks.length>4?`<div class="small-muted">+${activeBanks.length-4} more</div>`:''}</div>`;
  }
  return `
  <div class="section-card">
    <div class="sc-head">
      <button class="btn btn-ghost btn-sm" onclick="calShift(-1)">&larr;</button>
      <h3 style="min-width:170px;text-align:center;">${monthName}</h3>
      <button class="btn btn-ghost btn-sm" onclick="calShift(1)">&rarr;</button>
      <div class="spacer"></div>
      <span class="small-muted">Click a date to see per-bank planning detail</span>
    </div>
    <div class="sc-body">
      <div class="cal-grid" style="margin-bottom:6px;">
        ${['Sun','Mon','Tue','Wed','Thu','Fri','Sat'].map(d=>`<div class="small-muted" style="text-align:center;font-weight:700;">${d}</div>`).join('')}
      </div>
      <div class="cal-grid">${cells}</div>
    </div>
  </div>`;
}
function calShift(n){ calMonth += n; if (calMonth<0){calMonth=11;calYear--;} if(calMonth>11){calMonth=0;calYear++;} render(); }
function openCalendarDate(dateStr){
  const activeBanks = S.bankAccounts.filter(b=>b.status==='Active');
  const blocks = activeBanks.map(b=>{
    const cap = bankCapacity(b.id, dateStr);
    const list = cap.plans.map(p=>{ const ipo = findIpo(p.ipoId); return `<li>${escapeHtml(ipo?ipo.ipoName:'—')} <span class="small-muted">(${p.plannedClientCount||0} clients planned)</span></li>`; }).join('') || '<li class="small-muted">No IPOs planned</li>';
    return `<div style="margin-bottom:12px;">
      <div style="display:flex;align-items:center;gap:8px;"><b>${escapeHtml(b.bankName)}</b><span class="cap-cell ${capClass(cap.status)}">${cap.planned}/6 used</span><span class="small-muted">${cap.available} slot(s) remaining</span></div>
      <ul style="margin:6px 0 0 18px;font-size:12.5px;">${list}</ul>
    </div>`;
  }).join('');
  openModal(`Planning Detail — ${fmtDate(dateStr)}`, blocks,
    `<button class="btn btn-primary" onclick="closeModal()">Close</button>`, true);
}

/* ---- capacity dashboard ---- */
function planningCapacityTab(){
  const activeBanks = S.bankAccounts.filter(b=>b.status==='Active');
  const dateSet = new Set(S.ipoPlans.map(p=>p.plannedDate));
  if (!dateSet.size) dateSet.add(todayStr());
  const rows = [];
  activeBanks.forEach(b => {
    dateSet.forEach(d => {
      const cap = bankCapacity(b.id, d);
      if (cap.planned > 0) rows.push({ bank:b.bankName, date:d, ...cap });
    });
  });
  rows.sort((a,b)=> a.date.localeCompare(b.date) || a.bank.localeCompare(b.bank));
  const trs = rows.map(r=>`<tr>
    <td>${escapeHtml(r.bank)}</td><td>${fmtDate(r.date)}</td><td>${r.planned}</td><td>${r.capacity}</td>
    <td>${r.available}</td><td>${r.utilisation}%</td><td><span class="cap-cell ${capClass(r.status)}">${r.status}</span></td>
  </tr>`).join('') || `<tr class="empty-row"><td colspan="7">No planning activity yet.</td></tr>`;
  return `
  <div class="section-card">
    <div class="sc-head"><h3>Bank Capacity Dashboard</h3></div>
    <div class="sc-body table-wrap">
      <table class="dt"><thead><tr><th>Bank</th><th>Date</th><th>Planned Mandates</th><th>Capacity</th><th>Available</th><th>Utilisation</th><th>Status</th></tr></thead>
      <tbody>${trs}</tbody></table>
    </div>
  </div>`;
}

/* ---- planned vs actual variance ---- */
function planningVarianceTab(){
  const rows = S.ipoPlans.map(p=>{
    const ipo = findIpo(p.ipoId); const bank = findBank(p.bankAccountId);
    const acts = S.applications.filter(a=>a.planId===p.id);
    const actualBank = acts.length ? findBank(acts[0].bankAccountId) : null;
    const actualDate = acts.length ? acts[0].applicationDate : null;
    return `<tr>
      <td>${escapeHtml(ipo?ipo.ipoName:'—')}</td>
      <td>${fmtDate(p.plannedDate)}</td>
      <td>${escapeHtml(bank?bank.bankName:'—')}</td>
      <td>${p.plannedClientCount||0}</td>
      <td>${actualDate?fmtDate(actualDate):'—'}</td>
      <td>${actualBank?escapeHtml(actualBank.bankName):'—'}</td>
      <td>${acts.length}</td>
      <td>${badge(planVariance(p))}</td>
    </tr>`;
  }).join('') || `<tr class="empty-row"><td colspan="8">No plans yet.</td></tr>`;
  return `
  <div class="section-card">
    <div class="sc-head"><h3>Planned vs Actual</h3></div>
    <div class="sc-body table-wrap">
      <table class="dt"><thead><tr><th>IPO</th><th>Planned Date</th><th>Planned Bank</th><th>Planned Clients</th><th>Actual Date</th><th>Actual Bank</th><th>Actual Applications</th><th>Variance</th></tr></thead>
      <tbody>${rows}</tbody></table>
    </div>
  </div>`;
}

/* ---- upcoming IPO planner ---- */
function upcomingPlanningStatus(ipo){
  const plans = S.ipoPlans.filter(p=>p.ipoId===ipo.id);
  if (!plans.length) return 'Not Planned';
  const totalPlannedClients = plans.reduce((s,p)=>s+(p.plannedClientCount||0),0);
  const mappedClients = S.plannedClients.filter(pc => plans.some(p=>p.id===pc.planId)).length;
  if (mappedClients >= totalPlannedClients && totalPlannedClients > 0) return 'Planned';
  return 'Partially Planned';
}
function planningUpcomingTab(){
  const upcoming = S.ipos.filter(i => ipoStatus(i) !== 'Closed').sort((a,b)=>a.openDate.localeCompare(b.openDate));
  const rows = upcoming.map(i=>{
    const plans = S.ipoPlans.filter(p=>p.ipoId===i.id);
    const banks = [...new Set(plans.map(p=>{ const b=findBank(p.bankAccountId); return b?b.bankName:''; }))].filter(Boolean).join(', ') || '—';
    return `<tr><td>${escapeHtml(i.ipoName)}</td><td>${fmtDate(i.openDate)}</td><td>${fmtDate(i.closeDate)}</td><td>${badge(ipoStatus(i))}</td><td>${escapeHtml(banks)}</td><td>${badge(upcomingPlanningStatus(i))}</td>
      <td><button class="btn btn-sm btn-primary" onclick="quickPlan(${i.id})">Plan</button></td></tr>`;
  }).join('') || `<tr class="empty-row"><td colspan="7">No upcoming or open IPOs.</td></tr>`;
  return `
  <div class="section-card">
    <div class="sc-head"><h3>Upcoming IPO Planner</h3></div>
    <div class="sc-body table-wrap">
      <table class="dt"><thead><tr><th>IPO</th><th>Open</th><th>Close</th><th>Status</th><th>Bank(s) Planned</th><th>Planning Status</th><th></th></tr></thead>
      <tbody>${rows}</tbody></table>
    </div>
  </div>`;
}
function quickPlan(ipoId){
  editPlan();
  setTimeout(()=>{ const sel = document.getElementById('fld_ipoId'); if (sel) sel.value = ipoId; }, 30);
}
</script>
<script>
/* =================== APPLICATIONS =================== */
const APP_STATUSES = ['Not Applied','To Be Applied','Applied'];

function findApp(id){ return S.applications.find(a=>a.id===id); }

/* UPI select helper: renders based on how many UPIs the chosen bank has */
function upiOptionsHtml(bankAccountId, selectedUpiId){
  const upis = bankAccountId ? bankUpis(Number(bankAccountId)) : [];
  if (!upis.length) return `<div class="small-muted" id="upiFieldInner">No UPI ID configured for this bank account.</div>`;
  if (upis.length === 1) return `<input type="hidden" id="fld_upiId" value="${upis[0].id}"><div class="small-muted" id="upiFieldInner">${escapeHtml(upis[0].upiId)} (auto-selected)</div>`;
  return `<select id="fld_upiId">${upis.map(u=>`<option value="${u.id}" ${String(selectedUpiId)===String(u.id)?'selected':''}>${escapeHtml(u.upiId)}</option>`).join('')}</select>`;
}
function refreshAppUpiField(bankAccountId, prefix){
  prefix = prefix || '';
  const wrap = document.getElementById(prefix+'upiFieldWrap');
  if (!wrap) return;
  wrap.innerHTML = upiOptionsHtml(bankAccountId, null).replace('fld_upiId', prefix+'fld_upiId').replace('upiFieldInner', prefix+'upiFieldInner');
}

let __selectedAppIds = new Set();
function viewApplications(){
  window.__tableRerender['appsTbl'] = () => {
    renderIntoWrap('appsTblWrap', renderDataTable('appsTbl', {
      data: S.applications,
      searchFn: (r,q) => { const c=findClient(r.clientId), i=findIpo(r.ipoId); const u=S.bankUpiIds.find(x=>x.id===r.upiId); return ((c?c.clientName:'')+' '+(i?i.ipoName:'')+' '+(u?u.upiId:'')).toLowerCase().includes(q); },
      searchPlaceholder: 'Search client, IPO, UPI...',
      filters: [
        { key:'applicationStatus', label:'Status', options: APP_STATUSES },
        { key:'ipoId', label:'IPO', options: sortedIpos().map(i=>i.ipoName), match:(r,v)=>{ const i=findIpo(r.ipoId); return i && i.ipoName===v; } },
        { key:'bankAccountId', label:'Bank', options: S.bankAccounts.map(b=>b.bankName), match:(r,v)=>{ const b=findBank(r.bankAccountId); return b && b.bankName===v; } }
      ],
      pageSize: 12,
      columns: [
        { key:'sel', label:`<input type="checkbox" onchange="toggleAllAppSelection(this.checked)">`, render:r=>`<input type="checkbox" class="appSelCk" ${__selectedAppIds.has(r.id)?'checked':''} onchange="toggleAppSelection(${r.id}, this.checked)">` },
        { key:'clientId', label:'Client', render:r=>{ const c=findClient(r.clientId); return escapeHtml(c?`${c.clientId} — ${c.clientName}`:'—'); } },
        { key:'ipoId', label:'IPO', render:r=>{ const i=findIpo(r.ipoId); return escapeHtml(i?i.ipoName:'—'); } },
        { key:'bankAccountId', label:'Bank', render:r=>{ const b=findBank(r.bankAccountId); return escapeHtml(b?b.bankName:'—'); } },
        { key:'applicationDate', label:'App Date', render:r=>fmtDate(r.applicationDate) },
        { key:'upiId', label:'UPI ID', render:r=>{ const u=S.bankUpiIds.find(x=>x.id===r.upiId); return escapeHtml(u?u.upiId:'—'); } },
        { key:'amountApplied', label:'Amount Applied', render:r=>fmtMoney(r.amountApplied) },
        { key:'applicationStatus', label:'Status', render:r=>badge(r.applicationStatus) },
        { key:'plan', label:'From Plan', render:r=>r.planId?'Yes':'No' }
      ],
      rowActions: r => `<button class="btn btn-sm btn-ghost" onclick="editApplication(${r.id})">Edit</button>
                         <button class="btn btn-sm btn-danger" onclick="deleteApplication(${r.id})">Delete</button>`
    }));
  };
  setTimeout(()=>window.__tableRerender['appsTbl'](), 0);
  return `
  <div class="section-card">
    <div class="sc-head" style="flex-wrap:wrap;">
      <h3>Applications</h3><div class="spacer"></div>
      <span class="small-muted" id="appSelCount">Selected: ${__selectedAppIds.size}</span>
      <select id="bulkStatusSelect" style="border:1px solid var(--border);border-radius:6px;padding:6px 8px;font-size:12.5px;">
        ${APP_STATUSES.map(s=>`<option value="${s}">${s}</option>`).join('')}
      </select>
      <button class="btn btn-ghost btn-sm" onclick="bulkUpdateAppStatus()">Update Selected</button>
      <button class="btn btn-ghost btn-sm" onclick="clearAppSelection()">Clear Selection</button>
      <button class="btn btn-gold" onclick="bulkApplyFromPlan()">Bulk Apply from Plan</button>
      <button class="btn btn-primary" onclick="editApplication()">+ New Application</button>
    </div>
    <div class="sc-body" id="appsTblWrap"></div>
  </div>`;
}
function __refreshAppSelectionUI(){
  if (window.__tableRerender['appsTbl']) window.__tableRerender['appsTbl']();
  const el = document.getElementById('appSelCount');
  if (el) el.textContent = 'Selected: ' + __selectedAppIds.size;
}
function toggleAppSelection(id, checked){ if (checked) __selectedAppIds.add(id); else __selectedAppIds.delete(id); __refreshAppSelectionUI(); }
function toggleAllAppSelection(checked){
  const filteredIds = (window.__lastFilteredIds && window.__lastFilteredIds['appsTbl']) || [];
  if (checked) filteredIds.forEach(id => __selectedAppIds.add(id));
  else filteredIds.forEach(id => __selectedAppIds.delete(id));
  __refreshAppSelectionUI();
}
function clearAppSelection(){ __selectedAppIds = new Set(); __refreshAppSelectionUI(); }
async function bulkUpdateAppStatus(){
  if (!__selectedAppIds.size){ toast('No applications selected','warn'); return; }
  const status = document.getElementById('bulkStatusSelect').value;
  for (const id of __selectedAppIds){
    const existing = findApp(id);
    if (!existing || existing.applicationStatus === status) continue;
    const updated = { ...existing, applicationStatus: status, updatedAt: new Date().toISOString() };
    await putRec('applications', updated); Object.assign(existing, updated);
    await audit('Application Status Change','Application', id, existing, updated);
  }
  toast(`Status updated for ${__selectedAppIds.size} application(s)`, 'ok');
  __selectedAppIds = new Set();
  navigate('applications');
}

function appFields(a){
  const planOpts = sortedPlans().map(p=>{ const ipo=findIpo(p.ipoId); return {value:p.id, label:`${ipo?ipo.ipoName:''} · ${fmtDate(p.plannedDate)}`}; });
  return [
    { key:'clientId', label:'Client', type:'select', required:true, placeholder:'Select Client', options: S.clients.map(c=>({value:c.id,label:`${c.clientId} — ${c.clientName}`})) },
    { key:'ipoId', label:'IPO', type:'select', required:true, placeholder:'Select IPO', options: sortedActiveIpos(a?a.ipoId:null).map(i=>({value:i.id,label:i.ipoName})) },
    { key:'bankAccountId', label:'Bank Account', type:'select', required:true, placeholder:'Select Bank', onchange:"refreshAppUpiField(this.value,'')", options: S.bankAccounts.map(b=>({value:b.id,label:b.bankName})) },
    { key:'applicationDate', label:'Application Date', type:'date', required:true },
    { key:'amountApplied', label:'Amount Applied', type:'number', required:true },
    { key:'applicationStatus', label:'Application Status', type:'select', options: APP_STATUSES },
    { key:'planId', label:'Originating Plan (optional)', type:'select', placeholder:'None', options: planOpts, span2:true }
  ].map(f => fieldHtml(f, a ? a[f.key] : (f.key==='applicationStatus'?'To Be Applied':(f.key==='applicationDate'?todayStr():'')))).join('');
}
function editApplication(id){
  const a = id ? findApp(id) : null;
  openModal(a ? 'Edit Application' : 'New Application',
    `<div class="form-grid">${appFields(a)}
      <div class="f-group"><label>UPI ID</label><div id="upiFieldWrap">${upiOptionsHtml(a?a.bankAccountId:'', a?a.upiId:null)}</div></div>
    </div>`,
    `<button class="btn btn-ghost" onclick="closeModal()">Cancel</button><button class="btn btn-primary" onclick="saveApplication(${id||'null'})">Save</button>`, true);
}
function dateWarnings(data){
  const warns = [];
  const ipo = findIpo(data.ipoId);
  if (ipo && data.applicationDate && (data.applicationDate < ipo.openDate || data.applicationDate > ipo.closeDate)) warns.push('Application date is outside the IPO open/close period.');
  return warns;
}
async function saveApplication(id, force){
  const fields = [{key:'clientId',type:'number'},{key:'ipoId',type:'number'},{key:'bankAccountId',type:'number'},{key:'applicationDate'},{key:'amountApplied',type:'number'},{key:'applicationStatus'},{key:'planId',type:'number'}];
  const data = readFields(fields);
  const upiEl = document.getElementById('fld_upiId');
  data.upiId = upiEl ? (upiEl.value ? Number(upiEl.value) : null) : null;
  if (!data.clientId || !data.ipoId || !data.bankAccountId || !data.applicationDate || !data.amountApplied){ toast('Client, IPO, bank, date and amount are required','warn'); return; }
  if (Number(data.amountApplied) <= 0){ toast('Amount Applied must be a positive number','warn'); return; }
  if (!data.planId) data.planId = null;

  const warns = dateWarnings(data);
  const dupe = S.applications.find(x => x.id!==id && x.clientId===data.clientId && x.ipoId===data.ipoId && x.bankAccountId===data.bankAccountId);
  if (dupe) warns.push('This client already has an application for this IPO from this bank account — this looks like a duplicate.');
  if (warns.length && !force){
    openModal('Date Warning', `<p style="font-size:13px;">${warns.join('<br>')}</p><p class="small-muted">You can still save this record.</p>`,
      `<button class="btn btn-ghost" onclick="closeModal()">Cancel</button><button class="btn btn-danger" onclick="saveApplication(${id||'null'}, true)">Save Anyway</button>`);
    return;
  }

  if (id){
    const existing = findApp(id);
    const updated = { ...existing, ...data, updatedAt: new Date().toISOString() };
    await putRec('applications', updated); Object.assign(existing, updated);
    await audit('Application Status Change','Application', id, existing, updated);
    toast('Application updated','ok');
  } else {
    const rec = { ...data, allotmentStatus:'Pending', allotmentDate:null, saleStatus:null, saleDate:null, saleAmount:null,
      calculatedGrossReceived:null, grossReceived:null, grossReceivedOverridden:false,
      calculatedOurProfit:null, ourProfit:null, ourProfitOverridden:false,
      calculatedClientProfit:null, clientProfit:null, clientProfitOverridden:false,
      createdAt:new Date().toISOString(), updatedAt:new Date().toISOString() };
    const newId = await putRec('applications', rec); rec.id = newId; S.applications.push(rec);
    await audit('Application Creation','Application', newId, null, rec);
    toast('Application created','ok');
  }
  closeModal(); navigate('applications');
}
function deleteApplication(id){
  const a = findApp(id);
  const c = a ? calcAllotmentSale(a) : null;
  const stakes = a ? [
    `Amount Applied: ${fmtMoney(a.amountApplied)}`,
    a.allotmentStatus ? `Allotment: ${escapeHtml(a.allotmentStatus)}` : '',
    (c && c.applicable) ? `Recorded Profit: ${fmtMoney(c.ourFinal)}` : ''
  ].filter(Boolean).join(' · ') : '';
  confirmAction(`Delete this application record? This will permanently remove it from reporting.${stakes ? '<br><span class="small-muted">'+stakes+'</span>' : ''}`, async () => {
    await delRec('applications', id);
    S.applications = S.applications.filter(x=>x.id!==id);
    await audit('Application Deletion','Application', id, a, null);
    toast('Application deleted','ok'); navigate('applications');
  });
}

/* ---- bulk apply from plan ---- */
function bulkApplyFromPlan(){
  const openPlans = sortedPlans(S.ipoPlans.filter(p=>p.planStatus!=='Cancelled'));
  const opts = openPlans.map(p=>{ const ipo=findIpo(p.ipoId); const bank=findBank(p.bankAccountId); return `<option value="${p.id}">${escapeHtml(ipo?ipo.ipoName:'')} · ${escapeHtml(bank?bank.bankName:'')} · ${fmtDate(p.plannedDate)}</option>`; }).join('');
  openModal('Bulk Apply from Plan',
    `<div class="f-group"><label>Select Plan</label><select id="baPlan" onchange="renderBulkApplyClients()"><option value="">Select a plan</option>${opts}</select></div>
     <div id="baClientsWrap" style="margin-top:12px;"></div>`,
    `<button class="btn btn-ghost" onclick="closeModal()">Cancel</button><button class="btn btn-primary" onclick="submitBulkApply()">Mark Selected as Applied</button>`, true);
}
function renderBulkApplyClients(){
  const planId = Number(document.getElementById('baPlan').value);
  const wrap = document.getElementById('baClientsWrap');
  if (!planId){ wrap.innerHTML=''; return; }
  const plan = findPlan(planId);
  const plannedClientIds = S.plannedClients.filter(pc=>pc.planId===planId).map(pc=>pc.clientId);
  const bankOpts = S.bankAccounts.filter(b=>b.status==='Active').map(b=>`<option value="${b.id}" ${b.id===plan.bankAccountId?'selected':''}>${escapeHtml(b.bankName)}</option>`).join('');
  const rows = plannedClientIds.map(cid=>{
    const c = findClient(cid);
    const already = S.applications.some(a=>a.planId===planId && a.clientId===cid);
    return `<tr>
      <td><label class="checkbox-row"><input type="checkbox" class="baClient" value="${cid}" ${already?'disabled':'checked'}> ${escapeHtml(c.clientId)} — ${escapeHtml(c.clientName)}</label></td>
      <td><input type="number" class="baAmt" data-cid="${cid}" placeholder="Amount" value="${findIpo(plan.ipoId)?.minimumApplicationAmount||''}" ${already?'disabled':''}></td>
      <td>${already?'<span class="badge gray">Already Applied</span>':''}</td>
    </tr>`;
  }).join('') || `<tr class="empty-row"><td colspan="3">No clients mapped to this plan yet. Use "Clients" on the plan first.</td></tr>`;
  wrap.innerHTML = `
    <div class="form-grid one" style="margin-bottom:10px;">
      <div class="f-group"><label>Application Date</label><input type="date" id="baDate" value="${plan.plannedDate}"></div>
      <div class="f-group"><label>Bank Account</label><select id="baBank" onchange="refreshAppUpiField(this.value,'ba')">${bankOpts}</select></div>
      <div class="f-group"><label>UPI ID (applies to every application in this batch)</label><div id="baupiFieldWrap">${upiOptionsHtml(plan.bankAccountId, null).replace('fld_upiId','bafld_upiId').replace('upiFieldInner','baupiFieldInner')}</div></div>
    </div>
    <div class="table-wrap"><table class="dt"><thead><tr><th>Client</th><th>Amount Applied</th><th></th></tr></thead><tbody>${rows}</tbody></table></div>`;
}
async function submitBulkApply(){
  const planId = Number(document.getElementById('baPlan').value);
  if (!planId){ toast('Select a plan first','warn'); return; }
  const date = document.getElementById('baDate').value;
  const bankAccountId = Number(document.getElementById('baBank').value);
  const upiEl = document.getElementById('bafld_upiId');
  const upiId = upiEl ? (upiEl.value ? Number(upiEl.value) : null) : null;
  const checked = Array.from(document.querySelectorAll('.baClient:checked:not(:disabled)'));
  if (!checked.length){ toast('No clients selected','warn'); return; }
  let count = 0;
  for (const chk of checked){
    const cid = Number(chk.value);
    const amt = Number(document.querySelector(`.baAmt[data-cid="${cid}"]`).value) || 0;
    const plan = findPlan(planId);
    const rec = { clientId:cid, ipoId:plan.ipoId, bankAccountId, applicationDate:date, upiId, amountApplied:amt,
      applicationStatus:'Applied', planId, allotmentStatus:'Pending', allotmentDate:null, saleStatus:null, saleDate:null, saleAmount:null,
      calculatedGrossReceived:null, grossReceived:null, grossReceivedOverridden:false,
      calculatedOurProfit:null, ourProfit:null, ourProfitOverridden:false,
      calculatedClientProfit:null, clientProfit:null, clientProfitOverridden:false,
      createdAt:new Date().toISOString(), updatedAt:new Date().toISOString() };
    const id = await putRec('applications', rec); rec.id = id; S.applications.push(rec);
    await audit('Application Creation','Application', id, null, rec);
    count++;
  }
  toast(`${count} application(s) created`, 'ok');
  closeModal(); navigate('applications');
}
</script>
<script>
/* =================== ALLOTMENTS & SALE =================== */
const ALLOTMENT_STATUSES = ['Pending','Allotted','Not Allotted'];
const SALE_STATUSES = ['Pending to Sell','Sold'];
const RECEIVE_STATUSES = ['Receivable','Received'];

let __selectedAllotIds = new Set();

function viewAllotments(){
  const apps = S.applications
    .filter(a=>a.applicationStatus==='Applied' || a.allotmentStatus==='Allotted' || a.allotmentStatus==='Not Allotted')
    .sort((a,b) => compareDatesDesc(a.allotmentDate, b.allotmentDate) || (b.id - a.id));
  const allotted = apps.filter(a=>a.allotmentStatus==='Allotted');
  const notAllotted = apps.filter(a=>a.allotmentStatus==='Not Allotted');
  const pending = apps.filter(a=>!a.allotmentStatus || a.allotmentStatus==='Pending');
  const allotRate = apps.length ? Math.round((allotted.length/apps.length)*1000)/10 : 0;
  const pendingToSell = allotted.filter(a=>a.saleStatus!=='Sold');
  const totalOurProfit = apps.reduce((s,a)=>{ const c=calcAllotmentSale(a); return s + (c.applicable?c.ourFinal:0); },0);
  const totalClientProfit = apps.reduce((s,a)=>{ const c=calcAllotmentSale(a); return s + (c.applicable?c.clientFinal:0); },0);
  const totalReceived = apps.reduce((s,a)=>{ const c=calcAllotmentSale(a); return s + (c.applicable && a.amountReceiveStatus==='Received' ? c.grossFinal : 0); },0);
  const totalReceivable = apps.reduce((s,a)=>{ const c=calcAllotmentSale(a); return s + (c.applicable && a.amountReceiveStatus==='Receivable' ? c.grossFinal : 0); },0);

  window.__tableRerender['allotTbl'] = () => {
    renderIntoWrap('allotTblWrap', renderDataTable('allotTbl', {
      data: apps,
      searchFn: (r,q) => { const c=findClient(r.clientId), i=findIpo(r.ipoId); return ((c?c.clientName:'')+' '+(i?i.ipoName:'')).toLowerCase().includes(q); },
      searchPlaceholder: 'Search client, IPO...',
      filters: [
        { key:'allotmentStatus', label:'Allotment', options: ALLOTMENT_STATUSES },
        { key:'saleStatus', label:'Sale', options: SALE_STATUSES },
        { key:'amountReceiveStatus', label:'Recovery', options: RECEIVE_STATUSES },
        { key:'ipoId', label:'IPO', options: sortedIpos().map(i=>i.ipoName), match:(r,v)=>{ const i=findIpo(r.ipoId); return i && i.ipoName===v; } },
        { key:'bankAccountId', label:'Bank', options: S.bankAccounts.map(b=>b.bankName), match:(r,v)=>{ const b=findBank(r.bankAccountId); return b && b.bankName===v; } },
        { key:'clientId', label:'Client', options: S.clients.map(c=>c.clientName), match:(r,v)=>{ const c=findClient(r.clientId); return c && c.clientName===v; } }
      ],
      pageSize: 12,
      columns: [
        { key:'sel', label:`<input type="checkbox" onchange="toggleAllAllotSelection(this.checked)">`, render:r=>`<input type="checkbox" class="allotSelCk" ${__selectedAllotIds.has(r.id)?'checked':''} onchange="toggleAllotSelection(${r.id}, this.checked)">` },
        { key:'clientId', label:'Client', render:r=>{ const c=findClient(r.clientId); return escapeHtml(c?c.clientName:'—'); } },
        { key:'ipoId', label:'IPO', render:r=>{ const i=findIpo(r.ipoId); return escapeHtml(i?i.ipoName:'—'); } },
        { key:'amountApplied', label:'Amount Applied', render:r=>fmtMoney(r.amountApplied) },
        { key:'allotmentStatus', label:'Allotment', render:r=>badge(r.allotmentStatus||'Pending') },
        { key:'allotmentDate', label:'Allotment Date', render:r=>fmtDate(r.allotmentDate) },
        { key:'saleStatus', label:'Sale', render:r=>r.saleStatus?badge(r.saleStatus):'—' },
        { key:'saleDate', label:'Sale Date', render:r=>fmtDate(r.saleDate) },
        { key:'saleAmount', label:'Sale Amount', render:r=>fmtMoney(r.saleAmount) },
        { key:'grossReceived', label:'Gross Received', render:r=>{ const c=calcAllotmentSale(r); return c.applicable?(fmtMoney(c.grossFinal)+(c.grossOverridden?overrideBadge('Gross Received', c.calculatedGross, c.grossFinal, r.overrideReason, r.overrideChangedAt):'')):'—'; } },
        { key:'amountReceiveStatus', label:'Recovery Status', render:r=>r.amountReceiveStatus?badge(r.amountReceiveStatus):'—' },
        { key:'ourProfit', label:'Our Profit', render:r=>{ const c=calcAllotmentSale(r); return c.applicable?(fmtMoney(c.ourFinal)+(c.ourOverridden?overrideBadge('Our Profit', c.calculatedOur, c.ourFinal, r.overrideReason, r.overrideChangedAt):'')):'—'; } },
        { key:'clientProfit', label:'Client Profit', render:r=>{ const c=calcAllotmentSale(r); return c.applicable?(fmtMoney(c.clientFinal)+(c.clientOverridden?overrideBadge('Client Profit', c.calculatedClient, c.clientFinal, r.overrideReason, r.overrideChangedAt):'')):'—'; } }
      ],
      rowActions: r => `<button class="btn btn-sm btn-primary" onclick="editAllotmentSale(${r.id})">Update</button>`
    }));
  };
  setTimeout(()=>window.__tableRerender['allotTbl'](), 0);

  return `
  <div class="kpi-grid">
    <div class="kpi-card"><div class="lbl">Total Allotments</div><div class="val ok">${allotted.length}</div></div>
    <div class="kpi-card"><div class="lbl">Not Allotted</div><div class="val danger">${notAllotted.length}</div></div>
    <div class="kpi-card"><div class="lbl">Pending Allotment</div><div class="val">${pending.length}</div></div>
    <div class="kpi-card"><div class="lbl">Allotment Rate</div><div class="val">${allotRate}%</div></div>
    <div class="kpi-card"><div class="lbl">Pending to Sell</div><div class="val gold">${pendingToSell.length}</div></div>
    <div class="kpi-card"><div class="lbl">Total Our Profit</div><div class="val ok">${fmtMoney(totalOurProfit)}</div></div>
    <div class="kpi-card"><div class="lbl">Total Client Profit</div><div class="val">${fmtMoney(totalClientProfit)}</div></div>
    <div class="kpi-card"><div class="lbl">Total Received</div><div class="val ok">${fmtMoney(totalReceived)}</div></div>
    <div class="kpi-card"><div class="lbl">Total Receivable</div><div class="val gold">${fmtMoney(totalReceivable)}</div></div>
  </div>
  <div class="section-card">
    <div class="sc-head" style="flex-wrap:wrap;gap:10px;">
      <h3>Allotments &amp; Sale</h3><div class="spacer"></div>
      <span class="small-muted" id="allotSelCount">Selected: ${__selectedAllotIds.size}</span>
      <button class="btn btn-ghost btn-sm" onclick="clearAllotSelection()">Clear Selection</button>
    </div>
    <div class="sc-body" style="padding-bottom:8px;">
      <div style="display:flex;flex-wrap:wrap;gap:16px;align-items:flex-end;padding:10px 0 14px;border-bottom:1px solid var(--border);margin-bottom:12px;">
        <div class="f-group" style="min-width:200px;">
          <label>Bulk Update — Allotment Status</label>
          <div style="display:flex;gap:6px;">
            <select id="bulkAllotStatusSelect">${ALLOTMENT_STATUSES.map(s=>`<option value="${s}">${s}</option>`).join('')}</select>
            <button class="btn btn-ghost btn-sm" onclick="bulkUpdateAllotmentStatus()">Update</button>
          </div>
        </div>
        <div class="f-group" style="min-width:200px;">
          <label>Bulk Update — Sale Date</label>
          <div style="display:flex;gap:6px;">
            <input type="date" id="bulkSaleDateInput">
            <button class="btn btn-ghost btn-sm" onclick="bulkUpdateSaleDate()">Apply</button>
          </div>
          <div class="hint">Only applies to selected rows that are already Allotted; also sets Sale Status to Sold.</div>
        </div>
      </div>
      <div id="allotTblWrap"></div>
    </div>
  </div>
  <p class="small-muted">There is no partial sale — the entire allotted lot is sold in a single transaction. Gross Received = Applied Amount + 50% × (Sale Amount − Applied Amount); calculated automatically once Allotted + Sold, and independently overridable. Allotment Date is fixed at the IPO level (see IPOs tab) and cannot be edited per application.</p>`;
}
function __refreshAllotSelectionUI(){
  if (window.__tableRerender['allotTbl']) window.__tableRerender['allotTbl']();
  const el = document.getElementById('allotSelCount');
  if (el) el.textContent = 'Selected: ' + __selectedAllotIds.size;
}
function toggleAllotSelection(id, checked){ if (checked) __selectedAllotIds.add(id); else __selectedAllotIds.delete(id); __refreshAllotSelectionUI(); }
function toggleAllAllotSelection(checked){
  const filteredIds = (window.__lastFilteredIds && window.__lastFilteredIds['allotTbl']) || [];
  if (checked) filteredIds.forEach(id => __selectedAllotIds.add(id));
  else filteredIds.forEach(id => __selectedAllotIds.delete(id));
  __refreshAllotSelectionUI();
}
function clearAllotSelection(){ __selectedAllotIds = new Set(); __refreshAllotSelectionUI(); }

async function bulkUpdateAllotmentStatus(){
  if (!__selectedAllotIds.size){ toast('No rows selected','warn'); return; }
  const status = document.getElementById('bulkAllotStatusSelect').value;
  let count = 0;
  for (const id of __selectedAllotIds){
    const a = findApp(id);
    if (!a) continue;
    const ipo = findIpo(a.ipoId);
    const patch = { allotmentStatus: status, allotmentDate: ipo ? (ipo.allotmentDate || null) : null };
    if (status === 'Not Allotted'){ patch.saleStatus = null; patch.saleDate = null; patch.saleAmount = null; }
    else if (status === 'Allotted'){ if (a.saleStatus !== 'Sold') patch.saleStatus = 'Pending to Sell'; }
    else { patch.saleStatus = null; }
    const updated = { ...a, ...patch, updatedAt: new Date().toISOString() };
    await putRec('applications', updated); Object.assign(a, updated);
    await audit('Allotment Updates','Application', id, a, updated);
    count++;
  }
  toast(`Allotment status updated for ${count} row(s)`, 'ok');
  navigate('allotments');
}
async function bulkUpdateSaleDate(){
  if (!__selectedAllotIds.size){ toast('No rows selected','warn'); return; }
  const dateVal = document.getElementById('bulkSaleDateInput').value;
  if (!dateVal){ toast('Pick a sale date first','warn'); return; }
  let count = 0, skipped = 0;
  for (const id of __selectedAllotIds){
    const a = findApp(id);
    if (!a || a.allotmentStatus !== 'Allotted'){ skipped++; continue; }
    const updated = { ...a, saleDate: dateVal, saleStatus: 'Sold', updatedAt: new Date().toISOString() };
    await putRec('applications', updated); Object.assign(a, updated);
    await audit('Allotment Updates','Application', id, a, updated);
    count++;
  }
  toast(`Sale date applied to ${count} row(s)${skipped?`, ${skipped} skipped (not Allotted)`:''}`, 'ok');
  navigate('allotments');
}

function allotmentSaleModalBody(a){
  const calc = calcAllotmentSale(a);
  const ipo = findIpo(a.ipoId);
  const saleSectionDisabled = a.allotmentStatus !== 'Allotted';
  return `<div class="form-grid">
      ${fieldHtml({key:'allotmentStatus',label:'Allotment Status',type:'select',options:ALLOTMENT_STATUSES,onchange:'onAllotmentStatusChange()'}, a.allotmentStatus||'Pending')}
      <div class="f-group"><label>Allotment Date</label><div class="small-muted" style="padding:8px 0;">${ipo && ipo.allotmentDate ? fmtDate(ipo.allotmentDate) : 'Not set on this IPO yet'} <span class="badge gray">Locked — set on the IPO</span></div></div>
      <div class="f-group"><label>Sale Status</label><select id="fld_saleStatus" ${saleSectionDisabled?'disabled':''} onchange="onSaleStatusChange()">
        <option value="">—</option>
        ${SALE_STATUSES.map(s=>`<option value="${s}" ${a.saleStatus===s?'selected':''}>${s}</option>`).join('')}
      </select></div>
      ${fieldHtml({key:'saleDate',label:'Sale Date',type:'date'}, a.saleDate||'')}
      ${fieldHtml({key:'saleAmount',label:'Sale Amount (total for the full allotted lot)',type:'number'}, a.saleAmount!=null?a.saleAmount:'')}
    </div>
    <div id="grossOurClientWrap" style="margin-top:14px;">${grossOurClientFieldsHtml(a, calc)}</div>
    <p class="hint">Applied Amount: ${fmtMoney(a.amountApplied)}${a.applicationStatus!=='Applied'?'<br><b>Note:</b> allotment results are normally only entered once the application status is "Applied".':''}</p>`;
}
function grossOurClientFieldsHtml(a, calc){
  const anyOverridden = calc.applicable && (calc.grossOverridden || calc.ourOverridden || calc.clientOverridden);
  return `<div class="form-grid">
      ${fieldHtml({key:'grossReceived',label:'Gross Amount Received From Client',type:'number',hint:calc.applicable?`Calculated: ${fmtMoney(calc.calculatedGross)}`:'Applicable only once Allotted + Sold'}, (a.grossReceivedOverridden && a.grossReceived!=null) ? a.grossReceived : (calc.applicable?calc.calculatedGross:''))}
      ${fieldHtml({key:'amountReceiveStatus',label:'Recovery Status',type:'select',options:['',...RECEIVE_STATUSES],placeholder:'—'}, a.amountReceiveStatus||'')}
      ${fieldHtml({key:'ourProfit',label:'Our Profit',type:'number',hint:calc.applicable?`Calculated: ${fmtMoney(calc.calculatedOur)}`:'Gross Received − Applied Amount'}, (a.ourProfitOverridden && a.ourProfit!=null) ? a.ourProfit : (calc.applicable?calc.calculatedOur:''))}
      ${fieldHtml({key:'clientProfit',label:'Client Profit',type:'number',hint:calc.applicable?`Calculated: ${fmtMoney(calc.calculatedClient)}`:'Sale Amount − Gross Received'}, (a.clientProfitOverridden && a.clientProfit!=null) ? a.clientProfit : (calc.applicable?calc.calculatedClient:''))}
      <div class="f-group span2"><label>Reason for Manual Override ${anyOverridden?'':'<span class="small-muted">(only used if you override a calculated value above)</span>'}</label>
        <input type="text" id="fld_overrideReason" value="${escapeHtml(a.overrideReason||'')}" placeholder="e.g. Brokerage adjustment agreed with client">
      </div>
    </div>`;
}
function overrideBadge(fieldLabel, calculated, final, reason, changedAt){
  const payload = escapeHtml(JSON.stringify({ fieldLabel, calculated, final, reason: reason||'Not recorded', changedAt: changedAt?fmtDate(changedAt):'Not recorded' }));
  return ` <span class="badge gold" style="cursor:pointer;" onclick='showOverrideDetail(this)' data-override="${payload}">&#9888; Manual Override</span>`;
}
function showOverrideDetail(el){
  const d = JSON.parse(el.getAttribute('data-override'));
  openModal('Manual Override — ' + escapeHtml(d.fieldLabel),
    `<p style="font-size:13px;line-height:1.6;">
       <b>Calculated:</b> ${fmtMoney(d.calculated)}<br>
       <b>Manual:</b> ${fmtMoney(d.final)}<br>
       <b>Changed:</b> ${escapeHtml(d.changedAt)}<br>
       <b>Reason:</b> ${escapeHtml(d.reason)}
     </p>`,
    `<button class="btn btn-primary" onclick="closeModal()">Close</button>`);
}
function editAllotmentSale(id){
  const a = findApp(id);
  const c = findClient(a.clientId), i = findIpo(a.ipoId);
  openModal(`Allotment &amp; Sale — ${escapeHtml(c?c.clientName:'')} · ${escapeHtml(i?i.ipoName:'')}`,
    allotmentSaleModalBody(a),
    `<button class="btn btn-ghost" onclick="closeModal()">Cancel</button><button class="btn btn-primary" onclick="saveAllotmentSale(${id})">Save</button>`, true);
}
function onAllotmentStatusChange(){
  const status = document.getElementById('fld_allotmentStatus').value;
  const saleSel = document.getElementById('fld_saleStatus');
  if (status !== 'Allotted'){
    saleSel.value = ''; saleSel.disabled = true;
  } else {
    saleSel.disabled = false;
    if (!saleSel.value) saleSel.value = 'Pending to Sell';
  }
  onSaleStatusChange();
}
function onSaleStatusChange(){
  // Gross/Our/Client Profit are (re)computed on save; nothing to do live here beyond enabling/disabling the Sale Status field, handled in onAllotmentStatusChange.
}
async function saveAllotmentSale(id, force){
  const data = readFields([{key:'allotmentStatus'},{key:'saleStatus'},{key:'saleDate'},{key:'saleAmount',type:'number'},{key:'grossReceived',type:'number'},{key:'amountReceiveStatus'},{key:'ourProfit',type:'number'},{key:'clientProfit',type:'number'}]);
  const a = findApp(id);
  const ipo = findIpo(a.ipoId);
  data.allotmentDate = ipo ? (ipo.allotmentDate || null) : null; // hard-locked to the IPO's allotment date

  if ((data.allotmentStatus === 'Allotted' || data.allotmentStatus === 'Not Allotted') && a.applicationStatus !== 'Applied' && !force){
    openModal('Validation Warning',
      `<p style="font-size:13px;">Allotment results are normally only entered when Application Status is "Applied". This application is currently "${escapeHtml(a.applicationStatus)}".</p><p class="small-muted">You can still save.</p>`,
      `<button class="btn btn-ghost" onclick="closeModal()">Cancel</button><button class="btn btn-danger" onclick="saveAllotmentSale(${id}, true)">Save Anyway</button>`);
    return;
  }

  if (data.allotmentStatus === 'Not Allotted'){ data.saleStatus = null; data.saleDate = null; data.saleAmount = null; }
  if (data.allotmentStatus !== 'Allotted'){ data.saleStatus = null; }
  if (data.allotmentStatus === 'Allotted' && !data.saleStatus) data.saleStatus = 'Pending to Sell';
  if (!data.amountReceiveStatus) data.amountReceiveStatus = null;

  if (data.saleAmount!=null && Number(data.saleAmount) < 0){ toast('Sale Amount cannot be negative','warn'); return; }
  if (data.grossReceived!=null && Number(data.grossReceived) < 0){ toast('Gross Received cannot be negative','warn'); return; }
  if (data.ourProfit!=null && Number(data.ourProfit) < 0){ toast('Our Profit cannot be negative — if this is intentional (e.g. a loss), please flag it for review rather than saving silently','warn'); return; }

  const warns = [];
  if (data.saleStatus === 'Sold' && !data.saleDate) warns.push('Sale Date is required when Sale Status is Sold.');
  if (data.saleDate && data.allotmentDate && data.saleDate < data.allotmentDate) warns.push('Sale date is before allotment date.');
  if (data.allotmentDate && a.applicationDate && data.allotmentDate < a.applicationDate) warns.push('Allotment date (from the IPO) is before this application\u2019s application date.');
  if (warns.length && !force){
    openModal('Date / Status Warning', `<p style="font-size:13px;">${warns.join('<br>')}</p><p class="small-muted">You can still save.</p>`,
      `<button class="btn btn-ghost" onclick="closeModal()">Cancel</button><button class="btn btn-danger" onclick="saveAllotmentSale(${id}, true)">Save Anyway</button>`);
    return;
  }

  // detect manual overrides: user-entered value differs from the auto-calculated one
  const probe = { ...a, ...data };
  const calc = calcAllotmentSale({ ...probe, grossReceivedOverridden:false, ourProfitOverridden:false, clientProfitOverridden:false });
  const grossReceivedOverridden = calc.applicable && isFilled(data.grossReceived) && Number(data.grossReceived) !== calc.calculatedGross;
  const ourProfitOverridden = calc.applicable && isFilled(data.ourProfit) && Number(data.ourProfit) !== calc.calculatedOur;
  const clientProfitOverridden = calc.applicable && isFilled(data.clientProfit) && Number(data.clientProfit) !== calc.calculatedClient;
  const anyOverridden = grossReceivedOverridden || ourProfitOverridden || clientProfitOverridden;
  const wasOverridden = a.grossReceivedOverridden || a.ourProfitOverridden || a.clientProfitOverridden;
  const overrideReasonInput = (document.getElementById('fld_overrideReason')?.value || '').trim();
  // Only bump the "changed" timestamp when the override state genuinely changes this save —
  // editing an unrelated field shouldn't make an old override look freshly changed.
  const overrideStateChanged = anyOverridden && (!wasOverridden || overrideReasonInput !== (a.overrideReason||'') ||
    (grossReceivedOverridden && Number(data.grossReceived) !== Number(a.grossReceived)) ||
    (ourProfitOverridden && Number(data.ourProfit) !== Number(a.ourProfit)) ||
    (clientProfitOverridden && Number(data.clientProfit) !== Number(a.clientProfit)));
  const overrideReason = anyOverridden ? (overrideReasonInput || a.overrideReason || null) : null;
  const overrideChangedAt = anyOverridden ? (overrideStateChanged ? new Date().toISOString() : (a.overrideChangedAt || new Date().toISOString())) : null;

  const updated = { ...a, ...data,
    grossReceivedOverridden, ourProfitOverridden, clientProfitOverridden,
    overrideReason, overrideChangedAt,
    calculatedGrossReceived: calc.applicable ? calc.calculatedGross : null,
    calculatedOurProfit: calc.applicable ? calc.calculatedOur : null,
    calculatedClientProfit: calc.applicable ? calc.calculatedClient : null,
    updatedAt: new Date().toISOString() };
  await putRec('applications', updated); Object.assign(a, updated);
  await audit('Allotment Updates','Application', id, a, updated);
  toast('Allotment / sale updated','ok');
  closeModal(); navigate('allotments');
}

</script>
<script>
/* =================== DASHBOARD =================== */
let dashRange = { preset:'thisMonth', from:null, to:null };

function fyRange(offsetYears){
  const now = new Date();
  let fyStartYear = now.getMonth() >= 3 ? now.getFullYear() : now.getFullYear()-1;
  fyStartYear -= offsetYears;
  return { from: `${fyStartYear}-04-01`, to: `${fyStartYear+1}-03-31` };
}
function resolveDashRange(){
  const now = new Date();
  const y = now.getFullYear(), m = now.getMonth(), d = now.getDate();
  const p = dashRange.preset;
  if (p === 'today') return { from: todayStr(), to: todayStr() };
  if (p === 'thisWeek'){
    const dow = now.getDay();
    const start = new Date(now); start.setDate(d - dow);
    const end = new Date(start); end.setDate(start.getDate()+6);
    return { from: isoDate(start), to: isoDate(end) };
  }
  if (p === 'thisMonth') return { from: isoDate(new Date(y,m,1)), to: isoDate(new Date(y,m+1,0)) };
  if (p === 'prevMonth') return { from: isoDate(new Date(y,m-1,1)), to: isoDate(new Date(y,m,0)) };
  if (p === 'thisFY') return fyRange(0);
  if (p === 'prevFY') return fyRange(1);
  if (p === 'custom') return { from: dashRange.from || '0001-01-01', to: dashRange.to || '9999-12-31' };
  return { from: '0001-01-01', to: '9999-12-31' };
}
function inRange(dateStr, r){ return dateStr && dateStr >= r.from && dateStr <= r.to; }

function viewDashboard(){
  return `<div id="dashBody"></div>`;
}
function afterDashboard(){ document.getElementById('dashBody').innerHTML = dashboardBody(); }
function setDashPreset(p){ dashRange.preset = p; render(); }
function setDashCustom(){
  dashRange.preset = 'custom';
  dashRange.from = document.getElementById('dashFrom').value;
  dashRange.to = document.getElementById('dashTo').value;
  render();
}

function dashboardBody(){
  const today = todayStr();
  const now = new Date();
  const monthStart = isoDate(new Date(now.getFullYear(), now.getMonth(), 1));
  const yearStart = isoDate(new Date(now.getFullYear(), 0, 1));

  // ---- Fixed "Overview" figures: always real calendar month/year/today,
  // independent of the selectable date-range below. ----
  const soldThisMonth = S.applications.filter(a=>a.saleStatus==='Sold' && a.saleDate>=monthStart && a.saleDate<=today);
  const soldThisYear = S.applications.filter(a=>a.saleStatus==='Sold' && a.saleDate>=yearStart && a.saleDate<=today);
  const monthlyProfit = soldThisMonth.reduce((s,a)=>{ const c=calcAllotmentSale(a); return s+(c.applicable?c.ourFinal:0); },0);
  const yearlyProfit = soldThisYear.reduce((s,a)=>{ const c=calcAllotmentSale(a); return s+(c.applicable?c.ourFinal:0); },0);
  const avgProfitPerMonth = Math.round(yearlyProfit / (now.getMonth()+1));
  const pendingReceivables = S.applications.reduce((s,a)=>{ const c=calcAllotmentSale(a); return s+(c.applicable && a.amountReceiveStatus==='Receivable' ? c.grossFinal : 0); },0);
  const activeIpos = S.ipos.filter(i=>ipoStatus(i)==='Open').length;
  const appsToday = S.applications.filter(a=>a.applicationDate===today).length;
  // Capital Blocked: only applications still awaiting an allotment decision — matches the
  // same "Amount Blocked" definition used in Reports > Bank Analysis (Pending only, not
  // Not Allotted or already-resolved applications).
  const capitalBlocked = S.applications.filter(a=>!a.allotmentStatus || a.allotmentStatus==='Pending').reduce((s,a)=>s+(Number(a.amountApplied)||0),0);
  const pendingAllotmentCount = S.applications.filter(a=>!a.allotmentStatus || a.allotmentStatus==='Pending').length;

  const overviewGrid = `
  <div class="kpi-grid">
    <div class="kpi-card"><div class="lbl">Monthly Profit</div><div class="val gold">${fmtMoney(monthlyProfit)}</div></div>
    <div class="kpi-card"><div class="lbl">Yearly Profit</div><div class="val gold">${fmtMoney(yearlyProfit)}</div></div>
    <div class="kpi-card"><div class="lbl">Avg Profit / Month</div><div class="val">${fmtMoney(avgProfitPerMonth)}</div></div>
    <div class="kpi-card"><div class="lbl">Pending Receivables</div><div class="val ${pendingReceivables>0?'danger':''}">${fmtMoney(pendingReceivables)}</div></div>
    <div class="kpi-card"><div class="lbl">Active IPOs</div><div class="val ok">${activeIpos}</div></div>
    <div class="kpi-card"><div class="lbl">Applications Today</div><div class="val">${appsToday}</div></div>
    <div class="kpi-card"><div class="lbl">Total Capital Blocked</div><div class="val">${fmtMoney(capitalBlocked)}</div></div>
    <div class="kpi-card"><div class="lbl">Pending Allotment</div><div class="val ${pendingAllotmentCount>0?'danger':''}">${pendingAllotmentCount}</div></div>
  </div>`;

  // ---- Today's Work ----
  const todaysIpoItems = [];
  S.ipos.forEach(i=>{
    if (i.openDate===today) todaysIpoItems.push(`<div>&#128994; <b>${escapeHtml(i.ipoName)}</b> — Opens today</div>`);
    if (i.closeDate===today) todaysIpoItems.push(`<div>&#128994; <b>${escapeHtml(i.ipoName)}</b> — Closes today</div>`);
    if (ipoStatus(i)==='Open' && i.openDate!==today && i.closeDate!==today) todaysIpoItems.push(`<div>&#128994; <b>${escapeHtml(i.ipoName)}</b> — Currently open</div>`);
    if (i.allotmentDate===today) todaysIpoItems.push(`<div>&#128309; <b>${escapeHtml(i.ipoName)}</b> — Allotment today</div>`);
  });

  const awaitingAllotment = S.applications.filter(a=>a.applicationStatus==='Applied' && (!a.allotmentStatus || a.allotmentStatus==='Pending')).length;
  const awaitingSale = S.applications.filter(a=>a.allotmentStatus==='Allotted' && a.saleStatus!=='Sold').length;
  const awaitingReceipt = S.applications.filter(a=>a.saleStatus==='Sold' && a.amountReceiveStatus==='Receivable').length;
  const amountAwaitingReceipt = S.applications.reduce((s,a)=>{ const c=calcAllotmentSale(a); return s+(c.applicable && a.amountReceiveStatus==='Receivable' ? c.grossFinal : 0); },0);

  const actionItems = [
    awaitingAllotment ? `<div class="clickable" onclick="navigate('allotments', {presetFilter:{tableId:'allotTbl', filterVals:{allotmentStatus:'Pending'}}})">${awaitingAllotment} application${awaitingAllotment===1?'':'s'} awaiting allotment</div>` : '',
    awaitingSale ? `<div class="clickable" onclick="navigate('allotments', {presetFilter:{tableId:'allotTbl', filterVals:{allotmentStatus:'Allotted', saleStatus:'Pending to Sell'}}})">${awaitingSale} allotted application${awaitingSale===1?'':'s'} awaiting sale</div>` : '',
    awaitingReceipt ? `<div class="clickable" onclick="navigate('allotments', {presetFilter:{tableId:'allotTbl', filterVals:{amountReceiveStatus:'Receivable'}}})">${awaitingReceipt} sold application${awaitingReceipt===1?'':'s'} awaiting receipt (${fmtMoney(amountAwaitingReceipt)})</div>` : ''
  ].filter(Boolean);

  const todaysWorkHtml = `
  <div class="section-card">
    <div class="sc-head"><h3>Today's Work — ${fmtDate(today)}</h3></div>
    <div class="sc-body">
      <b>Today's IPOs</b>
      <div style="margin:6px 0 14px 0;">${todaysIpoItems.length ? todaysIpoItems.join('') : '<div class="small-muted">No IPO activity today.</div>'}</div>
      <b>Action Required</b>
      <div style="margin-top:6px;">${actionItems.length ? actionItems.join('') : '<div class="small-muted">Nothing pending — all caught up.</div>'}</div>
    </div>
  </div>`;

  const r = resolveDashRange();
  const appsInRange = S.applications.filter(a => inRange(a.applicationDate, r));
  const plansInRange = S.ipoPlans.filter(p => inRange(p.plannedDate, r));
  const allottedInRange = S.applications.filter(a => inRange(a.allotmentDate, r));
  const notAllottedInRange = allottedInRange.filter(a=>a.allotmentStatus==='Not Allotted');
  const soldInRange = S.applications.filter(a => inRange(a.saleDate, r) && a.saleStatus==='Sold');
  const profitInRange = soldInRange.reduce((s,a)=>{ const c=calcAllotmentSale(a); return s+(c.applicable?c.ourFinal:0); }, 0);
  const amountAppliedInRange = appsInRange.reduce((s,a)=>s+(Number(a.amountApplied)||0),0);
  const grossInRange = soldInRange.reduce((s,a)=>{ const c=calcAllotmentSale(a); return s+(c.applicable?c.grossFinal:0); },0);
  const avgProfit = allottedInRange.filter(a=>a.allotmentStatus==='Allotted').length ? Math.round(profitInRange / allottedInRange.filter(a=>a.allotmentStatus==='Allotted').length) : 0;
  const pendingToSell = S.applications.filter(a=>a.allotmentStatus==='Allotted' && a.saleStatus!=='Sold').length;
  const upcomingIpos = S.ipos.filter(i=>ipoStatus(i)==='Upcoming').length;
  const needPlanning = S.ipos.filter(i=>ipoStatus(i)!=='Closed' && upcomingPlanningStatus(i)==='Not Planned').length;

  const presetBtns = [
    ['today','Today'],['thisWeek','This Week'],['thisMonth','This Month'],['prevMonth','Previous Month'],
    ['thisFY','Current FY'],['prevFY','Previous FY'],['custom','Custom']
  ].map(([k,l]) => `<button class="btn btn-sm ${dashRange.preset===k?'btn-primary':'btn-ghost'}" onclick="setDashPreset('${k}')">${l}</button>`).join('');

  const attn = buildAttentionList();
  const attnHtml = attn.length ? attn.map(a=>`<div class="attn-item ${a.level}"><span class="tag">${a.level}</span><span>${a.text}</span></div>`).join('')
    : `<div class="small-muted">Nothing needs attention right now.</div>`;

  return `
  ${overviewGrid}
  ${todaysWorkHtml}

  <div class="section-card">
    <div class="sc-body" style="display:flex;flex-wrap:wrap;gap:8px;align-items:center;">
      ${presetBtns}
      ${dashRange.preset==='custom' ? `<input type="date" id="dashFrom" value="${dashRange.from||''}" onchange="setDashCustom()"><span>to</span><input type="date" id="dashTo" value="${dashRange.to||''}" onchange="setDashCustom()">` : ''}
      <span class="small-muted" style="margin-left:auto;">Showing: ${fmtDate(r.from)} – ${fmtDate(r.to)}</span>
    </div>
  </div>

  <div class="kpi-grid">
    <div class="kpi-card"><div class="lbl">Total Clients</div><div class="val">${S.clients.length}</div></div>
    <div class="kpi-card"><div class="lbl">Total IPOs</div><div class="val">${S.ipos.length}</div></div>
    <div class="kpi-card"><div class="lbl">Applications (period)</div><div class="val">${appsInRange.length}</div></div>
    <div class="kpi-card"><div class="lbl">Allotments (period)</div><div class="val ok">${allottedInRange.filter(a=>a.allotmentStatus==='Allotted').length}</div></div>
    <div class="kpi-card"><div class="lbl">Not Allotted (period)</div><div class="val danger">${notAllottedInRange.length}</div></div>
    <div class="kpi-card"><div class="lbl">Sold (period)</div><div class="val">${soldInRange.length}</div></div>
    <div class="kpi-card"><div class="lbl">Amount Applied (period)</div><div class="val">${fmtMoney(amountAppliedInRange)}</div></div>
    <div class="kpi-card"><div class="lbl">Gross Received (period)</div><div class="val">${fmtMoney(grossInRange)}</div></div>
    <div class="kpi-card"><div class="lbl">Our Profit (period)</div><div class="val gold">${fmtMoney(profitInRange)}</div></div>
    <div class="kpi-card"><div class="lbl">Avg Profit / Allotment</div><div class="val">${fmtMoney(avgProfit)}</div></div>
    <div class="kpi-card"><div class="lbl">Pending to Sell</div><div class="val">${pendingToSell}</div></div>
    <div class="kpi-card"><div class="lbl">Upcoming IPOs</div><div class="val">${upcomingIpos}</div></div>
    <div class="kpi-card"><div class="lbl">IPOs Requiring Planning</div><div class="val danger">${needPlanning}</div></div>
  </div>
  <p class="small-muted">Date basis: Applications use Application Date · Planning uses Planned Date · Allotments use Allotment Date · Profit/Sales use Sale Date.</p>

  <div class="section-card">
    <div class="sc-head"><h3>What Needs Attention?</h3></div>
    <div class="sc-body attn-list">${attnHtml}</div>
  </div>

  ${operationalDailyPlannerHtml()}
  `;
}

function buildAttentionList(){
  const items = [];
  const today = todayStr();
  const tomorrow = isoDate(new Date(Date.now()+86400000));
  S.ipos.forEach(i=>{
    if (i.openDate===today) items.push({level:'high', text:`IPO opening today: ${escapeHtml(i.ipoName)}`});
    if (i.openDate===tomorrow) items.push({level:'med', text:`IPO opening tomorrow: ${escapeHtml(i.ipoName)}`});
    if (i.closeDate===today) items.push({level:'high', text:`IPO closing today: ${escapeHtml(i.ipoName)}`});
    if (i.closeDate===tomorrow) items.push({level:'med', text:`IPO closing tomorrow: ${escapeHtml(i.ipoName)}`});
    if (ipoStatus(i)!=='Closed' && upcomingPlanningStatus(i)==='Not Planned') items.push({level:'med', text:`IPO not planned: ${escapeHtml(i.ipoName)}`});
  });
  S.bankAccounts.filter(b=>b.status==='Active').forEach(b=>{
    const cap = bankCapacity(b.id, today);
    if (cap.status==='Over Capacity') items.push({level:'high', text:`Bank capacity exceeded: ${escapeHtml(b.bankName)} today (${cap.planned}/6)`});
    else if (cap.status==='Full' || cap.status==='Near Capacity') items.push({level:'med', text:`Bank capacity nearly full: ${escapeHtml(b.bankName)} today (${cap.planned}/6)`});
  });
  S.ipoPlans.forEach(p=>{ if (planVariance(p)==='Pending' && p.plannedDate < today) items.push({level:'med', text:`Planned application not yet executed: ${escapeHtml(findIpo(p.ipoId)?.ipoName||'')} (${fmtDate(p.plannedDate)})`}); });
  S.applications.filter(a=>a.allotmentStatus==='Allotted' && a.saleStatus!=='Sold').forEach(a=>{ const c=findClient(a.clientId); items.push({level:'low', text:`Pending to sell: ${escapeHtml(c?c.clientName:'')} — ${escapeHtml(findIpo(a.ipoId)?.ipoName||'')}`}); });
  const order = {high:0, med:1, low:2};
  return items.sort((a,b)=>order[a.level]-order[b.level]).slice(0,20);
}

function operationalDailyPlannerHtml(){
  const today = todayStr();
  const activeBanks = S.bankAccounts.filter(b=>b.status==='Active');
  const bankBlocks = activeBanks.map(b=>{
    const cap = bankCapacity(b.id, today);
    const list = cap.plans.map(p=>{ const ipo=findIpo(p.ipoId); return `<li>${escapeHtml(ipo?ipo.ipoName:'')}</li>`; }).join('');
    return `<div style="margin-bottom:8px;"><b>${escapeHtml(b.bankName)}</b> — <span class="cap-cell ${capClass(cap.status)}">${cap.planned}/6</span>
      ${list?`<ul style="margin:4px 0 0 18px;font-size:12px;">${list}</ul>`:'<div class="small-muted">No IPOs planned today</div>'}</div>`;
  }).join('') || '<div class="small-muted">No active bank accounts.</div>';

  const plannedClientsToday = S.ipoPlans.filter(p=>p.plannedDate===today).reduce((s,p)=>s+(S.plannedClients.filter(pc=>pc.planId===p.id).length),0);
  const appsToday = S.applications.filter(a=>a.applicationDate===today).length;
  const pendingToday = Math.max(0, plannedClientsToday - appsToday);

  const closingToday = S.ipos.filter(i=>i.closeDate===today).length;
  const fullBanks = activeBanks.filter(b=>bankCapacity(b.id,today).status!=='Available').length;
  const notAppliedYet = plannedClientsToday - appsToday;

  return `
  <div class="section-card">
    <div class="sc-head"><h3>Operational Daily Planner — ${fmtDate(today)}</h3></div>
    <div class="sc-body">
      <div class="form-grid">
        <div><b>IPO Applications by Bank</b>${bankBlocks}</div>
        <div>
          <b>Client Work</b>
          <ul style="margin:8px 0 0 18px;font-size:12.5px;line-height:1.8;">
            <li>${plannedClientsToday} clients planned</li>
            <li>${appsToday} applications completed</li>
            <li>${pendingToday} pending</li>
          </ul>
          <b>Alerts</b>
          <ul style="margin:8px 0 0 18px;font-size:12.5px;line-height:1.8;">
            <li>${closingToday} IPO(s) closing today</li>
            <li>${fullBanks} bank(s) at/near full capacity</li>
            <li>${Math.max(0,notAppliedYet)} client(s) not yet applied</li>
          </ul>
        </div>
      </div>
    </div>
  </div>`;
}
</script>
<script>
/* =================== REPORTS =================== */

  if (reportsTab==='planning') return reportPlanningPerformance();

function reportTrends(){

  <div class="section-card">

  </div>

  <div class="section-card">

  <div class="section-card">

  <div class="section-card">
    <div class="sc-head"><h3>Application Lifecycle Funnel</h3></div>

  </div>

  <div class="section-card">

      <div id="yoySummaryWrap"></div>
      <canvas id="chartYoY" height="90" style="margin-top:14px;"></canvas>
    </div>
  </div>

  <div class="section-card">

    <div class="sc-body" id="topIposWrap"></div>

  <div class="section-card">
