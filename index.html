function dateWarnings(data){
  const warns = [];
  const ipo = findIpo(data.ipoId);
  if (ipo && data.applicationDate && (data.applicationDate < ipo.openDate || data.applicationDate > ipo.closeDate)) warns.push('Application date is outside the IPO open/close period.');
  return warns;
}
async function saveApplication(id, force){
  const fields = [{key:'clientId',type:'number'},{key:'ipoId',type:'number'},{key:'bankAccountId',type:'number'},{key:'applicationDate'},{key:'amountApplied',type:'number'},{key:'applicationStatus'},{key:'planId',type:'number'},{key:'notes'}];
  const data = readFields(fields);
  const upiEl = document.getElementById('fld_upiId');
  data.upiId = upiEl ? (upiEl.value ? Number(upiEl.value) : null) : null;
  if (!data.clientId || !data.ipoId || !data.bankAccountId || !data.applicationDate || data.amountApplied===''||data.amountApplied==null){ toast('Client, IPO, bank, date and amount are required','warn'); return; }
  if (!data.planId) data.planId = null;

  const warns = dateWarnings(data);
  const dupe = S.applications.find(x => x.id!==id && x.clientId===data.clientId && x.ipoId===data.ipoId && x.bankAccountId===data.bankAccountId);
  if (dupe) warns.push('This client already has an application for this IPO from this bank account — this looks like a duplicate.');
  if (data.upiId){ const u = S.applications.find(x => x.id!==id && x.ipoId===data.ipoId && x.upiId===data.upiId && isLiveApp(x)); if (u){ const uc=findClient(u.clientId); warns.push(`This UPI ID is already used for this IPO${uc?' by '+escapeHtml(uc.clientName):''} — a UPI ID can normally apply only once per IPO.`); } }
  if (warns.length && !force){
    openModal('Date Warning', `<p style="font-size:13px;">${warns.join('<br>')}</p><p class="small-muted">You can still save this record.</p>`,
      `<button class="btn btn-ghost" onclick="closeModal()">Cancel</button><button class="btn btn-danger" onclick="saveApplication(${id||'null'}, true)">Save Anyway</button>`);
    return;
  }

  if (id){
    const existing = findApp(id);
    const updated = { ...existing, ...data, updatedAt: new Date().toISOString() };
    await putRec('applications', updated); const __prev10 = {...existing}; Object.assign(existing, updated);
    await audit('Application Status Change','Application', id, __prev10, updated);
    toast('Application updated','ok');
  } else {
    const rec = { ...data, profitSharePct: shareForClient(data.clientId), allotmentStatus:'Pending', allotmentDate:null, saleStatus:null, saleDate:null, saleAmount:null,
      calculatedGrossReceived:null, grossReceived:null, grossReceivedOverridden:false,
      calculatedOurProfit:null, ourProfit:null, ourProfitOverridden:false,
      calculatedClientProfit:null, clientProfit:null, clientProfitOverridden:false,
      createdAt:new Date().toISOString(), updatedAt:new Date().toISOString() };
    const newId = await putRec('applications', rec); rec.id = newId; S.applications.push(rec);
    await audit('Application Creation','Application', newId, null, rec);
    toast('Application created','ok');
  }
  closeModal(); navigate('applications');
}
function deleteApplication(id){
  const a = findApp(id);
  const c = a ? calcAllotmentSale(a) : null;
  const stakes = a ? [
    `Amount Applied: ${fmtMoney(a.amountApplied)}`,
    a.allotmentStatus ? `Allotment: ${escapeHtml(a.allotmentStatus)}` : '',
    (c && c.applicable) ? `Recorded Profit: ${fmtMoney(c.ourFinal)}` : ''
  ].filter(Boolean).join(' · ') : '';
  confirmAction(`Delete this application record? This will permanently remove it from reporting.${stakes ? '<br><span class="small-muted">'+stakes+'</span>' : ''}`, async () => {
    await delRec('applications', id);
    S.applications = S.applications.filter(x=>x.id!==id);
    await audit('Application Deletion','Application', id, a, null);
    toast('Application deleted','ok'); navigate('applications');
  });
}

/* ---- bulk apply from plan ---- */
function bulkApplyFromPlan(){
  const openPlans = sortedPlans(S.ipoPlans.filter(p=>p.planStatus!=='Cancelled'));
  const opts = openPlans.map(p=>{ const ipo=findIpo(p.ipoId); const bank=findBank(p.bankAccountId); return `<option value="${p.id}">${escapeHtml(ipo?ipo.ipoName:'')} · ${escapeHtml(bank?bank.bankName:'')} · ${fmtDate(p.plannedDate)}</option>`; }).join('');
  openModal('Bulk Apply from Plan',
    `<div class="f-group"><label>Select Plan</label><select id="baPlan" onchange="renderBulkApplyClients()"><option value="">Select a plan</option>${opts}</select></div>
     <div id="baClientsWrap" style="margin-top:12px;"></div>`,
    `<button class="btn btn-ghost" onclick="closeModal()">Cancel</button><button class="btn btn-primary" onclick="submitBulkApply()">Mark Selected as Applied</button>`, true);
}
function renderBulkApplyClients(){
  const planId = Number(document.getElementById('baPlan').value);
  const wrap = document.getElementById('baClientsWrap');
  if (!planId){ wrap.innerHTML=''; return; }
  const plan = findPlan(planId);
  const plannedClientIds = S.plannedClients.filter(pc=>pc.planId===planId).map(pc=>pc.clientId);
  const bankOpts = S.bankAccounts.filter(b=>b.status==='Active').map(b=>`<option value="${b.id}" ${b.id===plan.bankAccountId?'selected':''}>${escapeHtml(b.bankName)}</option>`).join('');
  const rows = plannedClientIds.map(cid=>{
    const c = findClient(cid);
    const already = S.applications.some(a=>a.planId===planId && a.clientId===cid);
    return `<tr>
      <td><label class="checkbox-row"><input type="checkbox" class="baClient" value="${cid}" ${already?'disabled':'checked'}> ${escapeHtml(c.clientId)} — ${escapeHtml(c.clientName)}</label></td>
      <td><input type="number" class="baAmt" data-cid="${cid}" placeholder="Amount" value="${findIpo(plan.ipoId)?.minimumApplicationAmount||''}" ${already?'disabled':''}></td>
      <td>${already?'<span class="badge gray">Already Applied</span>':''}</td>
    </tr>`;
  }).join('') || `<tr class="empty-row"><td colspan="3">No clients mapped to this plan yet. Use "Clients" on the plan first.</td></tr>`;
  wrap.innerHTML = `
    <div class="form-grid one" style="margin-bottom:10px;">
      <div class="f-group"><label>Application Date</label><input type="date" id="baDate" value="${plan.plannedDate}"></div>
      <div class="f-group"><label>Bank Account</label><select id="baBank" onchange="refreshAppUpiField(this.value,'ba')">${bankOpts}</select></div>
      <div class="f-group"><label>UPI ID (applies to every application in this batch)</label><div id="baupiFieldWrap">${upiOptionsHtml(plan.bankAccountId, null).replace('fld_upiId','bafld_upiId').replace('upiFieldInner','baupiFieldInner')}</div></div>
    </div>
    <div class="table-wrap"><table class="dt"><thead><tr><th>Client</th><th>Amount Applied</th><th></th></tr></thead><tbody>${rows}</tbody></table></div>`;
}
async function submitBulkApply(){
  const planId = Number(document.getElementById('baPlan').value);
  if (!planId){ toast('Select a plan first','warn'); return; }
  const date = document.getElementById('baDate').value;
  const bankAccountId = Number(document.getElementById('baBank').value);
  const upiEl = document.getElementById('bafld_upiId');
  const upiId = upiEl ? (upiEl.value ? Number(upiEl.value) : null) : null;
  const checked = Array.from(document.querySelectorAll('.baClient:checked:not(:disabled)'));
  if (!checked.length){ toast('No clients selected','warn'); return; }
  let count = 0;
  for (const chk of checked){
    const cid = Number(chk.value);
    const amt = Number(document.querySelector(`.baAmt[data-cid="${cid}"]`).value) || 0;
    const plan = findPlan(planId);
    const rec = { clientId:cid, ipoId:plan.ipoId, bankAccountId, applicationDate:date, upiId, amountApplied:amt,
      applicationStatus:'Applied', planId, profitSharePct: shareForClient(cid), allotmentStatus:'Pending', allotmentDate:null, saleStatus:null, saleDate:null, saleAmount:null,
      calculatedGrossReceived:null, grossReceived:null, grossReceivedOverridden:false,
      calculatedOurProfit:null, ourProfit:null, ourProfitOverridden:false,
      calculatedClientProfit:null, clientProfit:null, clientProfitOverridden:false,
      createdAt:new Date().toISOString(), updatedAt:new Date().toISOString() };
    const id = await putRec('applications', rec); rec.id = id; S.applications.push(rec);
    await audit('Application Creation','Application', id, null, rec);
    count++;
  }
  toast(`${count} application(s) created`, 'ok');
  closeModal(); navigate('applications');
}
</script>
<script>
/* =================== ALLOTMENTS & SALE =================== */
const ALLOTMENT_STATUSES = ['Pending','Allotted','Not Allotted'];
const SALE_STATUSES = ['Pending to Sell','Sold'];
const RECEIVE_STATUSES = ['Receivable','Received'];

let __selectedAllotIds = new Set();

function viewAllotments(){
  const apps = S.applications
    .filter(a=>a.applicationStatus==='Applied' || a.allotmentStatus==='Allotted' || a.allotmentStatus==='Not Allotted')
    .sort((a,b) => compareDatesDesc(a.allotmentDate, b.allotmentDate) || (b.id - a.id));
  const allotted = apps.filter(a=>a.allotmentStatus==='Allotted');
  const notAllotted = apps.filter(a=>a.allotmentStatus==='Not Allotted');
  const pending = apps.filter(a=>isLiveApp(a) && (!a.allotmentStatus || a.allotmentStatus==='Pending'));
  const allotRate = apps.length ? Math.round((allotted.length/apps.length)*1000)/10 : 0;
  const pendingToSell = allotted.filter(a=>a.saleStatus!=='Sold');
  const totalOurProfit = apps.reduce((s,a)=>{ const c=calcAllotmentSale(a); return s + (c.applicable?c.ourFinal:0); },0);
  const totalClientProfit = apps.reduce((s,a)=>{ const c=calcAllotmentSale(a); return s + (c.applicable?c.clientFinal:0); },0);
  const totalReceived = apps.reduce((s,a)=>{ const c=calcAllotmentSale(a); return s + (c.applicable && a.amountReceiveStatus==='Received' ? c.grossFinal : 0); },0);
  const totalReceivable = apps.reduce((s,a)=>s + recvDue(a),0);

  window.__tableRerender['allotTbl'] = () => {
    renderIntoWrap('allotTblWrap', renderDataTable('allotTbl', {
      data: apps,
      searchFn: (r,q) => { const c=findClient(r.clientId), i=findIpo(r.ipoId); return ((c?c.clientName:'')+' '+(i?i.ipoName:'')).toLowerCase().includes(q); },
      searchPlaceholder: 'Search client, IPO...',
      filters: [
        { key:'allotmentStatus', label:'Allotment', options: ALLOTMENT_STATUSES },
        { key:'saleStatus', label:'Sale', options: SALE_STATUSES },
        { key:'amountReceiveStatus', label:'Recovery', options: RECEIVE_STATUSES },
        { key:'ipoId', label:'IPO', options: sortedIpos().map(i=>i.ipoName), match:(r,v)=>{ const i=findIpo(r.ipoId); return i && i.ipoName===v; } },
        { key:'bankAccountId', label:'Bank', options: S.bankAccounts.map(b=>b.bankName), match:(r,v)=>{ const b=findBank(r.bankAccountId); return b && b.bankName===v; } },
        { key:'clientId', label:'Client', options: S.clients.map(c=>c.clientName), match:(r,v)=>{ const c=findClient(r.clientId); return c && c.clientName===v; } },
      ],
      pageSize: 12,
      stickyCol: 'clientId',
      columns: [
        { key:'sel', label:`<input type="checkbox" onchange="toggleAllAllotSelection(this.checked)">`, render:r=>`<input type="checkbox" class="allotSelCk" ${__selectedAllotIds.has(r.id)?'checked':''} onchange="toggleAllotSelection(${r.id}, this.checked)">` },
        { key:'clientId', label:'Client', val:r=>{ const c=findClient(r.clientId); return c?c.clientName:''; }, render:r=>{ const c=findClient(r.clientId); return c?`<a class="lnk" href="javascript:void(0)" onclick="event.stopPropagation();openClientDetail(${c.id})">${escapeHtml(c.clientName)}</a>`:'—'; } },
        { key:'ipoId', label:'IPO', val:r=>{ const i=findIpo(r.ipoId); return i?i.ipoName:''; }, render:r=>{ const i=findIpo(r.ipoId); return i?`<a class="lnk" href="javascript:void(0)" onclick="event.stopPropagation();openIpoDetail(${i.id})">${escapeHtml(i.ipoName)}</a>`:'—'; } },
        { key:'amountApplied', label:'Amount Applied', num:true, sum:'money', val:r=>Number(r.amountApplied)||0, render:r=>fmtMoney(r.amountApplied) },
        { key:'allotmentStatus', label:'Allotment', val:r=>r.allotmentStatus||'Pending', render:r=>`<span class="clickable" title="Click to quick-edit" onclick="event.stopPropagation(); quickEditAllotmentStatus(${r.id})">${badge(r.allotmentStatus||'Pending')}</span>${r.notes ? ` <span class="clickable" title="View note" data-note="${escapeHtml(r.notes)}" onclick="event.stopPropagation(); showNote(this)">📝</span>` : ''}<br><span class="small-muted">${fmtDate(r.allotmentDate)}</span>` },
        { key:'saleStatus', label:'Sale', val:r=>r.saleStatus||'', render:r=>r.saleStatus?`${badge(r.saleStatus)}<br><span class="small-muted">${fmtDate(r.saleDate)}</span>`:'—' },
        { key:'saleAmount', label:'Sale Amount', num:true, sum:'money', val:r=>Number(r.saleAmount)||0, render:r=>r.saleAmount?fmtMoney(r.saleAmount):'—' },
        { hidden:true, key:'grossReceived', label:'Gross Received', num:true, sum:'money', val:r=>{ const c=calcAllotmentSale(r); return c.applicable?c.grossFinal:0; }, render:r=>{ const c=calcAllotmentSale(r); return c.applicable?(fmtMoney(c.grossFinal)+(c.grossOverridden?overrideBadge('Gross Received', c.calculatedGross, c.grossFinal, r.overrideReason, r.overrideChangedAt):'')):'—'; } },
        { key:'amountReceiveStatus', label:'Recovery Status', val:r=>r.amountReceiveStatus||'', render:r=>r.amountReceiveStatus?`<span class="clickable" title="Click to quick-edit" onclick="event.stopPropagation(); quickEditRecoveryStatus(${r.id})">${badge(r.amountReceiveStatus)}</span>`:'—' },
        { key:'ourProfit', label:'Our Profit', num:true, sum:'money', val:r=>{ const c=calcAllotmentSale(r); return c.applicable?c.ourFinal:0; }, render:r=>{ const c=calcAllotmentSale(r); return c.applicable?(fmtMoney(c.ourFinal)+(c.ourOverridden?overrideBadge('Our Profit', c.calculatedOur, c.ourFinal, r.overrideReason, r.overrideChangedAt):'')):'—'; } },
        { key:'clientProfit', label:'Client Profit', num:true, sum:'money', val:r=>{ const c=calcAllotmentSale(r); return c.applicable?c.clientFinal:0; }, render:r=>{ const c=calcAllotmentSale(r); return c.applicable?(fmtMoney(c.clientFinal)+(c.clientOverridden?overrideBadge('Client Profit', c.calculatedClient, c.clientFinal, r.overrideReason, r.overrideChangedAt):'')):'—'; } }
      ],
      rowActions: r => `<button class="btn btn-sm btn-primary" onclick="editAllotmentSale(${r.id})">Update</button>`
    }));
  };
  setTimeout(()=>window.__tableRerender['allotTbl'](), 0);

  return `
  <div class="kpi-grid">
    <div class="kpi-card clickable" ${navAttr('allotments',{allotmentStatus:'Pending'})}><div class="lbl">Awaiting result</div><div class="val">${pending.length}</div><div class="small-muted">${allotted.length} allotted · ${notAllotted.length} not (${allotRate}%)</div></div>
    <div class="kpi-card clickable" ${navAttr('allotments',{allotmentStatus:'Allotted',saleStatus:'Pending to Sell'})}><div class="lbl">To sell</div><div class="val gold">${pendingToSell.length}</div><div class="small-muted">allotted, not yet sold</div></div>
    <div class="kpi-card clickable" ${navAttr('allotments',{amountReceiveStatus:'Receivable'})}><div class="lbl">To collect</div><div class="val ${totalReceivable?'danger':''}">${fmtMoney(totalReceivable)}</div><div class="small-muted">${fmtMoney(totalReceived)} received</div></div>
    <div class="kpi-card"><div class="lbl">Our profit</div><div class="val ok">${fmtMoney(totalOurProfit)}</div><div class="small-muted">Clients' share ${fmtMoney(totalClientProfit)}</div></div>
  </div>
  <div class="section-card">
    <div class="sc-head" style="flex-wrap:wrap;gap:10px;">
      <h3>Allotments &amp; Sale</h3><div class="spacer"></div>
      <button class="btn btn-gold btn-sm" onclick="navigate('results')">Enter allotment results</button>
      <span id="allotBulkBar" class="selbar ${__selectedAllotIds.size?'on':''}"><b class="small-muted" id="allotSelCount">Selected: ${__selectedAllotIds.size}</b>
      <button class="btn btn-ghost btn-sm" onclick="clearAllotSelection()">Clear</button></span>
    </div>
    <div class="sc-body" style="padding-bottom:8px;">
      ${allotChipsHtml()}${collectPanelHtml()}${quickSalePanelHtml()}
      <details class="bulk-box" ${__selectedAllotIds.size?'open':''}><summary>Bulk update selected rows <span class="small-muted">(tick rows in the table first)</span></summary>
      <div style="display:flex;flex-wrap:wrap;gap:16px;align-items:flex-end;padding:10px 0 14px;">
        <div class="f-group" style="min-width:200px;">
          <label>Bulk Update — Allotment Status</label>
          <div style="display:flex;gap:6px;">
            <select id="bulkAllotStatusSelect">${ALLOTMENT_STATUSES.map(s=>`<option value="${s}">${s}</option>`).join('')}</select>
            <button class="btn btn-ghost btn-sm" onclick="bulkUpdateAllotmentStatus()">Update</button>
          </div>
        </div>
        <div class="f-group" style="min-width:200px;">
          <label>Bulk Update — Sale Date</label>
          <div style="display:flex;gap:6px;">
            <input type="date" id="bulkSaleDateInput">
            <button class="btn btn-ghost btn-sm" onclick="bulkUpdateSaleDate()">Apply</button>
          </div>
          <div class="hint">Only applies to selected rows that are already Allotted; also sets Sale Status to Sold.</div>
        </div>
        <div class="f-group" style="min-width:200px;">
          <label>Bulk Update — Recovery Status</label>
          <div style="display:flex;gap:6px;">
            <select id="bulkRecoveryStatusSelect">${RECEIVE_STATUSES.map(s=>`<option value="${s}">${s}</option>`).join('')}</select>
            <button class="btn btn-ghost btn-sm" onclick="bulkUpdateRecoveryStatus()">Update</button>
          </div>
          <div class="hint">Only applies to selected rows that are already Sold.</div>
        </div>
      </div></details>
      <div id="allotTblWrap"></div>
    </div>
  </div>
  <p class="small-muted">There is no partial sale — the entire allotted lot is sold in a single transaction. Gross Received = Applied Amount + (your profit share %) × (Sale Amount − Applied Amount) — normally 50%, set in Settings → Profit Sharing and adjustable per application; calculated automatically once Allotted + Sold, and independently overridable. Allotment Date is fixed at the IPO level (see IPOs tab) and cannot be edited per application.</p>`;
}
function __refreshAllotSelectionUI(){
  if (window.__tableRerender['allotTbl']) window.__tableRerender['allotTbl']();
  { const bb = document.getElementById('allotBulkBar'); if (bb) bb.classList.toggle('on', __selectedAllotIds.size>0); }
  const el = document.getElementById('allotSelCount');
  if (el) el.textContent = 'Selected: ' + __selectedAllotIds.size;
}
function toggleAllotSelection(id, checked){ if (checked) __selectedAllotIds.add(id); else __selectedAllotIds.delete(id); __refreshAllotSelectionUI(); }
function toggleAllAllotSelection(checked){
  const filteredIds = (window.__lastFilteredIds && window.__lastFilteredIds['allotTbl']) || [];
  if (checked) filteredIds.forEach(id => __selectedAllotIds.add(id));
  else filteredIds.forEach(id => __selectedAllotIds.delete(id));
  __refreshAllotSelectionUI();
}
function clearAllotSelection(){ __selectedAllotIds = new Set(); __refreshAllotSelectionUI(); }

async function bulkUpdateAllotmentStatus(){
  if (!__selectedAllotIds.size){ toast('No rows selected','warn'); return; }
  const status = document.getElementById('bulkAllotStatusSelect').value;
  let count = 0;
  for (const id of __selectedAllotIds){
    const a = findApp(id);
    if (!a) continue;
    const ipo = findIpo(a.ipoId);
    const patch = { allotmentStatus: status, allotmentDate: ipo ? (ipo.allotmentDate || null) : null };
    if (status === 'Not Allotted'){ patch.saleStatus = null; patch.saleDate = null; patch.saleAmount = null; }
    else if (status === 'Allotted'){ if (a.saleStatus !== 'Sold') patch.saleStatus = 'Pending to Sell'; }
    else { patch.saleStatus = null; }
    const updated = { ...a, ...patch, updatedAt: new Date().toISOString() };
    await putRec('applications', updated); const __prev11 = {...a}; Object.assign(a, updated);
    await audit('Allotment Updates','Application', id, __prev11, updated);
    count++;
  }
  toast(`Allotment status updated for ${count} row(s)`, 'ok');
  navigate('allotments');
}
async function bulkUpdateSaleDate(){
  if (!__selectedAllotIds.size){ toast('No rows selected','warn'); return; }
  const dateVal = document.getElementById('bulkSaleDateInput').value;
  if (!dateVal){ toast('Pick a sale date first','warn'); return; }
  let count = 0, skipped = 0;
  for (const id of __selectedAllotIds){
    const a = findApp(id);
    if (!a || a.allotmentStatus !== 'Allotted'){ skipped++; continue; }
    const updated = { ...a, saleDate: dateVal, saleStatus: 'Sold', updatedAt: new Date().toISOString() };
    await putRec('applications', updated); const __prev12 = {...a}; Object.assign(a, updated);
    await audit('Allotment Updates','Application', id, __prev12, updated);
    count++;
  }
  toast(`Sale date applied to ${count} row(s)${skipped?`, ${skipped} skipped (not Allotted)`:''}`, 'ok');
  navigate('allotments');
}
async function bulkUpdateRecoveryStatus(){
  if (!__selectedAllotIds.size){ toast('No rows selected','warn'); return; }
  const status = document.getElementById('bulkRecoveryStatusSelect').value;
  let count = 0, skipped = 0;
  for (const id of __selectedAllotIds){
    const a = findApp(id);
    if (!a || a.saleStatus !== 'Sold'){ skipped++; continue; }
    const updated = { ...a, amountReceiveStatus: status, receivedDate: status==='Received' ? (a.amountReceiveStatus==='Received' ? (a.receivedDate||todayStr()) : todayStr()) : null, receivedViaLedger:false, updatedAt: new Date().toISOString() };
    await putRec('applications', updated); const __prev13 = {...a}; Object.assign(a, updated);
    await audit('Allotment Updates','Application', id, __prev13, updated);
    count++;
  }
  toast(`Recovery status updated for ${count} row(s)${skipped?`, ${skipped} skipped (not Sold)`:''}`, 'ok');
  navigate('allotments');
}

function allotmentSaleModalBody(a){
  const calc = calcAllotmentSale(a);
  const ipo = findIpo(a.ipoId);
  const saleSectionDisabled = a.allotmentStatus !== 'Allotted';
  return `<div class="form-grid">
      ${fieldHtml({key:'allotmentStatus',label:'Allotment Status',type:'select',options:ALLOTMENT_STATUSES,onchange:'onAllotmentStatusChange()'}, a.allotmentStatus||'Pending')}
      <div class="f-group"><label>Allotment Date</label><div class="small-muted" style="padding:8px 0;">${ipo && ipo.allotmentDate ? fmtDate(ipo.allotmentDate) : 'Not set on this IPO yet'} <span class="badge gray">Locked — set on the IPO</span></div></div>
      <div class="f-group"><label>Sale Status</label><select id="fld_saleStatus" ${saleSectionDisabled?'disabled':''} onchange="onSaleStatusChange()">
        <option value="">—</option>
        ${SALE_STATUSES.map(s=>`<option value="${s}" ${a.saleStatus===s?'selected':''}>${s}</option>`).join('')}
      </select></div>
      ${fieldHtml({key:'profitSharePct',label:'Our Profit Share % (this application)',type:'number',hint:`Standard share is ${defaultProfitShare()}% (this client's own share, if set, is used for new applications). The client keeps the rest. Change only if this deal is different.`}, appProfitShare(a))}
      ${fieldHtml({key:'lotsAllotted',label:'Lots Allotted (optional)',type:'number',hint:'Only if allotted'}, a.lotsAllotted!=null?a.lotsAllotted:'')}
      ${fieldHtml({key:'sharesAllotted',label:'Shares Allotted (optional)',type:'number',hint:'Only if allotted'}, a.sharesAllotted!=null?a.sharesAllotted:'')}
      ${fieldHtml({key:'saleDate',label:'Sale Date',type:'date'}, a.saleDate||'')}
      ${fieldHtml({key:'saleAmount',label:'Sale Amount (total for the full allotted lot)',type:'number'}, a.saleAmount!=null?a.saleAmount:'')}
    </div>
    <div id="grossOurClientWrap" data-applied="${Number(a.amountApplied)||0}" style="margin-top:14px;">${grossOurClientFieldsHtml(a, calc)}</div>
    <p class="hint">Applied Amount: ${fmtMoney(a.amountApplied)}${a.applicationStatus!=='Applied'?'<br><b>Note:</b> allotment results are normally only entered once the application status is "Applied".':''}</p>`;
}
function grossOurClientFieldsHtml(a, calc){
  const anyOverridden = calc.applicable && (calc.grossOverridden || calc.ourOverridden || calc.clientOverridden);
  return `<div class="form-grid">

async function saveAllotmentSale(id, force){
  const data = readFields([{key:'allotmentStatus'},{key:'saleStatus'},{key:'saleDate'},{key:'saleAmount',type:'number'},{key:'profitSharePct',type:'number'},{key:'lotsAllotted',type:'number'},{key:'sharesAllotted',type:'number'},{key:'grossReceived',type:'number'},{key:'amountReceiveStatus'},{key:'ourProfit',type:'number'},{key:'clientProfit',type:'number'}]);

      if (!a.ourProfitOverridden && isFilled(data.ourProfit) && Number(data.ourProfit) === oldCalc.calculatedOur) data.ourProfit = null;
      if (!a.clientProfitOverridden && isFilled(data.clientProfit) && Number(data.clientProfit) === oldCalc.calculatedClient) data.clientProfit = null;
    }

  if (data.allotmentStatus === 'Not Allotted'){ data.saleStatus = null; data.saleDate = null; data.saleAmount = null; }
  if (data.allotmentStatus !== 'Allotted'){ data.saleStatus = null; data.lotsAllotted = null; data.sharesAllotted = null; }
  if (data.lotsAllotted === '' || data.lotsAllotted === undefined) data.lotsAllotted = null;
  if (data.sharesAllotted === '' || data.sharesAllotted === undefined) data.sharesAllotted = null;

  else { data.receivedDate = null; data.receivedViaLedger = false; }

  const warns = [];

      `<button class="btn btn-ghost" onclick="closeModal()">Cancel</button><button class="btn btn-danger" onclick="saveAllotmentSale(${id}, true)">Save Anyway</button>`);
    return;
  }

  // detect manual overrides: user-entered value differs from the auto-calculated one
  const probe = { ...a, ...data };
  const calc = calcAllotmentSale({ ...probe, grossReceivedOverridden:false, ourProfitOverridden:false, clientProfitOverridden:false });
  const grossReceivedOverridden = calc.applicable && isFilled(data.grossReceived) && Math.abs(Number(data.grossReceived) - calc.calculatedGross) > 0.01;
  // Our / Client profit are judged against the split that follows from the gross actually entered
  const calc2 = calcAllotmentSale({ ...probe, grossReceived: grossReceivedOverridden ? Number(data.grossReceived) : probe.grossReceived, grossReceivedOverridden, ourProfitOverridden:false, clientProfitOverridden:false });
  const ourProfitOverridden = calc.applicable && isFilled(data.ourProfit) && Math.abs(Number(data.ourProfit) - calc2.calculatedOur) > 0.01;
  const clientProfitOverridden = calc.applicable && isFilled(data.clientProfit) && Math.abs(Number(data.clientProfit) - calc2.calculatedClient) > 0.01;
  const anyOverridden = grossReceivedOverridden || ourProfitOverridden || clientProfitOverridden;

    grossReceivedOverridden, ourProfitOverridden, clientProfitOverridden,
    overrideReason, overrideChangedAt,

    calculatedOurProfit: calc.applicable ? calc.calculatedOur : null,

<script>
/* =================== DASHBOARD =================== */
let dashRange = { preset:'thisMonth', from:null, to:null };

function fyRange(offsetYears){
  const now = new Date();
  let fyStartYear = now.getMonth() >= 3 ? now.getFullYear() : now.getFullYear()-1;
  fyStartYear -= offsetYears;
  return { from: `${fyStartYear}-04-01`, to: `${fyStartYear+1}-03-31` };
}
function resolveDashRange(){ return presetRange(dashRange.preset, dashRange.from, dashRange.to); }
function presetRange(p, customFrom, customTo){
  const now = new Date();
  const y = now.getFullYear(), m = now.getMonth(), d = now.getDate();
  if (p === 'today') return { from: todayStr(), to: todayStr() };
  if (p === 'thisWeek'){
    const dow = now.getDay();
    const start = new Date(now); start.setDate(d - dow);
    const end = new Date(start); end.setDate(start.getDate()+6);
    return { from: isoDate(start), to: isoDate(end) };
  }
  if (p === 'thisMonth') return { from: isoDate(new Date(y,m,1)), to: isoDate(new Date(y,m+1,0)) };
  if (p === 'prevMonth') return { from: isoDate(new Date(y,m-1,1)), to: isoDate(new Date(y,m,0)) };
  if (p === 'thisFY') return fyRange(0);
  if (p === 'prevFY') return fyRange(1);
  if (p === 'custom') return { from: customFrom || '0001-01-01', to: customTo || '9999-12-31' };
  return { from: '0001-01-01', to: '9999-12-31' };
}
function inRange(dateStr, r){ return dateStr && dateStr >= r.from && dateStr <= r.to; }

/* ---- previous-period comparison ---- */
// The period just before r: previous calendar month for a whole month, previous financial year for a whole FY,
// otherwise the same number of days immediately before. Returns null for open-ended ("all time") ranges.
function previousRange(r){
  if (!r || r.from <= '0001-01-01' || r.to >= '9999-12-31') return null;
  const [fy, fm, fd] = r.from.split('-').map(Number), [ty, tm, td] = r.to.split('-').map(Number);
  const lastDay = new Date(fy, fm, 0).getDate();
  if (fd === 1 && fy === ty && fm === tm && td === lastDay) return { from: localDateStr(new Date(fy, fm-2, 1)), to: localDateStr(new Date(fy, fm-1, 0)) };
  if (fd === 1 && fm === 4 && ty === fy+1 && tm === 3 && td === 31) return { from: `${fy-1}-04-01`, to: `${fy}-03-31` };
  const n = dayDiff(r.from, r.to) + 1;
  return { from: addDaysIso(r.from, -n), to: addDaysIso(r.from, -1) };
}
function dashPeriodStats(r){
  const apps = S.applications.filter(a => inRange(a.applicationDate, r));
  const allot = S.applications.filter(a => inRange(a.allotmentDate, r));
  const sold = S.applications.filter(a => inRange(a.saleDate, r) && a.saleStatus === 'Sold');
  let profit = 0, gross = 0, withProfit = 0;
  sold.forEach(a => { const c = calcAllotmentSale(a); if (c.applicable){ profit += c.ourFinal; gross += c.grossFinal; withProfit++; } });
  return {

    allotted: allot.filter(a=>a.allotmentStatus==='Allotted').length, notAllotted: allot.filter(a=>a.allotmentStatus==='Not Allotted').length,

// Small "▲ 12% vs previous" line. `invert` = true when a rise is bad (e.g. Not Allotted).
function deltaHtml(cur, prev, opts){
  opts = opts || {};
  if (prev === null || prev === undefined) return '';
  const money = v => opts.money ? fmtMoney(v) : String(v);
  const label = opts.label || 'previous period';
  if (cur === 0 && prev === 0) return `<div class="small-muted">— no change vs ${label}</div>`;
  const tip = escapeHtml(`${label}: ${money(prev)}`);
  if (prev === 0) return `<div class="small-muted ${opts.invert?'danger':'ok'}" title="${tip}">▲ vs ${money(0)} in ${label}</div>`;
  const pct = Math.round((cur - prev) / Math.abs(prev) * 100);
  if (pct === 0) return `<div class="small-muted" title="${tip}">— 0% vs ${label}</div>`;
  const good = opts.invert ? pct < 0 : pct > 0;

  const cur = dashPeriodStats(r), prv = prevR ? dashPeriodStats(prevR) : null;
  const cmp = (key,o) => prv ? deltaHtml(cur[key], prv[key], o) : '';
  const presetBtns = [['today','Today'],['thisWeek','Week'],['thisMonth','Month'],['prevMonth','Last month'],['thisFY','This FY'],['prevFY','Last FY'],['custom','Custom']]
    .map(([k,l])=>`<button class="btn btn-sm ${dashRange.preset===k?'btn-primary':'btn-ghost'}" onclick="setDashPreset('${k}')">${l}</button>`).join('');
  const period = `<details class="collapse" ${dashOpen('period',false)} ontoggle="dashToggle('period',this.open)"><summary>Period analysis <span class="small-muted" style="font-weight:500;">${fmtDate(r.from)} – ${fmtDate(r.to)}</span></summary>
    <div style="display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:12px;">${presetBtns}
      ${dashRange.preset==='custom' ? `<input type="date" id="dashFrom" value="${dashRange.from||''}" onchange="setDashCustom()"><span>to</span><input type="date" id="dashTo" value="${dashRange.to||''}" onchange="setDashCustom()">` : ''}</div>
    <div class="kpi-grid">
      <div class="kpi-card" ${drillAttr('Applications in this period', appsInRange)}><div class="lbl">Applications</div><div class="val">${appsInRange.length}</div>${cmp('apps')}</div>
      <div class="kpi-card" ${drillAttr('Allotted in this period', allottedInRange)}><div class="lbl">Allotment rate</div><div class="val ok">${rate}%</div><div class="small-muted">${allottedInRange.length} of ${resolvedInRange.length} results</div></div>
      <div class="kpi-card" ${drillAttr('Sold in this period', soldInRange)}><div class="lbl">Sold</div><div class="val">${soldInRange.length}</div>${cmp('sold')}</div>
      <div class="kpi-card" ${drillAttr('Applications in this period', appsInRange)}><div class="lbl">Amount applied</div><div class="val">${fmtMoney(amountInRange)}</div>${cmp('amount',{money:true})}</div>
      <div class="kpi-card" ${drillAttr('Sales in this period', soldInRange)}><div class="lbl">Our profit</div><div class="val gold">${fmtMoney(profitInRange)}</div>${cmp('profit',{money:true})}</div>
      <div class="kpi-card" ${drillAttr('Sales in this period', soldInRange)}><div class="lbl">Client profit</div><div class="val">${fmtMoney(clientInRange)}</div></div>
      <div class="kpi-card" ${drillAttr('Sales in this period', soldInRange)}><div class="lbl" title="Profit from sales in the period ÷ number of sales">Avg profit / sale</div><div class="val">${fmtMoney(soldWithProfit?Math.round(profitInRange/soldWithProfit):0)}</div></div>
    </div>
    <p class="small-muted" style="margin-top:8px;">Applications are counted by application date, allotments by allotment date, profit and sales by sale date.</p></details>`;
  // ---- Receivables pending: who owes what (click a row to open the client) ----
  const byClient = {};
  recvList.forEach(a=>{ const g = byClient[a.clientId] || (byClient[a.clientId] = { id:a.clientId, apps:[], amt:0, oldest:'' }); g.apps.push(a); g.amt += recvDue(a); if (a.saleDate && (!g.oldest || a.saleDate<g.oldest)) g.oldest = a.saleDate; });
  const recvRows = Object.values(byClient).sort((x,y)=>y.amt-x.amt);
  const recvShow = recvRows.slice(0,8).map(g=>{ const c = findClient(g.id);
    return `<tr class="clickable" onclick="navigate('clients',{id:${g.id}})"><td><b>${escapeHtml(c?c.clientName:'—')}</b></td>
      <td>${g.apps.length}</td><td>${g.oldest?fmtDate(g.oldest):'—'}</td><td style="text-align:right;"><b>${fmtMoney(g.amt)}</b></td>${dcell((c?c.clientName:'Client')+' — receivables', g.apps, 'View')}</tr>`; }).join('');
  const recvPanel = `<div class="section-card"><div class="sc-head"><h3>Receivables pending</h3><div class="spacer"></div>
      ${recvList.length?`<button class="btn btn-ghost btn-sm" onclick="navigate('allotments',{presetFilter:{tableId:'allotTbl',filterVals:{amountReceiveStatus:'Receivable'}}})">View all ${recvList.length} sale${recvList.length===1?'':'s'}</button>`:''}</div>
    <div class="sc-body">${recvRows.length
      ? `<p class="small-muted" style="margin-bottom:8px;"><b>${fmtMoney(toCollect)}</b> across ${recvList.length} sale${recvList.length===1?'':'s'} from ${recvRows.length} client${recvRows.length===1?'':'s'}${recvRows.length>8?' — top 8 shown':''}. Click a client to open, or View to see the sales.</p>
         <div class="table-wrap"><table class="dt"><thead><tr><th>Client</th><th>Sales</th><th>Oldest sale</th><th style="text-align:right;">Amount</th><th></th></tr></thead><tbody>${recvShow}</tbody></table></div>`
      : '<p class="small-muted">Nothing pending — all sales have been collected.</p>'}</div></div>`;
  return `${firstRunHtml()}${todayPanelHtml()}${cards}${capitalViewHtml()}${mobileCollapse('recv','Receivables pending',fmtMoney(toCollect),recvPanel)}${weeklyReviewHtml()}${period}`;
}
</script>
<script>
/* =================== REPORTS =================== */
let reportsTab = 'settlement';
const REPORT_GROUPS = [
  ['profit','Profit',[['trends','Monthly & charts'],['yearly','By year'],['gap','Our vs Client']]],
  ['settlement','Settlement',[['settlement','Settlement']]],
  ['clients','Clients',[['client','Client analysis'],['scorecard','Scorecards'],['stmt','Statements (PDF)']]],
  ['ipos','IPOs',[['ipo','IPO analysis']]],
  ['banks','Banks',[['bank','Bank analysis']]],
  ['custom','Custom',[['pivot','Report builder']]]
];
function viewReports(){
  const leaves = REPORT_GROUPS.flatMap(g=>g[2].map(l=>l[0]));
  if (!leaves.includes(reportsTab)) reportsTab = 'trends';
  const g = REPORT_GROUPS.find(g=>g[2].some(l=>l[0]===reportsTab));
  return `
  <div class="tabs">${REPORT_GROUPS.map(x=>`<button class="${x[0]===g[0]?'active':''}" onclick="setReportsTab('${x[2][0][0]}')">${x[1]}</button>`).join('')}</div>
  ${g[2].length>1 ? `<div class="pills no-print">${g[2].map(l=>`<button class="pill ${l[0]===reportsTab?'on':''}" onclick="setReportsTab('${l[0]}')">${l[1]}</button>`).join('')}</div>` : ''}
  <div id="reportsTabBody">${reportsTabContent()}</div>`;
}
function setReportsTab(t){ reportsTab = t; render(); }
function reportsTabContent(){
  if (reportsTab==='client') return reportClientAnalysis();
  if (reportsTab==='ipo') return reportIpoAnalysis();
  if (reportsTab==='bank') return reportBankAnalysis();
  if (reportsTab==='scorecard') return reportClientScorecards();
  if (reportsTab==='pivot') return reportBuilder();
  if (reportsTab==='gap') return reportGap();
  if (reportsTab==='trends'){ setTimeout(renderTrendsCharts, 0); return reportTrends(); }
  if (reportsTab==='yearly') return reportYearlySummary();
  if (reportsTab==='settlement') return reportSettlement();
  if (reportsTab==='stmt') return reportStatements();
  return '';
}
function reportTrends(){
  return `
  <div class="section-card">
    <div class="sc-head"><h3>Monthly Profit Trend — Last 12 Months</h3></div>
    <div class="sc-body" id="monthlyTrendTableWrap"></div>
  </div>

  <div class="section-card">
    <div class="sc-head"><h3>Our Profit by Month</h3></div>
    <div class="sc-body"><canvas id="chartProfitTrend" height="90"></canvas></div>
  </div>

  <div class="section-card">
    <div class="sc-head"><h3>Profit by IPO (Top 10)</h3></div>
    <div class="sc-body"><canvas id="chartProfitByIpo" height="100"></canvas></div>
  </div>

  <div class="section-card">
    <div class="sc-head"><h3>Applications by Bank</h3></div>
    <div class="sc-body"><canvas id="chartAppsByBank" height="100"></canvas></div>
  </div>

  <div class="section-card">
    <div class="sc-head"><h3>Application Lifecycle Funnel</h3></div>
    <div class="sc-body"><canvas id="chartFunnel" height="90"></canvas></div>
  </div>

  <div class="section-card">
    <div class="sc-head"><h3>Year-over-Year Comparison</h3></div>
    <div class="sc-body">
      <div id="yoySummaryWrap"></div>
      <canvas id="chartYoY" height="90" style="margin-top:14px;"></canvas>
    </div>
  </div>

  <div class="section-card">
    <div class="sc-head"><h3>Top 10 Clients by Profit</h3></div>
    <div class="sc-body" id="topClientsWrap"></div>
  </div>

  <div class="section-card">
    <div class="sc-head"><h3>Top 10 IPOs by Profit</h3></div>
    <div class="sc-body" id="topIposWrap"></div>
  </div>`;
}

function monthKey(dateStr){ if(!dateStr) return null; return dateStr.slice(0,7); } // 'YYYY-MM'
function monthLabel(key){ const [y,m] = key.split('-'); return new Date(Number(y), Number(m)-1, 1).toLocaleDateString('en-IN',{month:'short', year:'2-digit'}); }

function last12MonthKeys(){
  const keys = [];
  const now = new Date();
  for (let i=11; i>=0; i--){
    const d = new Date(now.getFullYear(), now.getMonth()-i, 1);
    keys.push(`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`);
  }
  return keys;
}

window.__trendCharts = {};
function destroyChart(id){ if (window.__trendCharts[id]){ window.__trendCharts[id].destroy(); delete window.__trendCharts[id]; } }

function renderTrendsCharts(){
  if (typeof Chart === 'undefined'){
    ['monthlyTrendTableWrap'].forEach(id=>{ const el=document.getElementById(id); if(el) el.innerHTML = '<p class="small-muted">Charts library failed to load (check your internet connection) — the tables below still work.</p>'; });
  } else {
    // Chart.js draws its own text (axis labels, legend) in a fixed color by
    // default, with no idea this app has a Dark Mode — without this, every
    // chart would render near-invisible dark-gray text on a dark background.
    const cs = getComputedStyle(document.documentElement);
    Chart.defaults.color = cs.getPropertyValue('--text-dim').trim() || '#5c6b7a';
    Chart.defaults.borderColor = cs.getPropertyValue('--border').trim() || '#e2e6ed';
  }
  const months = last12MonthKeys();

  // ---- Monthly Profit Trend table + line chart ----
  const monthly = months.map(mk => {
    const soldThisMonth = S.applications.filter(a => a.saleStatus==='Sold' && monthKey(a.saleDate)===mk);
    const appsThisMonth = S.applications.filter(a => monthKey(a.applicationDate)===mk).length;
    const allottedThisMonth = S.applications.filter(a => { const i=findIpo(a.ipoId); return a.allotmentStatus==='Allotted' && i && monthKey(i.allotmentDate)===mk; }).length;
    let gross=0, our=0, client=0;
    soldThisMonth.forEach(a=>{ const c=calcAllotmentSale(a); if(c.applicable){ gross+=c.grossFinal; our+=c.ourFinal; client+=c.clientFinal; } });
    return { mk, applications:appsThisMonth, allotments:allottedThisMonth, sold:soldThisMonth.length, gross, our, client };
  });
  const tblRows = monthly.map(m=>`<tr><td>${monthLabel(m.mk)}</td><td>${m.applications}</td><td>${m.allotments}</td><td>${m.sold}</td><td>${fmtMoney(m.gross)}</td><td>${fmtMoney(m.our)}</td><td>${fmtMoney(m.client)}</td></tr>`).join('');
  const tblWrap = document.getElementById('monthlyTrendTableWrap');
  if (tblWrap) tblWrap.innerHTML = `<div class="table-wrap"><table class="dt"><thead><tr><th>Month</th><th>Applications</th><th>Allotments</th><th>Sold</th><th>Gross Received</th><th>Our Profit</th><th>Client Profit</th></tr></thead><tbody>${tblRows}</tbody></table></div>`;

  const chartsAvailable = (typeof Chart !== 'undefined');
  if (!chartsAvailable){
    const el = document.getElementById('monthlyTrendTableWrap');
    if (el) el.insertAdjacentHTML('beforeend', '<p class="small-muted">Charts library failed to load (check your internet connection) — the tables below still work.</p>');
  }

  if (chartsAvailable) { destroyChart('profitTrend');
  const ctxTrend = document.getElementById('chartProfitTrend');
  if (ctxTrend) window.__trendCharts['profitTrend'] = new Chart(ctxTrend, {
    type:'line',
    data:{ labels: monthly.map(m=>monthLabel(m.mk)), datasets:[{ label:'Our Profit', data: monthly.map(m=>m.our), borderColor:'#c8963e', backgroundColor:'rgba(200,150,62,.15)', fill:true, tension:.25 }] },
    options:{ responsive:true, plugins:{legend:{display:false}}, scales:{ y:{ ticks:{ callback:v=>fmtMoney(v) } } },
      onHover:(e,els)=>{ if (e.native) e.native.target.style.cursor = els.length ? 'pointer' : 'default'; },
      onClick:(e,els)=>{ if (els.length){ const m = monthly[els[0].index]; drillNow('Sold in '+monthLabel(m.mk), S.applications.filter(a=>a.saleStatus==='Sold' && monthKey(a.saleDate)===m.mk)); } } }
  }); }

  // ---- Profit by IPO (top 10) ----
  const ipoProfits = S.ipos.map(i=>{
    const apps = S.applications.filter(a=>a.ipoId===i.id);
    let our=0, client=0; apps.forEach(a=>{ const c=calcAllotmentSale(a); if(c.applicable){ our+=c.ourFinal; client+=c.clientFinal; } });
    return { id:i.id, name:i.ipoName, our, client };
  }).filter(x=>x.our!==0).sort((a,b)=>b.our-a.our).slice(0,10);
  const isNarrow = window.innerWidth <= 900;
  if (chartsAvailable) { destroyChart('profitByIpo');
  const ctxIpo = document.getElementById('chartProfitByIpo');
  if (ctxIpo) window.__trendCharts['profitByIpo'] = new Chart(ctxIpo, {
    type:'bar',
    data:{ labels: ipoProfits.map(x=>x.name), datasets:[{ label:'Our Profit', data: ipoProfits.map(x=>x.our), backgroundColor:'#2f8f7f' }] },
    options:{ responsive:true, indexAxis: isNarrow?'y':'x', plugins:{legend:{display:false}},
      onHover:(e,els)=>{ if (e.native) e.native.target.style.cursor = els.length ? 'pointer' : 'default'; },
      onClick:(e,els)=>{ if (els.length){ const x = ipoProfits[els[0].index]; drillNow(x.name+' — all applications', S.applications.filter(a=>a.ipoId===x.id)); } },
      scales: isNarrow
        ? { x:{ ticks:{ callback:v=>fmtMoney(v) } } }
        : { y:{ ticks:{ callback:v=>fmtMoney(v) } }, x:{ ticks:{ autoSkip:false, maxRotation:60, minRotation:0 } } }
    }
  }); }

  // ---- Applications by Bank ----
  const bankCounts = S.bankAccounts.map(b=>({ name:b.bankName, count: S.applications.filter(a=>a.bankAccountId===b.id).length })).filter(x=>x.count>0).sort((a,b)=>b.count-a.count);
  if (chartsAvailable) { destroyChart('appsByBank');
  const ctxBank = document.getElementById('chartAppsByBank');
  if (ctxBank) window.__trendCharts['appsByBank'] = new Chart(ctxBank, {
    type:'bar',
    data:{ labels: bankCounts.map(x=>x.name), datasets:[{ label:'Applications', data: bankCounts.map(x=>x.count), backgroundColor:'#16263f' }] },
    options:{ responsive:true, indexAxis: isNarrow?'y':'x', plugins:{legend:{display:false}},
      onHover:(e,els)=>{ if (e.native) e.native.target.style.cursor = els.length ? 'pointer' : 'default'; },
      onClick:(e,els)=>{ if (els.length){ const x = bankCounts[els[0].index]; const b = S.bankAccounts.find(bb=>bb.bankName===x.name); if (b) drillNow(x.name+' — all applications', S.applications.filter(a=>a.bankAccountId===b.id)); } },
      scales: isNarrow ? {} : { x:{ ticks:{ autoSkip:false, maxRotation:60, minRotation:0 } } }
    }
  }); }

  // ---- Lifecycle funnel ----
  const totalApps = S.applications.length;
  const allottedCount = S.applications.filter(a=>a.allotmentStatus==='Allotted').length;
  const soldCount = S.applications.filter(a=>a.saleStatus==='Sold').length;
  const receivedCount = S.applications.filter(a=>a.amountReceiveStatus==='Received').length;
  if (chartsAvailable) { destroyChart('funnel');
  const ctxFunnel = document.getElementById('chartFunnel');
  if (ctxFunnel) window.__trendCharts['funnel'] = new Chart(ctxFunnel, {
    type:'bar',
    data:{ labels:['Applied','Allotted','Sold','Received'], datasets:[{ data:[totalApps, allottedCount, soldCount, receivedCount], backgroundColor:['#16263f','#2f8f7f','#c8963e','#1f7a63'] }] },
    options:{ indexAxis:'y', responsive:true, plugins:{legend:{display:false}} }
  }); }

  // ---- Year-over-Year comparison ----
  const thisYear = new Date().getFullYear();
  const lastYear = thisYear - 1;
  function yearTotals(year){
    const sold = S.applications.filter(a=>a.saleStatus==='Sold' && a.saleDate && new Date(a.saleDate).getFullYear()===year);
    const apps = S.applications.filter(a=>a.applicationDate && new Date(a.applicationDate).getFullYear()===year);
    let gross=0, our=0, client=0;
    sold.forEach(a=>{ const c=calcAllotmentSale(a); if(c.applicable){ gross+=c.grossFinal; our+=c.ourFinal; client+=c.clientFinal; } });
    return { applications:apps.length, sold:sold.length, gross, our, client };
  }
  const yThis = yearTotals(thisYear), yLast = yearTotals(lastYear);
  const pctChange = (a,b) => b===0 ? (a===0?'—':'New') : `${a>=b?'+':''}${Math.round(((a-b)/Math.abs(b))*100)}%`;
  const yoyRows = [
    ['Applications', yLast.applications, yThis.applications, pctChange(yThis.applications, yLast.applications)],
    ['Sold', yLast.sold, yThis.sold, pctChange(yThis.sold, yLast.sold)],
    ['Gross Received', fmtMoney(yLast.gross), fmtMoney(yThis.gross), pctChange(yThis.gross, yLast.gross)],
    ['Our Profit', fmtMoney(yLast.our), fmtMoney(yThis.our), pctChange(yThis.our, yLast.our)],
    ['Client Profit', fmtMoney(yLast.client), fmtMoney(yThis.client), pctChange(yThis.client, yLast.client)],
  ];
  const yoyWrap = document.getElementById('yoySummaryWrap');
  if (yoyWrap) yoyWrap.innerHTML = `<div class="table-wrap"><table class="dt"><thead><tr><th></th><th>${lastYear}</th><th>${thisYear}</th><th>Change</th></tr></thead><tbody>${yoyRows.map(r=>`<tr><td>${r[0]}</td><td>${r[1]}</td><td>${r[2]}</td><td>${r[3]}</td></tr>`).join('')}</tbody></table></div>`;

  // Monthly Our Profit, this year vs last year, month-by-month (Jan-Dec)
  const monthNames = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  function monthlyProfitForYear(year){
    return monthNames.map((_,idx)=>{
      const sold = S.applications.filter(a=>{ if(a.saleStatus!=='Sold'||!a.saleDate) return false; const d=new Date(a.saleDate); return d.getFullYear()===year && d.getMonth()===idx; });
      let our=0; sold.forEach(a=>{ const c=calcAllotmentSale(a); if(c.applicable) our+=c.ourFinal; });
      return our;
    });
  }
  if (chartsAvailable) { destroyChart('yoy');
  const ctxYoy = document.getElementById('chartYoY');
  if (ctxYoy) window.__trendCharts['yoy'] = new Chart(ctxYoy, {
    type:'bar',
    data:{ labels: monthNames, datasets:[
      { label:String(lastYear), data: monthlyProfitForYear(lastYear), backgroundColor:'#93a7bd' },
      { label:String(thisYear), data: monthlyProfitForYear(thisYear), backgroundColor:'#c8963e' }
    ]},
    options:{ responsive:true, plugins:{legend:{display:true}}, scales:{ y:{ ticks:{ callback:v=>fmtMoney(v) } } } }
  }); }

  // ---- Top 10 Clients by Profit ----
  const clientProfits = S.clients.map(c=>{
    const apps = S.applications.filter(a=>a.clientId===c.id);
    let our=0, client=0; apps.forEach(a=>{ const cal=calcAllotmentSale(a); if(cal.applicable){ our+=cal.ourFinal; client+=cal.clientFinal; } });
    return { dbId:c.id, name:c.clientName, id:c.clientId, our, client };
  }).filter(x=>x.our!==0).sort((a,b)=>b.our-a.our).slice(0,10);
  const topClientsWrap = document.getElementById('topClientsWrap');
  if (topClientsWrap) topClientsWrap.innerHTML = clientProfits.length
    ? `<div class="table-wrap"><table class="dt"><thead><tr><th>Client</th><th>Our Profit</th><th>Client Profit</th></tr></thead><tbody>${clientProfits.map(x=>`<tr class="clickable" onclick="navigate('clients',{id:${x.dbId}})"><td>${escapeHtml(x.id)} — ${escapeHtml(x.name)}</td><td>${fmtMoney(x.our)}</td><td>${fmtMoney(x.client)}</td></tr>`).join('')}</tbody></table></div>`
    : '<p class="small-muted">No profit recorded yet.</p>';

  // ---- Top 10 IPOs by Profit (table alongside the chart) ----
  const topIposWrap = document.getElementById('topIposWrap');
  if (topIposWrap) topIposWrap.innerHTML = ipoProfits.length
    ? `<div class="table-wrap"><table class="dt"><thead><tr><th>IPO</th><th>Our Profit</th><th>Client Profit</th></tr></thead><tbody>${ipoProfits.map(x=>`<tr class="clickable" onclick="navigate('ipos',{id:${x.id}})"><td>${escapeHtml(x.name)}</td><td>${fmtMoney(x.our)}</td><td>${fmtMoney(x.client)}</td></tr>`).join('')}</tbody></table></div>`
    : '<p class="small-muted">No profit recorded yet.</p>';
}

let yearlySummaryYear = new Date().getFullYear();
function setYearlySummaryYear(y){ yearlySummaryYear = Number(y); render(); }
function reportYearlySummary(){
  const year = yearlySummaryYear;
  const yearsWithData = Array.from(new Set(
    S.applications.map(a=>a.applicationDate).filter(Boolean).map(d=>new Date(d).getFullYear())
  )).sort((a,b)=>b-a);
  if (!yearsWithData.includes(year)) yearsWithData.unshift(year);

  const appsThisYear = S.applications.filter(a=>a.applicationDate && new Date(a.applicationDate).getFullYear()===year);
  const allotted = appsThisYear.filter(a=>a.allotmentStatus==='Allotted');
  const notAllotted = appsThisYear.filter(a=>a.allotmentStatus==='Not Allotted');
  const sold = appsThisYear.filter(a=>a.saleStatus==='Sold');
  const ipoIdsThisYear = new Set(appsThisYear.map(a=>a.ipoId));
  const amountApplied = appsThisYear.reduce((s,a)=>s+(Number(a.amountApplied)||0),0);
  let gross=0, our=0, client=0;
  appsThisYear.forEach(a=>{ const c=calcAllotmentSale(a); if(c.applicable){ gross+=c.grossFinal; our+=c.ourFinal; client+=c.clientFinal; } });

  const bankRows = S.bankAccounts.map(b=>{
    const bApps = appsThisYear.filter(a=>a.bankAccountId===b.id);
    if (!bApps.length) return null;
    let bOur=0, bCl=0; bApps.forEach(a=>{ const c=calcAllotmentSale(a); if(c.applicable){ bOur+=c.ourFinal; bCl+=c.clientFinal; } });
    return `<tr><td>${escapeHtml(b.bankName)}</td><td>${bApps.length}</td><td>${fmtMoney(bApps.reduce((s,a)=>s+(Number(a.amountApplied)||0),0))}</td><td>${fmtMoney(bOur)}</td><td>${fmtMoney(bCl)}</td></tr>`;
  }).filter(Boolean).join('') || `<tr class="empty-row"><td colspan="5">No data for ${year}.</td></tr>`;

  return `
  <div class="section-card no-print">
    <div class="sc-body" style="display:flex;gap:8px;align-items:center;">
      <select onchange="setYearlySummaryYear(this.value)">
        ${yearsWithData.map(y=>`<option value="${y}" ${y===year?'selected':''}>${y}</option>`).join('')}
      </select>
      <button class="btn btn-primary" onclick="window.print()">Print / Save as PDF</button>
    </div>
  </div>

  <div class="section-card printable-report">
    <div class="sc-body">
      <div style="text-align:center;margin-bottom:20px;">
        <h2 style="margin:0;">IPO Management Portal</h2>
        <p class="small-muted" style="margin:4px 0;">Yearly Summary — ${year}</p>
      </div>

      <div class="kpi-grid">

/* =================== DATE HELPERS =================== */
function addDaysIso(iso, n){ const [y,m,d] = iso.split('-').map(Number); return localDateStr(new Date(y, m-1, d+n)); }
function dayDiff(a, b){
  const pa = a.split('-').map(Number), pb = b.split('-').map(Number);
  return Math.round((Date.UTC(pb[0],pb[1]-1,pb[2]) - Date.UTC(pa[0],pa[1]-1,pa[2])) / 86400000);
}
/* ---- Settlement by Reference ----
   For a chosen period (by SALE date): each Reference → Sub-Reference (→ client) with how much was sold, the total profit,
   our share vs the clients' share, and how much of the money owed to you has been collected vs is still receivable.
   Uses each application's own profit share % (so a changed split is respected) and any manual overrides. */
let settleState = { preset:'thisMonth', from:'', to:'', ref:'', showClients:false };
function setSettle(k, v){ settleState[k] = v; render(); }
function settlementData(){
  const r = presetRange(settleState.preset === 'all' ? 'all' : settleState.preset, settleState.from, settleState.to);
  const refs = new Map(); // ref -> { subs: Map(sub -> { clients: Map(clientId -> row) }) }
  const blank = () => ({ sales:0, applied:0, saleAmt:0, our:0, client:0, collected:0, pending:0, apps:[], pApps:[] });
  const add = (row, a, c) => {
    row.apps.push(a); row.sales++; row.applied += Number(a.amountApplied)||0; row.saleAmt += Number(a.saleAmount)||0;
    row.our += c.ourFinal; row.client += c.clientFinal;
    if (a.amountReceiveStatus === 'Received') row.collected += c.grossFinal;
    else if (a.amountReceiveStatus === 'Receivable'){ row.pending += recvDue(a); row.collected += allocatedTo(a.id,'in'); row.pApps.push(a); }
  };
  S.applications.forEach(a=>{
    if (a.saleStatus !== 'Sold' || !a.saleDate || !inRange(a.saleDate, r)) return;
    const c = calcAllotmentSale(a); if (!c.applicable) return;
    const cl = findClient(a.clientId); if (!cl) return;
    const ref = cl.referenceName || '(No Reference)', sub = cl.subReference || '(No Sub-Reference)';
    if (settleState.ref && ref !== settleState.ref) return;
    if (!refs.has(ref)) refs.set(ref, { total: blank(), subs: new Map() });
    const R = refs.get(ref);
    if (!R.subs.has(sub)) R.subs.set(sub, { total: blank(), clients: new Map() });
    const SB = R.subs.get(sub);
    if (!SB.clients.has(cl.id)) SB.clients.set(cl.id, { name: cl.clientName, ...blank() });
    add(R.total, a, c); add(SB.total, a, c); add(SB.clients.get(cl.id), a, c);
  });
  return { r, refs };
}

/* ---- Allotment-rate analysis ----
   Answers "where do my allotments actually come from?" by grouping applications on any one dimension
   (bank, UPI, reference, sub-reference, client, IPO, amount, month) and showing the allotment rate.
   Rate = Allotted ÷ (Allotted + Not Allotted), i.e. only applications whose result is already out —
   Pending ones are shown separately so they never drag the rate down. Cancelled / failed applications are ignored. */
const ALLOT_DIMS = {
  bank:   { label:'Bank',            key:a=>{ const b=findBank(a.bankAccountId); return b?b.bankName:'(unknown bank)'; } },
  upi:    { label:'UPI ID',          key:a=>{ const u=S.bankUpiIds.find(x=>x.id===a.upiId); const b=findBank(a.bankAccountId); return u ? `${u.upiId}${b?' ('+b.bankName+')':''}` : '(no UPI recorded)'; } },
  ref:    { label:'Reference',       key:a=>{ const c=findClient(a.clientId); return (c&&c.referenceName)||'(no reference)'; } },
  subref: { label:'Sub-Reference',   key:a=>{ const c=findClient(a.clientId); return (c&&c.subReference)||'(no sub-reference)'; } },
  client: { label:'Client',          key:a=>{ const c=findClient(a.clientId); return c?c.clientName:'(unknown client)'; } },
  ipo:    { label:'IPO',             key:a=>{ const i=findIpo(a.ipoId); return i?i.ipoName:'(unknown IPO)'; } },
  amount: { label:'Application Amount', key:a=>{ const n=Number(a.amountApplied)||0; return n<=15000?'Up to ₹15,000':n<=50000?'₹15,001 – ₹50,000':n<=100000?'₹50,001 – ₹1,00,000':'Above ₹1,00,000'; } },

/* ---------- 18. Client scorecards ---------- */
let scoreState = { sort:'profit', ipoId:'' };
function setScore(k, v){ scoreState[k] = v; render(); }
function clientScoreData(){
  const today = todayStr();
  const base = S.applications.filter(a => isLiveApp(a) && a.applicationStatus === 'Applied');
  let allotted = 0, decided = 0, profitTot = 0, soldTot = 0;
  base.forEach(a=>{
    if (a.allotmentStatus==='Allotted'){ allotted++; decided++; } else if (a.allotmentStatus==='Not Allotted') decided++;
    const c = calcAllotmentSale(a); if (c.applicable){ profitTot += c.ourFinal; soldTot++; }
  });
  const overallRate = decided ? allotted/decided : 0, overallAvgSale = soldTot ? profitTot/soldTot : 0;
  const rows = S.clients.map(cl=>{
    const apps = base.filter(a=>a.clientId===cl.id);
    const al = apps.filter(a=>a.allotmentStatus==='Allotted'), na = apps.filter(a=>a.allotmentStatus==='Not Allotted');
    const decidedN = al.length + na.length;
    let profit = 0, clientP = 0, soldN = 0, outAmt = 0, paySum = 0, payN = 0;
    const outApps = [];
    apps.forEach(a=>{
      const c = calcAllotmentSale(a); if (!c.applicable) return;
      profit += c.ourFinal; clientP += c.clientFinal; soldN++;
      if (a.amountReceiveStatus === 'Received' && a.receivedDate && a.saleDate){ paySum += Math.max(0, dayDiff(a.saleDate, a.receivedDate)); payN++; }
      if (a.amountReceiveStatus === 'Receivable'){ outAmt += recvDue(a); outApps.push(a); }
    });
    // Expected profit per application: allotment rate (pulled toward the overall rate while there are few results) × typical profit per sale
    const smoothRate = (al.length + overallRate*3) / (decidedN + 3);
    const avgSale = soldN ? profit/soldN : overallAvgSale;
    const expected = smoothRate * avgSale;
    return { cl, apps, al, na, decidedN, rate: decidedN ? al.length/decidedN*100 : null, profit, clientP, soldN, avgPerApp: apps.length ? profit/apps.length : 0, outAmt, outApps, expected, avgSale, payDays: payN ? paySum/payN : null, payN };
  });
  return { rows, overallRate, overallAvgSale, today };
}

  const upcoming = S.ipos.filter(i=>ipoStatus(i)!=='Closed' && (i.archiveStatus||'Active')==='Active').sort((a,b)=>(a.openDate||'').localeCompare(b.openDate||''));

let pivot = { rows:'bank', cols:'', metric:'our', basis:'applicationDate', from:'', to:'', sort:'value' };
function setPivot(k, v){ pivot[k] = v; render(); }
const PIVOT_METRICS = {
  apps:        { label:'Applications (count)',        fmt:'n', fn:L=>L.length },
  allotted:    { label:'Allotted (count)',            fmt:'n', fn:L=>L.filter(a=>a.allotmentStatus==='Allotted').length },
  notAllotted: { label:'Not Allotted (count)',        fmt:'n', fn:L=>L.filter(a=>a.allotmentStatus==='Not Allotted').length },
  pending:     { label:'Awaiting result (count)',     fmt:'n', fn:L=>L.filter(a=>!a.allotmentStatus||a.allotmentStatus==='Pending').length },
  rate:        { label:'Allotment rate (%)',          fmt:'p', fn:L=>{ const al=L.filter(a=>a.allotmentStatus==='Allotted').length, d=al+L.filter(a=>a.allotmentStatus==='Not Allotted').length; return d ? al/d*100 : null; } },
  sold:        { label:'Sold (count)',                fmt:'n', fn:L=>L.filter(a=>calcAllotmentSale(a).applicable).length },
  amount:      { label:'Amount applied (₹)',          fmt:'m', fn:L=>L.reduce((s,a)=>s+(Number(a.amountApplied)||0),0) },
  saleAmt:     { label:'Sale amount (₹)',             fmt:'m', fn:L=>L.reduce((s,a)=>s+(calcAllotmentSale(a).applicable?Number(a.saleAmount)||0:0),0) },
  gross:       { label:'Gross received (₹)',          fmt:'m', fn:L=>L.reduce((s,a)=>{ const c=calcAllotmentSale(a); return s+(c.applicable?c.grossFinal:0); },0) },
  our:         { label:'Our profit (₹)',              fmt:'m', fn:L=>L.reduce((s,a)=>{ const c=calcAllotmentSale(a); return s+(c.applicable?c.ourFinal:0); },0) },
  client:      { label:'Client profit (₹)',           fmt:'m', fn:L=>L.reduce((s,a)=>{ const c=calcAllotmentSale(a); return s+(c.applicable?c.clientFinal:0); },0) },
  avgOur:      { label:'Avg profit per sale (₹)',     fmt:'m', fn:L=>{ let t=0,n=0; L.forEach(a=>{ const c=calcAllotmentSale(a); if(c.applicable){ t+=c.ourFinal; n++; } }); return n ? t/n : null; } },
  receivable:  { label:'Still to receive (₹)',        fmt:'m', fn:L=>L.reduce((s,a)=>s+recvDue(a),0) }
};
function pivotDims(){
  const fyOf = d => { if (!d) return '(no date)'; const y = Number(d.slice(0,4)), m = Number(d.slice(5,7)); const s = m>=4 ? y : y-1; return `FY ${s}-${String(s+1).slice(2)}`; };
  return { ...ALLOT_DIMS,
    salemonth: { label:'Sale Month', key:a=>(a.saleStatus==='Sold' && a.saleDate) ? a.saleDate.slice(0,7) : '(not sold)', time:true },
    fy:        { label:'Financial Year (applied)', key:a=>fyOf(a.applicationDate) },
    category:  { label:'IPO Category', key:a=>{ const i=findIpo(a.ipoId); return (i&&i.category)||'(not set)'; } },
    allotstatus:{ label:'Allotment Result', key:a=>a.allotmentStatus||'Pending' },
    recovery:  { label:'Recovery Status', key:a=>a.saleStatus==='Sold' ? (a.amountReceiveStatus||'(not set)') : '(not sold)' },
    share:     { label:'Our Profit Share %', key:a=>appProfitShare(a)+'%' }
  };
}
function pivotLabel(dimKey, v){
  if ((dimKey==='month' || dimKey==='salemonth') && /^\d{4}-\d{2}$/.test(v)) return new Date(v+'-01').toLocaleDateString('en-IN',{month:'short',year:'numeric'});
  return v;
}
function pivotFormat(metric, v){
  if (v===null || v===undefined) return '—';
  const f = PIVOT_METRICS[metric].fmt;
  return f==='m' ? fmtMoney(v) : f==='p' ? v.toFixed(1)+'%' : String(Math.round(v));
}
function pivotCompute(){
  const dims = pivotDims();
  const rd = dims[pivot.rows] || dims.bank, cd = pivot.cols ? (dims[pivot.cols] || null) : null;
  const M = PIVOT_METRICS[pivot.metric] || PIVOT_METRICS.our;
  const base = S.applications.filter(a=>{
    if (!isLiveApp(a) || a.applicationStatus !== 'Applied') return false;
    const d = a[pivot.basis]; 
    if (pivot.from && (!d || d < pivot.from)) return false;
    if (pivot.to && (!d || d > pivot.to)) return false;
    return true;
  });
  const rowMap = new Map(), colTotals = new Map();
  base.forEach(a=>{
    const rk = rd.key(a), ck = cd ? cd.key(a) : '__all';
    if (!rowMap.has(rk)) rowMap.set(rk, { all:[], cells:new Map() });
    const R = rowMap.get(rk); R.all.push(a);
    if (!R.cells.has(ck)) R.cells.set(ck, []);
    R.cells.get(ck).push(a);
    if (!colTotals.has(ck)) colTotals.set(ck, []);
    colTotals.get(ck).push(a);
  });
  const isTime = (pivot.rows==='month' || pivot.rows==='salemonth' || pivot.rows==='fy');
  let rowKeys = Array.from(rowMap.keys());
  const val = L => M.fn(L);
  rowKeys.sort((a,b)=> (pivot.sort==='name' || isTime) ? String(a).localeCompare(String(b)) : ((val(rowMap.get(b).all) ?? -1e15) - (val(rowMap.get(a).all) ?? -1e15)));
  let colKeys = cd ? Array.from(colTotals.keys()) : ['__all'];
  const colTime = (pivot.cols==='month' || pivot.cols==='salemonth' || pivot.cols==='fy');
  colKeys.sort((a,b)=> colTime ? String(a).localeCompare(String(b)) : ((val(colTotals.get(b)) ?? -1e15) - (val(colTotals.get(a)) ?? -1e15)));
  const COLCAP = 14, extraCols = Math.max(0, colKeys.length - COLCAP);
  colKeys = colKeys.slice(0, COLCAP);
  return { rd, cd, M, base, rowMap, colTotals, rowKeys, colKeys, extraCols, val };
}
function reportBuilder(){
  const dims = pivotDims();
  const P = pivotCompute();
  const dimOpts = (sel, withNone) => (withNone?`<option value="" ${sel===''?'selected':''}>— none (single column) —</option>`:'') + Object.entries(dims).map(([k,d])=>`<option value="${k}" ${sel===k?'selected':''}>${d.label}</option>`).join('');
  const metricOpts = Object.entries(PIVOT_METRICS).map(([k,m])=>`<option value="${k}" ${pivot.metric===k?'selected':''}>${m.label}</option>`).join('');
  const basisOpts = [['applicationDate','Application date'],['allotmentDate','Allotment date'],['saleDate','Sale date']].map(([k,l])=>`<option value="${k}" ${pivot.basis===k?'selected':''}>${l}</option>`).join('');
  // heat shading relative to the largest cell
  let maxAbs = 0;
  P.rowKeys.forEach(rk => P.colKeys.forEach(ck => { const v = P.val(P.rowMap.get(rk).cells.get(ck) || []); if (v!=null && Math.abs(v) > maxAbs) maxAbs = Math.abs(v); }));
  const shade = v => (v==null || !maxAbs || P.M.fmt==='p') ? '' : `background:rgba(200,150,62,${(Math.min(1,Math.abs(v)/maxAbs)*0.35).toFixed(2)});`;
  const head = `<tr><th>${P.rd.label}${P.cd?` ↓ / ${P.cd.label} →`:''}</th>${P.cd ? P.colKeys.map(ck=>`<th>${escapeHtml(pivotLabel(pivot.cols, ck))}</th>`).join('') : ''}<th>${P.cd?'Total':escapeHtml(P.M.label)}</th></tr>`;
  const bodyRows = P.rowKeys.slice(0, 300).map(rk=>{
    const R = P.rowMap.get(rk);
    const cells = P.cd ? P.colKeys.map(ck=>{ const L = R.cells.get(ck) || []; const v = L.length ? P.val(L) : null; const a = drillAttr(`${pivotLabel(pivot.rows, rk)} · ${pivotLabel(pivot.cols, ck)}`, L); return `<td ${a?'class="clickable" '+a.replace('style="cursor:pointer;"',`style="cursor:pointer;${shade(v)}"`):''}>${L.length?pivotFormat(pivot.metric, v):'<span class="small-muted">·</span>'}</td>`; }).join('') : '';
    const tv = P.val(R.all);
    const ta = drillAttr(`${pivotLabel(pivot.rows, rk)}`, R.all);
    return `<tr><td>${escapeHtml(pivotLabel(pivot.rows, rk))}</td>${cells}<td ${ta?'class="clickable" '+ta:''}><b>${pivotFormat(pivot.metric, tv)}</b></td></tr>`;
  }).join('') || `<tr><td colspan="${(P.cd?P.colKeys.length:0)+2}" class="small-muted">No applications match these filters.</td></tr>`;
  const totalRow = P.rowKeys.length ? `<tr style="font-weight:700;border-top:2px solid var(--border);"><td>TOTAL</td>${P.cd ? P.colKeys.map(ck=>`<td>${pivotFormat(pivot.metric, P.val(P.colTotals.get(ck)||[]))}</td>`).join('') : ''}<td>${pivotFormat(pivot.metric, P.val(P.base))}</td></tr>` : '';
  return `
  <div class="section-card">
    <div class="sc-head"><h3>Report Builder</h3><div class="spacer"></div>
      <button class="btn btn-ghost btn-sm" onclick="exportPivot('xlsx')">Download Excel</button>
      <button class="btn btn-ghost btn-sm" onclick="exportPivot('csv')">Download CSV</button></div>
    <div class="sc-body">
      <div style="display:flex;flex-wrap:wrap;gap:12px;align-items:flex-end;margin-bottom:10px;">
        <div class="f-group"><label>Rows</label><select onchange="setPivot('rows', this.value)">${dimOpts(pivot.rows,false)}</select></div>
        <div class="f-group"><label>Columns</label><select onchange="setPivot('cols', this.value)">${dimOpts(pivot.cols,true)}</select></div>
        <div class="f-group"><label>Show</label><select onchange="setPivot('metric', this.value)">${metricOpts}</select></div>
        <div class="f-group"><label>Filter dates by</label><select onchange="setPivot('basis', this.value)">${basisOpts}</select></div>
        <div class="f-group"><label>From</label><input type="date" value="${pivot.from}" onchange="setPivot('from', this.value)"></div>
        <div class="f-group"><label>To</label><input type="date" value="${pivot.to}" onchange="setPivot('to', this.value)"></div>
        <div class="f-group"><label>Sort rows</label><select onchange="setPivot('sort', this.value)"><option value="value" ${pivot.sort==='value'?'selected':''}>Highest first</option><option value="name" ${pivot.sort==='name'?'selected':''}>A → Z</option></select></div>
      </div>
      <div class="table-wrap"><table class="dt"><thead>${head}</thead><tbody>${bodyRows}${totalRow}</tbody></table></div>
      <p class="hint">Pick what goes down the side (Rows), optionally across the top (Columns), and the number to show. Money and profit figures only count completed sales (Allotted + Sold). Cancelled / Mandate Failed applications are ignored. Click any number to see the records behind it${P.extraCols?` · Showing the ${P.colKeys.length} biggest columns (${P.extraCols} more hidden — narrow the dates or pick a different column)`:''}${P.rowKeys.length>300?' · Showing the first 300 rows':''}.</p>
    </div>
  </div>`;
}
function exportPivot(kind){
  const P = pivotCompute();
  const aoa = [[P.rd.label + (P.cd ? ' / ' + P.cd.label : ''), ...(P.cd ? P.colKeys.map(ck=>pivotLabel(pivot.cols, ck)) : []), P.cd ? 'Total' : P.M.label]];
  const num = v => (v===null||v===undefined) ? '' : Number((Math.round(v*100)/100).toFixed(2));
  P.rowKeys.forEach(rk=>{ const R = P.rowMap.get(rk); aoa.push([pivotLabel(pivot.rows, rk), ...(P.cd ? P.colKeys.map(ck=>{ const L = R.cells.get(ck)||[]; return L.length ? num(P.val(L)) : ''; }) : []), num(P.val(R.all))]); });
  aoa.push(['TOTAL', ...(P.cd ? P.colKeys.map(ck=>num(P.val(P.colTotals.get(ck)||[]))) : []), num(P.val(P.base))]);
  const ws = XLSX.utils.aoa_to_sheet(aoa);
  const name = `Report_${pivot.rows}${pivot.cols?'_by_'+pivot.cols:''}_${pivot.metric}_${todayStr()}`;
  if (kind === 'csv'){
    const blob = new Blob([XLSX.utils.sheet_to_csv(ws)], { type:'text/csv' });
    const url = URL.createObjectURL(blob); const a = document.createElement('a'); a.href = url; a.download = name + '.csv'; a.click(); URL.revokeObjectURL(url);
  } else {
    const wb = XLSX.utils.book_new(); XLSX.utils.book_append_sheet(wb, ws, 'Report'); XLSX.writeFile(wb, name + '.xlsx');
  }
}


function reportSubReferenceProfit(){
  // Group: Reference -> Sub-Reference -> clients -> profit, so you can see each
  // individual sub-reference's contribution plus the combined total for the
  // reference it rolls up under.
  function clientProfitTotal(clientId){
    let our=0, gross=0, clientShare=0;
    S.applications.filter(a=>a.clientId===clientId).forEach(a=>{
      const c = calcAllotmentSale(a);
      if (c.applicable){ our+=c.ourFinal; gross+=c.grossFinal; clientShare+=c.clientFinal; }
    });
    return { our, gross, clientShare };
  }
  // #10: month-over-month trend, by Sale Date, for the headline "Our Profit" figure
  const now = new Date();
  const thisMonthStart = isoDate(new Date(now.getFullYear(), now.getMonth(), 1));
  const lastMonthStart = isoDate(new Date(now.getFullYear(), now.getMonth()-1, 1));
  const lastMonthEnd = isoDate(new Date(now.getFullYear(), now.getMonth(), 0));
  function clientProfitInMonth(clientId, from, to){
    let our=0;
    S.applications.filter(a=>a.clientId===clientId && a.saleStatus==='Sold' && a.saleDate>=from && a.saleDate<=to).forEach(a=>{
      const c = calcAllotmentSale(a);
      if (c.applicable) our+=c.ourFinal;
    });
    return our;
  }
  function trendArrow(thisM, lastM){
    if (lastM===0) return thisM>0 ? '<span class="ok">▲ New</span>' : '';
    const pct = Math.round(((thisM-lastM)/Math.abs(lastM))*100);
    if (pct>0) return `<span class="ok">▲ ${pct}%</span>`;
    if (pct<0) return `<span class="danger">▼ ${Math.abs(pct)}%</span>`;
    return '<span class="small-muted">— 0%</span>';
  }

  const references = ['(No Reference)', ...(S.settings.references||[])];
  let anyData = false;
  const sections = references.map(refName=>{
    const isNone = refName === '(No Reference)';
    const clientsInRef = S.clients.filter(c => isNone ? !c.referenceName : c.referenceName===refName);
    if (!clientsInRef.length) return '';

    const subRefNames = ['(No Sub-Reference)', ...(S.settings.subReferences||[])];
    const subRows = subRefNames.map(subName=>{
      const isNoneSub = subName === '(No Sub-Reference)';
      const clientsInSub = clientsInRef.filter(c => isNoneSub ? !c.subReference : c.subReference===subName);
      if (!clientsInSub.length) return null;
      let our=0, gross=0, clientShare=0, thisMonth=0, lastMonth=0;
      clientsInSub.forEach(c=>{
        const t=clientProfitTotal(c.id); our+=t.our; gross+=t.gross; clientShare+=t.clientShare;
        thisMonth += clientProfitInMonth(c.id, thisMonthStart, todayStr());
        lastMonth += clientProfitInMonth(c.id, lastMonthStart, lastMonthEnd);
      });
      if (our===0 && gross===0 && clientShare===0) return null;
      anyData = true;
      return { subName, clientCount:clientsInSub.length, our, gross, clientShare, thisMonth, lastMonth };
    }).filter(Boolean);

    if (!subRows.length) return '';
    const refTotalOur = subRows.reduce((s,r)=>s+r.our,0);
    const refTotalGross = subRows.reduce((s,r)=>s+r.gross,0);
    const refTotalClient = subRows.reduce((s,r)=>s+r.clientShare,0);

    return `
    <div class="section-card">
      <div class="sc-head"><h3>${escapeHtml(refName)}</h3><div class="spacer"></div><span class="small-muted">Total Our Profit: <b class="gold">${fmtMoney(refTotalOur)}</b></span></div>
      <div class="sc-body table-wrap">
        <table class="dt"><thead><tr><th>Sub-Reference</th><th>Clients</th><th>Gross Received</th><th>Our Profit</th><th>Client Profit</th><th>Trend (vs last month)</th></tr></thead>
        <tbody>
          ${subRows.map(r=>`<tr><td>${escapeHtml(r.subName)}</td><td>${r.clientCount}</td><td>${fmtMoney(r.gross)}</td><td>${fmtMoney(r.our)}</td><td>${fmtMoney(r.clientShare)}</td><td>${trendArrow(r.thisMonth, r.lastMonth)}</td></tr>`).join('')}
          <tr style="font-weight:700;border-top:2px solid var(--border);"><td>Total</td><td>${clientsInRef.length}</td><td>${fmtMoney(refTotalGross)}</td><td>${fmtMoney(refTotalOur)}</td><td>${fmtMoney(refTotalClient)}</td><td></td></tr>
        </tbody></table>
      </div>
    </div>`;
  }).join('');

  return anyData ? sections : `<div class="section-card"><div class="sc-body"><p class="small-muted">No profit recorded against any Reference/Sub-Reference yet.</p></div></div>`;
}

let caFilters = { reference:'', subReference:'' };
function setCaFilter(key, val){ caFilters[key] = val; render(); }
function reportClientAnalysis(){

  }).join('') || `<tr class="empty-row"><td colspan="10">No clients match.</td></tr>`;

  // #9: Inactive client flagging — no application in 60+/90+ days, based on their most recent application date

  return `<div class="section-card">

        ${(S.settings.references||[]).map(r=>`<option value="${escapeHtml(r)}" ${caFilters.reference===r?'selected':''}>${escapeHtml(r)}</option>`).join('')}
      </select>
      <select onchange="setCaFilter('subReference', this.value)">
        <option value="">Sub Reference: All</option>
        ${(S.settings.subReferences||[]).map(r=>`<option value="${escapeHtml(r)}" ${caFilters.subReference===r?'selected':''}>${escapeHtml(r)}</option>`).join('')}
      </select>
    </div>
  </div>
  <div class="section-card"><div class="sc-body table-wrap"><table class="dt"><thead><tr><th>Client</th><th>Sub Reference</th><th>Applications</th><th>Allotments</th><th>Not Allotted</th><th>Sold</th><th>Amount Applied</th><th>Gross Received</th><th>Our Profit</th><th>Client Profit</th></tr></thead><tbody>${rows}</tbody></table></div></div>

  <div class="section-card">
    <div class="sc-head"><h3>Inactive Clients — Re-engagement List</h3></div>
    <div class="sc-body">
      <p class="small-muted">Clients with no application in 60+ days, sorted by longest inactive first. Past 90 days is flagged.</p>
      ${inactiveTableRows ? `<div class="table-wrap"><table class="dt"><thead><tr><th>Client</th><th>Last Application</th><th>Days Inactive</th></tr></thead><tbody>${inactiveTableRows}</tbody></table></div>` : '<p class="small-muted">No inactive clients right now — everyone has applied within the last 60 days.</p>'}
    </div>
  </div>`;
}
function reportIpoAnalysis(){
  const rows = S.ipos.map(i=>{
    const st = ipoStats(i.id);
    const notAllotted = st.apps.filter(a=>a.allotmentStatus==='Not Allotted').length;
    const sold = st.apps.filter(a=>a.saleStatus==='Sold').length;
    const amountApplied = st.apps.reduce((s,a)=>s+(Number(a.amountApplied)||0),0);
    const gross = st.apps.reduce((s,a)=>{ const c=calcAllotmentSale(a); return s+(c.applicable?c.grossFinal:0); },0);
    const resolvedCount = st.allotted.length + notAllotted;
    const winRate = resolvedCount ? Math.round((st.allotted.length/resolvedCount)*1000)/10 : null;
    return { ipoName:i.ipoName, apps:st.apps.length, allotted:st.allotted.length, notAllotted, sold, amountApplied, gross, profit:st.profit, clientProfit:st.clientProfit, winRate, resolvedCount };
  });
