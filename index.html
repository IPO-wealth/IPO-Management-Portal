let gapState = { dim:'ipo', period:'all' };
window.__gapG = {};
function setGap(k,v){ gapState[k]=v; render(); }
function goGap(){ reportsTab='gap'; navigate('reports'); }
function gapRows(){
  const now = new Date(), y = now.getFullYear();
  let from='', to='';
  if (gapState.period==='year'){ from=y+'-01-01'; to=y+'-12-31'; }
  else if (gapState.period==='lastyear'){ from=(y-1)+'-01-01'; to=(y-1)+'-12-31'; }
  const groups = new Map();
  S.applications.forEach(a=>{
    const c = calcAllotmentSale(a); if (!c.applicable) return;
    if (from && (!a.saleDate || a.saleDate<from || a.saleDate>to)) return;
    let key, name, nav;
    if (gapState.dim==='client'){ const cl=findClient(a.clientId); key='c'+a.clientId; name=cl?cl.clientName:'(unknown client)'; nav=`openClientDetail(${a.clientId})`; }
    else { const i=findIpo(a.ipoId); key='i'+a.ipoId; name=i?i.ipoName:'(unknown IPO)'; nav=`navigate('ipos',{id:${a.ipoId}})`; }
    if (!groups.has(key)) groups.set(key,{ key, name, nav, apps:[], our:0, client:0, shareEff:0, ovEff:0, shares:new Map(), ovN:0 });
    const g = groups.get(key);
    // What the split would have been with no manual overrides: that difference is purely the share %.
    const base = calcAllotmentSale({ ...a, grossReceivedOverridden:false, ourProfitOverridden:false, clientProfitOverridden:false });
    const sh = base.ourFinal - base.clientFinal, d = c.ourFinal - c.clientFinal;
    g.apps.push(a); g.our += c.ourFinal; g.client += c.clientFinal; g.shareEff += sh; g.ovEff += d - sh;
    const sp = appProfitShare(a);
    if (sp !== 50){ const e = g.shares.get(sp) || { n:0, v:0 }; e.n++; e.v += sh; g.shares.set(sp, e); }
    if (c.grossOverridden || c.ourOverridden || c.clientOverridden) g.ovN++;
  });
  const sg = v => (Math.abs(v)<0.5 ? '' : (v>0?'+':'−')) + fmtMoney(Math.abs(v));
  const rows = Array.from(groups.values()).map(g=>{
    g.diff = g.our - g.client;
    const why = [];
    Array.from(g.shares.entries()).sort((a,b)=>Math.abs(b[1].v)-Math.abs(a[1].v)).forEach(([sp,e])=>{ if (Math.abs(e.v)>=0.5) why.push(`${sp}% share on ${e.n} sale${e.n>1?'s':''} (${sg(e.v)})`); });
    if (g.ovN && Math.abs(g.ovEff)>=0.5) why.push(`${g.ovN} manual override${g.ovN>1?'s':''} (${sg(g.ovEff)})`);
    g.why = why.length ? why.join('; ') : 'Equal split';
    window.__gapG[g.key] = g;
    return g;
  }).sort((a,b)=>Math.abs(b.diff)-Math.abs(a.diff));
  return rows;
}
function reportGap(){
  const rows = gapRows();
  const T = rows.reduce((t,g)=>({ our:t.our+g.our, client:t.client+g.client, sh:t.sh+g.shareEff, ov:t.ov+g.ovEff, n:t.n+g.apps.length }), { our:0, client:0, sh:0, ov:0, n:0 });
  const diff = T.our - T.client;
  const sg = v => (Math.abs(v)<0.5 ? '' : (v>0?'+':'−')) + fmtMoney(Math.abs(v));
  const dimName = gapState.dim==='client' ? 'Client' : 'IPO';
  window.__tableRerender['gapTbl'] = () => {
    renderIntoWrap('gapTblWrap', renderDataTable('gapTbl', {
      data: rows,
      searchFn: (r,q) => (r.name+' '+r.why).toLowerCase().includes(q),
      searchPlaceholder: 'Search '+dimName.toLowerCase()+'...',
      filters: [],
      pageSize: 15,
      columns: [
        { key:'name', label:dimName, render:r=>`<a class="lnk" href="javascript:void(0)" onclick="${r.nav}">${escapeHtml(r.name)}</a>` },
        { key:'sales', label:'Sales', num:true, sum:true, val:r=>r.apps.length, render:r=>`<a class="lnk" href="javascript:void(0)" onclick="drillNow(window.__gapG['${r.key}'].name+' — sales', window.__gapG['${r.key}'].apps)">${r.apps.length}</a>` },
        { key:'our', label:'Our Profit', num:true, sum:'money', val:r=>r.our, render:r=>fmtMoney(r.our) },
        { key:'client', label:'Client Profit', num:true, sum:'money', val:r=>r.client, render:r=>fmtMoney(r.client) },
        { key:'diff', label:'Difference (Our − Client)', num:true, sum:'money', val:r=>r.diff, render:r=>`<b class="${r.diff>0.5?'gold':r.diff<-0.5?'danger':''}">${sg(r.diff)||fmtMoney(0)}</b>` },
        { key:'shareEff', label:'From share %', num:true, sum:'money', val:r=>r.shareEff, render:r=>sg(r.shareEff)||'—' },
        { key:'ovEff', label:'From overrides', num:true, sum:'money', val:r=>r.ovEff, render:r=>sg(r.ovEff)||'—' },
        { key:'why', label:'Reason', render:r=>`<span class="small-muted">${escapeHtml(r.why)}</span>` }
      ]
    }));
  };
  setTimeout(()=>window.__tableRerender['gapTbl'](), 0);
  const opt = (v,l,cur)=>`<option value="${v}" ${cur===v?'selected':''}>${l}</option>`;
  return `
  <div class="section-card">
    <div class="sc-head"><h3>Our Profit vs Client Profit</h3></div>
    <div class="sc-body">
      <div style="display:flex;flex-wrap:wrap;gap:12px;align-items:flex-end;margin-bottom:14px;">
        <div class="f-group"><label>Break down by</label><select onchange="setGap('dim',this.value)">${opt('ipo','IPO',gapState.dim)}${opt('client','Client',gapState.dim)}</select></div>
        <div class="f-group"><label>Sale date</label><select onchange="setGap('period',this.value)">${opt('all','All time',gapState.period)}${opt('year','This year',gapState.period)}${opt('lastyear','Last year',gapState.period)}</select></div>
      </div>
      <div class="kpi-grid" style="margin-bottom:14px;">
        <div class="kpi-card"><div class="lbl">Our profit</div><div class="val gold">${fmtMoney(T.our)}</div></div>
        <div class="kpi-card"><div class="lbl">Client profit</div><div class="val">${fmtMoney(T.client)}</div></div>
        <div class="kpi-card"><div class="lbl">Difference (Our − Client)</div><div class="val ${diff>0.5?'gold':diff<-0.5?'danger':''}">${sg(diff)||fmtMoney(0)}</div><div class="small-muted">${T.n} completed sale${T.n===1?'':'s'}</div></div>
        <div class="kpi-card"><div class="lbl">Due to share %</div><div class="val">${sg(T.sh)||'—'}</div><div class="small-muted">our share is not 50%</div></div>
        <div class="kpi-card"><div class="lbl">Due to overrides</div><div class="val">${sg(T.ov)||'—'}</div><div class="small-muted">manual changes to profit</div></div>
      </div>
      <div id="gapTblWrap"></div>
      <p class="hint">Each sale's profit is split between us and the client. The two totals are equal when every sale is split 50/50 with no manual changes. <b>From share %</b> = the gap created because our share on that sale is above or below 50%. <b>From overrides</b> = the gap created by manually edited Gross Received / Our Profit / Client Profit. The two columns add up to the Difference. The table is sorted by the biggest gap first; click a count to see the sales behind it.</p>
    </div>
  </div>`;
}

/* Plain-language summary of an audit entry: "field: old → new" for each changed field. */
function auditChangeSummary(r){
  try {
    if (r.chg){
      const f = v => (v===null||v===undefined||v==='') ? '(blank)' : String(v);
      const parts = Object.entries(r.chg).map(([k,v])=>`<b>${escapeHtml(k)}</b>: ${escapeHtml(f(v[0]))} → ${escapeHtml(f(v[1]))}`);
      return parts.length ? parts.slice(0,6).join('<br>') + (parts.length>6 ? `<br><span class="small-muted">+${parts.length-6} more</span>` : '') : '<span class="small-muted">No field changes</span>';
    }
    const prev = r.prev ? JSON.parse(r.prev) : null, next = r.next ? JSON.parse(r.next) : null;
    if (!prev && next) return '<span class="small-muted">New record created</span>';
    if (prev && !next) return '<span class="small-muted">Record deleted</span>';
    if (!prev || !next) return '—';
    const skip = new Set(['updatedAt','createdAt','id']);
    const parts = [];
    for (const k of Object.keys(next)){
      if (skip.has(k)) continue;
      if (JSON.stringify(prev[k]) !== JSON.stringify(next[k])){
        const f = v => (v===null||v===undefined||v==='') ? '(blank)' : String(v);
        parts.push(`<b>${escapeHtml(k)}</b>: ${escapeHtml(f(prev[k]))} → ${escapeHtml(f(next[k]))}`);
      }
    }
    return parts.length ? parts.slice(0,6).join('<br>') + (parts.length>6 ? `<br><span class="small-muted">+${parts.length-6} more</span>` : '') : '<span class="small-muted">No field changes</span>';
  } catch(e){ return '—'; }
}

function applyShareToUnsold(){
  const v = defaultProfitShare();

  const targets = S.applications.filter(a => a.saleStatus !== 'Sold' && appProfitShare(a) !== shareForClient(a.clientId));
  if (!targets.length){ toast('Every not-yet-sold application already matches its client\'s share','ok'); return; }
  confirmAction(`Update the profit share on ${targets.length} application(s) that are not sold yet — ${v}% for clients on the standard share, and each custom-share client's own percentage? Sold applications are not touched.`, async () => {
    for (const a of targets){

      await putRec('applications', updated); Object.assign(a, updated);
    }
    await audit('Profit Share Bulk Update','Applications', null, null, { count: targets.length, share: v });

/* Design note: "Applications", "Allotment", "Sale", and "Recovery" are NOT separate
   entities in this app — they're all fields on one Application record (see
   saveApplication/saveAllotmentSale). So the import uses ONE "Applications" sheet
   covering the full lifecycle per row, matching how the app actually stores data,
   rather than three sheets that would need to be stitched back together.
   Allotment Date is deliberately NOT a column here — it's hard-locked to the IPO's
   own Allotment Date everywhere else in the app, so the import pulls it from the
   matched IPO automatically instead of asking for it per row. */

function downloadImportTemplate(){

function excelSerialToIso(serial){
  // Standard Excel-serial-to-calendar-date conversion, done entirely in UTC
  // math. This deliberately avoids depending on how any library constructs
  // JS Date objects internally (that ambiguity is what caused the date to
  // shift by a day) — a serial number is just a number, so there's nothing
  // to get wrong about timezone or local-vs-UTC here.
  const utcDays = Math.floor(serial - 25569); // 25569 = days between 1899-12-30 and 1970-01-01
  const d = new Date(utcDays * 86400 * 1000);
  const y = d.getUTCFullYear(), m = String(d.getUTCMonth()+1).padStart(2,'0'), day = String(d.getUTCDate()).padStart(2,'0');
  return `${y}-${m}-${day}`;
}
function parseExcelDate(val){
  if (val===null || val===undefined || val==='') return null;
  if (typeof val === 'number') return excelSerialToIso(val);
  if (val instanceof Date){
    // Fallback only — shouldn't normally be hit now that we read raw values,
    // but handled defensively in case a cell already comes through as a Date.
    if (val.getUTCHours()===0 && val.getUTCMinutes()===0 && val.getUTCSeconds()===0){
      return `${val.getUTCFullYear()}-${String(val.getUTCMonth()+1).padStart(2,'0')}-${String(val.getUTCDate()).padStart(2,'0')}`;
    }
    return `${val.getFullYear()}-${String(val.getMonth()+1).padStart(2,'0')}-${String(val.getDate()).padStart(2,'0')}`;
  }
  const s = String(val).trim();
  // dd/mm/yyyy or dd-mm-yyyy (common in India) — construct in UTC, not local time
  const dmy = s.match(/^(\d{1,2})[\/\-](\d{1,2})[\/\-](\d{4})$/);
  if (dmy) return excelSerialToIso(Math.floor((Date.UTC(Number(dmy[3]), Number(dmy[2])-1, Number(dmy[1])) - Date.UTC(1899,11,30)) / 86400000));
  // yyyy-mm-dd — extract directly rather than round-tripping through Date parsing
  const iso = s.match(/^(\d{4})-(\d{1,2})-(\d{1,2})/);
  if (iso) return `${iso[1]}-${String(iso[2]).padStart(2,'0')}-${String(iso[3]).padStart(2,'0')}`;
  return null;
}
function normalizeStatus(val, allowed){
  const s = (val||'').toString().trim();
  const hit = allowed.find(a => a.toLowerCase() === s.toLowerCase());
  return hit || null;
}

let __pendingImport = null;
function importFromExcel(file){
  if (!file) return;
  const reader = new FileReader();
  reader.onload = (e) => {
    let wb;
    try { wb = XLSX.read(e.target.result, { type:'array', cellDates:false }); }
    catch(err){ toast('Could not read this file — make sure it\'s a valid .xlsx file','danger'); return; }

    const ipoRows = wb.Sheets['IPOs'] ? XLSX.utils.sheet_to_json(wb.Sheets['IPOs'], { defval:'' }) : [];
    const appRows = wb.Sheets['Applications'] ? XLSX.utils.sheet_to_json(wb.Sheets['Applications'], { defval:'' }) : [];

    const plan = { newIpos:[], updatedIpos:[], newClients:new Set(), newClientMeta:{}, clientFills:{}, newBanks:new Set(), newUpis:[], newApps:[], errors:[], skippedDupes:0 };

    // ---- IPOs sheet: create new, or update dates/amount on existing (matched by name) ----
    ipoRows.forEach((row, idx) => {
      const name = (row['IPO Name']||'').toString().trim();
      if (!name || /example — delete/i.test(name)) return;
      const openDate = parseExcelDate(row['Open Date']);
      const closeDate = parseExcelDate(row['Close Date']);
      const allotmentDate = parseExcelDate(row['Allotment Date']);
      const minAmount = Number(row['Min Amount']) || 0;
      const existing = S.ipos.find(i => i.ipoName.toLowerCase() === name.toLowerCase());
      if (existing) plan.updatedIpos.push({ existing, name, minAmount, openDate, closeDate, allotmentDate });
      else plan.newIpos.push({ name, minAmount, openDate, closeDate, allotmentDate });
    });

    // ---- Applications sheet: auto-create Client/Bank/UPI by name, match IPO by name ----
    appRows.forEach((row, idx) => {
      const rowNum = idx + 2; // +2: header row + 1-indexing, matches what the user sees in Excel
      const clientName = (row['Client Name']||'').toString().trim();
      const ipoName = (row['IPO']||'').toString().trim();
      const bankName = (row['Bank']||'').toString().trim();
      if (!clientName || /example — delete/i.test(clientName)) return;
      if (!ipoName || !bankName){ plan.errors.push(`Row ${rowNum}: missing IPO or Bank name — skipped.`); return; }

      const amountApplied = Number(row['Amount Applied']) || 0;

      const applicationDate = parseExcelDate(row['Application Date']);
      if (!applicationDate){ plan.errors.push(`Row ${rowNum} (${clientName}): missing or invalid Application Date — skipped.`); return; }

      const allotmentStatus = normalizeStatus(row['Allotment Status'], ALLOTMENT_STATUSES) || 'Pending';
      const saleStatus = row['Sale Status'] ? normalizeStatus(row['Sale Status'], SALE_STATUSES) : null;
      if (row['Sale Status'] && !saleStatus){ plan.errors.push(`Row ${rowNum} (${clientName}): Sale Status "${row['Sale Status']}" not recognized — must be exactly "Pending to Sell" or "Sold". Left blank.`); }
      const recoveryStatus = row['Recovery Status'] ? normalizeStatus(row['Recovery Status'], RECEIVE_STATUSES) : null;
      if (row['Recovery Status'] && !recoveryStatus){ plan.errors.push(`Row ${rowNum} (${clientName}): Recovery Status "${row['Recovery Status']}" not recognized — must be exactly "Receivable" or "Received". Left blank.`); }
      const saleDate = parseExcelDate(row['Sale Date']);
      const saleAmount = row['Sale Amount']!=='' ? Number(row['Sale Amount'])||0 : null;
      const grossReceived = row['Gross Received']!=='' && row['Gross Received']!=null ? Number(row['Gross Received'])||0 : null;
      const refName = (row['Reference']||'').toString().trim().replace(/\s+/g,' ');
      const subRef = (row['Sub Reference']||'').toString().trim().replace(/\s+/g,' ');
      // optional link to an existing plan — must be a plan for the same IPO
      let planId = null;
      if (row['Plan ID']!=='' && row['Plan ID']!=null){
        const pl = S.ipoPlans.find(x => String(x.id) === String(row['Plan ID']).trim());
        const ipoForPlan = S.ipos.find(i=>i.ipoName.toLowerCase()===ipoName.toLowerCase());
        if (!pl) plan.errors.push(`Row ${rowNum} (${clientName}): Plan ID "${row['Plan ID']}" does not exist — plan link left blank.`);
        else if (!ipoForPlan || pl.ipoId !== ipoForPlan.id) plan.errors.push(`Row ${rowNum} (${clientName}): Plan ID ${row['Plan ID']} belongs to a different IPO — plan link left blank.`);
        else planId = pl.id;
      }

      // duplicate check against records already in the portal (same rule the manual form uses)
      const existingClient = S.clients.find(c=>c.clientName.toLowerCase()===clientName.toLowerCase());
      const existingBank = S.bankAccounts.find(b=>b.bankName.toLowerCase()===bankName.toLowerCase());
      const matchedNewIpo = plan.newIpos.find(i=>i.name.toLowerCase()===ipoName.toLowerCase());
      const existingIpo = S.ipos.find(i=>i.ipoName.toLowerCase()===ipoName.toLowerCase());
      if (existingClient && existingBank && (existingIpo||matchedNewIpo)){
        const ipoRef = existingIpo ? existingIpo.id : ('NEW:'+ipoName.toLowerCase());
        const dupe = S.applications.find(a => a.clientId===existingClient.id && String(a.ipoId)===String(ipoRef) && a.bankAccountId===existingBank.id) ||
                     plan.newApps.find(a => a._clientKey===clientName.toLowerCase() && a._ipoKey===ipoName.toLowerCase() && a._bankKey===bankName.toLowerCase());
        if (dupe){ plan.skippedDupes++; return; }
      }
      if (!existingClient){
        plan.newClients.add(clientName);
        const k = clientName.toLowerCase();
        if (!plan.newClientMeta[k]) plan.newClientMeta[k] = { ref:refName, sub:subRef };
        else { if (!plan.newClientMeta[k].ref && refName) plan.newClientMeta[k].ref = refName; if (!plan.newClientMeta[k].sub && subRef) plan.newClientMeta[k].sub = subRef; }
      } else if ((!existingClient.referenceName && refName) || (!existingClient.subReference && subRef)){
        plan.clientFills[existingClient.id] = { ref: refName, sub: subRef };
      }
      if (!existingBank) plan.newBanks.add(bankName);
      const upiId = (row['UPI ID']||'').toString().trim();
      if (upiId && existingBank && !bankUpis(existingBank.id).some(u=>u.upiId.toLowerCase()===upiId.toLowerCase())){
        plan.newUpis.push({ bankName, upiId });
      }

      plan.newApps.push({
        _clientKey:clientName.toLowerCase(), _ipoKey:ipoName.toLowerCase(), _bankKey:bankName.toLowerCase(),
        clientName, ipoName, bankName, upiId, applicationDate, amountApplied,
        allotmentStatus, saleStatus, saleDate, saleAmount, recoveryStatus, grossReceived, planId, rowNum
      });
    });

    __pendingImport = plan;
    showImportPreview(plan);
  };
  reader.readAsArrayBuffer(file);
}

  const summary = `
    <div class="kpi-grid" style="margin-bottom:14px;">
      <div class="kpi-card"><div class="lbl">New IPOs</div><div class="val">${plan.newIpos.length}</div></div>
      <div class="kpi-card"><div class="lbl">IPOs to Update</div><div class="val">${plan.updatedIpos.length}</div></div>

    </div>`;

  openModal('Review Import Before Committing',

    `<button class="btn btn-ghost" onclick="closeModal()">Cancel</button><button class="btn btn-primary" onclick="commitImport()">Import ${plan.newApps.length} Application${plan.newApps.length===1?'':'s'}</button>`);
}

async function commitImport(){
  const plan = __pendingImport;
  if (!plan) return;
  closeModal();

  // 1) IPOs — create new, update existing
  for (const ni of plan.newIpos){
    const ipoId = nextCode(S.ipos, 'ipoId', 'IPO');
    const rec = { ipoId, ipoName:ni.name, minimumApplicationAmount:ni.minAmount, openDate:ni.openDate, closeDate:ni.closeDate, allotmentDate:ni.allotmentDate, archiveStatus:'Active', createdAt:new Date().toISOString(), updatedAt:new Date().toISOString() };
    const newId = await putRec('ipos', rec); rec.id = newId; S.ipos.push(rec);
    await audit('IPO Imported','IPO', ipoId, null, rec);
  }
  for (const ui of plan.updatedIpos){
    const updated = { ...ui.existing, minimumApplicationAmount:ui.minAmount||ui.existing.minimumApplicationAmount, openDate:ui.openDate||ui.existing.openDate, closeDate:ui.closeDate||ui.existing.closeDate, allotmentDate:ui.allotmentDate||ui.existing.allotmentDate, updatedAt:new Date().toISOString() };
    await putRec('ipos', updated); const __prev15 = {...ui.existing}; Object.assign(ui.existing, updated);
    await audit('IPO Updated via Import','IPO', ui.existing.ipoId, __prev15, updated);
    await syncIpoAllotmentDate(ui.existing);
  }

  // 2) Clients — auto-create by name
  const clientByName = {};
  S.clients.forEach(c => clientByName[c.clientName.toLowerCase()] = c);
  for (const name of plan.newClients){
    const clientId = nextCode(S.clients, 'clientId', 'CL');
    const meta = (plan.newClientMeta||{})[name.toLowerCase()] || { ref:'', sub:'' };
    const rec = { clientId, clientName:name, referenceName:meta.ref||'', subReference:meta.sub||'', status:'Active', createdAt:new Date().toISOString(), updatedAt:new Date().toISOString() };
    const newId = await putRec('clients', rec); rec.id = newId; S.clients.push(rec);
    clientByName[name.toLowerCase()] = rec;
    await audit('Client Imported','Client', clientId, null, rec);
  }

  // 2b) Fill blank Reference / Sub Reference on existing clients (never overwrite a value already there)
  for (const [cid, f] of Object.entries(plan.clientFills||{})){
    const c = S.clients.find(x => String(x.id) === String(cid));
    if (!c) continue;
    const updated = { ...c, referenceName: c.referenceName || f.ref || '', subReference: c.subReference || f.sub || '', updatedAt:new Date().toISOString() };
    const prev = {...c}; await putRec('clients', updated); Object.assign(c, updated);
    await audit('Client Updated via Import','Client', c.clientId, prev, updated);
  }
  // keep the Sub-Reference dropdown list in Settings in step with any new names
  const knownSubs = S.settings.subReferences || [];
  const newSubs = S.clients.map(c=>(c.subReference||'').trim()).filter(x => x && !knownSubs.includes(x));
  if (newSubs.length) await saveSetting('subReferences', [...knownSubs, ...Array.from(new Set(newSubs))]);

  // 3) Banks — auto-create by name
  const bankByName = {};
  S.bankAccounts.forEach(b => bankByName[b.bankName.toLowerCase()] = b);
  for (const name of plan.newBanks){
    const bankId = nextCode(S.bankAccounts, 'bankId', 'BANK');
    const rec = { bankId, bankName:name, accountHolderName:'', status:'Active', createdAt:new Date().toISOString(), updatedAt:new Date().toISOString() };
    const newId = await putRec('bankAccounts', rec); rec.id = newId; S.bankAccounts.push(rec);
    bankByName[name.toLowerCase()] = rec;
    await audit('Bank Account Imported','BankAccount', bankId, null, rec);
  }

  // 4) UPI IDs — auto-create under the matched bank
  for (const nu of plan.newUpis){
    const bank = bankByName[nu.bankName.toLowerCase()];
    if (!bank) continue;
    const rec = { bankAccountId:bank.id, upiId:nu.upiId, createdAt:new Date().toISOString(), updatedAt:new Date().toISOString() };
    const newId = await putRec('bankUpiIds', rec); rec.id = newId; S.bankUpiIds.push(rec);
  }

  // 5) Applications — build final records, resolving IPO/Client/Bank/UPI by name
  const ipoByName = {}; S.ipos.forEach(i => ipoByName[i.ipoName.toLowerCase()] = i);
  for (const na of plan.newApps){
    const client = clientByName[na._clientKey];
    const bank = bankByName[na._bankKey];
    const ipo = ipoByName[na._ipoKey];
    if (!client || !bank || !ipo) continue; // shouldn't happen — already validated in the preview step
    const upi = na.upiId ? bankUpis(bank.id).find(u=>u.upiId.toLowerCase()===na.upiId.toLowerCase()) : null;
    const rec = {
      clientId:client.id, ipoId:ipo.id, bankAccountId:bank.id, upiId: upi?upi.id:null,
      applicationDate:na.applicationDate, amountApplied:na.amountApplied, applicationStatus:'Applied', planId: na.planId || null, profitSharePct: shareForClient(client.id),
      allotmentStatus:na.allotmentStatus, allotmentDate: ipo.allotmentDate || null,
      saleStatus:na.saleStatus, saleDate:na.saleDate, saleAmount:na.saleAmount,
      calculatedGrossReceived:null, grossReceived:na.grossReceived, grossReceivedOverridden: na.grossReceived!=null,
      calculatedOurProfit:null, ourProfit:null, ourProfitOverridden:false,
      calculatedClientProfit:null, clientProfit:null, clientProfitOverridden:false,
      amountReceiveStatus:na.recoveryStatus,
      overrideReason: na.grossReceived!=null ? 'Set via Excel import' : null,
      overrideChangedAt: na.grossReceived!=null ? new Date().toISOString() : null,
      createdAt:new Date().toISOString(), updatedAt:new Date().toISOString()
    };
    const newId = await putRec('applications', rec); rec.id = newId; S.applications.push(rec);
  }
  await audit('Bulk Import','Applications', null, null, { count: plan.newApps.length });

  __pendingImport = null;
  toast(`Imported ${plan.newApps.length} application(s)`,'ok');
  if (typeof scheduleSync === 'function') scheduleSync();
  navigate('dashboard');
}

function localBackupDownload(){

  const url = URL.createObjectURL(blob);
  const a = document.createElement('a'); a.href = url; a.download = `ipo_portal_backup_${todayStr()}.json`; a.click();
  URL.revokeObjectURL(url);

function daysSinceLastBackup(){
  const dates = [S.settings.lastManualBackup, S.settings.lastSynced].filter(Boolean).map(d=>new Date(d).getTime());
  if (!dates.length) return null;
  const mostRecent = Math.max(...dates);
  return Math.floor((Date.now() - mostRecent) / 86400000);
}
async function restoreSnapshot(data){
  window.__suppressReadOnlyCheck = true; // this is the system syncing real data in, not a user edit — must never be blocked by viewer read-only mode
  try {
    for (const [store, keyPath] of Object.entries(STORES)){
      if (store === 'settings') continue;
      await clearStore(store);
      const arr = data[store] || [];
      for (const rec of arr) await putRec(store, rec);
    }
    if (data.settings){
      const isOwner = window.__drive && window.__drive.role === 'owner';
      for (const [k,v] of Object.entries(data.settings)){
        if (isLocalOnlySetting(k)) continue;
        if (isOwner && k==='authorizedEmail' && S.settings[k]) continue;
        if (isOwner && k==='collaborators' && (S.settings[k]||[]).length) continue; // owner's list is the master copy
        await saveSetting(k, v);
      }
    }
    await loadAll();
  } finally {
    window.__suppressReadOnlyCheck = false;
  }
}
function localBackupRestore(file){
  if (!file) return;
  const reader = new FileReader();
  reader.onload = (e) => {
    let data;
    try { data = JSON.parse(e.target.result); }
    catch(err){ toast('Invalid backup file — not valid JSON','danger'); return; }
    const counts = ['clients','bankAccounts','ipos','ipoPlans','applications'].map(k =>
      `${(data[k]||[]).length} ${k}`).join(', ');
    openModal('Restore Backup?',
      `<p style="font-size:13px;line-height:1.6;">
         <b>&#9888; Restoring this backup may replace current portal data.</b><br><br>
         <b>Backup date:</b> ${data.exportedAt ? fmtDate(data.exportedAt) : 'Unknown'}<br>
         <b>Data version:</b> ${data.version ?? 'Unknown'}<br>
         <b>Contains:</b> ${counts || 'No records found'}
       </p>`,
      `<button class="btn btn-ghost" onclick="closeModal()">Cancel</button>
       <button class="btn btn-danger" id="confirmRestoreBtn">Restore This Backup</button>`);
    document.getElementById('confirmRestoreBtn').onclick = async () => {
      closeModal();
      try {
        await restoreSnapshot(data);
        await saveSetting('lastRestore', new Date().toISOString());
        toast('Backup restored','ok');
        navigate('dashboard');
      } catch(err){ toast('Restore failed: ' + (err.message||err),'danger'); }
    };
  };
  reader.readAsText(file);
}

  return new Promise((resolve) => {
    if (window.google && window.google.picker) return resolve();
    const s = document.createElement('script');
    s.src = 'https://apis.google.com/js/api.js';
    s.onload = () => { gapi.load('picker', resolve); };
    s.onerror = resolve;
    document.head.appendChild(s);
  });
}
async function openCollaboratorFilePicker(){
  const apiKey = S.settings.googlePickerApiKey;
  if (!apiKey){
    openModal('One More Setup Step',
      `<p style="font-size:13px;line-height:1.6;">To access a portal shared with you, the owner needs to add a Google Picker API key in Settings → Share Portal Access first (a one-time setup, separate from the OAuth Client ID). Ask them to complete that, then reconnect here.</p>`,
      `<button class="btn btn-primary" onclick="closeModal()">OK</button>`);
    return;
  }
  await loadPicker();
  if (!window.google || !window.google.picker){ toast('Could not load Google Picker — check your connection','danger'); return; }
  const view = new google.picker.DocsView(google.picker.ViewId.DOCS)
    .setMimeTypes('application/json')
    .setIncludeFolders(true);
  const picker = new google.picker.PickerBuilder()
    .addView(view)
    .setOAuthToken(window.__drive.accessToken)
    .setDeveloperKey(apiKey)
    .setAppId(String(S.settings.driveClientId||'').split('-')[0]) // Cloud project number: required so Google grants this app access to the picked file under drive.file scope
    .setCallback(async (data) => {
      if (data.action === google.picker.Action.PICKED){
        const file = data.docs[0];
        const email = (window.__drive.email||'').toLowerCase();
        await saveSetting('collabFileId_'+email, file.id);
        if (file.parentId) await saveSetting('collabFolderId_'+email, file.parentId);
        window.__drive.fileId = file.id;
        const ok = await refreshFromDrive(true);
        if (!ok){
          window.__drive.role = 'pending';
          openModal('Could not open the shared file',
            `<p style="font-size:13px;line-height:1.6;">Google refused to let this portal read the file you picked.</p>
             <p style="font-size:13px;line-height:1.6;"><b>Error:</b> ${escapeHtml(window.__drive.lastError||'unknown')}</p>
             <p class="small-muted">Send this message to the portal owner.</p>`,
            `<button class="btn btn-primary" onclick="closeModal()">Close</button>`);
          return;
        }
        // Only now, after pulling the REAL shared settings, do we actually know
        // whether this person is an Editor or Viewer — trusting anything set
        // before this point would be a guess, which is exactly what caused the
        // original bug.
        const realCollaborators = S.settings.collaborators || [];
        const realCollab = realCollaborators.find(c => c.email.toLowerCase() === email);
        const realOwner = (S.settings.authorizedEmail||'').toLowerCase();
        if (email === realOwner){ window.__drive.role = 'owner'; }
        else if (realCollab){ window.__drive.role = realCollab.role; }
        else {
          window.__drive.role = 'viewer'; // safest possible fallback if something's inconsistent
          toast('Connected, but you\'re not on this portal\'s access list — showing view-only until the owner adds you','warn');
        }
        toast(`Portal data connected as ${window.__drive.role}`,'ok');
        startDrivePolling();
        navigate('dashboard');
      }
    })
    .build();
  picker.setVisible(true);
}
/* ---- Owner-side: grant/revoke access for a collaborator ---- */
async function grantCollaboratorAccess(){
  const email = document.getElementById('collabEmailInput').value.trim().toLowerCase();
  const role = document.getElementById('collabRoleSelect').value;
  if (!email || !email.includes('@')){ toast('Enter a valid email address','warn'); return; }
  if (!window.__drive.fileId){ toast('Connect Google Drive yourself first, before sharing access','warn'); return; }
  try {
    const driveRole = role === 'editor' ? 'writer' : 'reader';
    // Only share the file itself, not the folder — Google's Drive API rejects
    // folder-permission changes under this app's narrow file-scoped access
    // when it doesn't already have explicit permission on every child file
    // inside that folder. The collaborator only ever needs the data file.
    if (!window.__drive.fileId) throw new Error('No connected data file to share yet — try reconnecting Google Drive first.');
    await driveApi(`https://www.googleapis.com/drive/v3/files/${window.__drive.fileId}/permissions`, {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({ role: driveRole, type:'user', emailAddress: email })
    });
    const collaborators = (S.settings.collaborators || []).filter(c=>c.email!==email);
    collaborators.push({ email, role });
    await saveSetting('collaborators', collaborators);
    const pushed = await pushSharedSettingsNow();
    toast(pushed ? `Access granted to ${email} (${role}) and saved to Google Drive` : `Access granted to ${email}, but saving the list to Drive failed — check connection and try again`, pushed ? 'ok' : 'warn');
    navigate('settings');
  } catch(err){
    console.error('grantCollaboratorAccess failed:', err);
    openModal('Could Not Grant Access',
      `<p style="font-size:13px;line-height:1.6;">${escapeHtml(err.message||'Unknown error')}</p>
       <p class="small-muted">This is the exact error from Google's API — if you're not sure what it means, copy this message and send it over.</p>`,
      `<button class="btn btn-primary" onclick="closeModal()">Close</button>`);
  }
}
/* Push the owner's access list to the Drive file right now, before any background pull can overwrite it. */
async function pushSharedSettingsNow(){
  try {
    if (window.__drive.syncTimer) clearTimeout(window.__drive.syncTimer);
    window.__drive.pendingChanges = true;
    const meta = await driveGetFileMeta(window.__drive.fileId);
    if (window.__drive.remoteModifiedTime && meta.modifiedTime !== window.__drive.remoteModifiedTime){
      const res = await driveApi(`https://www.googleapis.com/drive/v3/files/${window.__drive.fileId}?alt=media`);
      await restoreSnapshot(await res.json()); // owner's access list is preserved by restoreSnapshot
      window.__drive.remoteModifiedTime = meta.modifiedTime;
    }
    await syncToDrive();
    return window.__drive.status === 'idle';
  } catch(e){ return false; }
}
async function revokeCollaboratorAccess(email){
  confirmAction(`Remove ${escapeHtml(email)}'s access to this portal? They will need to be re-invited to get access again.`, async () => {
    const collaborators = (S.settings.collaborators || []).filter(c=>c.email!==email);
    await saveSetting('collaborators', collaborators);
    await pushSharedSettingsNow();
    toast('Access removed — note: this stops future syncing for them, but does not retroactively revoke the Google Drive file permission. Remove that separately in Drive if needed.','ok');
    navigate('settings');
  });
}
function setDriveStatus(status){
  window.__drive.status = status;
  renderSyncIndicator();
  if (S.view === 'settings') { const b = document.getElementById('contentSettingsRerenderHook'); if (b) navigate('settings'); }
}
function renderSyncIndicator(){
  const el = document.getElementById('syncIndicator');
  if (!el) return;
  const labels = {
    idle: window.__drive.signedIn ? 'Saved to Google Drive' : '',
    saving: 'Saving...', syncing: 'Syncing...', offline: 'Offline — changes will sync when connection is restored',
    conflict: 'Data updated elsewhere — refresh to continue', error: 'Sync failed — Retry', denied: 'Access Denied'
  };
  const text = labels[window.__drive.status] || '';
  el.textContent = text;
  el.style.display = text ? 'inline-block' : 'none';
  el.className = 'badge ' + ({idle:'green',saving:'gold',syncing:'gold',offline:'gray',conflict:'red',error:'red',denied:'red'}[window.__drive.status] || 'gray');
  el.onclick = (window.__drive.status==='error') ? syncToDrive : (window.__drive.status==='conflict' ? refreshFromDrive : null);
  el.style.cursor = el.onclick ? 'pointer' : 'default';
}

/* ---- centralized sync trigger: called after every real data mutation via audit() ---- */
function scheduleSync(){
  if (!window.__drive.signedIn) return;
  window.__drive.pendingChanges = true;
  if (!navigator.onLine){ setDriveStatus('offline'); return; }
  setDriveStatus('saving');
  if (window.__drive.syncTimer) clearTimeout(window.__drive.syncTimer);
  window.__drive.syncTimer = setTimeout(() => { syncToDrive(); }, 1200);
}
window.addEventListener('online', () => { if (window.__drive.signedIn && window.__drive.pendingChanges) syncToDrive(); });
window.addEventListener('offline', () => { if (window.__drive.signedIn) setDriveStatus('offline'); });

async function driveConnect(){
  await loadGis();
  if (!window.google || !window.google.accounts){ toast('Could not load Google Identity Services (check network/connectivity)','danger'); return; }
  await loadGoogleClientId();
  const clientId = S.settings.driveClientId;
  if (!clientId){ toast('Enter a Google OAuth Client ID in Settings first','warn'); return; }
  requestDriveToken(clientId, false);
}
async function loadGoogleClientId(){ /* placeholder for symmetry — client id comes from Settings input */ }

/* silent=true is used for auto-reconnect on page load / device switch: no popups, fails quietly */
function requestDriveToken(clientId, silent){
  const tokenClient = google.accounts.oauth2.initTokenClient({
    client_id: clientId,
    scope: DRIVE_SCOPE + ' https://www.googleapis.com/auth/userinfo.email',
    callback: async (resp) => {
      if (!resp || !resp.access_token){
        if (!silent) toast('Google Drive connection failed','danger');
        return;
      }
      window.__drive.accessToken = resp.access_token;
      await driveVerifyAndBootstrap(silent);
    },
    error_callback: () => { /* silent auto-reconnect failed (e.g. needs interaction) — user can click Connect manually */ }
  });
  tokenClient.requestAccessToken(silent ? { prompt: 'none' } : {});
}

/* Called once on every page load. If this device previously connected to Drive,
   try to silently re-establish the session so the user doesn't have to click
   "Connect Google Drive" every single time they open the app on a device. */
async function driveAutoReconnect(){
  try {
    const clientId = S.settings.driveClientId;
    const knownEmail = S.settings.driveConnectedEmail;
    if (!clientId || !knownEmail) return;
    await loadGis();
    if (!window.google || !window.google.accounts) return;
    requestDriveToken(clientId, true);
  } catch(err){ /* silent — user can always connect manually from Settings */ }
}

async function driveVerifyAndBootstrap(silent){
  try {
    const res = await fetch('https://www.googleapis.com/oauth2/v3/userinfo', { headers: { Authorization: `Bearer ${window.__drive.accessToken}` } });
    const info = await res.json();
    const email = (info.email || '').toLowerCase();
    const authorized = (S.settings.authorizedEmail || '').toLowerCase();
    const collaborators = S.settings.collaborators || [];
    const collab = collaborators.find(c => c.email.toLowerCase() === email);

    if (authorized && email !== authorized && !collab){
      setDriveStatus('denied');
      if (!silent){
        openModal('Access Denied',
          `<p style="font-size:13px;">Access Denied — This Google account is not authorized to use the IPO Management Portal.</p>
           <p class="small-muted">Signed in as ${escapeHtml(info.email||'')}. Ask the portal owner to grant you access in Settings → Share Portal Access.</p>`,
          `<button class="btn btn-primary" onclick="closeModal()">OK</button>`);
      }
      window.__drive.accessToken = null;
      window.__drive.signedIn = false;
      return;
    }

    // This is the actual bug fix: a blank local "authorizedEmail" used to mean
    // "nobody's set up yet, so whoever connects first becomes the owner" — but
    // that's ALSO true on a brand-new device belonging to someone who was
    // actually invited as a collaborator (their device has never seen the real
    // owner/collaborator list either, since that only exists inside the shared
    // file itself). Silently assuming "owner" in that case is exactly what
    // silently forked a new, empty portal instead of joining the real one.
    // So: ask explicitly instead of guessing, whenever there's no local context.
    if (!authorized){
      if (silent) { window.__drive.accessToken = null; window.__drive.signedIn = false; return; } // can't ask silently — require a manual connect
      window.__drive.email = info.email;
      openModal('One Quick Question',
        `<p style="font-size:13px;line-height:1.6;">Signed in as <b>${escapeHtml(info.email)}</b>. This device hasn't connected before — which applies to you?</p>`,
        `<button class="btn btn-ghost" onclick="closeModal()">Cancel</button>
         <button class="btn btn-ghost" onclick="closeModal(); driveConnectAsCollaborator('${escapeHtml(email)}')">Someone shared a portal with me</button>
         <button class="btn btn-primary" onclick="closeModal(); driveConnectAsNewOwner('${escapeHtml(email)}')">This is my own new portal</button>`);
      return;
    }

    window.__drive.email = info.email;
    window.__drive.signedIn = true;
    window.__drive.role = (email === authorized) ? 'owner' : collab.role;
    await saveSetting('driveConnectedEmail', info.email);
    if (!silent){ toast(`Google Drive connected as ${window.__drive.role}`,'ok'); }

    if (window.__drive.role === 'owner'){
      await driveBootstrapFolderAndFile();
      startDrivePolling();
    } else {
      // Collaborators didn't create this file, so the app's own drive.file
      // permission can't just "find" it the way it can for the owner —
      // Google Picker is what lets them explicitly select the file the owner
      // shared with them, granting the app access to that specific file only.
      const savedCollabFileId = S.settings['collabFileId_'+email];
      if (savedCollabFileId){
        window.__drive.fileId = savedCollabFileId;
        window.__drive.folderId = S.settings['collabFolderId_'+email] || null;
        await refreshFromDrive(true);
        startDrivePolling();
      } else if (!silent){
        openCollaboratorFilePicker();
      }
    }
    if (!silent && !(window.__drive.role !== 'owner' && !S.settings['collabFileId_'+email])) navigate('settings');
  } catch(err){
    console.error('driveVerifyAndBootstrap failed', err);
    setDriveStatus('error');
    if (!silent) openModal('Google Drive sign-in failed',
      `<p style="font-size:13px;line-height:1.6;">${escapeHtml(err && err.message ? err.message : 'Unknown error')}</p>
       <p class="small-muted">If this keeps happening on this device, use <b>Reset This Device's Connection</b> in Settings → Cloud Storage and connect again.</p>`,
      `<button class="btn btn-primary" onclick="closeModal()">Close</button>`);
  }
}

/* ---- cross-device auto-pull: periodically check if the Drive file changed
   elsewhere (e.g. edited on another device) and pull it in automatically ---- */
function startDrivePolling(){
  stopDrivePolling();
  window.__drive.pollTimer = setInterval(checkRemoteChanges, 20000);
  document.addEventListener('visibilitychange', onVisibilityCheckRemote);
}
function stopDrivePolling(){
  if (window.__drive.pollTimer){ clearInterval(window.__drive.pollTimer); window.__drive.pollTimer = null; }
  document.removeEventListener('visibilitychange', onVisibilityCheckRemote);
}
function onVisibilityCheckRemote(){
  if (document.visibilityState === 'visible') checkRemoteChanges();
}
async function checkRemoteChanges(){
  if (!window.__drive.signedIn || !window.__drive.fileId) return;
  if (window.__drive.pendingChanges) return; // don't pull over unsaved local edits — let the push finish first
  if (!navigator.onLine) return;
  try {
    const meta = await driveGetFileMeta(window.__drive.fileId);
    if (window.__drive.remoteModifiedTime && meta.modifiedTime !== window.__drive.remoteModifiedTime){
      await refreshFromDrive(true);
    }
  } catch(err){ /* transient network/API hiccup during background polling — ignore, next poll retries */ }
}

async function driveApi(url, opts={}){
  const res = await fetch(url, { ...opts, headers: { ...(opts.headers||{}), Authorization: `Bearer ${window.__drive.accessToken}` } });
  if (!res.ok){
    let detail = '';
    try { const j = await res.json(); detail = j.error && j.error.message ? j.error.message : JSON.stringify(j); } catch(e){ /* response wasn't JSON */ }
    const err = new Error(`Drive API error ${res.status}${detail ? ': ' + detail : ''}`);
    err.status = res.status;
    throw err;
  }
  return res;
}
async function driveFindFolder(){
  const q = encodeURIComponent(`name='${DRIVE_FOLDER_NAME}' and mimeType='application/vnd.google-apps.folder' and trashed=false`);
  const res = await driveApi(`https://www.googleapis.com/drive/v3/files?q=${q}&fields=files(id,name)`);
  const json = await res.json();
  return (json.files && json.files[0]) || null;
}
async function driveCreateFolder(){
  const res = await driveApi('https://www.googleapis.com/drive/v3/files', {
    method: 'POST', headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ name: DRIVE_FOLDER_NAME, mimeType: 'application/vnd.google-apps.folder' })
  });
  return await res.json();
}
async function driveFindFile(folderId){
  const q = encodeURIComponent(`name='${DRIVE_FILE_NAME}' and '${folderId}' in parents and trashed=false`);
  const res = await driveApi(`https://www.googleapis.com/drive/v3/files?q=${q}&fields=files(id,name,modifiedTime)`);
  const json = await res.json();
  return (json.files && json.files[0]) || null;
}
async function driveCreateFile(folderId){
  const metadata = { name: DRIVE_FILE_NAME, parents: [folderId], mimeType: 'application/json' };
  const boundary = '-------ipoportal' + Date.now();
  const body =
    `--${boundary}\r\nContent-Type: application/json; charset=UTF-8\r\n\r\n${JSON.stringify(metadata)}\r\n` +
    `--${boundary}\r\nContent-Type: application/json\r\n\r\n${JSON.stringify(snapshotData())}\r\n--${boundary}--`;
  const res = await driveApi('https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart&fields=id,modifiedTime', {
    method: 'POST', headers: { 'Content-Type': `multipart/related; boundary=${boundary}` }, body
  });
  return await res.json();
}
/* #12: rolling automatic daily backup snapshots, separate from the live data
   file — a safety net in case something goes wrong between manual exports.
   Owner-only (collaborators shouldn't create their own independent snapshot
   chains), and only once per calendar day so this doesn't spam Drive or burn
   API calls on every sync. */
async function maybeCreateDailyBackupSnapshot(){
  if (window.__drive.role !== 'owner' || !window.__drive.folderId) return;
  const today = todayStr();
  if (S.settings.lastAutoBackupDate === today) return; // already done today
  try {
    const name = `ipo_portal_snapshot_${today}.json`;
    const metadata = { name, parents: [window.__drive.folderId], mimeType: 'application/json' };
    const boundary = '-------ipoportalsnap' + Date.now();
    const body =
      `--${boundary}\r\nContent-Type: application/json; charset=UTF-8\r\n\r\n${JSON.stringify(metadata)}\r\n` +
      `--${boundary}\r\nContent-Type: application/json\r\n\r\n${JSON.stringify(snapshotData())}\r\n--${boundary}--`;
    await driveApi('https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart&fields=id', {
      method: 'POST', headers: { 'Content-Type': `multipart/related; boundary=${boundary}` }, body
    });
    await saveSetting('lastAutoBackupDate', today);
    await pruneOldBackupSnapshots();
  } catch(err){ /* non-critical background task — don't interrupt normal sync if this fails */ }
}
async function pruneOldBackupSnapshots(){
  try {
    const q = encodeURIComponent(`name contains 'ipo_portal_snapshot_' and '${window.__drive.folderId}' in parents and trashed=false`);
    const res = await driveApi(`https://www.googleapis.com/drive/v3/files?q=${q}&fields=files(id,name)&orderBy=name desc`);
    const json = await res.json();
    const files = json.files || [];
    for (const f of files.slice(7)){ // keep the 7 most recent, delete the rest
      await driveApi(`https://www.googleapis.com/drive/v3/files/${f.id}`, { method:'DELETE' });
    }
  } catch(err){ /* non-critical — old snapshots just accumulate until next successful prune */ }
}
async function driveBootstrapFolderAndFile(){
  setDriveStatus('syncing');
  // Validate any remembered ids: they may be stale or belong to a different Google account
  // (older versions copied them between devices), which used to crash sign-in.
  let folder = null;
  if (S.settings.driveFolderId){
    try { const r = await driveApi(`https://www.googleapis.com/drive/v3/files/${S.settings.driveFolderId}?fields=id,trashed`); const j = await r.json(); if (!j.trashed) folder = { id: j.id }; } catch(e){ folder = null; }
  }
  if (!folder) folder = await driveFindFolder();
  if (!folder){ folder = await driveCreateFolder(); }
  window.__drive.folderId = folder.id;
  await saveSetting('driveFolderId', folder.id);

  let file = S.settings.driveFileId ? await driveGetFileMeta(S.settings.driveFileId).catch(()=>null) : null;
  if (!file) file = await driveFindFile(folder.id).catch(()=>null);
  if (!file){ file = await driveCreateFile(folder.id); }
  window.__drive.fileId = file.id;
  window.__drive.remoteModifiedTime = file.modifiedTime || null;
  await saveSetting('driveFileId', file.id);

  await refreshFromDrive(true);
  setDriveStatus('idle');
}
async function driveGetFileMeta(fileId){
  const res = await driveApi(`https://www.googleapis.com/drive/v3/files/${fileId}?fields=id,name,modifiedTime,trashed`);
  const json = await res.json();
  if (json.trashed) throw new Error('trashed');
  return json;
}

async function refreshFromDrive(silent){
  if (!window.__drive.signedIn || !window.__drive.fileId){ toast('Connect Google Drive first','warn'); return; }
  const doRefresh = async () => {
    setDriveStatus('syncing');
    try {
      const meta = await driveGetFileMeta(window.__drive.fileId);
      const res = await driveApi(`https://www.googleapis.com/drive/v3/files/${window.__drive.fileId}?alt=media`);
      const data = await res.json();
      await restoreSnapshot(data);
      window.__drive.remoteModifiedTime = meta.modifiedTime;
      window.__drive.pendingChanges = false;
      window.__suppressReadOnlyCheck = true;
      try { await saveSetting('lastSynced', new Date().toISOString()); } finally { window.__suppressReadOnlyCheck = false; }
      setDriveStatus('idle');
      if (!silent){ toast('Refreshed from Google Drive','ok'); navigate('dashboard'); }
      return true;
    } catch(err){
      setDriveStatus('error'); window.__drive.lastError = err && err.message ? err.message : String(err);
      const hint = (err && (err.status===404||err.status===403)) ? ' — this Google account has not selected the shared file yet. Press "Select Shared Data File".' : '';
      if (!silent) toast('Could not refresh from Google Drive: '+window.__drive.lastError+hint,'danger');
      return false;
    }
  };
  if (silent) { return await doRefresh(); }
  confirmAction('This will replace your local working copy with the latest data from Google Drive. Continue?', doRefresh);
}
async function driveResetDeviceConnection(){
  confirmAction("Reset this device's Google Drive connection? Your data on Google Drive is not touched. You'll be asked to connect again and say whether this is your own portal or one shared with you.", async () => {
    stopDrivePolling();
    window.__suppressReadOnlyCheck = true;
    try {
      for (const k of Object.keys(S.settings)){
        if (['driveFileId','driveFolderId','driveConnectedEmail','authorizedEmail','collaborators','lastSynced'].includes(k) || k.startsWith('collabFileId_') || k.startsWith('collabFolderId_')){
          await delRec('settings', k); delete S.settings[k];
        }
      }
    } finally { window.__suppressReadOnlyCheck = false; }
    window.__drive.signedIn = false; window.__drive.accessToken = null; window.__drive.email = null;
    window.__drive.fileId = null; window.__drive.folderId = null; window.__drive.role = null; window.__drive.pendingChanges = false;
    setDriveStatus('idle');
    toast('Connection reset on this device. Click Connect Google Drive.','ok');
    navigate('settings');
  });
}
function driveSignOut(){
  stopDrivePolling();
  window.__drive.signedIn = false;
  window.__drive.accessToken = null;
  window.__drive.email = null;
  setDriveStatus('idle');
  const el = document.getElementById('syncIndicator'); if (el) el.style.display = 'none';
  toast('Signed out of Google Drive. Your data on Drive has not been changed.','ok');
  navigate('settings');
}
async function saveDriveConfig(){
  await saveSetting('driveClientId', document.getElementById('driveClientId').value.trim());
  toast('Google Drive configuration saved','ok');
}
</script>
<script>
/* =================== APPEARANCE / THEME =================== */
function resolveTheme(pref){
  if (pref === 'dark') return 'dark';
  if (pref === 'light') return 'light';
  // 'system' (or unset): follow the OS/browser preference
  return (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) ? 'dark' : 'light';
}
function applyTheme(){
  const pref = (S.settings && S.settings.theme) || 'light';
  const resolved = resolveTheme(pref);
  document.documentElement.setAttribute('data-theme', resolved);
  // Keep the installed-app status bar/task-switcher color in sync with the
  // actual theme. On mobile the topbar (not the navy sidebar) sits at the very
  // top of the screen, so this matches --card, not the brand navy.
  const meta = document.querySelector('meta[name="theme-color"]');
  if (meta) meta.setAttribute('content', resolved === 'dark' ? '#132238' : '#ffffff');
}
async function setTheme(pref){
  await saveSetting('theme', pref);
  applyTheme();
  navigate('settings');
}
if (window.matchMedia){
  window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', () => {
    if (S.settings && S.settings.theme === 'system') applyTheme();
  });
}
</script>
<script>
/* =================== APP LOCK =================== */
/* Honest limitation: this is a UI-level lock only. All portal data still lives
   unencrypted in this browser's IndexedDB — a technically savvy person with
   access to this device and its browser storage could still read it directly.
   This lock deters casual access (someone picking up an unlocked phone), it is
   not encryption-at-rest and cannot be, in a purely static, serverless app. */
window.__appLock = { locked:false, timer:null };

async function sha256Hex(str){
  const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(str));
  return Array.from(new Uint8Array(buf)).map(b=>b.toString(16).padStart(2,'0')).join('');
}

function armAutoLock(){
  if (window.__appLock.timer) clearTimeout(window.__appLock.timer);
  const mins = Number(S.settings.autoLockMinutes) || 0;
  if (!S.settings.appLockEnabled || !S.settings.appLockPin || !mins) return;
  window.__appLock.timer = setTimeout(triggerAppLock, mins * 60000);
}
function triggerAppLock(){
  if (!S.settings.appLockEnabled || !S.settings.appLockPin) return;
  window.__appLock.locked = true;
  document.getElementById('appLockOverlay').style.display = 'block';
  document.getElementById('lockPinInput').value = '';

}
['click','keydown','touchstart'].forEach(ev => document.addEventListener(ev, () => { if (!window.__appLock.locked) armAutoLock(); }));

async function disableAppLock(){
  confirmAction('Turn off App Lock? This portal contains client and financial data — anyone with access to this device would be able to open it without a PIN.', async () => {
    await saveSetting('appLockEnabled', false);
    await saveSetting('appLockPin', null);
    if (window.__appLock.timer) clearTimeout(window.__appLock.timer);
    toast('App Lock disabled','ok');
    navigate('settings');
  });
}
async function setAutoLockMinutes(mins){
  await saveSetting('autoLockMinutes', Number(mins));

}

/* =================== INIT =================== */
async function init(){
  // Register the service worker so Chrome recognizes this as a real installable
  // app. Registration failing (e.g. sw.js missing from the deployment) isn't
  // fatal to the app itself — it just means "Install" won't appear and you'll
  // still see "Create shortcut" instead, so this is wrapped defensively.
  // Needs the two small helper files (sw.js + manifest.json) saved in the same folder/web address as this page.
  if ('serviceWorker' in navigator && /^https?:$/.test(location.protocol)){
    navigator.serviceWorker.register('./sw.js').then(()=>{ window.__pwaReady = true; }).catch(()=>{ window.__pwaReady = false; });
  }
  try {
    await openDB();
    // Ask the browser to treat this app's data as "keep permanently" so it can't be
    // silently cleared when the device runs low on storage. Safe to fail quietly.
    try {
      if (navigator.storage && navigator.storage.persist){
        const already = navigator.storage.persisted ? await navigator.storage.persisted() : false;
        window.__storagePersisted = already || await navigator.storage.persist();
      }
    } catch(e){ window.__storagePersisted = false; }
    await loadAll();
    applyTheme();
    renderNav();
    navigate('dashboard');
    renderSyncIndicator();
    if (!navigator.onLine) setDriveStatus('offline');
    driveAutoReconnect(); // silent — reconnects this device to Drive and starts cross-device auto-sync if previously connected
    if (S.settings.appLockEnabled && S.settings.appLockPin){ triggerAppLock(); } else { armAutoLock(); }
    renderNotifBadge();
    maybeFireBrowserNotifications();
  } catch(err){
    console.error('Portal failed to initialize:', err);
    document.getElementById('content').innerHTML =
      `<div class="section-card"><div class="sc-body">
         <h3 style="color:var(--danger);margin-top:0;">The portal failed to load</h3>
         <p style="font-size:13px;">${escapeHtml(err && err.message ? err.message : String(err))}</p>
         <p class="small-muted">Try reloading the page. If this keeps happening, your browser may have an older cached copy of the local database — clearing this site's storage (Application → IndexedDB → ipoPortalDB → Delete, in browser dev tools) and reloading will rebuild it from scratch.</p>
       </div></div>`;
  }
}
window.addEventListener('error', (e) => {
  const c = document.getElementById('content');
  if (c && !c.innerHTML.trim()) {
    c.innerHTML = `<div class="section-card"><div class="sc-body"><h3 style="color:var(--danger);margin-top:0;">Something went wrong</h3><p style="font-size:13px;">${escapeHtml(e.message||'Unknown error')}</p></div></div>`;

});

/* ---------- Reminders: .ics calendar + to-do digest (original point 31) ---------- */
function icsEscape(t){ return String(t).replace(/\\/g,'\\\\').replace(/;/g,'\;').replace(/,/g,'\\,').replace(/\n/g,'\\n'); }
function exportIcs(){
  const today = todayStr(); const ev = [];
  const add = (date, title, ipo) => { if (!date || date < today) return; ev.push({ date, title, ipo }); };
  S.ipos.forEach(i=>{ if (ipoStatus(i)==='Closed' && !(i.allotmentDate>=today) && !(i.listingDate>=today)) return;

  if (!ev.length){ toast('No upcoming IPO dates to export','warn'); return; }

  const ymd = d => d.replace(/-/g,''); const nextDay = d => ymd(localDateStr(new Date(new Date(d+'T00:00:00').getTime()+86400000)));

  lines.push('END:VCALENDAR');
  const a=document.createElement('a'); a.href=URL.createObjectURL(new Blob([lines.join('\r\n')],{type:'text/calendar'})); a.download='ipo_dates.ics'; document.body.appendChild(a); a.click(); setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove();},500);
  toast(`${ev.length} calendar reminder(s) downloaded — open the file to add them to your calendar`,'ok');
}
function todoDigest(){

    const log = { ...(rs.deletedLog||{}) }; Object.entries(S.settings.deletedLog||{}).forEach(([k,v])=>{ if (!log[k] || v>log[k]) log[k]=v; });
    const locks = { ...(S.settings.monthLocks||{}) }; Object.entries(rs.monthLocks||{}).forEach(([k,v])=>{ if (!locks[k] || (v.at||'')>(locks[k].at||'')) locks[k]=v; });
    await saveSetting('deletedLog', pruneTombstones(log)); await saveSetting('monthLocks', locks);
    for (const store of ['clients','bankAccounts','ipos','ipoPlans','plannedClients','applications','bankUpiIds','payments']){
      const local = new Map((S[store]||[]).map(r=>[r.id,r])); const trashed = new Set((S.trash||[]).filter(t=>t.store===store).map(t=>t.payload.id));
      const dead = r => { const d = log[tombKey(store,r)]; return d && stamp(r) <= d; };
      for (const l of local.values()){ if (dead(l)){ await __delRecRaw(store, l.id); removed++; } }
      for (const r of (remote[store]||[])){
        if (dead(r)) continue;
        const l = local.get(r.id);
        if (!l){ if (trashed.has(r.id)) continue; await putRec(store, r); added++; }
        else if (l.createdAt && r.createdAt && l.createdAt!==r.createdAt){ clashes++; }
        else if (stamp(r) > stamp(l)){ await putRec(store, r); updated++; }
      }
    }
    const seen = new Set(S.auditLogs.map(a=>a.timestamp+'|'+a.by+'|'+a.action+'|'+a.entityId));
    for (const a of (remote.auditLogs||[])){ if (!seen.has(a.timestamp+'|'+a.by+'|'+a.action+'|'+a.entityId)){ const c={...a}; delete c.id; await putRec('auditLogs', c); } }
    for (const [k,v] of Object.entries(remote.settings||{})){ if (k==='deletedLog'||k==='monthLocks') continue; if (S.settings[k]===undefined && !isLocalOnlySetting(k)) await saveSetting(k,v); }
    await loadAll();
  } finally { window.__suppressReadOnlyCheck = false; }
  return { added, updated, clashes, removed };
}
window.syncToDrive = async function(){
  if (!window.__drive.signedIn || !window.__drive.fileId) return;
  if (!navigator.onLine){ setDriveStatus('offline'); return; }
  setDriveStatus('syncing');
  try {
    let meta = await driveGetFileMeta(window.__drive.fileId); let merged = null;
    if (window.__drive.remoteModifiedTime && meta.modifiedTime !== window.__drive.remoteModifiedTime){
      const res = await driveApi(`https://www.googleapis.com/drive/v3/files/${window.__drive.fileId}?alt=media`); const remote = await res.json();
      merged = await mergeRemoteIntoLocal(remote); window.__drive.lastWriter = { by:remote.writtenBy, at:remote.writtenAt, device:remote.device };
      toast(`Merged changes saved by ${remote.writtenBy||'another device'}: ${merged.added} new, ${merged.updated} updated${merged.removed?`, ${merged.removed} removed`:''}${merged.clashes?` · ${merged.clashes} clash(es) kept as on this device`:''}`, merged.clashes?'warn':'ok');
    }
    const res = await driveApi(`https://www.googleapis.com/upload/drive/v3/files/${window.__drive.fileId}?uploadType=media&fields=id,modifiedTime`, { method:'PATCH', headers:{ 'Content-Type':'application/json' }, body: JSON.stringify(snapshotData()) });
    const json = await res.json(); window.__drive.remoteModifiedTime = json.modifiedTime || meta.modifiedTime; window.__drive.pendingChanges = false;
    window.__drive.lastWriter = { by:(window.__drive.email||'This device'), at:new Date().toISOString(), device:deviceId() };
    await saveSetting('lastSynced', new Date().toISOString()); setDriveStatus('idle'); if (merged) render();
    if (typeof maybeCreateDailyBackupSnapshot==='function') maybeCreateDailyBackupSnapshot();
  } catch(err){ setDriveStatus('error'); window.__drive.lastError = err && err.message ? err.message : String(err); toast('Sync failed: '+window.__drive.lastError,'danger'); }
};
(function(){ const o = window.renderSyncIndicator; window.renderSyncIndicator = function(){ o(); const el=document.getElementById('syncIndicator'); const w=window.__drive&&window.__drive.lastWriter; if (el && w) el.title = `Last saved by ${w.by||'?'} on ${w.at?new Date(w.at).toLocaleString('en-IN'):''} (${w.device||'device'})`; }; })();

/* ---------- Names become links everywhere (requirement 2) ---------- */
(function(){
  let lookup = null, lastKey = '';
  function build(){ const key = S.clients.length+'|'+S.ipos.length+'|'+S.bankAccounts.length; if (lookup && key===lastKey) return lookup; lastKey=key; lookup = { c:new Map(), i:new Map(), b:new Map() };
    S.clients.forEach(c=>{ lookup.c.set(c.clientName.trim().toLowerCase(), c.id); lookup.c.set((c.clientId+' — '+c.clientName).toLowerCase(), c.id); lookup.c.set((c.clientId+' - '+c.clientName).toLowerCase(), c.id); });

  window.autoLinkNames = function(root){
