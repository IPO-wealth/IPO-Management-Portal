<style>
:root{
  --navy:#0f1b2d;
  --navy-2:#16263f;
  --navy-3:#1e3252;
  --gold:#c8963e;
  --gold-light:#e0b46a;
  --teal:#2f8f7f;
  --bg:#f4f6f9;
  --card:#ffffff;
  --border:#e2e6ed;
  --text:#1c2733;
  --text-dim:#5c6b7a;
  --danger:#c0392b;
  --warn:#c8963e;
  --ok:#2f8f7f;
  --table-head-bg:#f8f9fb;
  --heading:#0f1b2d;
  --radius:8px;
  --shadow:0 1px 3px rgba(16,32,55,.08),0 1px 2px rgba(16,32,55,.06);
}
[data-theme="dark"]{
  --navy:#0b1420;
  --navy-2:#101d2e;
  --navy-3:#16263f;
  --gold:#d6a24e;
  --gold-light:#e8c07f;
  --teal:#3aa693;
  --bg:#0b1420;
  --card:#132238;
  --border:#28405c;
  --text:#e7edf5;
  --text-dim:#93a7bd;
  --danger:#e57468;
  --warn:#d6a24e;
  --ok:#3aa693;
  --table-head-bg:#0f2136;
  --heading:#eef3f9;
  --shadow:0 1px 3px rgba(0,0,0,.35),0 1px 2px rgba(0,0,0,.3);
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;height:100%;}
body{
  font-family:'Inter','Segoe UI',-apple-system,BlinkMacSystemFont,Roboto,Helvetica,Arial,sans-serif;
  background:var(--bg);
  color:var(--text);
  font-size:14px;
  display:flex;
  min-height:100vh;
  -webkit-font-smoothing:antialiased;
  text-rendering:optimizeLegibility;
}
/* Real financial dashboards align figures in a column — apply tabular (monospaced) digits
   to every number/currency value so amounts line up vertically instead of jittering with
   proportional-width digits. This is the one deliberate "signature" refinement for this pass. */
.kpi-card .val, table.dt td, .badge{ font-variant-numeric:tabular-nums; }
:focus-visible{ outline:2px solid var(--gold); outline-offset:1px; }
a{color:inherit;text-decoration:none;}
button{font-family:inherit;cursor:pointer;}
::-webkit-scrollbar{width:10px;height:10px;}
::-webkit-scrollbar-thumb{background:#c9d2dc;border-radius:6px;}

/* Sidebar */
#sidebar{
  width:238px;
  background:linear-gradient(180deg,var(--navy) 0%, var(--navy-2) 100%);
  color:#dbe4ef;
  flex-shrink:0;
  display:flex;
  flex-direction:column;
  position:fixed;
  top:0;left:0;bottom:0;
  z-index:200;
  transition:transform .25s ease;
}
#sidebar .brand{
  padding:20px 18px 14px;
  border-bottom:1px solid rgba(255,255,255,.08);
}
#sidebar .brand .title{font-size:15px;font-weight:700;letter-spacing:.4px;color:#fff;}
#sidebar .brand .sub{font-size:11px;color:var(--gold-light);margin-top:3px;letter-spacing:.5px;text-transform:uppercase;}
#sidebar nav{flex:1;overflow-y:auto;padding:10px 0;}
#sidebar .nav-item{
  display:flex;align-items:center;gap:10px;
  padding:10px 18px;
  font-size:13px;
  color:#b7c4d4;
  cursor:pointer;
  border-left:3px solid transparent;
  white-space:nowrap;
}
#sidebar .nav-item .ico{width:16px;text-align:center;font-size:13px;}
#sidebar .nav-item:hover{background:rgba(255,255,255,.05);color:#fff;}
#sidebar .nav-item.active{background:rgba(200,150,62,.14);color:#fff;border-left-color:var(--gold);font-weight:600;}
#sidebar .nav-badge{margin-left:auto;background:var(--danger);color:#fff;font-size:10px;padding:1px 6px;border-radius:10px;}
#sidebar .foot{padding:12px 18px;font-size:10.5px;color:#7688a0;border-top:1px solid rgba(255,255,255,.08);}

#sidebar-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:190;}

/* Main */
#main{margin-left:238px;flex:1;min-width:0;display:flex;flex-direction:column;}
#topbar{
  height:56px;background:var(--card);border-bottom:1px solid var(--border);
  display:flex;align-items:center;padding:0 20px;gap:14px;position:sticky;top:0;z-index:100;
}
#menuToggle{display:none;background:none;border:none;font-size:20px;color:var(--heading);padding:4px 8px;border-radius:6px;}
#topbar .pageTitle{font-size:16px;font-weight:700;color:var(--heading);}
#topbar .spacer{flex:1;}
#topbar .quickBtn{
  background:var(--navy);color:#fff;border:none;padding:8px 14px;border-radius:6px;font-size:12.5px;font-weight:600;
}
#topbar .quickBtn.secondary{background:var(--card);color:var(--heading);border:1px solid var(--border);}
#content{padding:20px 22px 60px;}

/* Cards / KPI */
.kpi-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(168px,1fr));gap:12px;margin-bottom:24px;}
.kpi-card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:16px;box-shadow:var(--shadow);}
.kpi-card .lbl{font-size:11px;color:var(--text-dim);text-transform:uppercase;letter-spacing:.4px;font-weight:600;}
.kpi-card .val{font-size:24px;font-weight:800;color:var(--heading);margin-top:8px;letter-spacing:-.2px;}
.kpi-card .val.gold{color:var(--gold);}
.kpi-card .val.danger{color:var(--danger);}
.kpi-card .val.ok{color:var(--ok);}

.section-card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow);margin-bottom:16px;}
.section-card .sc-head{padding:16px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:10px;}
.section-card .sc-head h3{margin:0;font-size:14px;color:var(--heading);font-weight:700;}
.section-card .sc-body{padding:16px;}
.section-card .sc-head .spacer{flex:1;}

/* Tables */
.table-wrap{overflow-x:auto;}
table.dt{width:100%;border-collapse:collapse;font-size:12.5px;}
table.dt th{
  text-align:left;padding:9px 10px;background:var(--table-head-bg);color:var(--text-dim);
  font-size:10.5px;text-transform:uppercase;letter-spacing:.3px;border-bottom:1px solid var(--border);
  white-space:nowrap;cursor:pointer;user-select:none;
}
table.dt th:hover{color:var(--heading);}
table.dt td{padding:9px 10px;border-bottom:1px solid var(--border);white-space:nowrap;}
table.dt tr:hover td{background:rgba(127,127,127,.08);}
table.dt tr.clickable{cursor:pointer;}
.clickable{cursor:pointer;}
.clickable:hover{text-decoration:underline;}
.empty-row td{text-align:center;color:var(--text-dim);padding:26px;font-style:italic;}

/* badges */
.badge{display:inline-block;padding:2px 9px;border-radius:20px;font-size:10.5px;font-weight:700;letter-spacing:.2px;}
.badge.gray{background:#eceff3;color:#5c6b7a;}
.badge.blue{background:#e5edfb;color:#2757a8;}
.badge.gold{background:#faf1de;color:#a2731c;}
.badge.green{background:#e2f5ef;color:#1f7a63;}
.badge.red{background:#fbe6e3;color:#a5301f;}
.badge.purple{background:#efe6fb;color:#6b2fa8;}
.badge.teal{background:#e0f3f0;color:#1c7f70;}

/* forms */
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px 14px;}
.form-grid.one{grid-template-columns:1fr;}
.f-group{display:flex;flex-direction:column;gap:5px;}
.f-group.span2{grid-column:1/-1;}
.f-group label{font-size:11.5px;color:var(--text-dim);font-weight:600;}
.f-group input,.f-group select,.f-group textarea{
  border:1px solid var(--border);border-radius:6px;padding:8px 10px;font-size:13px;font-family:inherit;background:var(--card);color:var(--text);
}
.f-group input:focus,.f-group select:focus,.f-group textarea:focus{outline:2px solid #2757a8;outline-offset:0;}
.f-group textarea{resize:vertical;min-height:60px;}
.checkbox-row{display:flex;align-items:center;gap:8px;}

.btn{border:none;border-radius:6px;padding:8px 14px;font-size:12.5px;font-weight:600;cursor:pointer;}
.btn-primary{background:var(--navy);color:#fff;}
.btn-gold{background:var(--gold);color:#fff;}
.btn-ghost{background:var(--card);border:1px solid var(--border);color:var(--text);}
.btn-danger{background:var(--danger);color:#fff;}
.btn-sm{padding:5px 10px;font-size:11.5px;}
.btn-row{display:flex;gap:8px;justify-content:flex-end;margin-top:16px;}
.link-btn{background:none;border:none;color:#2757a8;font-size:12px;font-weight:600;padding:2px 4px;}

/* toolbar for lists */
.list-toolbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:12px;}
.list-toolbar input[type=text],.list-toolbar select,.list-toolbar input[type=date]{
  border:1px solid var(--border);border-radius:6px;padding:7px 10px;font-size:12.5px;background:var(--card);
}
.list-toolbar .spacer{flex:1;}
.pagination{display:flex;gap:6px;justify-content:flex-end;align-items:center;margin-top:10px;font-size:12px;}
.pagination button{border:1px solid var(--border);background:var(--card);border-radius:5px;padding:4px 9px;}
.pagination button[disabled]{opacity:.4;cursor:not-allowed;}

/* modal */
#modalOverlay{position:fixed;inset:0;background:rgba(15,27,45,.5);display:none;align-items:flex-start;justify-content:center;z-index:500;overflow-y:auto;padding:40px 16px;}
#modalOverlay.open{display:flex;}
.modal-box{background:var(--card);border-radius:10px;max-width:640px;width:100%;box-shadow:0 20px 60px rgba(0,0,0,.3);}
.modal-box.wide{max-width:920px;}
.modal-head{padding:16px 20px;border-bottom:1px solid var(--border);display:flex;align-items:center;}
.modal-head h3{margin:0;font-size:15px;color:var(--heading);}
.modal-head .x{margin-left:auto;background:none;border:none;font-size:18px;color:var(--text-dim);cursor:pointer;}
.modal-body{padding:18px 20px;max-height:70vh;overflow-y:auto;}
.modal-foot{padding:14px 20px;border-top:1px solid var(--border);display:flex;justify-content:flex-end;gap:8px;}

/* toast */
#toastWrap{position:fixed;bottom:20px;right:20px;z-index:800;display:flex;flex-direction:column;gap:8px;}
.toast{background:var(--navy);color:#fff;padding:11px 16px;border-radius:7px;font-size:12.5px;box-shadow:var(--shadow);max-width:320px;}
.toast.warn{background:var(--warn);}
.toast.danger{background:var(--danger);}
.toast.ok{background:var(--ok);}

/* capacity cell */
.cap-cell{display:inline-block;padding:3px 8px;border-radius:5px;font-weight:700;font-size:11.5px;}
.cap-avail{background:#e2f5ef;color:#1f7a63;}
.cap-near{background:#faf1de;color:#a2731c;}
.cap-full{background:#fbe0d3;color:#b1521a;}
.cap-over{background:#fbe6e3;color:#a5301f;}

.attn-list{display:flex;flex-direction:column;gap:8px;}
.attn-item{display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:6px;border-left:4px solid var(--border);background:#fafbfc;font-size:12.5px;}
.attn-item.high{border-left-color:var(--danger);}
.attn-item.med{border-left-color:var(--warn);}
.attn-item.low{border-left-color:#9fb2c2;}
.attn-item .tag{font-size:9.5px;text-transform:uppercase;font-weight:800;letter-spacing:.4px;color:var(--text-dim);}

.tabs{display:flex;gap:2px;border-bottom:1px solid var(--border);margin-bottom:14px;flex-wrap:wrap;}
.tabs button{background:none;border:none;padding:9px 14px;font-size:12.5px;font-weight:600;color:var(--text-dim);border-bottom:2px solid transparent;}
.tabs button.active{color:var(--heading);border-bottom-color:var(--gold);}

.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;}
.cal-cell{min-height:76px;border:1px solid var(--border);border-radius:6px;padding:6px;font-size:11px;background:var(--card);cursor:pointer;}
.cal-cell.empty{background:transparent;border:none;cursor:default;}
.cal-cell .dnum{font-weight:700;color:var(--heading);font-size:12px;}
.cal-cell .bankline{display:flex;justify-content:space-between;margin-top:3px;}

.small-muted{color:var(--text-dim);font-size:11.5px;}
.hint{font-size:11px;color:var(--text-dim);margin-top:4px;}

@media print{
  #sidebar, #topbar, #sidebar-overlay, .tabs, .no-print, #appLockOverlay, #modalOverlay, #toastWrap{ display:none !important; }
  #main{ margin-left:0 !important; }
  body{ background:#fff !important; }
  .printable-report{ box-shadow:none !important; border:none !important; }
  .kpi-card{ box-shadow:none !important; border:1px solid #ccc !important; }
}
@media (max-width:900px){
  #sidebar{transform:translateX(-100%);}
  #sidebar.open{transform:translateX(0);}
  #sidebar-overlay.open{display:block;}
  #main{margin-left:0;}
  #menuToggle{display:block;}
  .form-grid{grid-template-columns:1fr;}
  .kpi-grid{grid-template-columns:repeat(2,1fr);}

  /* Topbar: search bar wraps to its own full-width row instead of squeezing
     against the title, bell, and export button on a narrow screen. */
  #topbar{flex-wrap:wrap;row-gap:8px;padding:10px 12px;}
  #topbar .gsearch-wrap{order:3;flex-basis:100%;max-width:100%;margin:2px 0 0 0;}
  #topbar .pageTitle{font-size:14px;}
  #topbar .quickBtn{padding:7px 10px;font-size:12px;}

  /* Modals: less vertical padding so short phone screens don't push content
     off-screen, and content fits the viewport width properly. */
  #modalOverlay{padding:16px 10px;}
  .modal-box{max-width:100%;}

  /* Table toolbars and pagination: stack cleanly instead of overflowing. */
  .list-toolbar select, .list-toolbar input[type="text"]{flex:1 1 140px;min-width:0;}
  .pagination{flex-wrap:wrap;justify-content:center;}

  /* Section card padding tightened slightly for more usable width on small screens. */
  .section-card .sc-body{padding:12px;}
}
</style>
</head>
<body>

<div id="sidebar-overlay" onclick="closeSidebar()"></div>
<div id="sidebar">
  <div class="brand">
    <div class="title">IPO Management Portal</div>
    <div class="sub">Planning &amp; MIS</div>
  </div>
  <nav id="navList"></nav>
  <div class="foot">Local data · IndexedDB<br>v1.0</div>
</div>

<div id="main">
  <div id="topbar">
    <button id="menuToggle" onclick="openSidebar()">&#9776;</button>
    <div class="pageTitle" id="pageTitle">Dashboard</div>
    <div class="gsearch-wrap" style="position:relative;max-width:280px;flex:1;margin:0 12px;">
      <input type="text" id="globalSearchInput" placeholder="Search clients, IPOs, applications..." oninput="onGlobalSearch(this.value)" onfocus="onGlobalSearch(this.value)" style="width:100%;border:1px solid var(--border);border-radius:6px;padding:6px 10px;font-size:12.5px;">
      <div id="globalSearchResults" style="display:none;position:absolute;top:100%;left:0;right:0;background:var(--card);border:1px solid var(--border);border-radius:6px;margin-top:4px;max-height:340px;overflow:auto;z-index:50;box-shadow:0 4px 12px rgba(0,0,0,.1);"></div>
    </div>
    <div class="spacer"></div>
    <div class="notif-wrap" style="position:relative;">
      <button class="quickBtn secondary" onclick="toggleNotifPanel()" style="position:relative;">&#128276;
        <span id="notifBadge" style="display:none;position:absolute;top:-4px;right:-4px;background:var(--danger);color:#fff;font-size:10px;font-weight:700;border-radius:10px;padding:1px 5px;line-height:1.3;"></span>
      </button>
      <div id="notifPanel" style="display:none;position:absolute;top:100%;right:0;margin-top:6px;width:min(320px, calc(100vw - 24px));max-height:400px;overflow-y:auto;background:var(--card);border:1px solid var(--border);border-radius:8px;box-shadow:0 4px 12px rgba(0,0,0,.12);z-index:60;"></div>
    </div>
    <span id="syncIndicator" class="badge gray" style="display:none;margin-right:4px;"></span>
    <button class="quickBtn secondary" onclick="exportAllToExcel()">Export Excel</button>
  </div>
  <div id="content"></div>
</div>

<div id="modalOverlay">
  <div class="modal-box" id="modalBox">
    <div class="modal-head">
      <h3 id="modalTitle"></h3>
      <button class="x" onclick="closeModal()">&times;</button>
    </div>
    <div class="modal-body" id="modalBody"></div>
    <div class="modal-foot" id="modalFoot"></div>
  </div>
</div>

<div id="toastWrap"></div>

<div id="appLockOverlay" style="display:none;position:fixed;inset:0;z-index:9999;background:var(--navy,#0f1e33);color:#fff;">
  <div style="max-width:320px;margin:18vh auto 0;text-align:center;padding:0 20px;">
    <div style="font-size:34px;margin-bottom:10px;">&#128274;</div>
    <h3 style="margin:0 0 6px 0;">Portal Locked</h3>
    <p style="font-size:12.5px;opacity:.75;margin-bottom:18px;">Enter your PIN to continue</p>
    <input type="password" id="lockPinInput" inputmode="numeric" maxlength="8" placeholder="PIN" autocomplete="off"
      style="width:100%;text-align:center;letter-spacing:4px;font-size:20px;padding:10px;border-radius:8px;border:1px solid rgba(255,255,255,.25);background:rgba(255,255,255,.08);color:#fff;"
      onkeydown="if(event.key==='Enter') tryUnlockApp()">
    <button class="btn btn-primary" style="width:100%;margin-top:12px;" onclick="tryUnlockApp()">Unlock</button>
    <div id="lockError" style="color:#ff8a8a;font-size:12.5px;margin-top:10px;height:16px;"></div>
  </div>
</div>

<script>
/* =========================================================
   IPO MANAGEMENT PORTAL
   Single-file app. IndexedDB storage. No build step.
========================================================= */

const DB_NAME = 'ipoPortalDB';
const DB_VERSION = 2; // bumped: v2 adds bankUpiIds store and drops the retired mandates store
const STORES = {
  clients: 'id', bankAccounts: 'id', ipos: 'id', ipoPlans: 'id',
  plannedClients: 'id', applications: 'id', bankUpiIds: 'id',
  auditLogs: 'id', settings: 'key'
};
let db;

function openDB(){
  return new Promise((resolve, reject) => {
    const req = indexedDB.open(DB_NAME, DB_VERSION);
    req.onupgradeneeded = (e) => {
      const d = e.target.result;
      Object.entries(STORES).forEach(([name, keyPath]) => {
        if (!d.objectStoreNames.contains(name)) {
          d.createObjectStore(name, { keyPath, autoIncrement: keyPath === 'id' });
        }
      });
      // retired store from an earlier version of this app — safe to drop if present
      if (d.objectStoreNames.contains('mandates')) {
        d.deleteObjectStore('mandates');
      }
    };
    req.onsuccess = (e) => { db = e.target.result; resolve(db); };
    req.onerror = (e) => reject(e.target.error || e);
    req.onblocked = () => reject(new Error('Database upgrade blocked — please close this app in any other open tabs and reload.'));
  });
}
function storeTx(name, mode='readonly'){ return db.transaction(name, mode).objectStore(name); }
function getAll(name){ return new Promise((res,rej)=>{ const r=storeTx(name).getAll(); r.onsuccess=()=>res(r.result); r.onerror=()=>rej(r.error); }); }
function getOne(name,id){ return new Promise((res,rej)=>{ const r=storeTx(name).get(id); r.onsuccess=()=>res(r.result); r.onerror=()=>rej(r.error); }); }
function putRec(name,obj){ return new Promise((res,rej)=>{ const r=storeTx(name,'readwrite').put(obj); r.onsuccess=()=>res(r.result); r.onerror=()=>rej(r.error); }); }
function delRec(name,id){ return new Promise((res,rej)=>{ const r=storeTx(name,'readwrite').delete(id); r.onsuccess=()=>res(); r.onerror=()=>rej(r.error); }); }
function clearStore(name){ return new Promise((res,rej)=>{ const r=storeTx(name,'readwrite').clear(); r.onsuccess=()=>res(); r.onerror=()=>rej(r.error); }); }

// ---- App state ----
const S = {
  clients: [], bankAccounts: [], ipos: [], ipoPlans: [], plannedClients: [],
  applications: [], bankUpiIds: [], auditLogs: [], settings: {},
  view: 'dashboard', params: {}
};

async function loadAll(){
  const [clients, bankAccounts, ipos, ipoPlans, plannedClients, applications, bankUpiIds, auditLogs, settingsArr] = await Promise.all([
    getAll('clients'), getAll('bankAccounts'), getAll('ipos'), getAll('ipoPlans'),
    getAll('plannedClients'), getAll('applications'), getAll('bankUpiIds'), getAll('auditLogs'), getAll('settings')
  ]);
  S.clients = clients; S.bankAccounts = bankAccounts; S.ipos = ipos; S.ipoPlans = ipoPlans;
  S.plannedClients = plannedClients; S.applications = applications; S.bankUpiIds = bankUpiIds; S.auditLogs = auditLogs;

  // One-time migration: older versions of this app stored the allotment status
  // as "Pending Decision". Normalize any leftover records (including ones
  // coming back in from an old Drive/local backup) to "Pending" so nothing
  // silently stops matching filters, badges, or dashboard counts.
  let __migratedPendingStatus = false;
  for (const a of S.applications){
    if (a.allotmentStatus === 'Pending Decision'){
      a.allotmentStatus = 'Pending';
      await putRec('applications', a);
      __migratedPendingStatus = true;
    }
  }
  if (__migratedPendingStatus && typeof scheduleSync === 'function') scheduleSync();

  S.settings = {};
  settingsArr.forEach(s => S.settings[s.key] = s.value);
  if (!S.settings.references) S.settings.references = ['Karan','Paras'];
  if (!S.settings.subReferences) S.settings.subReferences = [];
  // Sub Reference used to be free text — auto-collect any existing distinct values
  // so they remain selectable as a proper managed list instead of disappearing.
  let __subRefSeeded = false;
  S.clients.forEach(c => {
    const sr = (c.subReference||'').trim();
    if (sr && !S.settings.subReferences.includes(sr)){ S.settings.subReferences.push(sr); __subRefSeeded = true; }
  });
  if (__subRefSeeded) await saveSetting('subReferences', S.settings.subReferences);
  if (!S.settings.driveClientId) S.settings.driveClientId = '';
  if (!S.settings.authorizedEmail) S.settings.authorizedEmail = '';
  if (!S.settings.driveConnectedEmail) S.settings.driveConnectedEmail = '';
  if (!S.settings.driveFolderId) S.settings.driveFolderId = '';
  if (!S.settings.driveFileId) S.settings.driveFileId = '';
  if (!S.settings.lastSynced) S.settings.lastSynced = '';
}

async function saveSetting(key, value){
  S.settings[key] = value;
  await putRec('settings', { key, value });
}

async function audit(action, entity, entityId, prevVal, newVal){
  const rec = { timestamp: new Date().toISOString(), action, entity, entityId: String(entityId), prev: prevVal ? JSON.stringify(prevVal) : '', next: newVal ? JSON.stringify(newVal) : '' };
  const id = await putRec('auditLogs', rec);
  rec.id = id;
  S.auditLogs.unshift(rec);
  if (typeof scheduleSync === 'function') scheduleSync();
}

// ---- utils ----
function uid(){ return Date.now().toString(36) + Math.random().toString(36).slice(2,7); }
function fmtDate(d){ if(!d) return '—'; const dt = new Date(d); if(isNaN(dt)) return d; return dt.toLocaleDateString('en-IN',{day:'2-digit',month:'short',year:'numeric'}); }
function fmtMoney(n){ n = Number(n)||0; return '₹' + n.toLocaleString('en-IN',{maximumFractionDigits:0}); }
function todayStr(){ return new Date().toISOString().slice(0,10); }

// ---- shared, safe date-sorting utilities (Point 54) ----
// Missing/invalid dates always sort to the end regardless of direction, so a
// record with no date never unpredictably jumps to the top of a "latest first" list.
function safeDateValue(d){
  if (!d) return null;
  const t = new Date(d).getTime();
  return isNaN(t) ? null : t;
}
function compareDatesDesc(a, b){ // latest first; missing/invalid always last
  const av = safeDateValue(a), bv = safeDateValue(b);
  if (av===null && bv===null) return 0;
  if (av===null) return 1;
  if (bv===null) return -1;
  return bv - av;
}
function sortedIpos(){
  // Default IPO ordering used everywhere in the app (Points 43-44): latest Opening
  // Date first. Ties broken by name so the order is deterministic, not insertion-based.
  return S.ipos.slice().sort((a,b) => compareDatesDesc(a.openDate, b.openDate) || (a.ipoName||'').localeCompare(b.ipoName||''));
}
function sortedActiveIpos(includeId){
  // For dropdowns where the user is creating something NEW (a plan, an application):
  // archived/Inactive IPOs shouldn't be selectable going forward. Filters and the main
  // IPOs list intentionally keep showing everything, including inactive IPOs, since
  // you still want to see/filter historical data for them.
  return sortedIpos().filter(i => (i.archiveStatus||'Active')==='Active' || i.id===includeId);
}
function sortedPlans(list){
  // Default Plan ordering used everywhere in the app (Points 45-47): newest created first.
  return (list || S.ipoPlans).slice().sort((a,b) => compareDatesDesc(a.createdAt, b.createdAt) || (b.id - a.id));
}
function isoDate(d){ if(!d) return ''; const dt = new Date(d); if(isNaN(dt)) return ''; return dt.toISOString().slice(0,10); }
function escapeHtml(s){ return (s==null?'':String(s)).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function toast(msg, kind=''){
  const el = document.createElement('div');
  el.className = 'toast' + (kind ? ' '+kind : '');
  el.textContent = msg;
  document.getElementById('toastWrap').appendChild(el);
  setTimeout(()=>{ el.style.transition='opacity .4s'; el.style.opacity='0'; setTimeout(()=>el.remove(),400); }, 3200);
}
function pad3(n){ return String(n).padStart(3,'0'); }

function nextCode(list, field, prefix){
  let max = 0;
  list.forEach(r => {
    const v = r[field];
    if (v && v.startsWith(prefix)) {
      const n = parseInt(v.slice(prefix.length), 10);
      if (!isNaN(n) && n > max) max = n;
    }
  });
  return prefix + pad3(max + 1);
}

function findClient(id){ return S.clients.find(c => c.id === id); }
function findBank(id){ return S.bankAccounts.find(b => b.id === id); }
function findIpo(id){ return S.ipos.find(i => i.id === id); }
function findPlan(id){ return S.ipoPlans.find(p => p.id === id); }

function ipoStatus(ipo){
  const today = todayStr();
  if (!ipo.openDate || !ipo.closeDate) return 'Upcoming';
  if (today < ipo.openDate) return 'Upcoming';
  if (today >= ipo.openDate && today <= ipo.closeDate) return 'Open';
  return 'Closed';
}
function statusBadgeClass(status){
  const map = {
    'Upcoming':'blue','Open':'green','Closed':'gray',
    'Not Applied':'gray','To Be Applied':'blue','Applied':'teal',
    'Allotted':'green','Not Allotted':'red','Pending':'gray',
    'Pending to Sell':'gold','Sold':'purple',
    'Received':'green','Receivable':'gold',
    'Planned':'blue','Partially Executed':'gold','Executed':'green','Cancelled':'red',
    'Active':'green','Inactive':'gray',
    'Matched':'green','Bank Changed':'gold','Date Changed':'gold','Under Planned':'red','Over Planned':'blue',
    'Not Planned':'red','Partially Planned':'gold'
  };
  return map[status] || 'gray';
}
function badge(status){ return `<span class="badge ${statusBadgeClass(status)}">${escapeHtml(status||'—')}</span>`; }

// ---- bank capacity ----
function bankCapacity(bankAccountId, dateStr){
  const plans = S.ipoPlans.filter(p => p.bankAccountId === bankAccountId && p.plannedDate === dateStr && p.planStatus !== 'Cancelled');
  // Mandates = total individual client applications planned through this bank on this
  // date, NOT the number of IPO-plan rows. One IPO planned for 6 different clients is
  // 6 mandates, not 1 — each client needs their own separate application/mandate
  // regardless of how many share the same IPO/bank/date.
  const planned = plans.reduce((s,p) => s + (p.plannedClientCount||0), 0);
  const capacity = 6;
  const available = capacity - planned;
  const utilisation = Math.round((planned / capacity) * 1000) / 10;
  let status = 'Available';
  if (planned >= 7) status = 'Over Capacity';
  else if (planned === 6) status = 'Full';
  else if (planned >= 4) status = 'Near Capacity';
  return { planned, capacity, available, utilisation, status, plans };
}
function capClass(status){
  return { 'Available':'cap-avail','Near Capacity':'cap-near','Full':'cap-full','Over Capacity':'cap-over' }[status] || 'cap-avail';
}

// ---- planning vs actual ----
function planVariance(plan){
  const acts = S.applications.filter(a => a.planId === plan.id);
  const actualCount = acts.length;
  if (actualCount === 0) return 'Pending';
  const bankChanged = acts.some(a => a.bankAccountId !== plan.bankAccountId);
  const dateChanged = acts.some(a => a.applicationDate !== plan.plannedDate);
  if (bankChanged) return 'Bank Changed';
  if (dateChanged) return 'Date Changed';
  if (actualCount < (plan.plannedClientCount||0)) return 'Under Planned';
  if (actualCount > (plan.plannedClientCount||0)) return 'Over Planned';
  return 'Matched';
}

// ---- profit ----
// Allotment/Sale calculation. No partial sale: an allotted lot is either "Pending to Sell" or fully "Sold".
// Gross Received / Our Profit / Client Profit are only meaningful once Allotted + Sold, and each is independently overridable.
function isFilled(v){ return v !== null && v !== undefined && v !== ''; }
function calcAllotmentSale(app){
  const applicable = app.allotmentStatus === 'Allotted' && app.saleStatus === 'Sold' && isFilled(app.saleAmount);
  if (!applicable){
    return { applicable:false, calculatedGross:null, grossFinal:null, grossOverridden:false, calculatedOur:null, ourFinal:null, ourOverridden:false, calculatedClient:null, clientFinal:null, clientOverridden:false };
  }
  const applied = Number(app.amountApplied)||0;
  const sale = Number(app.saleAmount)||0;
  const calculatedGross = applied + 0.5*(sale-applied);
  const grossOverridden = !!app.grossReceivedOverridden && isFilled(app.grossReceived);
  const grossFinal = grossOverridden ? Number(app.grossReceived) : calculatedGross;
  const calculatedOur = grossFinal - applied;
  const ourOverridden = !!app.ourProfitOverridden && isFilled(app.ourProfit);
  const ourFinal = ourOverridden ? Number(app.ourProfit) : calculatedOur;
  const calculatedClient = sale - grossFinal;
  const clientOverridden = !!app.clientProfitOverridden && isFilled(app.clientProfit);
  const clientFinal = clientOverridden ? Number(app.clientProfit) : calculatedClient;
  return { applicable:true, calculatedGross, grossFinal, grossOverridden, calculatedOur, ourFinal, ourOverridden, calculatedClient, clientFinal, clientOverridden };
}
// Back-compat alias used across stats/reports/excel for the business-side profit ("Our Profit")
function calcProfit(app){ const r = calcAllotmentSale(app); return { final: r.applicable ? r.ourFinal : 0, overridden: r.ourOverridden, calculated: r.applicable ? r.calculatedOur : 0 }; }

</script>

/* =================== NOTIFICATIONS =================== */
/* Honest scope: this is an in-app Notification Center — it computes urgent items
   fresh every time you open the portal or the panel, using the exact same rules
   as Dashboard > What Needs Attention. The optional "Browser Notifications" toggle
   in Settings uses the standard Notification API, which ONLY fires while this tab/app
   is actually open and running — there is no real background push here, since that
   would require a server to send notifications when your device isn't even looking
   at the app, which a static, serverless portal like this one cannot do. */
function computeNotifications(){
  const today = todayStr();
  const soon = isoDate(new Date(Date.now() + 2*86400000)); // 2 days from now
  const items = [];
  S.ipos.forEach(i=>{
    if ((i.archiveStatus||'Active')!=='Active') return;
    if (i.closeDate && i.closeDate>=today && i.closeDate<=soon) items.push({ text:`IPO closing soon: ${i.ipoName} (${fmtDate(i.closeDate)})`, go:()=>navigate('ipos',{id:i.id}) });
    if (i.allotmentDate===today) items.push({ text:`Allotment due today: ${i.ipoName}`, go:()=>navigate('ipos',{id:i.id}) });
  });
  const pendingAllotment = S.applications.filter(a=>a.applicationStatus==='Applied' && (!a.allotmentStatus || a.allotmentStatus==='Pending'));
  if (pendingAllotment.length) items.push({ text:`${pendingAllotment.length} application(s) awaiting allotment`, go:()=>navigate('allotments',{presetFilter:{tableId:'allotTbl',filterVals:{allotmentStatus:'Pending'}}}) });
  const awaitingSale = S.applications.filter(a=>a.allotmentStatus==='Allotted' && a.saleStatus!=='Sold');
  if (awaitingSale.length) items.push({ text:`${awaitingSale.length} allotted application(s) awaiting sale`, go:()=>navigate('allotments',{presetFilter:{tableId:'allotTbl',filterVals:{allotmentStatus:'Allotted', saleStatus:'Pending to Sell'}}}) });
  const awaitingReceipt = S.applications.filter(a=>a.saleStatus==='Sold' && a.amountReceiveStatus==='Receivable');
  if (awaitingReceipt.length) items.push({ text:`${awaitingReceipt.length} sold application(s) awaiting receipt`, go:()=>navigate('allotments',{presetFilter:{tableId:'allotTbl',filterVals:{amountReceiveStatus:'Receivable'}}}) });
  return items;
}
function renderNotifBadge(){

  if (items.length){ badge.textContent = items.length; badge.style.display = 'inline-block'; }
  else badge.style.display = 'none';
}

}

// ---- generic field builder ----
function fieldHtml(f, val){
  val = (val===undefined||val===null) ? '' : val;
  const req = f.required ? 'required' : '';
  let inner = '';
  if (f.type === 'select'){
    inner = `<select id="fld_${f.key}" ${req} ${f.onchange?`onchange="${f.onchange}"`:''}>
      ${f.placeholder?`<option value="">${f.placeholder}</option>`:''}
      ${f.options.map(o=>{
        const ov = typeof o === 'object' ? o.value : o;
        const ol = typeof o === 'object' ? o.label : o;
        return `<option value="${escapeHtml(ov)}" ${String(val)===String(ov)?'selected':''}>${escapeHtml(ol)}</option>`;
      }).join('')}
    </select>`;
  } else if (f.type === 'textarea'){
    inner = `<textarea id="fld_${f.key}" ${req}>${escapeHtml(val)}</textarea>`;
  } else {
    inner = `<input type="${f.type||'text'}" id="fld_${f.key}" value="${escapeHtml(val)}" ${req} ${f.step?`step="${f.step}"`:''} ${f.min!==undefined?`min="${f.min}"`:''} placeholder="${escapeHtml(f.placeholder||'')}">`;
  }
  return `<div class="f-group ${f.span2?'span2':''}"><label>${f.label}${f.required?' *':''}</label>${inner}${f.hint?`<div class="hint">${f.hint}</div>`:''}</div>`;
}
function readFields(fields){
  const out = {};
  fields.forEach(f => {
    const el = document.getElementById('fld_'+f.key);
    if (!el) return;
    let v = el.value;
    if (f.type === 'number') v = v === '' ? null : Number(v);
    out[f.key] = v;
  });
  return out;
}

// ---- generic table with search/filter/sort/pagination ----
function makeTableController(id, opts){
  // opts: {data, columns, pageSize, rowClick, searchFields, filters:[{key,label,options}], extraToolbar}
  if (!window.__tableState) window.__tableState = {};
  if (!window.__tableState[id]) window.__tableState[id] = { search:'', sortKey:null, sortDir:1, page:1, filterVals:{}, pageSize: null };
  return window.__tableState[id];
}
function renderDataTable(id, opts){
  const st = makeTableController(id, opts);
  let rows = opts.data.slice();
  // filters
  (opts.filters||[]).forEach(f => {
    const v = st.filterVals[f.key];
    if (v) rows = rows.filter(r => f.match ? f.match(r, v) : String(r[f.key]) === String(v));
  });
  // search
  if (st.search && opts.searchFn) {
    rows = rows.filter(r => opts.searchFn(r, st.search.toLowerCase()));
  }
  // sort
  if (st.sortKey) {
    rows.sort((a,b) => {
      let av = opts.sortValue ? opts.sortValue(a, st.sortKey) : a[st.sortKey];
      let bv = opts.sortValue ? opts.sortValue(b, st.sortKey) : b[st.sortKey];
      if (av===undefined||av===null) av='';
      if (bv===undefined||bv===null) bv='';
      if (typeof av === 'number' && typeof bv === 'number') return (av-bv)*st.sortDir;
      return String(av).localeCompare(String(bv)) * st.sortDir;
    });
  }
  const pageSize = st.pageSize || opts.pageSize || 12;
  const totalPages = Math.max(1, Math.ceil(rows.length / pageSize));
  if (st.page > totalPages) st.page = totalPages;
  const pageRows = rows.slice((st.page-1)*pageSize, st.page*pageSize);

  // expose the full filtered/searched (pre-pagination) id set so "select all" actions can select
  // everything matching the current filter/search, not just the current page or the whole dataset.
  window.__lastFilteredIds = window.__lastFilteredIds || {};
  window.__lastFilteredIds[id] = rows.map(r=>r.id);

  const toolbar = `
    <div class="list-toolbar">
      ${opts.searchFn ? `<input type="text" id="tblsearch-${id}" placeholder="${opts.searchPlaceholder||'Search...'}" value="${escapeHtml(st.search)}" oninput="__tblSearch('${id}',this.value)">` : ''}
      ${(opts.filters||[]).map(f => `
        <select onchange="__tblFilter('${id}','${f.key}',this.value)">
          <option value="">${f.label}: All</option>
          ${f.options.map(o=>`<option value="${escapeHtml(o)}" ${st.filterVals[f.key]===o?'selected':''}>${escapeHtml(o)}</option>`).join('')}
        </select>`).join('')}
      <div class="spacer"></div>
      ${opts.extraToolbar || ''}
    </div>`;

  const thead = `<tr>${opts.columns.map(c => c.key==='sel'
    ? `<th>${c.label}</th>`
    : `<th onclick="__tblSort('${id}','${c.key}')" style="cursor:pointer;">${c.label}${st.sortKey===c.key?(st.sortDir===1?' ▲':' ▼'):''}</th>`
  ).join('')}${opts.rowActions?'<th>Actions</th>':''}</tr>`;
  const tbody = pageRows.length ? pageRows.map(r => `
    <tr class="${opts.rowClick?'clickable':''}" ${opts.rowClick?`onclick="${opts.rowClick}(${JSON.stringify(r.id)})"`:''}>
      ${opts.columns.map(c => `<td>${c.render ? c.render(r) : escapeHtml(r[c.key])}</td>`).join('')}
      ${opts.rowActions?`<td onclick="event.stopPropagation()">${opts.rowActions(r)}</td>`:''}
    </tr>`).join('') : `<tr class="empty-row"><td colspan="${opts.columns.length + (opts.rowActions?1:0)}">No records found.</td></tr>`;

  const pagination = `<div class="pagination">
    <span class="small-muted">${rows.length} record(s)</span>
    <button ${st.page<=1?'disabled':''} onclick="__tblPage('${id}',${st.page-1})">Prev</button>
    <span>Page ${st.page} / ${totalPages}</span>
    <button ${st.page>=totalPages?'disabled':''} onclick="__tblPage('${id}',${st.page+1})">Next</button>
    <select onchange="__tblPageSize('${id}', this.value)" style="margin-left:8px;">
      ${[12,25,50,100].map(n=>`<option value="${n}" ${pageSize===n?'selected':''}>${n} / page</option>`).join('')}
    </select>
  </div>`;

  return `${toolbar}<div class="table-wrap"><table class="dt"><thead>${thead}</thead><tbody>${tbody}</tbody></table></div>${pagination}`;
}
window.__tableRerender = {};

/* Root-cause fix for the "search loses focus" / "page jumps on selection" bugs:
   every table re-render used to blindly replace innerHTML, destroying and
   recreating the search input (and everything else) even when only a checkbox
   or one row changed. This helper preserves focus, cursor position, and the
   page's scroll position across that replace, and is used everywhere instead
   of a raw innerHTML assignment. */
function renderIntoWrap(wrapId, html){
  const wrap = document.getElementById(wrapId);
  if (!wrap) return;
  const active = document.activeElement;
  let focusInfo = null;
  if (active && wrap.contains(active) && (active.tagName==='INPUT' || active.tagName==='SELECT' || active.tagName==='TEXTAREA')){
    focusInfo = {
      id: active.id || null,
      selStart: (typeof active.selectionStart === 'number') ? active.selectionStart : null,
      selEnd: (typeof active.selectionEnd === 'number') ? active.selectionEnd : null
    };
  }
  const scrollY = window.scrollY;
  wrap.innerHTML = html;
  if (focusInfo && focusInfo.id){
    const el = document.getElementById(focusInfo.id);
    if (el){
      el.focus();
      if (focusInfo.selStart !== null && el.setSelectionRange){
        try { el.setSelectionRange(focusInfo.selStart, focusInfo.selEnd); } catch(e){ /* not a text-selectable input, ignore */ }
      }
    }
  }
  // Defensive: some browsers nudge scroll position when focus moves during
  // a DOM replace. Selecting/searching should never move the viewport.
  if (Math.abs(window.scrollY - scrollY) > 1) window.scrollTo(0, scrollY);
}

function __tblSearch(id, val){ window.__tableState[id].search = val; window.__tableState[id].page = 1; if(window.__tableRerender[id]) window.__tableRerender[id](); }
function __tblFilter(id, key, val){ window.__tableState[id].filterVals[key] = val; window.__tableState[id].page = 1; if(window.__tableRerender[id]) window.__tableRerender[id](); }
function __tblSort(id, key){
  const st = window.__tableState[id];
  if (st.sortKey === key) st.sortDir *= -1; else { st.sortKey = key; st.sortDir = 1; }
  if(window.__tableRerender[id]) window.__tableRerender[id]();
}
function __tblPage(id, p){ window.__tableState[id].page = p; if(window.__tableRerender[id]) window.__tableRerender[id](); }
function __tblPageSize(id, val){ window.__tableState[id].pageSize = Number(val); window.__tableState[id].page = 1; if(window.__tableRerender[id]) window.__tableRerender[id](); }
</script>
<script>
/* =================== CLIENTS =================== */
function clientStats(clientId){
  const apps = S.applications.filter(a => a.clientId === clientId);
  const allotted = apps.filter(a => a.allotmentStatus === 'Allotted');
  const notAllotted = apps.filter(a => a.allotmentStatus === 'Not Allotted');
  const sold = apps.filter(a => a.saleStatus === 'Sold');
  const amountApplied = apps.reduce((s,a)=>s+(Number(a.amountApplied)||0),0);
  const grossReceived = apps.reduce((s,a)=>{ const c=calcAllotmentSale(a); return s+(c.applicable?c.grossFinal:0); },0);
  const profit = apps.reduce((s,a)=>{ const c=calcAllotmentSale(a); return s+(c.applicable?c.ourFinal:0); },0);
  const clientProfit = apps.reduce((s,a)=>{ const c=calcAllotmentSale(a); return s+(c.applicable?c.clientFinal:0); },0);
  const ipoIds = new Set(apps.map(a=>a.ipoId));
  return { apps, allotted, notAllotted, sold, amountApplied, grossReceived, profit, clientProfit, ipoCount: ipoIds.size };
}

function editClient(id){

    `<button class="btn btn-ghost" onclick="closeModal()">Cancel</button><button class="btn btn-primary" onclick="saveClient(${id||'null'})">Save</button>`);
}
async function saveClient(id, force){
  const fields = [{key:'clientName'},{key:'referenceName'},{key:'subReference'},{key:'status'}];
  const data = readFields(fields);
  // Normalize: trim accidental leading/trailing spaces and collapse doubled internal spaces.
  data.clientName = (data.clientName||'').trim().replace(/\s+/g,' ');
  data.referenceName = (data.referenceName||'').trim().replace(/\s+/g,' ');
  data.subReference = (data.subReference||'').trim().replace(/\s+/g,' ');
  if (!data.clientName){ toast('Client name is required','warn'); return; }

  const dupe = S.clients.find(c => c.id!==id && c.clientName.toLowerCase() === data.clientName.toLowerCase());
  if (dupe && !force){
    openModal('Possible Duplicate Client',
      `<p style="font-size:13px;">A client named "${escapeHtml(dupe.clientName)}" (${escapeHtml(dupe.clientId)}) already exists.</p><p class="small-muted">You can still save this as a separate client if they are genuinely different people.</p>`,
      `<button class="btn btn-ghost" onclick="closeModal()">Cancel</button><button class="btn btn-danger" onclick="saveClient(${id||'null'}, true)">Save Anyway</button>`);
    return;
  }
  if (id){
    const existing = findClient(id);
    const updated = { ...existing, ...data, updatedAt: new Date().toISOString() };
    await putRec('clients', updated);
    Object.assign(existing, updated);
    await audit('Client Edit','Client', existing.clientId, existing, updated);
    toast('Client updated','ok');
  } else {
    const clientId = nextCode(S.clients, 'clientId', 'CL');
    const rec = { clientId, ...data, status: data.status||'Active', createdAt: new Date().toISOString(), updatedAt: new Date().toISOString() };
    const newId = await putRec('clients', rec);
    rec.id = newId;
    S.clients.push(rec);
    await audit('Client Creation','Client', clientId, null, rec);
    toast('Client added','ok');
  }
  closeModal(); navigate('clients');
}
function deleteClient(id){
  const c = findClient(id);
  const stats = clientStats(id);
  const plannedOnly = S.plannedClients.filter(pc=>pc.clientId===id);
  if (stats.apps.length || plannedOnly.length){
    confirmDangerousDelete({
      warningHtml: `This client (${escapeHtml(c.clientId)} — ${escapeHtml(c.clientName)}) has ${stats.apps.length} associated application(s), ${plannedOnly.length} planning entr(y/ies), and ${stats.allotted.length + stats.sold.length} completed transaction(s). Deleting it permanently removes all of this. This cannot be undone.`,
      onDelete: async () => {
        for (const a of stats.apps){ await delRec('applications', a.id); }
        S.applications = S.applications.filter(a=>a.clientId!==id);
        for (const pc of plannedOnly){ await delRec('plannedClients', pc.id); }
        S.plannedClients = S.plannedClients.filter(pc=>pc.clientId!==id);
        await delRec('clients', id);
        S.clients = S.clients.filter(x => x.id !== id);
        await audit('Client Deletion','Client', c.clientId, c, null);
        toast('Client and its records deleted','ok');
        navigate('clients');
      }
    });
    return;
  }
  confirmAction(`Delete client ${escapeHtml(c.clientId)} - ${escapeHtml(c.clientName)}? This client has no applications, so this is safe to remove permanently.`, async () => {
    await delRec('clients', id);
    S.clients = S.clients.filter(x => x.id !== id);
    await audit('Client Deletion','Client', c.clientId, c, null);
    toast('Client deleted','ok');
    navigate('clients');
  });
}

        <div class="kpi-card"><div class="lbl">Allotments</div><div class="val ok">${stats.allotted.length}</div></div>
        <div class="kpi-card"><div class="lbl">Not Allotted</div><div class="val danger">${stats.notAllotted.length}</div></div>
        <div class="kpi-card"><div class="lbl">Sold</div><div class="val">${stats.sold.length}</div></div>

        <div class="kpi-card"><div class="lbl">Gross Received</div><div class="val">${fmtMoney(stats.grossReceived)}</div></div>

      </div>
    </div>
  </div>
  <div class="section-card">
    <div class="sc-head"><h3>IPO History</h3></div>
    <div class="sc-body table-wrap">
      <table class="dt"><thead><tr>
        <th>IPO</th><th>Planned</th><th>App Status</th><th>Bank</th><th>App Date</th><th>Amount Applied</th><th>Allotment</th><th>Sale Date</th><th>Gross Received</th><th>Our Profit</th>
      </tr></thead><tbody>${rows}</tbody></table>

}

<script>
/* =================== BANK ACCOUNTS =================== */
function bankStats(bankId){
  const plans = S.ipoPlans.filter(p=>p.bankAccountId===bankId);
  const apps = S.applications.filter(a=>a.bankAccountId===bankId);
  const profit = apps.reduce((s,a)=>s+calcProfit(a).final,0);
  return { plans, apps, profit };
}
function viewBanks(){
  window.__tableRerender['banksTbl'] = () => {
    renderIntoWrap('banksTblWrap', renderDataTable('banksTbl', {
      data: S.bankAccounts,
      searchFn: (r,q) => (r.bankId+' '+r.bankName+' '+r.accountHolderName).toLowerCase().includes(q),
      searchPlaceholder: 'Search bank / account holder...',
      filters: [{ key:'status', label:'Status', options:['Active','Inactive'] }],
      pageSize: 10,
      columns: [
        { key:'bankId', label:'Bank ID' },
        { key:'bankName', label:'Bank Name' },
        { key:'accountHolderName', label:'Account Holder' },
        { key:'status', label:'Status', render:r=>badge(r.status) },
        { key:'plans', label:'Plans (all-time)', render:r=>bankStats(r.id).plans.length },
        { key:'apps', label:'Applications', render:r=>bankStats(r.id).apps.length },
        { key:'upis', label:'UPI IDs', render:r=>bankUpis(r.id).length },
        { key:'profit', label:'Our Profit', render:r=>fmtMoney(bankStats(r.id).profit) },
        { key:'today', label:"Today's Utilisation", render:r=>{ const cap = bankCapacity(r.id, todayStr()); return `<span class="cap-cell ${capClass(cap.status)}">${cap.planned}/6</span>`; } }
      ],
      rowActions: r => `<button class="btn btn-sm btn-ghost" onclick="editBank(${r.id})">Edit</button>
                         <button class="btn btn-sm btn-danger" onclick="deleteBank(${r.id})">Delete</button>`
    }));
  };
  setTimeout(()=>window.__tableRerender['banksTbl'](), 0);
  return `
  <div class="section-card">
    <div class="sc-head"><h3>Bank Accounts</h3><div class="spacer"></div><button class="btn btn-primary" onclick="editBank()">+ Add Bank Account</button></div>
    <div class="sc-body" id="banksTblWrap"></div>
  </div>
  <p class="small-muted">Rule: maximum 6 IPOs may be planned per bank account per day (soft warning, not enforced as a hard block).</p>`;
}
function bankFields(b){
  return [
    { key:'bankName', label:'Bank Name', required:true, placeholder:'e.g. HDFC Bank' },
    { key:'accountHolderName', label:'Account Holder Name', required:true },
    { key:'status', label:'Status', type:'select', options:['Active','Inactive'] }
  ].map(f => fieldHtml(f, b ? b[f.key] : (f.key==='status'?'Active':''))).join('');
}
/* ---- UPI IDs per bank account (bankUpiIds store) ---- */
function bankUpis(bankAccountId){ return S.bankUpiIds.filter(u=>u.bankAccountId===bankAccountId); }
let __editingBankUpiDraft = []; // {id|null, upiId, _tempKey}
function editBank(id){
  const b = id ? findBank(id) : null;
  __editingBankUpiDraft = id ? bankUpis(id).map(u=>({ id:u.id, upiId:u.upiId, _tempKey: 'u'+u.id })) : [];
  openModal(b ? 'Edit Bank Account' : 'Add Bank Account',
    `<div class="form-grid">${bankFields(b)}</div>
     <div class="f-group span2" style="margin-top:14px;">
       <label>UPI IDs (optional — a bank account may have zero, one, or several)</label>
       <div id="bankUpiRows"></div>
       <button type="button" class="btn btn-ghost btn-sm" style="margin-top:6px;width:fit-content;" onclick="addBankUpiRow()">+ Add UPI ID</button>
     </div>`,
    `<button class="btn btn-ghost" onclick="closeModal()">Cancel</button><button class="btn btn-primary" onclick="saveBank(${id||'null'})">Save</button>`);
  renderBankUpiRows();
}
function renderBankUpiRows(){
  const wrap = document.getElementById('bankUpiRows');
  if (!wrap) return;
  wrap.innerHTML = __editingBankUpiDraft.length ? __editingBankUpiDraft.map((u,idx)=>`
    <div style="display:flex;gap:8px;margin-bottom:6px;">
      <input type="text" value="${escapeHtml(u.upiId)}" placeholder="e.g. paras@hdfc" oninput="__editingBankUpiDraft[${idx}].upiId=this.value" style="flex:1;border:1px solid var(--border);border-radius:6px;padding:8px 10px;">
      <button type="button" class="btn btn-sm btn-danger" onclick="removeBankUpiRow(${idx})">Delete</button>
    </div>`).join('') : `<div class="small-muted">No UPI IDs added.</div>`;
}
function addBankUpiRow(){ __editingBankUpiDraft.push({ id:null, upiId:'', _tempKey:'new'+Date.now() }); renderBankUpiRows(); }
function removeBankUpiRow(idx){ __editingBankUpiDraft.splice(idx,1); renderBankUpiRows(); }
async function saveBank(id){
  const data = readFields([{key:'bankName'},{key:'accountHolderName'},{key:'status'}]);
  if (!data.bankName || !data.accountHolderName){ toast('Bank name and account holder are required','warn'); return; }

  const cleanedUpis = __editingBankUpiDraft.map(u=>({ ...u, upiId: (u.upiId||'').trim() })).filter(u=>u.upiId);
  const seen = new Set();
  for (const u of cleanedUpis){
    const key = u.upiId.toLowerCase();
    if (seen.has(key)){ toast('Duplicate UPI ID entered — each UPI ID must be unique for this bank account','warn'); return; }
    seen.add(key);
  }

  let bankAccountId = id;
  if (id){
    const existing = findBank(id);
    const updated = { ...existing, ...data, updatedAt: new Date().toISOString() };
    await putRec('bankAccounts', updated); Object.assign(existing, updated);
    await audit('Bank Account Edit','BankAccount', existing.bankId, existing, updated);
    toast('Bank account updated','ok');
  } else {
    const bankId = nextCode(S.bankAccounts, 'bankId', 'BANK');
    const rec = { bankId, ...data, status: data.status||'Active', createdAt: new Date().toISOString(), updatedAt: new Date().toISOString() };
    const newId = await putRec('bankAccounts', rec); rec.id = newId; S.bankAccounts.push(rec);
    bankAccountId = newId;
    await audit('Bank Account Creation','BankAccount', bankId, null, rec);
    toast('Bank account added','ok');
  }

  // sync UPI rows: delete removed, update existing, create new
  const existingUpis = bankUpis(bankAccountId);
  const keptIds = new Set(cleanedUpis.filter(u=>u.id).map(u=>u.id));
  for (const old of existingUpis){
    if (!keptIds.has(old.id)){
      await delRec('bankUpiIds', old.id);
      S.bankUpiIds = S.bankUpiIds.filter(x=>x.id!==old.id);
      await audit('UPI Deleted','BankUpiId', old.id, old, null);
    }
  }
  for (const u of cleanedUpis){
    if (u.id){
      const existingRec = S.bankUpiIds.find(x=>x.id===u.id);
      if (existingRec && existingRec.upiId !== u.upiId){
        const updated = { ...existingRec, upiId: u.upiId, updatedAt: new Date().toISOString() };
        await putRec('bankUpiIds', updated); Object.assign(existingRec, updated);
        await audit('UPI Edited','BankUpiId', u.id, existingRec, updated);
      }
    } else {
      const rec = { bankAccountId, upiId: u.upiId, createdAt: new Date().toISOString(), updatedAt: new Date().toISOString() };
      const newId = await putRec('bankUpiIds', rec); rec.id = newId; S.bankUpiIds.push(rec);
      await audit('UPI Added','BankUpiId', newId, null, rec);
    }
  }
  closeModal(); navigate('banks');
}
function deleteBank(id){
  const b = findBank(id);
  const stats = bankStats(id);
  if (stats.plans.length || stats.apps.length){
    confirmDangerousDelete({
      warningHtml: `This bank account (${escapeHtml(b.bankId)} — ${escapeHtml(b.bankName)}) has ${stats.plans.length} planned entr(y/ies) and ${stats.apps.length} application(s) on record. Deleting it permanently removes all of this. This cannot be undone.`,
      onDelete: async () => {
        for (const a of stats.apps){ await delRec('applications', a.id); }
        S.applications = S.applications.filter(a=>a.bankAccountId!==id);
        const planIds = stats.plans.map(p=>p.id);
        for (const p of stats.plans){ await delRec('ipoPlans', p.id); }
        S.ipoPlans = S.ipoPlans.filter(p=>p.bankAccountId!==id);
        const orphanedPlannedClients = S.plannedClients.filter(pc=>planIds.includes(pc.planId));
        for (const pc of orphanedPlannedClients){ await delRec('plannedClients', pc.id); }
        S.plannedClients = S.plannedClients.filter(pc=>!planIds.includes(pc.planId));
        await delRec('bankAccounts', id);
        S.bankAccounts = S.bankAccounts.filter(x=>x.id!==id);
        for (const u of bankUpis(id)){ await delRec('bankUpiIds', u.id); }
        S.bankUpiIds = S.bankUpiIds.filter(x=>x.bankAccountId!==id);
        await audit('Bank Account Deletion','BankAccount', b.bankId, b, null);
        toast('Bank account and its records deleted','ok'); navigate('banks');
      }
    });
    return;
  }
  confirmAction(`Delete bank account ${escapeHtml(b.bankId)} - ${escapeHtml(b.bankName)}? This bank account has no history, so this is safe to remove permanently.`, async () => {
    await delRec('bankAccounts', id);
    S.bankAccounts = S.bankAccounts.filter(x=>x.id!==id);
    for (const u of bankUpis(id)){ await delRec('bankUpiIds', u.id); }
    S.bankUpiIds = S.bankUpiIds.filter(x=>x.bankAccountId!==id);
    await audit('Bank Account Deletion','BankAccount', b.bankId, b, null);
    toast('Bank account deleted','ok'); navigate('banks');
  });
}

/* =================== IPOs =================== */
function ipoStats(ipoId){
  const apps = S.applications.filter(a=>a.ipoId===ipoId);
  const plans = S.ipoPlans.filter(p=>p.ipoId===ipoId);
  const allotted = apps.filter(a=>a.allotmentStatus==='Allotted');
  const profit = apps.reduce((s,a)=>s+calcProfit(a).final,0);
  return { apps, plans, allotted, profit };
}
function goFiltered(el){
  const p = JSON.parse(el.getAttribute('data-nav'));
  navigate(p.view, { presetFilter: p.presetFilter });
}
function navAttr(view, filterVals, tableId){
  return `data-nav='${escapeHtml(JSON.stringify({ view, presetFilter:{ tableId: tableId||'allotTbl', filterVals } }))}' onclick="goFiltered(this)"`;
}

function openIpoDetail(id){ navigate('ipos', { id }); }
function viewIpoDetail(id){
  const ipo = findIpo(id);
  if (!ipo) return `<p>IPO not found. <button class="link-btn" onclick="navigate('ipos')">Back</button></p>`;
  const apps = S.applications.filter(a=>a.ipoId===id);
  const plans = S.ipoPlans.filter(p=>p.ipoId===id);
  const plannedCount = plans.reduce((s,p)=>s+(p.plannedClientCount||0),0);
  const appliedCount = apps.filter(a=>a.applicationStatus==='Applied').length;
  const allotted = apps.filter(a=>a.allotmentStatus==='Allotted');
  const notAllotted = apps.filter(a=>a.allotmentStatus==='Not Allotted');
  const pendingAllotment = apps.filter(a=>!a.allotmentStatus || a.allotmentStatus==='Pending');
  const sold = apps.filter(a=>a.saleStatus==='Sold');
  const pendingSale = allotted.filter(a=>a.saleStatus!=='Sold');
  const received = apps.filter(a=>a.amountReceiveStatus==='Received');
  const receivable = apps.filter(a=>a.amountReceiveStatus==='Receivable');

  const totalApplied = apps.reduce((s,a)=>s+(Number(a.amountApplied)||0),0);
  const capitalBlocked = pendingAllotment.reduce((s,a)=>s+(Number(a.amountApplied)||0),0);
  const totalSaleAmount = sold.reduce((s,a)=>s+(Number(a.saleAmount)||0),0);
  let grossReceivedTotal=0, ourProfitTotal=0, clientProfitTotal=0, amountReceivedTotal=0, amountReceivableTotal=0;
  apps.forEach(a=>{
    const c = calcAllotmentSale(a);
    if (c.applicable){
      grossReceivedTotal += c.grossFinal;
      ourProfitTotal += c.ourFinal;
      clientProfitTotal += c.clientFinal;
      if (a.amountReceiveStatus==='Received') amountReceivedTotal += c.grossFinal;
      if (a.amountReceiveStatus==='Receivable') amountReceivableTotal += c.grossFinal;
    }
  });

  const bankMap = {};
  apps.forEach(a=>{ const b=findBank(a.bankAccountId); const name=b?b.bankName:'Unknown'; bankMap[name]=(bankMap[name]||0)+1; });
  const bankRows = Object.entries(bankMap).sort((a,b)=>b[1]-a[1]);

  return `
  <div class="section-card">
    <div class="sc-head"><h3>${escapeHtml(ipo.ipoName)}</h3><div class="spacer"></div><button class="link-btn" onclick="navigate('ipos')">&larr; Back to IPOs</button></div>
    <div class="sc-body">
      <p class="small-muted">${fmtDate(ipo.openDate)} – ${fmtDate(ipo.closeDate)} &nbsp;|&nbsp; Allotment Date: ${fmtDate(ipo.allotmentDate)} &nbsp;|&nbsp; Minimum Application: ${fmtMoney(ipo.minimumApplicationAmount)} &nbsp;|&nbsp; ${badge(ipoStatus(ipo))}</p>
    </div>
  </div>

  <div class="section-card">
    <div class="sc-head"><h3>Overview</h3></div>
    <div class="sc-body kpi-grid">
      <div class="kpi-card"><div class="lbl">Planned</div><div class="val">${plannedCount}</div></div>
      <div class="kpi-card"><div class="lbl">Applied</div><div class="val">${appliedCount}</div></div>

  return `

function ipoFields(i){
  return [
    { key:'ipoName', label:'IPO Name', required:true },
    { key:'minimumApplicationAmount', label:'Minimum Application Amount', type:'number', required:true },
    { key:'openDate', label:'Open Date', type:'date', required:true },
    { key:'closeDate', label:'Close Date', type:'date', required:true },
    { key:'allotmentDate', label:'Allotment Date', type:'date', hint:'Company-wide allotment date for this IPO — automatically applied to every application\u2019s Allotment & Sale record and not editable per-application.' },
    { key:'archiveStatus', label:'Active/Inactive', type:'select', options:['Active','Inactive'], hint:'Separate from the automatic Upcoming/Open/Closed lifecycle status below — this only controls whether the IPO is archived.' }
  ].map(f => fieldHtml(f, i ? (f.key==='archiveStatus' ? (i.archiveStatus||'Active') : i[f.key]) : (f.key==='archiveStatus' ? 'Active' : ''))).join('');
}
function editIpo(id){
  const i = id ? findIpo(id) : null;
  openModal(i ? 'Edit IPO' : 'Add IPO',
    `<div class="form-grid">${ipoFields(i)}</div><p class="hint">Status (Upcoming / Open / Closed) is calculated automatically from today's date vs open/close dates.</p>`,
    `<button class="btn btn-ghost" onclick="closeModal()">Cancel</button><button class="btn btn-primary" onclick="saveIpo(${id||'null'})">Save</button>`);
}
async function saveIpo(id){
  const data = readFields([{key:'ipoName'},{key:'minimumApplicationAmount',type:'number'},{key:'openDate'},{key:'closeDate'},{key:'allotmentDate'},{key:'archiveStatus'}]);
  if (!data.ipoName || !data.openDate || !data.closeDate){ toast('IPO name and dates are required','warn'); return; }
  if (data.closeDate < data.openDate){ toast('Close date cannot be before open date','warn'); return; }
  if (!data.allotmentDate) data.allotmentDate = null;
  if (id){
    const existing = findIpo(id);
    const updated = { ...existing, ...data, updatedAt: new Date().toISOString() };
    await putRec('ipos', updated); Object.assign(existing, updated);
    await audit('IPO Edit','IPO', existing.ipoId, existing, updated);
    toast('IPO updated','ok');
  } else {
    const ipoId = nextCode(S.ipos, 'ipoId', 'IPO');
    const rec = { ipoId, ...data, createdAt: new Date().toISOString(), updatedAt: new Date().toISOString() };
    const newId = await putRec('ipos', rec); rec.id = newId; S.ipos.push(rec);
    await audit('IPO Creation','IPO', ipoId, null, rec);
    toast('IPO added','ok');
  }
  closeModal(); navigate('ipos');
}
function deleteIpo(id){
  const i = findIpo(id);
  const stats = ipoStats(id);
  if (stats.plans.length || stats.apps.length){
    confirmDangerousDelete({
      warningHtml: `This IPO (${escapeHtml(i.ipoId)} — ${escapeHtml(i.ipoName)}) has ${stats.plans.length} planning record(s), ${stats.apps.length} application(s), and ${fmtMoney(stats.profit)} in recorded profit. Deleting it permanently removes all of this, including those planning records and applications. This cannot be undone.`,
      onDelete: async () => {
        const planIds = stats.plans.map(p=>p.id);
        for (const p of stats.plans){ await delRec('ipoPlans', p.id); }
        S.ipoPlans = S.ipoPlans.filter(p=>p.ipoId!==id);
        const orphanedPlannedClients = S.plannedClients.filter(pc=>planIds.includes(pc.planId));
        for (const pc of orphanedPlannedClients){ await delRec('plannedClients', pc.id); }
        S.plannedClients = S.plannedClients.filter(pc=>!planIds.includes(pc.planId));
        for (const a of stats.apps){ await delRec('applications', a.id); }
        S.applications = S.applications.filter(a=>a.ipoId!==id);
        await delRec('ipos', id);
        S.ipos = S.ipos.filter(x=>x.id!==id);
        await audit('IPO Deletion','IPO', i.ipoId, i, null);
        toast('IPO and its records deleted','ok');
        navigate('ipos');
      }
    });
    return;
  }
  confirmAction(`Delete IPO ${escapeHtml(i.ipoId)} - ${escapeHtml(i.ipoName)}? This IPO has no records, so this is safe to remove permanently.`, async () => {
    await delRec('ipos', id);
    S.ipos = S.ipos.filter(x=>x.id!==id);
    await audit('IPO Deletion','IPO', i.ipoId, i, null);
    toast('IPO deleted','ok'); navigate('ipos');
  });
}
</script>
<script>
/* =================== IPO PLANNING =================== */
let planningTab = 'plans'; // plans | calendar | variance | capacity

function viewPlanning(){
  return `
  <div class="tabs">
    <button class="${planningTab==='plans'?'active':''}" onclick="setPlanningTab('plans')">Plan List</button>
    <button class="${planningTab==='calendar'?'active':''}" onclick="setPlanningTab('calendar')">Planning Calendar</button>
    <button class="${planningTab==='capacity'?'active':''}" onclick="setPlanningTab('capacity')">Capacity Dashboard</button>
    <button class="${planningTab==='variance'?'active':''}" onclick="setPlanningTab('variance')">Planned vs Actual</button>
    <button class="${planningTab==='upcoming'?'active':''}" onclick="setPlanningTab('upcoming')">Upcoming IPO Planner</button>
  </div>
  <div id="planningTabBody"></div>`;
}
function setPlanningTab(t){ planningTab = t; render(); }
function afterPlanning(){
  const el = document.getElementById('planningTabBody');
  if (planningTab==='plans') el.innerHTML = planningPlansTab();
  else if (planningTab==='calendar') el.innerHTML = planningCalendarTab();
  else if (planningTab==='capacity') el.innerHTML = planningCapacityTab();
  else if (planningTab==='variance') el.innerHTML = planningVarianceTab();
  else if (planningTab==='upcoming') el.innerHTML = planningUpcomingTab();
  if (planningTab==='plans') { setTimeout(()=>window.__tableRerender['plansTbl'] && window.__tableRerender['plansTbl'](), 0); }
}

function planStatusComputed(plan){
  const v = planVariance(plan);
  if (plan.planStatus === 'Cancelled') return 'Cancelled';
  if (v === 'Pending') return 'Planned';
  if (v === 'Matched' || v === 'Bank Changed' || v === 'Date Changed') return 'Executed';
  return 'Partially Executed';
}

function planningPlansTab(){
  window.__tableRerender['plansTbl'] = () => {
    renderIntoWrap('plansTblWrap', renderDataTable('plansTbl', {
      data: sortedPlans(),
      searchFn: (r,q) => { const ipo=findIpo(r.ipoId); return ((ipo?ipo.ipoName:'')+' '+r.plannedDate).toLowerCase().includes(q); },
      searchPlaceholder: 'Search by IPO...',
      filters: [
        { key:'bankAccountId', label:'Bank', options: S.bankAccounts.map(b=>b.bankName), match:(r,v)=>{ const b=findBank(r.bankAccountId); return b && b.bankName===v; } }
      ],
      pageSize: 10,
      columns: [
        { key:'ipoId', label:'IPO', render:r=>{ const i=findIpo(r.ipoId); return escapeHtml(i?i.ipoName:'—'); } },
        { key:'plannedDate', label:'Planned Date', render:r=>fmtDate(r.plannedDate) },
        { key:'bankAccountId', label:'Bank', render:r=>{ const b=findBank(r.bankAccountId); return escapeHtml(b?b.bankName:'—'); } },
        { key:'plannedClientCount', label:'Planned Clients' },
        { key:'status', label:'Status', render:r=>badge(planStatusComputed(r)) },
        { key:'variance', label:'Vs Actual', render:r=>badge(planVariance(r)) },
        { key:'notes', label:'Notes', render:r=>escapeHtml(r.notes||'—') }
      ],
      rowActions: r => `<button class="btn btn-sm btn-ghost" onclick="planClients(${r.id})">Clients</button>
                         <button class="btn btn-sm btn-ghost" onclick="editPlan(${r.id})">Edit</button>
                         <button class="btn btn-sm btn-danger" onclick="deletePlan(${r.id})">Delete</button>`
    }));
  };
  setTimeout(()=>window.__tableRerender['plansTbl'](), 0);
  return `
  <div class="section-card">
    <div class="sc-head"><h3>IPO Plans</h3><div class="spacer"></div>
      <button class="btn btn-gold" onclick="bulkPlanClients()">Bulk Plan Clients</button>
      <button class="btn btn-primary" onclick="editPlan()">+ New Plan</button>
    </div>
    <div class="sc-body" id="plansTblWrap"></div>
  </div>`;
}

function planFields(p){
  return [
    { key:'ipoId', label:'IPO', type:'select', required:true, placeholder:'Select IPO', options: sortedActiveIpos(p?p.ipoId:null).map(i=>({value:i.id,label:i.ipoName})) },
    { key:'plannedDate', label:'Planned Application Date', type:'date', required:true },
    { key:'bankAccountId', label:'Bank Account', type:'select', required:true, placeholder:'Select Bank', options: S.bankAccounts.filter(b=>b.status==='Active').map(b=>({value:b.id,label:b.bankName})) },
    { key:'plannedClientCount', label:'Planned Number of Client Applications', type:'number' },
    { key:'planStatus', label:'Planned Status', type:'select', options:['Planned','Partially Executed','Executed','Cancelled'] },
    { key:'notes', label:'Notes', type:'textarea', span2:true }
  ].map(f => fieldHtml(f, p ? p[f.key] : (f.key==='planStatus'?'Planned':''))).join('');
}
function editPlan(id){
  const p = id ? findPlan(id) : null;
  openModal(p ? 'Edit IPO Plan' : 'New IPO Plan',
    `<div class="form-grid">${planFields(p)}</div>`,
    `<button class="btn btn-ghost" onclick="closeModal()">Cancel</button><button class="btn btn-primary" onclick="savePlan(${id||'null'})">Save</button>`, true);
}
async function savePlan(id, forceOverride){
  const data = readFields([{key:'ipoId',type:'number'},{key:'plannedDate'},{key:'bankAccountId',type:'number'},{key:'plannedClientCount',type:'number'},{key:'planStatus'},{key:'notes'}]);
  if (!data.ipoId || !data.plannedDate || !data.bankAccountId){ toast('IPO, date and bank are required','warn'); return; }

  // duplicate check
  const dup = S.ipoPlans.find(x => x.ipoId===data.ipoId && x.bankAccountId===data.bankAccountId && x.plannedDate===data.plannedDate && x.id !== id);
  if (dup && !forceOverride){
    openModal('Duplicate Plan',
      `<p style="font-size:13px;">This IPO is already planned through this bank account on this date. You can edit the existing plan instead, or continue to create another record.</p>`,
      `<button class="btn btn-ghost" onclick="closeModal()">Cancel</button>
       <button class="btn btn-gold" onclick="closeModal(); editPlan(${dup.id})">Edit Existing Plan</button>
       <button class="btn btn-danger" onclick="savePlan(${id||'null'}, true)">Continue Anyway</button>`);
    return;
  }

  // capacity check — count actual mandates (plannedClientCount), not a flat +1 per plan
  const cap = bankCapacity(data.bankAccountId, data.plannedDate);
  const existingPlanSameSlot = id ? S.ipoPlans.find(x=>x.id===id && x.bankAccountId===data.bankAccountId && x.plannedDate===data.plannedDate) : null;
  const previousMandatesForThisPlan = existingPlanSameSlot ? (existingPlanSameSlot.plannedClientCount||0) : 0;
  const projected = cap.planned - previousMandatesForThisPlan + (data.plannedClientCount||0);
  if (projected > 6 && !forceOverride){
    const bank = findBank(data.bankAccountId);
    openModal('⚠️ Capacity Warning',
      `<p style="font-size:13px;line-height:1.6;">${escapeHtml(bank.bankName)} already has <b>${cap.planned}</b> mandate(s) planned for ${fmtDate(data.plannedDate)}.<br>
       Maximum recommended capacity: <b>6</b><br>This plan would bring it to: <b>${projected}</b><br>Available: <b>${cap.available}</b><br><br>Do you want to continue anyway?</p>`,
      `<button class="btn btn-ghost" onclick="closeModal()">Cancel</button>
       <button class="btn btn-danger" onclick="savePlan(${id||'null'}, true)">Continue Anyway</button>`);
    return;
  }

  if (id){
    const existing = findPlan(id);
    const updated = { ...existing, ...data, updatedAt: new Date().toISOString() };
    await putRec('ipoPlans', updated); Object.assign(existing, updated);
    await audit('Plan Modification','IPOPlan', id, existing, updated);
    toast('Plan updated','ok');
  } else {
    const rec = { ...data, planStatus: data.planStatus||'Planned', createdAt: new Date().toISOString(), updatedAt: new Date().toISOString() };
    const newId = await putRec('ipoPlans', rec); rec.id = newId; S.ipoPlans.push(rec);
    await audit('Plan Creation','IPOPlan', newId, null, rec);
    toast('Plan created','ok');
  }
  closeModal(); navigate('planning');
}
function deletePlan(id){
  const p = findPlan(id);
  const dependentClients = S.plannedClients.filter(pc=>pc.planId===id);
  const msg = dependentClients.length
    ? `This plan has ${dependentClients.length} client(s) mapped to it. Deleting it will release those clients for re-planning against this IPO. Continue?`
    : `Delete this plan?`;
  confirmAction(msg, async () => {
    await delRec('ipoPlans', id);
    S.ipoPlans = S.ipoPlans.filter(x=>x.id!==id);
    for (const pc of dependentClients){ await delRec('plannedClients', pc.id); }
    S.plannedClients = S.plannedClients.filter(x=>x.planId!==id);
    await audit('Plan Modification','IPOPlan', id, p, null);
    toast('Plan deleted','ok'); navigate('planning');
  });
}

/* ---- duplicate-client-per-IPO eligibility rule ----
   A client already mapped to an ACTIVE (non-cancelled) plan for a given IPO cannot be
   mapped to another plan of the SAME IPO, regardless of bank/date/plan. Deleting or
   cancelling the plan releases the client for that IPO again. Deleting an application
   does NOT release the client — only the plan controls eligibility. */
function clientAlreadyPlannedForIpo(clientId, ipoId, excludePlanId){
  return S.plannedClients.some(pc => {
    if (pc.clientId !== clientId) return false;
    if (excludePlanId && pc.planId === excludePlanId) return false;
    const plan = findPlan(pc.planId);
    return plan && plan.ipoId === ipoId && plan.planStatus !== 'Cancelled';
  });
}

/* ---- client mapping for a plan ---- */
function planClients(planId){
  const p = findPlan(planId);
  const ipo = findIpo(p.ipoId);
  const mapped = S.plannedClients.filter(pc => pc.planId === planId);
  const rows = S.clients.map(c => {
    const pc = mapped.find(m=>m.clientId===c.id);
    const app = S.applications.find(a=>a.planId===planId && a.clientId===c.id);
    const blockedElsewhere = !pc && clientAlreadyPlannedForIpo(c.id, p.ipoId, planId);
    return `<tr>
      <td>${escapeHtml(c.clientId)} — ${escapeHtml(c.clientName)}</td>
      <td>${pc?'Yes':'No'}</td>
      <td>${pc ? escapeHtml(findBank(p.bankAccountId).bankName) : '—'}</td>
      <td>${app ? badge(app.applicationStatus) : (pc?badge('To Be Applied'):(blockedElsewhere?'<span class="badge gray">Already planned for this IPO</span>':'<span class="small-muted">Not Planned</span>'))}</td>
      <td>${blockedElsewhere ? '<span class="small-muted">Blocked</span>' : `<label class="checkbox-row"><input type="checkbox" data-cid="${c.id}" ${pc?'checked':''} onchange="togglePlanClient(${planId},${c.id},this.checked)"> Plan</label>`}</td>
    </tr>`;
  }).join('');
  openModal(`Plan Clients — ${escapeHtml(ipo.ipoName)}`,
    `<p class="small-muted">Select which clients are planned for this IPO/bank/date slot. A client already planned for this IPO under another active plan cannot be selected again until that plan is deleted or cancelled.</p>
     <div class="table-wrap"><table class="dt"><thead><tr><th>Client</th><th>Planned</th><th>Bank</th><th>Status</th><th>Toggle</th></tr></thead>
     <tbody>${rows}</tbody></table></div>`,
    `<button class="btn btn-primary" onclick="closeModal()">Done</button>`, true);
}
async function togglePlanClient(planId, clientId, checked){
  const plan = findPlan(planId);
  if (checked && clientAlreadyPlannedForIpo(clientId, plan.ipoId, planId)){
    toast('This client is already planned for this IPO under another active plan','warn');
    planClients(planId);
    return;
  }
  const existing = S.plannedClients.find(pc=>pc.planId===planId && pc.clientId===clientId);
  if (checked && !existing){
    const rec = { planId, clientId, createdAt: new Date().toISOString() };
    const id = await putRec('plannedClients', rec); rec.id = id; S.plannedClients.push(rec);
    await audit('Plan Modification','PlannedClient', id, null, rec);
  } else if (!checked && existing){
    await delRec('plannedClients', existing.id);
    S.plannedClients = S.plannedClients.filter(x=>x.id!==existing.id);
    await audit('Plan Modification','PlannedClient', existing.id, existing, null);
  }
}

/* ---- bulk client planning ---- */
let __bulkPlanSearch = '';
let __bulkPlanSelected = new Set();
function bulkPlanClients(){
  __bulkPlanSearch = '';
  __bulkPlanSelected = new Set();
  const ipoOpts = sortedActiveIpos().map(i=>`<option value="${i.id}">${escapeHtml(i.ipoName)}</option>`).join('');
  const bankOpts = S.bankAccounts.filter(b=>b.status==='Active').map(b=>`<option value="${b.id}">${escapeHtml(b.bankName)}</option>`).join('');
  openModal('Bulk Plan Clients',
    `<div class="form-grid">
      <div class="f-group"><label>IPO *</label><select id="bpIpo" onchange="renderBulkPlanClientList()"><option value="">Select IPO</option>${ipoOpts}</select></div>
      <div class="f-group"><label>Planned Date *</label><input type="date" id="bpDate"></div>
      <div class="f-group"><label>Bank Account *</label><select id="bpBank"><option value="">Select Bank</option>${bankOpts}</select></div>
      <div class="f-group"><label>&nbsp;</label><div class="small-muted">6-mandate/bank/day capacity rule — each client counts as one mandate, regardless of how many share the same IPO.</div></div>
    </div>
    <div class="f-group span2" style="margin-top:12px;">
      <label>Select Clients</label>
      <div style="display:flex;gap:8px;align-items:center;margin-bottom:6px;flex-wrap:wrap;">
        <input type="text" id="bpSearch" placeholder="Search by client name or ID..." oninput="__bulkPlanSearch=this.value; renderBulkPlanClientList()" style="flex:1;min-width:180px;border:1px solid var(--border);border-radius:6px;padding:7px 10px;">
        <button type="button" class="btn btn-ghost btn-sm" onclick="bulkPlanSelectAll()">Select All</button>
        <button type="button" class="btn btn-ghost btn-sm" onclick="bulkPlanClearAll()">Clear All</button>
        <span class="small-muted" id="bpSelectedCount">Selected: 0 clients</span>
      </div>
      <div id="bpClientListWrap" style="max-height:220px;overflow-y:auto;border:1px solid var(--border);border-radius:6px;padding:8px 12px;"></div>
    </div>`,
    `<button class="btn btn-ghost" onclick="closeModal()">Cancel</button><button class="btn btn-primary" onclick="submitBulkPlan()">Create Plan &amp; Map Clients</button>`, true);
  renderBulkPlanClientList();
}
function renderBulkPlanClientList(){
  const wrap = document.getElementById('bpClientListWrap');
  if (!wrap) return;
  const ipoId = Number(document.getElementById('bpIpo').value) || null;
  const q = (__bulkPlanSearch||'').toLowerCase();
  // Selection state comes from __bulkPlanSelected, a persistent Set kept independent of
  // whatever the search currently shows — this is what makes selections survive searching,
  // filtering, or the IPO changing, instead of being read back from (and lost with) the DOM.
  const visible = S.clients.filter(c => !q || (c.clientId+' '+c.clientName).toLowerCase().includes(q));
  wrap.innerHTML = visible.map(c=>{
    const blocked = ipoId && clientAlreadyPlannedForIpo(c.id, ipoId, null);
    const inactive = c.status === 'Inactive';
    const checked = __bulkPlanSelected.has(c.id);
    return `<label class="checkbox-row" style="padding:4px 0;${blocked?'opacity:.5;':''}${inactive&&!blocked?'color:var(--text-dim);':''}">
      <input type="checkbox" class="bulkPlanClient" value="${c.id}" ${blocked?'disabled':''} ${checked&&!blocked?'checked':''} onchange="toggleBulkPlanClient(${c.id}, this.checked)">
      ${escapeHtml(c.clientId)} — ${escapeHtml(c.clientName)} ${inactive?'<span class="badge gray">Inactive</span>':''} ${blocked?'<span class="badge gray">Already planned for this IPO</span>':''}
    </label>`;
  }).join('') || `<div class="small-muted">No clients match.</div>`;
  updateBulkPlanSelectedCount();
}
function toggleBulkPlanClient(id, checked){
  if (checked) __bulkPlanSelected.add(id); else __bulkPlanSelected.delete(id);
  updateBulkPlanSelectedCount();
}
function bulkPlanSelectAll(){
  // Selects everyone matching the CURRENT search/filter — not the entire client base —
  // consistent with the filtered Select All behaviour used elsewhere in the app.
  const ipoId = Number(document.getElementById('bpIpo').value) || null;
  const q = (__bulkPlanSearch||'').toLowerCase();
  S.clients
    .filter(c => (!q || (c.clientId+' '+c.clientName).toLowerCase().includes(q)) && !(ipoId && clientAlreadyPlannedForIpo(c.id, ipoId, null)))
    .forEach(c => __bulkPlanSelected.add(c.id));
  renderBulkPlanClientList();
}
function bulkPlanClearAll(){ __bulkPlanSelected = new Set(); renderBulkPlanClientList(); }
function updateBulkPlanSelectedCount(){
  const n = __bulkPlanSelected.size;
  const el = document.getElementById('bpSelectedCount');
  if (el) el.textContent = `Selected: ${n} client${n===1?'':'s'}`;
}
async function submitBulkPlan(force){
  const ipoId = Number(document.getElementById('bpIpo').value);
  const plannedDate = document.getElementById('bpDate').value;
  const bankAccountId = Number(document.getElementById('bpBank').value);
  let clientIds = Array.from(__bulkPlanSelected);
  if (!ipoId || !plannedDate || !bankAccountId){ toast('IPO, date and bank are required','warn'); return; }
  if (!clientIds.length){ toast('Select at least one client','warn'); return; }

  // defensive re-check against duplicate-client-per-IPO rule
  const blocked = clientIds.filter(cid => clientAlreadyPlannedForIpo(cid, ipoId, null));
  clientIds = clientIds.filter(cid => !blocked.includes(cid));
  if (!clientIds.length){ toast('All selected clients are already planned for this IPO','warn'); return; }

  let plan = S.ipoPlans.find(x=>x.ipoId===ipoId && x.bankAccountId===bankAccountId && x.plannedDate===plannedDate);
  const cap = bankCapacity(bankAccountId, plannedDate);
  const projected = cap.planned + clientIds.length;
  if (projected > 6 && !force){
    const bank = findBank(bankAccountId);
