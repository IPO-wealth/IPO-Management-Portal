async function savePlan(id, forceOverride){
  const data = readFields([{key:'ipoId',type:'number'},{key:'plannedDate'},{key:'bankAccountId',type:'number'},{key:'planStatus'},{key:'notes'}]);
  if (!data.ipoId || !data.plannedDate || !data.bankAccountId){ toast('IPO, date and bank are required','warn'); return; }

  // duplicate check
  const dup = S.ipoPlans.find(x => x.ipoId===data.ipoId && x.bankAccountId===data.bankAccountId && x.plannedDate===data.plannedDate && x.id !== id);
  if (dup && !forceOverride){
    openModal('Duplicate Plan',
      `<p style="font-size:13px;">This IPO is already planned through this bank account on this date. You can edit the existing plan instead, or continue to create another record.</p>`,
      `<button class="btn btn-ghost" onclick="closeModal()">Cancel</button>
       <button class="btn btn-gold" onclick="closeModal(); editPlan(${dup.id})">Edit Existing Plan</button>
       <button class="btn btn-danger" onclick="savePlan(${id||'null'}, true)">Continue Anyway</button>`);
    return;
  }

  // capacity check — count actual mandates (plannedClientCount), not a flat +1 per plan
  const cap = bankCapacity(data.bankAccountId, data.plannedDate);
  const existingPlanSameSlot = id ? S.ipoPlans.find(x=>x.id===id && x.bankAccountId===data.bankAccountId && x.plannedDate===data.plannedDate) : null;
  const thisPlanMandates = id ? planClientCount(findPlan(id)) : 0;       // clients already mapped to this plan
  const previousMandatesForThisPlan = existingPlanSameSlot ? thisPlanMandates : 0; // already counted in cap.planned if slot unchanged
  const projected = cap.planned - previousMandatesForThisPlan + thisPlanMandates;
  if (thisPlanMandates > 0 && projected > cap.capacity && !forceOverride){
    const bank = findBank(data.bankAccountId);
    openModal('⚠️ Capacity Warning',
      `<p style="font-size:13px;line-height:1.6;">${escapeHtml(bank.bankName)} already has <b>${cap.planned}</b> mandate(s) planned for ${fmtDate(data.plannedDate)}.<br>
       Maximum recommended capacity: <b>${cap.capacity}</b><br>This plan would bring it to: <b>${projected}</b><br>Available: <b>${cap.available}</b><br><br>Do you want to continue anyway?</p>`,
      `<button class="btn btn-ghost" onclick="closeModal()">Cancel</button>
       <button class="btn btn-danger" onclick="savePlan(${id||'null'}, true)">Continue Anyway</button>`);
    return;
  }

  if (id){
    const existing = findPlan(id);
    const updated = { ...existing, ...data, updatedAt: new Date().toISOString() };
    await putRec('ipoPlans', updated); const __prev8 = {...existing}; Object.assign(existing, updated);
    await audit('Plan Modification','IPOPlan', id, __prev8, updated);
    toast('Plan updated','ok');
  } else {
    const rec = { ...data, plannedClientCount: 0, countSynced: true, planStatus: data.planStatus||'Planned', createdAt: new Date().toISOString(), updatedAt: new Date().toISOString() };
    const newId = await putRec('ipoPlans', rec); rec.id = newId; S.ipoPlans.push(rec);
    await audit('Plan Creation','IPOPlan', newId, null, rec);
    toast('Plan created','ok');
  }
  closeModal(); navigate('planning');
}
function deletePlan(id){
  const p = findPlan(id);
  const dependentClients = S.plannedClients.filter(pc=>pc.planId===id);
  const linkedApps = S.applications.filter(a=>a.planId===id);
  const parts = [];
  if (dependentClients.length) parts.push(`${dependentClients.length} client(s) mapped to it, who will be released for re-planning against this IPO`);
  if (linkedApps.length) parts.push(`${linkedApps.length} application(s) created from it, which will be kept but will no longer be linked to any plan`);
  const msg = parts.length ? `This plan has ${parts.join(' and ')}. Continue?` : `Delete this plan?`;
  confirmAction(msg, async () => {
    for (const a of linkedApps){
      const updated = { ...a, planId: null, updatedAt: new Date().toISOString() };
      await putRec('applications', updated); Object.assign(a, updated);
    }
    await delRec('ipoPlans', id);
    S.ipoPlans = S.ipoPlans.filter(x=>x.id!==id);
    for (const pc of dependentClients){ await delRec('plannedClients', pc.id); }
    S.plannedClients = S.plannedClients.filter(x=>x.planId!==id);
    await audit('Plan Modification','IPOPlan', id, p, null);
    toast('Plan deleted','ok'); navigate('planning');
  });
}

/* ---- duplicate-client-per-IPO eligibility rule ----
   A client already mapped to an ACTIVE (non-cancelled) plan for a given IPO cannot be
   mapped to another plan of the SAME IPO, regardless of bank/date/plan. Deleting or
   cancelling the plan releases the client for that IPO again. Deleting an application
   does NOT release the client — only the plan controls eligibility. */
function clientAlreadyPlannedForIpo(clientId, ipoId, excludePlanId){
  return S.plannedClients.some(pc => {
    if (pc.clientId !== clientId) return false;
    if (excludePlanId && pc.planId === excludePlanId) return false;
    const plan = findPlan(pc.planId);
    return plan && plan.ipoId === ipoId && plan.planStatus !== 'Cancelled';
  });
}

/* ---- client mapping for a plan ---- */
function planClients(planId){
  const p = findPlan(planId);
  const ipo = findIpo(p.ipoId);
  const mapped = S.plannedClients.filter(pc => pc.planId === planId);
  const rows = S.clients.map(c => {
    const pc = mapped.find(m=>m.clientId===c.id);
    const app = S.applications.find(a=>a.planId===planId && a.clientId===c.id);
    const blockedElsewhere = !pc && clientAlreadyPlannedForIpo(c.id, p.ipoId, planId);
    return `<tr>
      <td>${escapeHtml(c.clientId)} — ${escapeHtml(c.clientName)}</td>
      <td>${pc?'Yes':'No'}</td>
      <td>${pc ? escapeHtml(findBank(p.bankAccountId).bankName) : '—'}</td>
      <td>${app ? badge(app.applicationStatus) : (pc?badge('To Be Applied'):(blockedElsewhere?'<span class="badge gray">Already planned for this IPO</span>':'<span class="small-muted">Not Planned</span>'))}</td>
      <td>${blockedElsewhere ? '<span class="small-muted">Blocked</span>' : `<label class="checkbox-row"><input type="checkbox" data-cid="${c.id}" ${pc?'checked':''} onchange="togglePlanClient(${planId},${c.id},this.checked)"> Plan</label>`}</td>
    </tr>`;
  }).join('');
  openModal(`Plan Clients — ${escapeHtml(ipo.ipoName)}`,
    `<p class="small-muted">Select which clients are planned for this IPO/bank/date slot. A client already planned for this IPO under another active plan cannot be selected again until that plan is deleted or cancelled.</p>
     <div class="table-wrap"><table class="dt"><thead><tr><th>Client</th><th>Planned</th><th>Bank</th><th>Status</th><th>Toggle</th></tr></thead>
     <tbody>${rows}</tbody></table></div>`,
    `<button class="btn btn-primary" onclick="closeModal()">Done</button>`, true);
}
async function togglePlanClient(planId, clientId, checked){
  const plan = findPlan(planId);
  if (checked && clientAlreadyPlannedForIpo(clientId, plan.ipoId, planId)){
    toast('This client is already planned for this IPO under another active plan','warn');
    planClients(planId);
    return;
  }
  const existing = S.plannedClients.find(pc=>pc.planId===planId && pc.clientId===clientId);
  if (checked && !existing){
    const rec = { planId, clientId, createdAt: new Date().toISOString() };
    const id = await putRec('plannedClients', rec); rec.id = id; S.plannedClients.push(rec);
    await audit('Plan Modification','PlannedClient', id, null, rec);
    const cap = bankCapacity(plan.bankAccountId, plan.plannedDate);
    if (cap.planned > cap.capacity) toast(`Heads up: ${findBank(plan.bankAccountId).bankName} now has ${cap.planned} mandates on ${fmtDate(plan.plannedDate)} (limit ${cap.capacity})`,'warn');
  } else if (!checked && existing){
    await delRec('plannedClients', existing.id);
    S.plannedClients = S.plannedClients.filter(x=>x.id!==existing.id);
    await audit('Plan Modification','PlannedClient', existing.id, existing, null);
  }
  await syncPlanClientCount(plan);
}

/* ---- bulk client planning ---- */
let __bulkPlanSearch = '';
let __bulkPlanSelected = new Set();
function bulkPlanClients(){
  __bulkPlanSearch = '';
  __bulkPlanSelected = new Set();
  const ipoOpts = sortedActiveIpos().map(i=>`<option value="${i.id}">${escapeHtml(i.ipoName)}</option>`).join('');
  const bankOpts = S.bankAccounts.filter(b=>b.status==='Active').map(b=>`<option value="${b.id}">${escapeHtml(b.bankName)}</option>`).join('');
  openModal('Bulk Plan Clients',
    `<div class="form-grid">
      <div class="f-group"><label>IPO *</label><select id="bpIpo" onchange="renderBulkPlanClientList()"><option value="">Select IPO</option>${ipoOpts}</select></div>
      <div class="f-group"><label>Planned Date *</label><input type="date" id="bpDate"></div>
      <div class="f-group"><label>Bank Account *</label><select id="bpBank"><option value="">Select Bank</option>${bankOpts}</select></div>
      <div class="f-group"><label>&nbsp;</label><div class="small-muted">${capacityLimit()}-mandate/bank/day capacity rule — each client counts as one mandate, regardless of how many share the same IPO.</div></div>
    </div>
    <div class="f-group span2" style="margin-top:12px;">
      <label>Select Clients</label>
      <div style="display:flex;gap:8px;align-items:center;margin-bottom:6px;flex-wrap:wrap;">
        <input type="text" id="bpSearch" placeholder="Search by client name or ID..." oninput="__bulkPlanSearch=this.value; renderBulkPlanClientList()" style="flex:1;min-width:180px;border:1px solid var(--border);border-radius:6px;padding:7px 10px;">
        <button type="button" class="btn btn-ghost btn-sm" onclick="bulkPlanSelectAll()">Select All</button>
        <button type="button" class="btn btn-ghost btn-sm" onclick="bulkPlanClearAll()">Clear All</button>
        <span class="small-muted" id="bpSelectedCount">Selected: 0 clients</span>
      </div>
      <div id="bpClientListWrap" style="max-height:220px;overflow-y:auto;border:1px solid var(--border);border-radius:6px;padding:8px 12px;"></div>
    </div>`,
    `<button class="btn btn-ghost" onclick="closeModal()">Cancel</button><button class="btn btn-primary" onclick="submitBulkPlan()">Create Plan &amp; Map Clients</button>`, true);
  renderBulkPlanClientList();
}
function renderBulkPlanClientList(){
  const wrap = document.getElementById('bpClientListWrap');
  if (!wrap) return;
  const ipoId = Number(document.getElementById('bpIpo').value) || null;
  const q = (__bulkPlanSearch||'').toLowerCase();
  // Selection state comes from __bulkPlanSelected, a persistent Set kept independent of
  // whatever the search currently shows — this is what makes selections survive searching,
  // filtering, or the IPO changing, instead of being read back from (and lost with) the DOM.
  const visible = S.clients.filter(c => !q || (c.clientId+' '+c.clientName).toLowerCase().includes(q));
  wrap.innerHTML = visible.map(c=>{
    const blocked = ipoId && clientAlreadyPlannedForIpo(c.id, ipoId, null);
    const inactive = c.status === 'Inactive';
    const checked = __bulkPlanSelected.has(c.id);
    return `<label class="checkbox-row" style="padding:4px 0;${blocked?'opacity:.5;':''}${inactive&&!blocked?'color:var(--text-dim);':''}">
      <input type="checkbox" class="bulkPlanClient" value="${c.id}" ${blocked?'disabled':''} ${checked&&!blocked?'checked':''} onchange="toggleBulkPlanClient(${c.id}, this.checked)">
      ${escapeHtml(c.clientId)} — ${escapeHtml(c.clientName)} ${inactive?'<span class="badge gray">Inactive</span>':''} ${blocked?'<span class="badge gray">Already planned for this IPO</span>':''}
    </label>`;
  }).join('') || `<div class="small-muted">No clients match.</div>`;
  updateBulkPlanSelectedCount();
}
function toggleBulkPlanClient(id, checked){
  if (checked) __bulkPlanSelected.add(id); else __bulkPlanSelected.delete(id);
  updateBulkPlanSelectedCount();
}
function bulkPlanSelectAll(){
  // Selects everyone matching the CURRENT search/filter — not the entire client base —
  // consistent with the filtered Select All behaviour used elsewhere in the app.
  const ipoId = Number(document.getElementById('bpIpo').value) || null;
  const q = (__bulkPlanSearch||'').toLowerCase();
  S.clients
    .filter(c => (!q || (c.clientId+' '+c.clientName).toLowerCase().includes(q)) && !(ipoId && clientAlreadyPlannedForIpo(c.id, ipoId, null)))
    .forEach(c => __bulkPlanSelected.add(c.id));
  renderBulkPlanClientList();
}
function bulkPlanClearAll(){ __bulkPlanSelected = new Set(); renderBulkPlanClientList(); }
function updateBulkPlanSelectedCount(){
  const n = __bulkPlanSelected.size;
  const el = document.getElementById('bpSelectedCount');
  if (el) el.textContent = `Selected: ${n} client${n===1?'':'s'}`;
}
async function submitBulkPlan(force){
  const ipoId = Number(document.getElementById('bpIpo').value);
  const plannedDate = document.getElementById('bpDate').value;
  const bankAccountId = Number(document.getElementById('bpBank').value);
  let clientIds = Array.from(__bulkPlanSelected);
  if (!ipoId || !plannedDate || !bankAccountId){ toast('IPO, date and bank are required','warn'); return; }
  if (!clientIds.length){ toast('Select at least one client','warn'); return; }

  // defensive re-check against duplicate-client-per-IPO rule
  const blocked = clientIds.filter(cid => clientAlreadyPlannedForIpo(cid, ipoId, null));
  clientIds = clientIds.filter(cid => !blocked.includes(cid));
  if (!clientIds.length){ toast('All selected clients are already planned for this IPO','warn'); return; }

  let plan = S.ipoPlans.find(x=>x.ipoId===ipoId && x.bankAccountId===bankAccountId && x.plannedDate===plannedDate);
  const cap = bankCapacity(bankAccountId, plannedDate);
  const projected = cap.planned + clientIds.length;
  if (projected > cap.capacity && !force){
    const bank = findBank(bankAccountId);
    openModal('⚠️ Capacity Warning',
      `<p style="font-size:13px;line-height:1.6;">${escapeHtml(bank.bankName)} already has <b>${cap.planned}</b> mandate(s) planned for ${fmtDate(plannedDate)}.<br>Adding these ${clientIds.length} client(s) would bring it to <b>${projected}</b>.<br>Maximum recommended capacity: <b>${cap.capacity}</b><br>Available: <b>${cap.available}</b><br><br>Continue anyway?</p>`,
      `<button class="btn btn-ghost" onclick="closeModal()">Cancel</button><button class="btn btn-danger" onclick="submitBulkPlan(true)">Continue Anyway</button>`);
    return;
  }
  if (!plan){
    const rec = { ipoId, plannedDate, bankAccountId, countSynced:true, plannedClientCount: 0, planStatus:'Planned', notes:'', createdAt:new Date().toISOString(), updatedAt:new Date().toISOString() };
    const id = await putRec('ipoPlans', rec); rec.id = id; S.ipoPlans.push(rec); plan = rec;
    await audit('Plan Creation','IPOPlan', id, null, rec);
  }
  for (const cid of clientIds){
    if (!S.plannedClients.some(pc=>pc.planId===plan.id && pc.clientId===cid)){
      const rec = { planId: plan.id, clientId: cid, createdAt: new Date().toISOString() };
      const id = await putRec('plannedClients', rec); rec.id = id; S.plannedClients.push(rec);
    }
  }
  await syncPlanClientCount(plan); // keep the stored count equal to the clients actually mapped
  toast(`${clientIds.length} client(s) planned for ${findIpo(ipoId).ipoName}${blocked.length?` (${blocked.length} skipped — already planned for this IPO)`:''}`, 'ok');
  closeModal(); navigate('planning');
}
</script>

<script>
/* ---- planning calendar ---- */
let calMonth = new Date().getMonth();
let calYear = new Date().getFullYear();
function planningCalendarTab(){
  const activeBanks = S.bankAccounts.filter(b=>b.status==='Active');
  const first = new Date(calYear, calMonth, 1);
  const startDow = first.getDay();
  const daysInMonth = new Date(calYear, calMonth+1, 0).getDate();
  const monthName = first.toLocaleDateString('en-IN',{month:'long',year:'numeric'});

  let cells = '';
  for (let i=0;i<startDow;i++) cells += `<div class="cal-cell empty"></div>`;
  for (let d=1; d<=daysInMonth; d++){
    const dateStr = `${calYear}-${String(calMonth+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
    const bankLines = activeBanks.slice(0,4).map(b=>{
      const cap = bankCapacity(b.id, dateStr);
      return `<div class="bankline"><span>${escapeHtml(b.bankName.slice(0,10))}</span><span class="cap-cell ${capClass(cap.status)}" style="padding:0 5px;">${cap.planned}/${cap.capacity}</span></div>`;
    }).join('');
    cells += `<div class="cal-cell" onclick="openCalendarDate('${dateStr}')"><div class="dnum">${d}</div>${bankLines}${activeBanks.length>4?`<div class="small-muted">+${activeBanks.length-4} more</div>`:''}</div>`;
  }
  return `
  <div class="section-card">
    <div class="sc-head">
      <button class="btn btn-ghost btn-sm" onclick="calShift(-1)">&larr;</button>
      <h3 style="min-width:170px;text-align:center;">${monthName}</h3>
      <button class="btn btn-ghost btn-sm" onclick="calShift(1)">&rarr;</button>

      <span class="small-muted">Click a date to see per-bank planning detail</span>
    </div>
    <div class="sc-body">
      <div class="cal-grid" style="margin-bottom:6px;">
        ${['Sun','Mon','Tue','Wed','Thu','Fri','Sat'].map(d=>`<div class="small-muted" style="text-align:center;font-weight:700;">${d}</div>`).join('')}
      </div>
      <div class="cal-grid">${cells}</div>
    </div>

}
function calShift(n){ calMonth += n; if (calMonth<0){calMonth=11;calYear--;} if(calMonth>11){calMonth=0;calYear++;} render(); }
function openCalendarDate(dateStr){
  const activeBanks = S.bankAccounts.filter(b=>b.status==='Active');
  const blocks = activeBanks.map(b=>{
    const cap = bankCapacity(b.id, dateStr);
    const list = cap.plans.map(p=>{ const ipo = findIpo(p.ipoId); return `<li>${escapeHtml(ipo?ipo.ipoName:'—')} <span class="small-muted">(${planClientCount(p)} clients planned)</span></li>`; }).join('') || '<li class="small-muted">No IPOs planned</li>';
    return `<div style="margin-bottom:12px;">
      <div style="display:flex;align-items:center;gap:8px;"><b>${escapeHtml(b.bankName)}</b><span class="cap-cell ${capClass(cap.status)}">${cap.planned}/${cap.capacity} used</span><span class="small-muted">${cap.available} slot(s) remaining</span></div>
      <ul style="margin:6px 0 0 18px;font-size:12.5px;">${list}</ul>
    </div>`;
  }).join('');
  openModal(`Planning Detail — ${fmtDate(dateStr)}`, blocks,
    `<button class="btn btn-primary" onclick="closeModal()">Close</button>`, true);
}

/* ---- capacity dashboard ---- */
function planningCapacityTab(){
  const activeBanks = S.bankAccounts.filter(b=>b.status==='Active');
  const dateSet = new Set(S.ipoPlans.map(p=>p.plannedDate));
  if (!dateSet.size) dateSet.add(todayStr());

/* ---- planned vs actual variance ---- */

/* ---- upcoming IPO planner ---- */
function upcomingPlanningStatus(ipo){
  const plans = S.ipoPlans.filter(p=>p.ipoId===ipo.id);
  if (!plans.length) return 'Not Planned';
  const totalPlannedClients = plans.reduce((s,p)=>s+planClientCount(p),0);
  const mappedClients = S.plannedClients.filter(pc => plans.some(p=>p.id===pc.planId)).length;
  if (mappedClients >= totalPlannedClients && totalPlannedClients > 0) return 'Planned';
  return 'Partially Planned';
}
function planningUpcomingTab(){
  const upcoming = S.ipos.filter(i => ipoStatus(i) !== 'Closed').sort((a,b)=>a.openDate.localeCompare(b.openDate));
  const rows = upcoming.map(i=>{
    const plans = S.ipoPlans.filter(p=>p.ipoId===i.id);
    const banks = [...new Set(plans.map(p=>{ const b=findBank(p.bankAccountId); return b?b.bankName:''; }))].filter(Boolean).join(', ') || '—';

<script>
/* =================== APPLICATIONS =================== */
const APP_STATUSES = ['Not Applied','To Be Applied','Applied','Cancelled / Withdrawn','Mandate Failed'];
// Cancelled / failed applications never block money and never wait for an allotment result.
function isLiveApp(a){ return a.applicationStatus !== 'Cancelled / Withdrawn' && a.applicationStatus !== 'Mandate Failed'; }

function findApp(id){ return S.applications.find(a=>a.id===id); }

/* UPI select helper: renders based on how many UPIs the chosen bank has */
function upiOptionsHtml(bankAccountId, selectedUpiId){
  const upis = bankAccountId ? bankUpis(Number(bankAccountId)) : [];
  if (!upis.length) return `<div class="small-muted" id="upiFieldInner">No UPI ID configured for this bank account.</div>`;
  if (upis.length === 1) return `<input type="hidden" id="fld_upiId" value="${upis[0].id}"><div class="small-muted" id="upiFieldInner">${escapeHtml(upis[0].upiId)} (auto-selected)</div>`;
  return `<select id="fld_upiId">${upis.map(u=>`<option value="${u.id}" ${String(selectedUpiId)===String(u.id)?'selected':''}>${escapeHtml(u.upiId)}</option>`).join('')}</select>`;

function refreshAppUpiField(bankAccountId, prefix){
  prefix = prefix || '';
  const wrap = document.getElementById(prefix+'upiFieldWrap');
  if (!wrap) return;
  wrap.innerHTML = upiOptionsHtml(bankAccountId, null).replace('fld_upiId', prefix+'fld_upiId').replace('upiFieldInner', prefix+'upiFieldInner');

let __selectedAppIds = new Set();
function viewApplications(){
  window.__tableRerender['appsTbl'] = () => {
    renderIntoWrap('appsTblWrap', renderDataTable('appsTbl', {
      data: S.applications,
      searchFn: (r,q) => { const c=findClient(r.clientId), i=findIpo(r.ipoId); const u=S.bankUpiIds.find(x=>x.id===r.upiId); return ((c?c.clientName:'')+' '+(i?i.ipoName:'')+' '+(u?u.upiId:'')).toLowerCase().includes(q); },
      searchPlaceholder: 'Search client, IPO, UPI...',
      filters: [
        { key:'applicationStatus', label:'Status', options: APP_STATUSES },
        { key:'ipoId', label:'IPO', options: sortedIpos().map(i=>i.ipoName), match:(r,v)=>{ const i=findIpo(r.ipoId); return i && i.ipoName===v; } },
        { key:'bankAccountId', label:'Bank', options: S.bankAccounts.map(b=>b.bankName), match:(r,v)=>{ const b=findBank(r.bankAccountId); return b && b.bankName===v; } }
      ],
      pageSize: 12,
      columns: [
        { key:'sel', label:`<input type="checkbox" onchange="toggleAllAppSelection(this.checked)">`, render:r=>`<input type="checkbox" class="appSelCk" ${__selectedAppIds.has(r.id)?'checked':''} onchange="toggleAppSelection(${r.id}, this.checked)">` },
        { key:'clientId', label:'Client', render:r=>{ const c=findClient(r.clientId); return escapeHtml(c?`${c.clientId} — ${c.clientName}`:'—'); } },
        { key:'ipoId', label:'IPO', render:r=>{ const i=findIpo(r.ipoId); return escapeHtml(i?i.ipoName:'—'); } },
        { key:'bankAccountId', label:'Bank', render:r=>{ const b=findBank(r.bankAccountId); return escapeHtml(b?b.bankName:'—'); } },
        { key:'applicationDate', label:'App Date', render:r=>fmtDate(r.applicationDate) },
        { key:'upiId', label:'UPI ID', render:r=>{ const u=S.bankUpiIds.find(x=>x.id===r.upiId); return escapeHtml(u?u.upiId:'—'); } },
        { key:'amountApplied', label:'Amount Applied', render:r=>fmtMoney(r.amountApplied) },
        { key:'applicationStatus', label:'Status', render:r=>badge(r.applicationStatus) + (r.notes ? ` <span class="clickable" title="View note" data-note="${escapeHtml(r.notes)}" onclick="showNote(this)">📝</span>` : '') },

function dateWarnings(data){
  const warns = [];
  const ipo = findIpo(data.ipoId);
  if (ipo && data.applicationDate && (data.applicationDate < ipo.openDate || data.applicationDate > ipo.closeDate)) warns.push('Application date is outside the IPO open/close period.');
  return warns;
}
async function saveApplication(id, force){
  const fields = [{key:'clientId',type:'number'},{key:'ipoId',type:'number'},{key:'bankAccountId',type:'number'},{key:'applicationDate'},{key:'amountApplied',type:'number'},{key:'applicationStatus'},{key:'planId',type:'number'},{key:'notes'}];
  const data = readFields(fields);
  const upiEl = document.getElementById('fld_upiId');
  data.upiId = upiEl ? (upiEl.value ? Number(upiEl.value) : null) : null;
  if (!data.clientId || !data.ipoId || !data.bankAccountId || !data.applicationDate || data.amountApplied===''||data.amountApplied==null){ toast('Client, IPO, bank, date and amount are required','warn'); return; }
  if (!data.planId) data.planId = null;

  const warns = dateWarnings(data);
  const dupe = S.applications.find(x => x.id!==id && x.clientId===data.clientId && x.ipoId===data.ipoId && x.bankAccountId===data.bankAccountId);
  if (dupe) warns.push('This client already has an application for this IPO from this bank account — this looks like a duplicate.');
  if (warns.length && !force){
    openModal('Date Warning', `<p style="font-size:13px;">${warns.join('<br>')}</p><p class="small-muted">You can still save this record.</p>`,
      `<button class="btn btn-ghost" onclick="closeModal()">Cancel</button><button class="btn btn-danger" onclick="saveApplication(${id||'null'}, true)">Save Anyway</button>`);
    return;
  }

  if (id){
    const existing = findApp(id);
    const updated = { ...existing, ...data, updatedAt: new Date().toISOString() };
    await putRec('applications', updated); const __prev10 = {...existing}; Object.assign(existing, updated);
    await audit('Application Status Change','Application', id, __prev10, updated);
    toast('Application updated','ok');
  } else {
    const rec = { ...data, profitSharePct: shareForClient(data.clientId), allotmentStatus:'Pending', allotmentDate:null, saleStatus:null, saleDate:null, saleAmount:null,
      calculatedGrossReceived:null, grossReceived:null, grossReceivedOverridden:false,
      calculatedOurProfit:null, ourProfit:null, ourProfitOverridden:false,
      calculatedClientProfit:null, clientProfit:null, clientProfitOverridden:false,
      createdAt:new Date().toISOString(), updatedAt:new Date().toISOString() };
    const newId = await putRec('applications', rec); rec.id = newId; S.applications.push(rec);
    await audit('Application Creation','Application', newId, null, rec);
    toast('Application created','ok');
  }
  closeModal(); navigate('applications');
}
function deleteApplication(id){
  const a = findApp(id);
  const c = a ? calcAllotmentSale(a) : null;
  const stakes = a ? [
    `Amount Applied: ${fmtMoney(a.amountApplied)}`,
    a.allotmentStatus ? `Allotment: ${escapeHtml(a.allotmentStatus)}` : '',
    (c && c.applicable) ? `Recorded Profit: ${fmtMoney(c.ourFinal)}` : ''
  ].filter(Boolean).join(' · ') : '';
  confirmAction(`Delete this application record? This will permanently remove it from reporting.${stakes ? '<br><span class="small-muted">'+stakes+'</span>' : ''}`, async () => {
    await delRec('applications', id);
    S.applications = S.applications.filter(x=>x.id!==id);
    await audit('Application Deletion','Application', id, a, null);
    toast('Application deleted','ok'); navigate('applications');
  });
}

async function submitBulkApply(){
  const planId = Number(document.getElementById('baPlan').value);

  const date = document.getElementById('baDate').value;
  const bankAccountId = Number(document.getElementById('baBank').value);

      calculatedGrossReceived:null, grossReceived:null, grossReceivedOverridden:false,
      calculatedOurProfit:null, ourProfit:null, ourProfitOverridden:false,
      calculatedClientProfit:null, clientProfit:null, clientProfitOverridden:false,
      createdAt:new Date().toISOString(), updatedAt:new Date().toISOString() };
    const id = await putRec('applications', rec); rec.id = id; S.applications.push(rec);
    await audit('Application Creation','Application', id, null, rec);

  toast(`${count} application(s) created`, 'ok');

}

<script>

  const pending = apps.filter(a=>isLiveApp(a) && (!a.allotmentStatus || a.allotmentStatus==='Pending'));
  const allotRate = apps.length ? Math.round((allotted.length/apps.length)*1000)/10 : 0;
  const pendingToSell = allotted.filter(a=>a.saleStatus!=='Sold');
  const totalOurProfit = apps.reduce((s,a)=>{ const c=calcAllotmentSale(a); return s + (c.applicable?c.ourFinal:0); },0);
  const totalClientProfit = apps.reduce((s,a)=>{ const c=calcAllotmentSale(a); return s + (c.applicable?c.clientFinal:0); },0);
  const totalReceived = apps.reduce((s,a)=>{ const c=calcAllotmentSale(a); return s + (c.applicable && a.amountReceiveStatus==='Received' ? c.grossFinal : 0); },0);
  const totalReceivable = apps.reduce((s,a)=>{ const c=calcAllotmentSale(a); return s + (c.applicable && a.amountReceiveStatus==='Receivable' ? c.grossFinal : 0); },0);

  window.__tableRerender['allotTbl'] = () => {
    renderIntoWrap('allotTblWrap', renderDataTable('allotTbl', {

        { key:'bankAccountId', label:'Bank', options: S.bankAccounts.map(b=>b.bankName), match:(r,v)=>{ const b=findBank(r.bankAccountId); return b && b.bankName===v; } },
        { key:'clientId', label:'Client', options: S.clients.map(c=>c.clientName), match:(r,v)=>{ const c=findClient(r.clientId); return c && c.clientName===v; } }
      ],

        { key:'sel', label:`<input type="checkbox" onchange="toggleAllAllotSelection(this.checked)">`, render:r=>`<input type="checkbox" class="allotSelCk" ${__selectedAllotIds.has(r.id)?'checked':''} onchange="toggleAllotSelection(${r.id}, this.checked)">` },
        { key:'clientId', label:'Client', render:r=>{ const c=findClient(r.clientId); return escapeHtml(c?c.clientName:'—'); } },
        { key:'ipoId', label:'IPO', render:r=>{ const i=findIpo(r.ipoId); return escapeHtml(i?i.ipoName:'—'); } },
        { key:'amountApplied', label:'Amount Applied', render:r=>fmtMoney(r.amountApplied) },

        { key:'saleStatus', label:'Sale', render:r=>r.saleStatus?`${badge(r.saleStatus)}<br><span class="small-muted">${fmtDate(r.saleDate)}</span>`:'—' },
        { key:'saleAmount', label:'Sale Amount', render:r=>fmtMoney(r.saleAmount) },
        { key:'grossReceived', label:'Gross Received', render:r=>{ const c=calcAllotmentSale(r); return c.applicable?(fmtMoney(c.grossFinal)+(c.grossOverridden?overrideBadge('Gross Received', c.calculatedGross, c.grossFinal, r.overrideReason, r.overrideChangedAt):'')):'—'; } },
        { key:'amountReceiveStatus', label:'Recovery Status', render:r=>r.amountReceiveStatus?`<span class="clickable" title="Click to quick-edit" onclick="event.stopPropagation(); quickEditRecoveryStatus(${r.id})">${badge(r.amountReceiveStatus)}</span>`:'—' },
        { key:'ourProfit', label:'Our Profit', render:r=>{ const c=calcAllotmentSale(r); return c.applicable?(fmtMoney(c.ourFinal)+(c.ourOverridden?overrideBadge('Our Profit', c.calculatedOur, c.ourFinal, r.overrideReason, r.overrideChangedAt):'')):'—'; } },
        { key:'clientProfit', label:'Client Profit', render:r=>{ const c=calcAllotmentSale(r); return c.applicable?(fmtMoney(c.clientFinal)+(c.clientOverridden?overrideBadge('Client Profit', c.calculatedClient, c.clientFinal, r.overrideReason, r.overrideChangedAt):'')):'—'; } }
      ],
      rowActions: r => `<button class="btn btn-sm btn-primary" onclick="editAllotmentSale(${r.id})">Update</button>`
    }));
  };
  setTimeout(()=>window.__tableRerender['allotTbl'](), 0);

  return `

          <label>Bulk Update — Allotment Status</label>
          <div style="display:flex;gap:6px;">
            <select id="bulkAllotStatusSelect">${ALLOTMENT_STATUSES.map(s=>`<option value="${s}">${s}</option>`).join('')}</select>
            <button class="btn btn-ghost btn-sm" onclick="bulkUpdateAllotmentStatus()">Update</button>
          </div>

}
function __refreshAllotSelectionUI(){

function toggleAllAllotSelection(checked){
  const filteredIds = (window.__lastFilteredIds && window.__lastFilteredIds['allotTbl']) || [];
  if (checked) filteredIds.forEach(id => __selectedAllotIds.add(id));
  else filteredIds.forEach(id => __selectedAllotIds.delete(id));
  __refreshAllotSelectionUI();
}
function clearAllotSelection(){ __selectedAllotIds = new Set(); __refreshAllotSelectionUI(); }

async function bulkUpdateAllotmentStatus(){
  if (!__selectedAllotIds.size){ toast('No rows selected','warn'); return; }
  const status = document.getElementById('bulkAllotStatusSelect').value;
  let count = 0;
  for (const id of __selectedAllotIds){
    const a = findApp(id);
    if (!a) continue;
    const ipo = findIpo(a.ipoId);
    const patch = { allotmentStatus: status, allotmentDate: ipo ? (ipo.allotmentDate || null) : null };
    if (status === 'Not Allotted'){ patch.saleStatus = null; patch.saleDate = null; patch.saleAmount = null; }
    else if (status === 'Allotted'){ if (a.saleStatus !== 'Sold') patch.saleStatus = 'Pending to Sell'; }
    else { patch.saleStatus = null; }
    const updated = { ...a, ...patch, updatedAt: new Date().toISOString() };
    await putRec('applications', updated); const __prev11 = {...a}; Object.assign(a, updated);
    await audit('Allotment Updates','Application', id, __prev11, updated);
    count++;
  }
  toast(`Allotment status updated for ${count} row(s)`, 'ok');
  navigate('allotments');
}
async function bulkUpdateSaleDate(){
  if (!__selectedAllotIds.size){ toast('No rows selected','warn'); return; }
  const dateVal = document.getElementById('bulkSaleDateInput').value;
  if (!dateVal){ toast('Pick a sale date first','warn'); return; }
  let count = 0, skipped = 0;
  for (const id of __selectedAllotIds){
    const a = findApp(id);

    if (oldCalc.applicable){

      if (!a.ourProfitOverridden && isFilled(data.ourProfit) && Number(data.ourProfit) === oldCalc.calculatedOur) data.ourProfit = null;
      if (!a.clientProfitOverridden && isFilled(data.clientProfit) && Number(data.clientProfit) === oldCalc.calculatedClient) data.clientProfit = null;

  const ourProfitOverridden = calc.applicable && isFilled(data.ourProfit) && Number(data.ourProfit) !== calc.calculatedOur;
  const clientProfitOverridden = calc.applicable && isFilled(data.clientProfit) && Number(data.clientProfit) !== calc.calculatedClient;
  const anyOverridden = grossReceivedOverridden || ourProfitOverridden || clientProfitOverridden;

    (grossReceivedOverridden && Number(data.grossReceived) !== Number(a.grossReceived)) ||
    (ourProfitOverridden && Number(data.ourProfit) !== Number(a.ourProfit)) ||

  const overrideChangedAt = anyOverridden ? (overrideStateChanged ? new Date().toISOString() : (a.overrideChangedAt || new Date().toISOString())) : null;

<script>
/* =================== DASHBOARD =================== */
let dashRange = { preset:'thisMonth', from:null, to:null };

function fyRange(offsetYears){
  const now = new Date();
  let fyStartYear = now.getMonth() >= 3 ? now.getFullYear() : now.getFullYear()-1;
  fyStartYear -= offsetYears;
  return { from: `${fyStartYear}-04-01`, to: `${fyStartYear+1}-03-31` };
}
function resolveDashRange(){ return presetRange(dashRange.preset, dashRange.from, dashRange.to); }
function presetRange(p, customFrom, customTo){
  const now = new Date();
  const y = now.getFullYear(), m = now.getMonth(), d = now.getDate();
  if (p === 'today') return { from: todayStr(), to: todayStr() };
  if (p === 'thisWeek'){
    const dow = now.getDay();
    const start = new Date(now); start.setDate(d - dow);
    const end = new Date(start); end.setDate(start.getDate()+6);
    return { from: isoDate(start), to: isoDate(end) };
  }
  if (p === 'thisMonth') return { from: isoDate(new Date(y,m,1)), to: isoDate(new Date(y,m+1,0)) };
  if (p === 'prevMonth') return { from: isoDate(new Date(y,m-1,1)), to: isoDate(new Date(y,m,0)) };
  if (p === 'thisFY') return fyRange(0);
  if (p === 'prevFY') return fyRange(1);
  if (p === 'custom') return { from: customFrom || '0001-01-01', to: customTo || '9999-12-31' };
  return { from: '0001-01-01', to: '9999-12-31' };
}
function inRange(dateStr, r){ return dateStr && dateStr >= r.from && dateStr <= r.to; }

/* ---- previous-period comparison ---- */
// The period just before r: previous calendar month for a whole month, previous financial year for a whole FY,
// otherwise the same number of days immediately before. Returns null for open-ended ("all time") ranges.
function previousRange(r){
  if (!r || r.from <= '0001-01-01' || r.to >= '9999-12-31') return null;
  const [fy, fm, fd] = r.from.split('-').map(Number), [ty, tm, td] = r.to.split('-').map(Number);
  const lastDay = new Date(fy, fm, 0).getDate();
  if (fd === 1 && fy === ty && fm === tm && td === lastDay) return { from: localDateStr(new Date(fy, fm-2, 1)), to: localDateStr(new Date(fy, fm-1, 0)) };
  if (fd === 1 && fm === 4 && ty === fy+1 && tm === 3 && td === 31) return { from: `${fy-1}-04-01`, to: `${fy}-03-31` };
  const n = dayDiff(r.from, r.to) + 1;
  return { from: addDaysIso(r.from, -n), to: addDaysIso(r.from, -1) };
}
function dashPeriodStats(r){
  const apps = S.applications.filter(a => inRange(a.applicationDate, r));
  const allot = S.applications.filter(a => inRange(a.allotmentDate, r));
  const sold = S.applications.filter(a => inRange(a.saleDate, r) && a.saleStatus === 'Sold');
  let profit = 0, gross = 0, withProfit = 0;
  sold.forEach(a => { const c = calcAllotmentSale(a); if (c.applicable){ profit += c.ourFinal; gross += c.grossFinal; withProfit++; } });
  return {
    apps: apps.length, amount: apps.reduce((s,a)=>s+(Number(a.amountApplied)||0),0),
    allotted: allot.filter(a=>a.allotmentStatus==='Allotted').length, notAllotted: allot.filter(a=>a.allotmentStatus==='Not Allotted').length,
    sold: sold.length, gross, profit, avg: withProfit ? Math.round(profit/withProfit) : 0
  };
}
// Small "▲ 12% vs previous" line. `invert` = true when a rise is bad (e.g. Not Allotted).
function deltaHtml(cur, prev, opts){
  opts = opts || {};
  if (prev === null || prev === undefined) return '';
  const money = v => opts.money ? fmtMoney(v) : String(v);
  const label = opts.label || 'previous period';
  if (cur === 0 && prev === 0) return `<div class="small-muted">— no change vs ${label}</div>`;
  const tip = escapeHtml(`${label}: ${money(prev)}`);
  if (prev === 0) return `<div class="small-muted ${opts.invert?'danger':'ok'}" title="${tip}">▲ new vs ${label}</div>`;
  const pct = Math.round((cur - prev) / Math.abs(prev) * 100);
  if (pct === 0) return `<div class="small-muted" title="${tip}">— 0% vs ${label}</div>`;
  const good = opts.invert ? pct < 0 : pct > 0;
  return `<div class="small-muted ${good?'ok':'danger'}" title="${tip}">${pct>0?'▲':'▼'} ${Math.abs(pct)}% vs ${label}</div>`;
}
function profitBetween(from, to){
  return S.applications.reduce((s,a)=>{ if (a.saleStatus==='Sold' && a.saleDate && a.saleDate>=from && a.saleDate<=to){ const c=calcAllotmentSale(a); return s+(c.applicable?c.ourFinal:0); } return s; }, 0);
}
// Goal progress card: progress bar + simple straight-line projection of where the period will end.
function goalCardHtml(title, profit, goal, elapsedDays, totalDays, periodWord){

  const left = Math.max(0, totalDays - elapsedDays);
  const need = Math.max(0, goal - profit);

  const barW = Math.min(100, Math.max(0, pct)).toFixed(0);
  return `<div style="flex:1;min-width:260px;">
    <div style="display:flex;justify-content:space-between;"><b>${title}</b><span><b class="${pct>=100?'ok':''}">${Math.round(pct)}%</b> of ${fmtMoney(goal)}</span></div>
    <div style="height:10px;border-radius:5px;background:var(--border);margin:6px 0;"><div style="height:10px;border-radius:5px;width:${barW}%;background:var(--${pct>=100?'ok':'gold'}, #c9a227);"></div></div>
    <div class="small-muted">${fmtMoney(profit)} earned · ${profit>=goal?'goal reached 🎉':`${fmtMoney(need)} to go${left?` (≈ ${fmtMoney(need/left)} per remaining day)`:''}`}</div>
    <div class="small-muted ${onTrack?'ok':'danger'}">Projected ${periodWord}-end: ${fmtMoney(projected)} — ${onTrack?'on track':'behind the goal'}</div>
  </div>`;

function dashboardBody(){

  const avgProfitPerMonth = Math.round(yearlyProfit / (now.getMonth()+1));

  const goalsHtml = (monthGoal || yearGoal) ? `

    <div class="kpi-card"><div class="lbl">Active IPOs</div><div class="val ok">${activeIpos}</div></div>
    <div class="kpi-card" ${drillAttr('Applications today', todayApps)}><div class="lbl">Applications Today</div><div class="val">${appsToday}</div></div>
    <div class="kpi-card" ${drillAttr('Capital blocked — awaiting allotment', pendingAppsList)}><div class="lbl">Total Capital Blocked</div><div class="val">${fmtMoney(capitalBlocked)}</div></div>
    <div class="kpi-card" ${drillAttr('Awaiting allotment result', pendingAppsList)}><div class="lbl">Pending Allotment</div><div class="val ${pendingAllotmentCount>0?'danger':''}">${pendingAllotmentCount}</div></div>
  </div>`;

  // ---- Today's Work ----
  const todaysIpoItems = [];
  S.ipos.forEach(i=>{
    if (i.openDate===today) todaysIpoItems.push(`<div>&#128994; <b>${escapeHtml(i.ipoName)}</b> — Opens today</div>`);
    if (i.closeDate===today) todaysIpoItems.push(`<div>&#128994; <b>${escapeHtml(i.ipoName)}</b> — Closes today</div>`);
    if (ipoStatus(i)==='Open' && i.openDate!==today && i.closeDate!==today) todaysIpoItems.push(`<div>&#128994; <b>${escapeHtml(i.ipoName)}</b> — Currently open</div>`);
    if (i.allotmentDate===today) todaysIpoItems.push(`<div>&#128309; <b>${escapeHtml(i.ipoName)}</b> — Allotment today</div>`);
  });

  const awaitingAllotment = S.applications.filter(a=>a.applicationStatus==='Applied' && (!a.allotmentStatus || a.allotmentStatus==='Pending')).length;
  const awaitingSale = S.applications.filter(a=>a.allotmentStatus==='Allotted' && a.saleStatus!=='Sold').length;
  const awaitingReceipt = S.applications.filter(a=>a.saleStatus==='Sold' && a.amountReceiveStatus==='Receivable').length;
  const amountAwaitingReceipt = S.applications.reduce((s,a)=>{ const c=calcAllotmentSale(a); return s+(c.applicable && a.amountReceiveStatus==='Receivable' ? c.grossFinal : 0); },0);
  const daysSinceBackup = daysSinceLastBackup();

  const actionItems = [
    daysSinceBackup===null ? `<div class="clickable" onclick="navigate('settings')">No backup taken yet — export one or connect Google Drive</div>`
      : daysSinceBackup>7 ? `<div class="clickable" onclick="navigate('settings')">Last backup was ${daysSinceBackup} days ago — consider backing up</div>` : '',
    awaitingAllotment ? `<div class="clickable" onclick="navigate('allotments', {presetFilter:{tableId:'allotTbl', filterVals:{allotmentStatus:'Pending'}}})">${awaitingAllotment} application${awaitingAllotment===1?'':'s'} awaiting allotment</div>` : '',
    awaitingSale ? `<div class="clickable" onclick="navigate('allotments', {presetFilter:{tableId:'allotTbl', filterVals:{allotmentStatus:'Allotted', saleStatus:'Pending to Sell'}}})">${awaitingSale} allotted application${awaitingSale===1?'':'s'} awaiting sale</div>` : '',
    awaitingReceipt ? `<div class="clickable" onclick="navigate('allotments', {presetFilter:{tableId:'allotTbl', filterVals:{amountReceiveStatus:'Receivable'}}})">${awaitingReceipt} sold application${awaitingReceipt===1?'':'s'} awaiting receipt (${fmtMoney(amountAwaitingReceipt)})</div>` : ''
  ].filter(Boolean);

  const todaysWorkHtml = `
  <div class="section-card">
    <div class="sc-head"><h3>Today's Work — ${fmtDate(today)}</h3></div>
    <div class="sc-body">
      <b>Today's IPOs</b>
      <div style="margin:6px 0 14px 0;">${todaysIpoItems.length ? todaysIpoItems.join('') : '<div class="small-muted">No IPO activity today.</div>'}</div>
      <b>Action Required</b>
      <div style="margin-top:6px;">${actionItems.length ? actionItems.join('') : '<div class="small-muted">Nothing pending — all caught up.</div>'}</div>
    </div>
  </div>`;

  const r = resolveDashRange();
  const appsInRange = S.applications.filter(a => inRange(a.applicationDate, r));
  const plansInRange = S.ipoPlans.filter(p => inRange(p.plannedDate, r));
  const allottedInRange = S.applications.filter(a => inRange(a.allotmentDate, r));
  const notAllottedInRange = allottedInRange.filter(a=>a.allotmentStatus==='Not Allotted');
  const soldInRange = S.applications.filter(a => inRange(a.saleDate, r) && a.saleStatus==='Sold');
  const profitInRange = soldInRange.reduce((s,a)=>{ const c=calcAllotmentSale(a); return s+(c.applicable?c.ourFinal:0); }, 0);
  const amountAppliedInRange = appsInRange.reduce((s,a)=>s+(Number(a.amountApplied)||0),0);
  const grossInRange = soldInRange.reduce((s,a)=>{ const c=calcAllotmentSale(a); return s+(c.applicable?c.grossFinal:0); },0);
  // Average profit is measured on the SAME basis as the profit itself: profit from sales made in this period
  // divided by the number of sales made in this period (not allotments received, which may fall in another period).
  const soldWithProfit = soldInRange.filter(a => calcAllotmentSale(a).applicable).length;
  const avgProfit = soldWithProfit ? Math.round(profitInRange / soldWithProfit) : 0;
  const prevR = previousRange(r);
  const cur = dashPeriodStats(r), prv = prevR ? dashPeriodStats(prevR) : null;
  const cmp = (key, o) => prv ? deltaHtml(cur[key], prv[key], o) : '';
  const pendingToSellList = S.applications.filter(a=>a.allotmentStatus==='Allotted' && a.saleStatus!=='Sold');
  const pendingToSell = pendingToSellList.length;
  const upcomingIpos = S.ipos.filter(i=>ipoStatus(i)==='Upcoming').length;
  const needPlanning = S.ipos.filter(i=>ipoStatus(i)!=='Closed' && upcomingPlanningStatus(i)==='Not Planned').length;

  const presetBtns = [
    ['today','Today'],['thisWeek','This Week'],['thisMonth','This Month'],['prevMonth','Previous Month'],
    ['thisFY','Current FY'],['prevFY','Previous FY'],['custom','Custom']
  ].map(([k,l]) => `<button class="btn btn-sm ${dashRange.preset===k?'btn-primary':'btn-ghost'}" onclick="setDashPreset('${k}')">${l}</button>`).join('');

  const attn = buildAttentionList();
  const attnHtml = attn.length ? attn.map(a=>`<div class="attn-item ${a.level}"><span class="tag">${a.level}</span><span>${a.text}</span></div>`).join('')
    : `<div class="small-muted">Nothing needs attention right now.</div>`;

  return `
  ${overviewGrid}
  ${goalsHtml}
  ${todaysWorkHtml}

  <div class="section-card">
    <div class="sc-body" style="display:flex;flex-wrap:wrap;gap:8px;align-items:center;">
      ${presetBtns}
      ${dashRange.preset==='custom' ? `<input type="date" id="dashFrom" value="${dashRange.from||''}" onchange="setDashCustom()"><span>to</span><input type="date" id="dashTo" value="${dashRange.to||''}" onchange="setDashCustom()">` : ''}
      <span class="small-muted" style="margin-left:auto;">Showing: ${fmtDate(r.from)} – ${fmtDate(r.to)}${prevR?` · compared with ${fmtDate(prevR.from)} – ${fmtDate(prevR.to)}`:''}</span>
    </div>
  </div>

  <div class="kpi-grid">
    <div class="kpi-card"><div class="lbl">Total Clients</div><div class="val">${S.clients.length}</div></div>
    <div class="kpi-card"><div class="lbl">Total IPOs</div><div class="val">${S.ipos.length}</div></div>
    <div class="kpi-card" ${drillAttr('Applications in this period', appsInRange)}><div class="lbl">Applications (period)</div><div class="val">${appsInRange.length}</div>${cmp('apps')}</div>
    <div class="kpi-card" ${drillAttr('Allotted in this period', allottedInRange.filter(a=>a.allotmentStatus==='Allotted'))}><div class="lbl">Allotments (period)</div><div class="val ok">${allottedInRange.filter(a=>a.allotmentStatus==='Allotted').length}</div>${cmp('allotted')}</div>
    <div class="kpi-card" ${drillAttr('Not allotted in this period', notAllottedInRange)}><div class="lbl">Not Allotted (period)</div><div class="val danger">${notAllottedInRange.length}</div>${cmp('notAllotted',{invert:true})}</div>
    <div class="kpi-card" ${drillAttr('Sold in this period', soldInRange)}><div class="lbl">Sold (period)</div><div class="val">${soldInRange.length}</div>${cmp('sold')}</div>
    <div class="kpi-card" ${drillAttr('Applications in this period', appsInRange)}><div class="lbl">Amount Applied (period)</div><div class="val">${fmtMoney(amountAppliedInRange)}</div>${cmp('amount',{money:true})}</div>
    <div class="kpi-card" ${drillAttr('Sales in this period', soldInRange)}><div class="lbl">Gross Received (period)</div><div class="val">${fmtMoney(grossInRange)}</div>${cmp('gross',{money:true})}</div>
    <div class="kpi-card" ${drillAttr('Sales in this period', soldInRange)}><div class="lbl">Our Profit (period)</div><div class="val gold">${fmtMoney(profitInRange)}</div>${cmp('profit',{money:true})}</div>
    <div class="kpi-card" ${drillAttr('Sales in this period', soldInRange)}><div class="lbl" title="Profit from sales in this period ÷ number of sales in this period">Avg Profit / Sold Allotment</div><div class="val">${fmtMoney(avgProfit)}</div>${cmp('avg',{money:true})}</div>
    <div class="kpi-card" ${drillAttr('Allotted — pending to sell', pendingToSellList)}><div class="lbl">Pending to Sell</div><div class="val">${pendingToSell}</div></div>
    <div class="kpi-card"><div class="lbl">Upcoming IPOs</div><div class="val">${upcomingIpos}</div></div>
    <div class="kpi-card"><div class="lbl">IPOs Requiring Planning</div><div class="val danger">${needPlanning}</div></div>
  </div>
  <p class="small-muted">Date basis: Applications use Application Date · Planning uses Planned Date · Allotments use Allotment Date · Profit/Sales use Sale Date.</p>

  <div class="section-card">
    <div class="sc-head"><h3>What Needs Attention?</h3></div>
    <div class="sc-body attn-list">${attnHtml}</div>
  </div>

  ${operationalDailyPlannerHtml()}
  `;
}

function buildAttentionList(){
  const items = [];
  const today = todayStr();
  const tomorrow = isoDate(new Date(Date.now()+86400000));
  S.ipos.forEach(i=>{
    if (i.openDate===today) items.push({level:'high', text:`IPO opening today: ${escapeHtml(i.ipoName)}`});
    if (i.openDate===tomorrow) items.push({level:'med', text:`IPO opening tomorrow: ${escapeHtml(i.ipoName)}`});
    if (i.closeDate===today) items.push({level:'high', text:`IPO closing today: ${escapeHtml(i.ipoName)}`});
    if (i.closeDate===tomorrow) items.push({level:'med', text:`IPO closing tomorrow: ${escapeHtml(i.ipoName)}`});
    if (ipoStatus(i)!=='Closed' && upcomingPlanningStatus(i)==='Not Planned') items.push({level:'med', text:`IPO not planned: ${escapeHtml(i.ipoName)}`});
  });
  S.bankAccounts.filter(b=>b.status==='Active').forEach(b=>{
    const cap = bankCapacity(b.id, today);
    if (cap.status==='Over Capacity') items.push({level:'high', text:`Bank capacity exceeded: ${escapeHtml(b.bankName)} today (${cap.planned}/${cap.capacity})`});
    else if (cap.status==='Full' || cap.status==='Near Capacity') items.push({level:'med', text:`Bank capacity nearly full: ${escapeHtml(b.bankName)} today (${cap.planned}/${cap.capacity})`});
  });
  S.ipoPlans.forEach(p=>{ if (planVariance(p)==='Pending' && p.plannedDate < today) items.push({level:'med', text:`Planned application not yet executed: ${escapeHtml(findIpo(p.ipoId)?.ipoName||'')} (${fmtDate(p.plannedDate)})`}); });
  S.applications.filter(a=>a.allotmentStatus==='Allotted' && a.saleStatus!=='Sold').forEach(a=>{ const c=findClient(a.clientId); items.push({level:'low', text:`Pending to sell: ${escapeHtml(c?c.clientName:'')} — ${escapeHtml(findIpo(a.ipoId)?.ipoName||'')}`}); });
  const order = {high:0, med:1, low:2};
  return items.sort((a,b)=>order[a.level]-order[b.level]).slice(0,20);
}

function operationalDailyPlannerHtml(){
  const today = todayStr();
  const activeBanks = S.bankAccounts.filter(b=>b.status==='Active');
  const bankBlocks = activeBanks.map(b=>{
    const cap = bankCapacity(b.id, today);
    const list = cap.plans.map(p=>{ const ipo=findIpo(p.ipoId); return `<li>${escapeHtml(ipo?ipo.ipoName:'')}</li>`; }).join('');
    return `<div style="margin-bottom:8px;"><b>${escapeHtml(b.bankName)}</b> — <span class="cap-cell ${capClass(cap.status)}">${cap.planned}/${cap.capacity}</span>
      ${list?`<ul style="margin:4px 0 0 18px;font-size:12px;">${list}</ul>`:'<div class="small-muted">No IPOs planned today</div>'}</div>`;
  }).join('') || '<div class="small-muted">No active bank accounts.</div>';

  const plannedClientsToday = S.ipoPlans.filter(p=>p.plannedDate===today).reduce((s,p)=>s+(S.plannedClients.filter(pc=>pc.planId===p.id).length),0);
  const appsToday = S.applications.filter(a=>a.applicationDate===today).length;
  const pendingToday = Math.max(0, plannedClientsToday - appsToday);

  const closingToday = S.ipos.filter(i=>i.closeDate===today).length;
  const fullBanks = activeBanks.filter(b=>bankCapacity(b.id,today).status!=='Available').length;
  const notAppliedYet = plannedClientsToday - appsToday;

  return `
  <div class="section-card">
    <div class="sc-head"><h3>Operational Daily Planner — ${fmtDate(today)}</h3></div>
    <div class="sc-body">
      <div class="form-grid">
        <div><b>IPO Applications by Bank</b>${bankBlocks}</div>
        <div>
          <b>Client Work</b>
          <ul style="margin:8px 0 0 18px;font-size:12.5px;line-height:1.8;">
            <li>${plannedClientsToday} clients planned</li>
            <li>${appsToday} applications completed</li>
            <li>${pendingToday} pending</li>
          </ul>
          <b>Alerts</b>
          <ul style="margin:8px 0 0 18px;font-size:12.5px;line-height:1.8;">
            <li>${closingToday} IPO(s) closing today</li>
            <li>${fullBanks} bank(s) at/near full capacity</li>
            <li>${Math.max(0,notAppliedYet)} client(s) not yet applied</li>
          </ul>
        </div>
      </div>
    </div>
  </div>`;
}
</script>
<script>
/* =================== REPORTS =================== */
let reportsTab = 'client';
function viewReports(){
  return `
  <div class="tabs">
    <button class="${reportsTab==='client'?'active':''}" onclick="setReportsTab('client')">Client Analysis</button>
    <button class="${reportsTab==='ipo'?'active':''}" onclick="setReportsTab('ipo')">IPO Analysis</button>

    <button class="${reportsTab==='roi'?'active':''}" onclick="setReportsTab('roi')">ROI &amp; Capital</button>

    <button class="${reportsTab==='settlement'?'active':''}" onclick="setReportsTab('settlement')">Settlement by Reference</button>
    <button class="${reportsTab==='subref'?'active':''}" onclick="setReportsTab('subref')">Profit by Sub-Reference</button>
    <button class="${reportsTab==='capacity'?'active':''}" onclick="setReportsTab('capacity')">Bank Capacity Analysis</button>
    <button class="${reportsTab==='planning'?'active':''}" onclick="setReportsTab('planning')">Planning Performance</button>

  </div>

}
function setReportsTab(t){ reportsTab = t; render(); }
function reportsTabContent(){
  if (reportsTab==='client') return reportClientAnalysis();
  if (reportsTab==='ipo') return reportIpoAnalysis();
  if (reportsTab==='bank') return reportBankAnalysis();
  if (reportsTab==='allotrate') return reportAllotmentRate();
  if (reportsTab==='scorecard') return reportClientScorecards();
  if (reportsTab==='pivot') return reportBuilder();
  if (reportsTab==='roi') return reportRoi();
  if (reportsTab==='cashflow') return reportCashFlow();
  if (reportsTab==='listing') return reportListing();
  if (reportsTab==='profit') return reportProfitAnalysis();
  if (reportsTab==='trends'){ setTimeout(renderTrendsCharts, 0); return reportTrends(); }
  if (reportsTab==='yearly') return reportYearlySummary();
  if (reportsTab==='settlement') return reportSettlement();
  if (reportsTab==='subref') return reportSubReferenceProfit();
  if (reportsTab==='capacity') return planningCapacityTab();
  if (reportsTab==='planning') return reportPlanningPerformance();
  if (reportsTab==='pva') return planningVarianceTab();
  return '';
}
function reportTrends(){
  return `
  <div class="section-card">
    <div class="sc-head"><h3>Monthly Profit Trend — Last 12 Months</h3></div>
    <div class="sc-body" id="monthlyTrendTableWrap"></div>
  </div>

  <div class="section-card">
    <div class="sc-head"><h3>Our Profit by Month</h3></div>
    <div class="sc-body"><canvas id="chartProfitTrend" height="90"></canvas></div>
  </div>

  <div class="section-card">
    <div class="sc-head"><h3>Profit by IPO (Top 10)</h3></div>
    <div class="sc-body"><canvas id="chartProfitByIpo" height="100"></canvas></div>
  </div>

  <div class="section-card">
    <div class="sc-head"><h3>Applications by Bank</h3></div>
    <div class="sc-body"><canvas id="chartAppsByBank" height="100"></canvas></div>
  </div>

  <div class="section-card">
    <div class="sc-head"><h3>Application Lifecycle Funnel</h3></div>
    <div class="sc-body"><canvas id="chartFunnel" height="90"></canvas></div>
  </div>

  <div class="section-card">
    <div class="sc-head"><h3>Year-over-Year Comparison</h3></div>
    <div class="sc-body">
      <div id="yoySummaryWrap"></div>
      <canvas id="chartYoY" height="90" style="margin-top:14px;"></canvas>
    </div>
  </div>

  <div class="section-card">
    <div class="sc-head"><h3>Top 10 Clients by Profit</h3></div>
    <div class="sc-body" id="topClientsWrap"></div>
  </div>

  <div class="section-card">
    <div class="sc-head"><h3>Top 10 IPOs by Profit</h3></div>
    <div class="sc-body" id="topIposWrap"></div>
  </div>

  <div class="section-card">
    <div class="sc-head"><h3>Aging Report — Pending Receivables</h3></div>
    <div class="sc-body"><p class="small-muted">Sold applications still awaiting recovery, sorted by longest outstanding first. Anything over 15 days is flagged.</p><div id="agingReportWrap"></div></div>
  </div>`;
}

function monthKey(dateStr){ if(!dateStr) return null; return dateStr.slice(0,7); } // 'YYYY-MM'
function monthLabel(key){ const [y,m] = key.split('-'); return new Date(Number(y), Number(m)-1, 1).toLocaleDateString('en-IN',{month:'short', year:'2-digit'}); }

function last12MonthKeys(){
  const keys = [];
  const now = new Date();
  for (let i=11; i>=0; i--){
    const d = new Date(now.getFullYear(), now.getMonth()-i, 1);
    keys.push(`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`);
  }
  return keys;
}

window.__trendCharts = {};
function destroyChart(id){ if (window.__trendCharts[id]){ window.__trendCharts[id].destroy(); delete window.__trendCharts[id]; } }

function renderTrendsCharts(){
  if (typeof Chart === 'undefined'){
    ['monthlyTrendTableWrap'].forEach(id=>{ const el=document.getElementById(id); if(el) el.innerHTML = '<p class="small-muted">Charts library failed to load (check your internet connection) — the tables below still work.</p>'; });
  } else {
    // Chart.js draws its own text (axis labels, legend) in a fixed color by
    // default, with no idea this app has a Dark Mode — without this, every
    // chart would render near-invisible dark-gray text on a dark background.
    const cs = getComputedStyle(document.documentElement);
    Chart.defaults.color = cs.getPropertyValue('--text-dim').trim() || '#5c6b7a';
    Chart.defaults.borderColor = cs.getPropertyValue('--border').trim() || '#e2e6ed';
  }
  const months = last12MonthKeys();

  // ---- Monthly Profit Trend table + line chart ----
  const monthly = months.map(mk => {
    const soldThisMonth = S.applications.filter(a => a.saleStatus==='Sold' && monthKey(a.saleDate)===mk);
    const appsThisMonth = S.applications.filter(a => monthKey(a.applicationDate)===mk).length;
    const allottedThisMonth = S.applications.filter(a => { const i=findIpo(a.ipoId); return a.allotmentStatus==='Allotted' && i && monthKey(i.allotmentDate)===mk; }).length;
    let gross=0, our=0, client=0;
    soldThisMonth.forEach(a=>{ const c=calcAllotmentSale(a); if(c.applicable){ gross+=c.grossFinal; our+=c.ourFinal; client+=c.clientFinal; } });
    return { mk, applications:appsThisMonth, allotments:allottedThisMonth, sold:soldThisMonth.length, gross, our, client };
  });
  const tblRows = monthly.map(m=>`<tr><td>${monthLabel(m.mk)}</td><td>${m.applications}</td><td>${m.allotments}</td><td>${m.sold}</td><td>${fmtMoney(m.gross)}</td><td>${fmtMoney(m.our)}</td><td>${fmtMoney(m.client)}</td></tr>`).join('');
  const tblWrap = document.getElementById('monthlyTrendTableWrap');
  if (tblWrap) tblWrap.innerHTML = `<div class="table-wrap"><table class="dt"><thead><tr><th>Month</th><th>Applications</th><th>Allotments</th><th>Sold</th><th>Gross Received</th><th>Our Profit</th><th>Client Profit</th></tr></thead><tbody>${tblRows}</tbody></table></div>`;

  const chartsAvailable = (typeof Chart !== 'undefined');
  if (!chartsAvailable){
    const el = document.getElementById('monthlyTrendTableWrap');
    if (el) el.insertAdjacentHTML('beforeend', '<p class="small-muted">Charts library failed to load (check your internet connection) — the tables below still work.</p>');
  }

  if (chartsAvailable) { destroyChart('profitTrend');
  const ctxTrend = document.getElementById('chartProfitTrend');
  if (ctxTrend) window.__trendCharts['profitTrend'] = new Chart(ctxTrend, {
    type:'line',
    data:{ labels: monthly.map(m=>monthLabel(m.mk)), datasets:[{ label:'Our Profit', data: monthly.map(m=>m.our), borderColor:'#c8963e', backgroundColor:'rgba(200,150,62,.15)', fill:true, tension:.25 }] },
    options:{ responsive:true, plugins:{legend:{display:false}}, scales:{ y:{ ticks:{ callback:v=>fmtMoney(v) } } },
      onHover:(e,els)=>{ if (e.native) e.native.target.style.cursor = els.length ? 'pointer' : 'default'; },
      onClick:(e,els)=>{ if (els.length){ const m = monthly[els[0].index]; drillNow('Sold in '+monthLabel(m.mk), S.applications.filter(a=>a.saleStatus==='Sold' && monthKey(a.saleDate)===m.mk)); } } }
  }); }

  // ---- Profit by IPO (top 10) ----
  const ipoProfits = S.ipos.map(i=>{
    const apps = S.applications.filter(a=>a.ipoId===i.id);
    let our=0; apps.forEach(a=>{ const c=calcAllotmentSale(a); if(c.applicable) our+=c.ourFinal; });
    return { id:i.id, name:i.ipoName, our };
  }).filter(x=>x.our!==0).sort((a,b)=>b.our-a.our).slice(0,10);
  const isNarrow = window.innerWidth <= 900;
  if (chartsAvailable) { destroyChart('profitByIpo');
  const ctxIpo = document.getElementById('chartProfitByIpo');
  if (ctxIpo) window.__trendCharts['profitByIpo'] = new Chart(ctxIpo, {
    type:'bar',

    const c = findClient(a.clientId), b = findBank(a.bankAccountId), i = findIpo(a.ipoId);
    const days = Math.round((today - new Date(a.saleDate)) / 86400000);
    const calc = calcAllotmentSale(a);
    return { clientDbId:a.clientId, client:c?c.clientName:'—', ipo:i?i.ipoName:'—', bank:b?b.bankName:'—', saleDate:a.saleDate, days, amount: calc.applicable?calc.grossFinal:0 };
  }).sort((a,b)=>b.days-a.days);
  const agingWrap = document.getElementById('agingReportWrap');
  if (agingWrap) agingWrap.innerHTML = aging.length
    ? `<div class="table-wrap"><table class="dt"><thead><tr><th>Client</th><th>IPO</th><th>Bank</th><th>Sale Date</th><th>Days Outstanding</th><th>Amount</th></tr></thead><tbody>${aging.map(a=>`<tr class="clickable" onclick="navigate('clients',{id:${a.clientDbId}})"><td>${escapeHtml(a.client)}</td><td>${escapeHtml(a.ipo)}</td><td>${escapeHtml(a.bank)}</td><td>${fmtDate(a.saleDate)}</td><td class="${a.days>15?'danger':''}">${a.days} day${a.days===1?'':'s'}${a.days>15?' ⚠️':''}</td><td>${fmtMoney(a.amount)}</td></tr>`).join('')}</tbody></table></div>`

/* =================== ROI, CASH FLOW, LISTING & GMP REPORTS =================== */
function addDaysIso(iso, n){ const [y,m,d] = iso.split('-').map(Number); return localDateStr(new Date(y, m-1, d+n)); }
function dayDiff(a, b){
  const pa = a.split('-').map(Number), pb = b.split('-').map(Number);
  return Math.round((Date.UTC(pb[0],pb[1]-1,pb[2]) - Date.UTC(pa[0],pa[1]-1,pa[2])) / 86400000);
}
// The date an application's money came free again: sale date if sold, allotment (refund) date if not allotted.
function appReleaseDate(a){
  if (a.saleStatus==='Sold' && a.saleDate) return a.saleDate;
  if (a.allotmentStatus==='Not Allotted' && a.allotmentDate) return a.allotmentDate;
  return null;
}

/* ---------- 12. ROI & capital efficiency ---------- */
let roiState = { dim:'bank', from:'', to:'' };
function setRoi(k, v){ roiState[k] = v; render(); }
function roiRows(){
  const dim = ALLOT_DIMS[roiState.dim] || ALLOT_DIMS.bank;
  const groups = new Map();
  S.applications.forEach(a=>{
    if (a.applicationStatus !== 'Applied' || !a.applicationDate) return;
    if (roiState.from && a.applicationDate < roiState.from) return;
    if (roiState.to && a.applicationDate > roiState.to) return;
    const k = dim.key(a);
    if (!groups.has(k)) groups.set(k, { name:k, done:0, capital:0, capDays:0, daysSum:0, profit:0, open:0, openCapital:0, list:[], openList:[] });
    const g = groups.get(k), amt = Number(a.amountApplied)||0, rel = appReleaseDate(a);
    if (rel){
      const days = Math.max(1, dayDiff(a.applicationDate, rel));
      g.list.push(a); g.done++; g.capital += amt; g.capDays += amt*days; g.daysSum += days;
      const c = calcAllotmentSale(a); if (c.applicable) g.profit += c.ourFinal;
    } else { g.openList.push(a); g.open++; g.openCapital += amt; }
  });
  return Array.from(groups.values()).map(g=>({
    ...g,
    roi: g.capital ? g.profit / g.capital * 100 : null,
    avgDays: g.done ? g.daysSum / g.done : null,
    annual: g.capDays ? g.profit / g.capDays * 365 * 100 : null,
    turns: g.done && g.daysSum ? 365 / (g.daysSum / g.done) : null
  }));
}
function reportRoi(){
  const all = roiRows();
  const T = all.reduce((t,g)=>({ done:t.done+g.done, capital:t.capital+g.capital, capDays:t.capDays+g.capDays, daysSum:t.daysSum+g.daysSum, profit:t.profit+g.profit, openCapital:t.openCapital+g.openCapital, open:t.open+g.open }), { done:0, capital:0, capDays:0, daysSum:0, profit:0, openCapital:0, open:0 });
  const rows = all.filter(g=>g.done>0).sort((a,b)=>(b.annual ?? -1e9) - (a.annual ?? -1e9));
  const f1 = v => v==null ? '—' : v.toFixed(1);
  const dimOpts = Object.entries(ALLOT_DIMS).map(([k,d])=>`<option value="${k}" ${roiState.dim===k?'selected':''}>${d.label}</option>`).join('');
  const body = rows.map(g=>`<tr>
    <td>${escapeHtml(roiState.dim==='month' && g.name.length===7 ? new Date(g.name+'-01').toLocaleDateString('en-IN',{month:'short',year:'numeric'}) : g.name)}</td>
    ${dcell(g.name+' — completed applications', g.list, g.done)}<td>${fmtMoney(g.capital)}</td><td>${fmtMoney(g.profit)}</td>
    <td><b class="${g.roi>=0?'ok':'danger'}">${f1(g.roi)}%</b></td>
    <td>${f1(g.avgDays)}</td><td>${f1(g.turns)}</td>
    <td><b class="${g.annual>=0?'ok':'danger'}">${f1(g.annual)}%</b></td>
    ${dcell(g.name+' — money still blocked', g.openList, g.open ? `${g.open} · ${fmtMoney(g.openCapital)}` : '—')}</tr>`).join('') || `<tr><td colspan="9" class="small-muted">No completed applications (sold, or declared Not Allotted with an allotment date) match these filters yet.</td></tr>`;
  return `
  <div class="section-card">
    <div class="sc-head"><h3>ROI &amp; Capital Efficiency</h3></div>
    <div class="sc-body">
      <div style="display:flex;flex-wrap:wrap;gap:12px;align-items:flex-end;margin-bottom:14px;">
        <div class="f-group"><label>Group by</label><select onchange="setRoi('dim', this.value)">${dimOpts}</select></div>
        <div class="f-group"><label>Applied from</label><input type="date" value="${roiState.from}" onchange="setRoi('from', this.value)"></div>
        <div class="f-group"><label>Applied to</label><input type="date" value="${roiState.to}" onchange="setRoi('to', this.value)"></div>
      </div>
      <div class="kpi-grid" style="margin-bottom:14px;">
        <div class="kpi-card"><div class="lbl">Overall Return on Capital</div><div class="val gold">${T.capital ? (T.profit/T.capital*100).toFixed(2)+'%' : '—'}</div></div>
        <div class="kpi-card"><div class="lbl">Annualised Return</div><div class="val gold">${T.capDays ? (T.profit/T.capDays*365*100).toFixed(1)+'%' : '—'}</div></div>
        <div class="kpi-card"><div class="lbl">Avg Days Money Blocked</div><div class="val">${T.done ? (T.daysSum/T.done).toFixed(1) : '—'}</div></div>
        <div class="kpi-card"><div class="lbl">Capital Still Blocked</div><div class="val">${fmtMoney(T.openCapital)}</div></div>
      </div>
      <div class="table-wrap"><table class="dt"><thead><tr>
        <th>${ALLOT_DIMS[roiState.dim].label}</th><th>Completed Apps</th><th>Capital Used</th><th>Our Profit</th><th>Return on Capital</th><th>Avg Days Blocked</th><th>Times Recycled / Year</th><th>Annualised Return</th><th>Still Blocked (apps · ₹)</th>
      </tr></thead><tbody>${body}</tbody></table></div>
      <p class="hint"><b>How to read this:</b> an application is "completed" once its money is free again — sold (on the sale date) or declared Not Allotted (on the IPO's allotment date). <b>Return on Capital</b> = profit ÷ money applied, counting the applications that got nothing too. <b>Annualised Return</b> = what that profit would be over a full year if the same money kept working at the same pace. Applications still waiting for a result, or allotted but unsold, are shown under "Still Blocked" and are left out of the percentages.</p>
    </div>
  </div>`;
}

/* ---------- 13. Cash-flow calendar & forecast ---------- */
let cfState = { from:'', to:'' };
function setCf(k, v){ cfState[k] = v; render(); }
function cashFlowData(from, to){
  const apps = S.applications.filter(a => isLiveApp(a) && a.applicationDate);
  // when does each app's money come free? known date if sold / not allotted; for results still pending, the IPO's allotment date (assumed refund)
  const info = apps.map(a=>{
    const amt = Number(a.amountApplied)||0;
    const ipo = findIpo(a.ipoId);
    const actual = a.applicationStatus === 'Applied';
    const planned = a.applicationStatus === 'To Be Applied';
    let release = appReleaseDate(a), kind = null;
    if (a.saleStatus==='Sold' && a.saleDate) kind = 'sale';
    else if (a.allotmentStatus==='Not Allotted' && a.allotmentDate) kind = 'refund';
    else if (actual && (!a.allotmentStatus || a.allotmentStatus==='Pending')){ release = a.allotmentDate || (ipo && ipo.allotmentDate) || null; kind = release ? 'due' : null; }
    return { a, amt, actual, planned, release, kind };
  });
  const blockedOn = d => info.reduce((s,x)=> s + ((x.actual && x.a.applicationDate <= d && (!x.release || x.release > d)) ? x.amt : 0), 0);
  const days = [];
  for (let d = from, n = 0; d <= to && n < 400; d = addDaysIso(d,1), n++){
    const row = { date:d, out:0, planned:0, refund:0, due:0, sale:0, blocked:0 };
    info.forEach(x=>{
      if (x.a.applicationDate === d){ if (x.actual) row.out += x.amt; else if (x.planned) row.planned += x.amt; }
      if (x.release === d){
        if (x.kind==='refund') row.refund += x.amt;
        else if (x.kind==='due') row.due += x.amt;
        else if (x.kind==='sale') row.sale += Number(x.a.saleAmount)||0;
      }
    });
    row.blocked = blockedOn(d);
    days.push(row);
  }
  return { days, blockedOn };
}
function reportCashFlow(){
  const today = todayStr();
  const from = cfState.from || addDaysIso(today,-7), to = cfState.to || addDaysIso(today,30);
  const { days, blockedOn } = cashFlowData(from, to);
  const active = days.filter(r => r.out||r.planned||r.refund||r.due||r.sale||r.date===today);
  const maxBlocked = Math.max(1, ...days.map(r=>r.blocked));
  const peak = days.reduce((p,r)=> r.blocked > p.blocked ? r : p, { blocked:-1, date:'' });
  const next7 = days.filter(r=>r.date>=today && r.date<=addDaysIso(today,7));
  const freeing7 = next7.reduce((s,r)=>s+r.refund+r.due,0);
  const plannedOut = days.filter(r=>r.date>=today).reduce((s,r)=>s+r.planned,0);
  const toReceive = S.applications.reduce((s,a)=>{ if (a.saleStatus==='Sold' && a.amountReceiveStatus==='Receivable'){ const c=calcAllotmentSale(a); return s + (c.applicable?c.grossFinal:0); } return s; }, 0);
  const body = active.map(r=>`<tr ${r.date===today?'style="background:var(--table-head-bg);font-weight:600;"':''}>
    <td>${fmtDate(r.date)}${r.date===today?' <span class="badge gold">Today</span>':''}${r.date<today?' <span class="small-muted">(past)</span>':''}</td>
    <td>${r.out?fmtMoney(r.out):'—'}</td><td>${r.planned?fmtMoney(r.planned):'—'}</td>
    <td>${r.refund?fmtMoney(r.refund):'—'}</td><td>${r.due?fmtMoney(r.due):'—'}</td><td>${r.sale?fmtMoney(r.sale):'—'}</td>
    <td>${fmtMoney(r.blocked)}<div style="height:5px;border-radius:3px;background:var(--border);margin-top:3px;min-width:80px;"><div style="height:5px;border-radius:3px;width:${(r.blocked/maxBlocked*100).toFixed(0)}%;background:var(--gold, #c9a227);"></div></div></td></tr>`).join('') || `<tr><td colspan="7" class="small-muted">No money movement in this date range.</td></tr>`;
  return `
  <div class="section-card">
    <div class="sc-head"><h3>Cash-Flow Calendar &amp; Forecast</h3></div>
    <div class="sc-body">
